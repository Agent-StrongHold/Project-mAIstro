name: Temporary merge-queue hardening v3

on:
  push:
    branches: [chatgpt/autonomous-merge-safety]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/autonomous-merge-safety
          fetch-depth: 0

      - name: Install migration test dependencies
        run: python3 -m pip install -q pyyaml pytest

      - name: Apply merge-queue hardening
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json

          def add_merge_group(path: str) -> None:
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              if "\n  merge_group:" in text:
                  return
              lines = text.splitlines(keepends=True)
              i = next(i for i, line in enumerate(lines) if line.rstrip("\n") == "  pull_request:")
              j = i + 1
              while j < len(lines):
                  line = lines[j]
                  stripped = line.strip()
                  if stripped and not stripped.startswith("#"):
                      if not line.startswith(" "):
                          break
                      if line.startswith("  ") and not line.startswith("    "):
                          break
                  j += 1
              lines[j:j] = ["  merge_group:\n", "    types: [checks_requested]\n"]
              p.write_text("".join(lines), encoding="utf-8")

          for path in (
              ".github/workflows/ci.yml",
              ".github/workflows/quality.yml",
              ".github/workflows/security.yml",
              ".github/workflows/formal-conformance.yml",
              ".github/workflows/registry.yml",
              ".github/workflows/vulture-ratchet.yml",
              ".github/workflows/cage-guard.yml",
              ".github/workflows/codeql.yml",
          ):
              add_merge_group(path)

          p = Path(".github/workflows/cage-guard.yml")
          text = p.read_text(encoding="utf-8").replace(
              "BASE_SHA: ${{ github.event.pull_request.base.sha }}",
              "BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}",
          ).replace(
              "HEAD_SHA: ${{ github.event.pull_request.head.sha }}",
              "HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}",
          )
          p.write_text(text, encoding="utf-8")

          p = Path(".github/workflows/security.yml")
          text = p.read_text(encoding="utf-8").replace(
              "BASE_SHA: ${{ github.event.pull_request.base.sha }}",
              "BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}",
          ).replace(
              "HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}",
              "HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}",
          ).replace(
              'if [ "$EVENT_NAME" = "pull_request" ]; then',
              'if [ "$EVENT_NAME" = "pull_request" ] || [ "$EVENT_NAME" = "merge_group" ]; then',
          ).replace(
              "if: (github.event_name == 'pull_request' && github.base_ref == 'main') || github.event_name == 'schedule'",
              "if: (github.event_name == 'pull_request' && github.base_ref == 'main') || (github.event_name == 'merge_group' && github.event.merge_group.base_ref == 'refs/heads/main') || github.event_name == 'schedule'",
          ).replace(
              "${{ github.event.pull_request.number || 'nightly' }}",
              "${{ github.event.pull_request.number || github.run_id }}",
          )
          p.write_text(text, encoding="utf-8")

          p = Path(".github/workflows/codeql.yml")
          text = p.read_text(encoding="utf-8")
          needle = '    name: Analyze (${{ matrix.language }})\n'
          if "github.event.merge_group.base_ref" not in text:
              text = text.replace(
                  needle,
                  needle + "    if: github.event_name != 'merge_group' || github.event.merge_group.base_ref == 'refs/heads/main'\n",
                  1,
              )
          p.write_text(text, encoding="utf-8")

          p = Path(".github/workflows/gates-ran.yml")
          text = p.read_text(encoding="utf-8")
          if '      - "Autonomous Merge Safety"' not in text:
              text = text.replace(
                  '      - "Cage Guard — Auto-reject PRs touching cage/ or eval/"\n',
                  '      - "Cage Guard — Auto-reject PRs touching cage/ or eval/"\n      - "Autonomous Merge Safety"\n',
              )
          text = text.replace(
              "if: github.event.workflow_run.event == 'pull_request'",
              "if: github.event.workflow_run.event == 'pull_request' || github.event.workflow_run.event == 'merge_group'",
          )
          marker = "            fs.writeFileSync('check-runs.json', JSON.stringify({ check_runs: runs }));\n            core.info(`${runs.length} check run(s) on ${process.env.HEAD_SHA}`);\n"
          if "target-branch.txt" not in text:
              extra = marker + "\n            const sourceEvent = context.payload.workflow_run.event;\n            const prs = context.payload.workflow_run.pull_requests || [];\n            let targetBranch = sourceEvent === 'pull_request' ? prs[0]?.base?.ref : null;\n            const queueRef = context.payload.workflow_run.head_branch || '';\n            if (!targetBranch && sourceEvent === 'merge_group') {\n              const match = queueRef.match(/^gh-readonly-queue\\/([^/]+)\\//);\n              targetBranch = match?.[1] || null;\n            }\n            if (!targetBranch) {\n              core.setFailed(`Cannot determine target branch for ${sourceEvent} run ${context.payload.workflow_run.id}`);\n              return;\n            }\n            fs.writeFileSync('target-branch.txt', targetBranch);\n            core.info(`Target branch: ${targetBranch}`);\n"
              if marker not in text:
                  raise RuntimeError("gates-ran check-run collection marker not found")
              text = text.replace(marker, extra, 1)
          text = text.replace(
              "run: python3 scripts/check-gates-ran.py --check-runs check-runs.json --require-complete",
              "run: >-\n          python3 scripts/check-gates-ran.py\n          --check-runs check-runs.json\n          --require-complete\n          --base-branch \"$(cat target-branch.txt)\"\n          --expected-app github-actions\n          --expected-app-id 15368",
          )
          p.write_text(text, encoding="utf-8")

          p = Path("scripts/check-branch-protection.py")
          text = p.read_text(encoding="utf-8")
          if "SPECIAL_REQUIRED_ROWS" not in text:
              text = text.replace(
                  'MARK_ADVISORY = "adv"\n',
                  '''MARK_ADVISORY = "adv"\n\n# Required checks intentionally outside the pull_request-triggered table.\nSPECIAL_REQUIRED_ROWS = (\n    ("Gates Ran", "gates-ran", "workflow completion"),\n    ("Autonomous Merge Safety", "autonomous-merge-admissibility", "base-trusted PR/merge group"),\n)\n''',
                  1,
              )
          text = text.replace(
              "    rows = contract.collect()\n",
              "    rows = [*contract.collect(), *SPECIAL_REQUIRED_ROWS]\n",
              1,
          )
          p.write_text(text, encoding="utf-8")

          p = Path("scripts/check-gates-ran.py")
          text = p.read_text(encoding="utf-8")
          text = text.replace(
              'REQUIRED_CHECKS_SCRIPT = REPO_ROOT / "scripts" / "check-required-checks.py"\n',
              'REQUIRED_CHECKS_SCRIPT = REPO_ROOT / "scripts" / "check-required-checks.py"\nBRANCH_PROTECTION = REPO_ROOT / ".github" / "branch-protection.json"\n',
          )
          start = text.index("def required_check_names() -> list[str]:")
          end = text.index("\n\n@dataclass\nclass Verdict:", start)
          text = text[:start] + '''def required_check_names(base_branch: str = "develop") -> list[str]:\n    """Exact required set for the target branch, excluding this gate itself."""\n    doc = json.loads(BRANCH_PROTECTION.read_text(encoding="utf-8"))\n    branches = doc.get("branches") or {}\n    if base_branch not in branches:\n        raise ValueError(f"no branch-protection contract for target {base_branch!r}")\n    contexts = branches[base_branch]["required_status_checks"]["contexts"]\n    return sorted({str(name) for name in contexts if str(name) != "gates-ran"})\n''' + text[end:]
          text = text.replace(
              "    unfinished: list[str] = field(default_factory=list)\n    ran: list[str] = field(default_factory=list)\n",
              "    unfinished: list[str] = field(default_factory=list)\n    wrong_source: list[str] = field(default_factory=list)\n    ran: list[str] = field(default_factory=list)\n",
          )
          text = text.replace(
              "        return not self.absent and not self.stalled and not self.unfinished\n",
              "        return not self.absent and not self.stalled and not self.unfinished and not self.wrong_source\n",
          )
          text = text.replace(
              "    require_complete: bool,\n) -> Verdict:",
              "    require_complete: bool,\n    expected_app: str | None = None,\n    expected_app_id: int | None = None,\n) -> Verdict:",
          )
          source = '''        if run is None:\n            verdict.absent.append(name)\n            continue\n'''
          text = text.replace(
              source,
              source + '''        app = run.get("app") or {}\n        if expected_app is not None and app.get("slug") != expected_app:\n            verdict.wrong_source.append(name)\n            continue\n        if expected_app_id is not None and app.get("id") != expected_app_id:\n            verdict.wrong_source.append(name)\n            continue\n''',
              1,
          )
          text = text.replace(
              '    parser.add_argument(\n        "--require-complete",',
              '    parser.add_argument("--base-branch", default="develop")\n    parser.add_argument("--expected-app")\n    parser.add_argument("--expected-app-id", type=int)\n    parser.add_argument(\n        "--require-complete",',
          )
          text = text.replace(
              "    required = required_check_names()\n",
              '''    try:\n        required = required_check_names(args.base_branch)\n    except (OSError, ValueError, KeyError, json.JSONDecodeError) as exc:\n        print(f"FAIL: required-check contract for {args.base_branch!r} is unreadable: {exc}")\n        return 1\n''',
          )
          text = text.replace(
              "    verdict = evaluate(required, runs, require_complete=args.require_complete)\n",
              '''    verdict = evaluate(\n        required, runs, require_complete=args.require_complete,\n        expected_app=args.expected_app, expected_app_id=args.expected_app_id,\n    )\n''',
          )
          text = text.replace(
              "    if verdict.unfinished:\n",
              '''    if verdict.wrong_source:\n        print(f"\\n  wrong status source ({len(verdict.wrong_source)}):")\n        for name in verdict.wrong_source:\n            print(f"    {name}")\n        print("\\n  A same-named status from another app cannot satisfy merge authority.")\n    if verdict.unfinished:\n''',
          )
          p.write_text(text, encoding="utf-8")

          p = Path(".github/branch-protection.json")
          doc = json.loads(p.read_text(encoding="utf-8"))
          for rule in doc["branches"].values():
              contexts = rule["required_status_checks"]["contexts"]
              for name in ("gates-ran", "autonomous-merge-admissibility"):
                  if name not in contexts:
                      contexts.append(name)
          p.write_text(json.dumps(doc, indent=2) + "\n", encoding="utf-8")

          p = Path("docs/ci/REQUIRED-CHECKS.md")
          text = p.read_text(encoding="utf-8").replace(
              "## One required check the table cannot list: `gates-ran`",
              "## Required checks the PR-trigger table cannot list",
          )
          if "`autonomous-merge-admissibility` is the other deliberate exception" not in text:
              marker = "It exists because a check that never reports is not red, it is *absent*,"
              insert = '''`autonomous-merge-admissibility` is the other deliberate exception. Its\nworkflow uses `pull_request_target` so GitHub loads the judge from the protected\nbase branch; an autonomous candidate cannot replace the code deciding whether\nthat candidate may merge. It also runs on `merge_group` so the exact queue\ncandidate SHA is judged. `check-branch-protection.py` carries both special\nchecks into the reviewable protection contract and generated protection tables.\n\n'''
              text = text.replace(marker, insert + marker, 1)
          p.write_text(text, encoding="utf-8")

          p = Path("tests/test_check_gates_ran.py")
          text = p.read_text(encoding="utf-8").replace(
              'def _run(name: str, *, status: str = "completed", conclusion: str | None = "success") -> dict:\n    return {"name": name, "status": status, "conclusion": conclusion}\n',
              'def _run(name: str, *, status: str = "completed", conclusion: str | None = "success", app: str = "github-actions", app_id: int = 15368) -> dict:\n    return {"name": name, "status": status, "conclusion": conclusion, "app": {"slug": app, "id": app_id}}\n',
          )
          if "class TestCheckProvenanceAndBranchScope" not in text:
              text += '''\n\nclass TestCheckProvenanceAndBranchScope:\n    def test_a_same_named_check_from_another_app_is_rejected(self, check):\n        v = check.evaluate(["a"], [_run("a", app="not-github-actions", app_id=999)], require_complete=True, expected_app="github-actions", expected_app_id=15368)\n        assert v.wrong_source == ["a"]\n        assert not v.ok\n\n    def test_the_expected_github_actions_source_is_accepted(self, check):\n        v = check.evaluate(["a"], [_run("a")], require_complete=True, expected_app="github-actions", expected_app_id=15368)\n        assert v.ok\n\n    def test_develop_reads_its_exact_protection_contract(self, check):\n        names = check.required_check_names("develop")\n        assert "autonomous-merge-admissibility" in names\n        assert "gates-ran" not in names\n        assert not [n for n in names if n.startswith("Analyze (")]\n\n    def test_main_includes_the_main_only_heavy_checks(self, check):\n        names = check.required_check_names("main")\n        assert "Container scan + SBOM + cosign" in names\n        assert [n for n in names if n.startswith("Analyze (")]\n\n    def test_an_unknown_target_branch_fails_closed(self, check):\n        with pytest.raises(ValueError):\n            check.required_check_names("not-a-real-target")\n'''
          p.write_text(text, encoding="utf-8")

          p = Path("tests/test_check_branch_protection.py")
          text = p.read_text(encoding="utf-8")
          if "test_special_required_checks_are_part_of_the_real_contract" not in text:
              text += '''\n\ndef test_special_required_checks_are_part_of_the_real_contract(gate):\n    contract = gate._contract()\n    rows = [*contract.collect(), *gate.SPECIAL_REQUIRED_ROWS]\n    problems = gate.audit(gate.load_ruleset(), rows)\n    assert not [p for p in problems if "gates-ran" in p or "autonomous-merge-admissibility" in p]\n'''
          p.write_text(text, encoding="utf-8")

          # Six new focused tests were added above; normal CI validates the ledger.
          note = Path("docs/testing/inventory-notes/autonomous-merge-safety.md")
          text = note.read_text(encoding="utf-8").replace("tests/: +32", "tests/: +38")
          text = text.replace("Adds 32 root-suite tests", "Adds 38 root-suite tests")
          note.write_text(text, encoding="utf-8")
          PY

      - name: Regenerate protection documentation
        run: python3 scripts/check-branch-protection.py --update-doc

      - name: Focused policy tests
        shell: bash
        run: |
          set +e
          python3 -m pytest tests/test_check_gates_ran.py tests/test_check_branch_protection.py tests/test_check_autonomous_merge.py -q > queue-hardening-diagnostics.txt 2>&1
          code=$?
          cat queue-hardening-diagnostics.txt
          exit $code

      - name: Static contract checks
        run: |
          python3 scripts/check-required-checks.py
          python3 scripts/check-branch-protection.py

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: queue-hardening-diagnostics
          path: queue-hardening-diagnostics.txt
          if-no-files-found: ignore
          retention-days: 1

      - name: Commit hardened queue support and remove migration workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/_patch-merge-queue-v3.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --stat
          git commit -m "Run required gates on exact merge-queue candidates"
          # workflow-write-safety: allow temporary self-deleting migration; external connector retriggers the final head
          git push origin HEAD:chatgpt/autonomous-merge-safety
