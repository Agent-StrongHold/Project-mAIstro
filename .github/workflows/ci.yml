name: CI

on:
  push:
    branches: [main, integration, develop, merge/main-into-integration]
  # No `branches:` filter. It used to be [main, integration, develop], which
  # matched on the PR's *base* — so a PR stacked on a feature branch ran none of
  # this. #151 and #138 got Registry CI and Formal Conformance only: no lint, no
  # types, no tests, no coverage, no SAST, no ratchet gates. The work was not
  # unreviewed, it was unmeasured, and every accumulated failure arrived at once
  # on retarget, against the branch least able to absorb it.
  #
  # A required-check set that silently does not apply to a whole class of PRs is
  # worse than none: the green tick means different things depending on the base
  # and nothing on the PR says which. #161.
  pull_request:

# Supersede in-flight runs for the same PR instead of letting them pile up.
# Every push to a PR previously left the prior run's jobs burning runners —
# including this workflow's own 20-minute `hive-conductor-e2e-ui` — which is
# what left later jobs sitting `queued` for tens of minutes.
#
# Cancellation is scoped to pull_request on purpose: pushes to main/integration/
# develop must run to completion, because ADR-095's branch model relies on
# knowing whether a given commit on a protected branch was green. A cancelled
# run reports neither success nor failure, so cancelling those would erase that
# record rather than just saving time.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint-and-type-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked --extra dev
      - run: bash scripts/verify-monorepo-layout.sh
      # Before anything expensive: a merge marker on the branch means the merge
      # was never finished, and one reached `develop` in a file no other gate
      # reads (#154).
      - name: No conflict markers in tracked files
        run: python scripts/check-merge-markers.py
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: >-
          uv run mypy
          packages/maistro-core/src
          packages/maistro-server/src
          packages/maistro-turing/src
          packages/maistro-canvas/src
          packages/maistro-bootstrap/src
          packages/maistro-registry/src
          packages/maistro-evolve/src
          packages/maistro-rsi/src
          packages/maistro-design/src

  postgres:
    # A real PostgreSQL, because the alternative was proving nothing. Every
    # `test_pg_*.py` module mocks the connection and asserts on the SQL string,
    # which cannot catch a missing table, a column the store writes and the
    # schema lacks, or a naive/aware timestamp mismatch — and #122 found all
    # three once a server was actually there.
    #
    # Matrixed over the supported majors so "PostgreSQL 17-19" is a tested
    # claim rather than a README line. 19 is absent only because no pgvector
    # image ships for it yet; add it here the day one does.
    name: postgres (pg${{ matrix.postgres }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        postgres: ["17", "18"]
    services:
      postgres:
        image: pgvector/pgvector:pg${{ matrix.postgres }}
        env:
          POSTGRES_USER: maistro
          POSTGRES_PASSWORD: maistro
          POSTGRES_DB: maistro_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U maistro"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      DB_USER: maistro
      DB_PASSWORD: maistro
      DB_NAME: maistro_test
      MAISTRO_TEST_PG_DSN: postgresql://maistro:maistro@127.0.0.1:5432/maistro_test
      MAISTRO_TEST_DATABASE_URL: postgresql://maistro:maistro@127.0.0.1:5432/maistro_test
      REQUIRE_AUTH: "false"
      MAISTRO_DRY_RUN: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked --extra dev
      # First, because it drives alembic itself and ends on an empty database:
      # applying the chain and then asking these tests to apply it again is a
      # different scenario from the one they were written for (#177).
      - name: The chain applies to an empty database, and reverses
        run: uv run pytest tests/migrations/test_migration_chain.py -v --tb=short
      # The migration chain is itself under test here: it could not run to
      # completion against a clean database before this change.
      - name: Apply migrations
        run: uv run alembic upgrade head
      - name: Migrations are reversible
        run: |
          uv run alembic downgrade base
          uv run alembic upgrade head
      - name: Persistence conformance
        run: uv run pytest packages/maistro-core/tests/persistence -v --tb=short
      - name: Container wires the PostgreSQL backend
        run: uv run pytest packages/maistro-core/tests/test_container_postgres.py -v --tb=short

  object-storage:
    # MinIO, not moto. The default `test` job already runs the archive suite
    # against an in-process moto server, which is a real HTTP S3 implementation
    # and enough to catch our own mistakes. MinIO is what people actually run,
    # so it is what catches the difference between "S3-compatible" and
    # "compatible with the parts moto implements" (ADR-082226-f436 decision 3).
    name: object storage (MinIO)
    runs-on: ubuntu-latest
    env:
      MAISTRO_TEST_S3_ENDPOINT: http://127.0.0.1:9000
      AWS_ACCESS_KEY_ID: maistro
      AWS_SECRET_ACCESS_KEY: maistro-secret
      AWS_DEFAULT_REGION: us-east-1
      REQUIRE_AUTH: "false"
      MAISTRO_DRY_RUN: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked --extra dev --extra s3
      # `docker run`, not a `services:` container. MinIO's own image needs an
      # explicit `server /data` command and service containers cannot set one,
      # which is why this used `bitnami/minio` — a repackaging that starts the
      # server by default. Bitnami withdrew that tag and the job began failing
      # on `manifest unknown`, so the dependency on someone else's repackaging
      # is gone: the upstream image, pinned, started here.
      - name: Start MinIO
        run: |
          docker run -d --name minio \
            -p 9000:9000 \
            -e MINIO_ROOT_USER=maistro \
            -e MINIO_ROOT_PASSWORD=maistro-secret \
            minio/minio:RELEASE.2025-04-22T22-12-26Z server /data
          for _ in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:9000/minio/health/live >/dev/null; then
              echo "minio ready"
              exit 0
            fi
            sleep 2
          done
          echo "minio did not become ready" >&2
          docker logs minio >&2 || true
          exit 1
      - name: Archive conformance against MinIO
        run: uv run pytest packages/maistro-core/tests/archive -v --tb=short

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v7
      - run: |
          set -e
          # Bounded: an unbounded apt-get or curl here hangs the whole job with
          # no output. Observed 2026-08-19 — quality.yml sat 29 minutes on this
          # step (past its own timeout-minutes) with every later step pending,
          # because the fetch from dl.filippo.io never returned and nothing
          # bounded it. `|| true` tolerates a *failed* apt, not a wedged one.
          timeout 180 sudo apt-get update || true
          timeout 180 sudo apt-get install -y age || true
          if ! command -v age-keygen &> /dev/null; then
            echo "Installing age-keygen from source..."
            mkdir -p /tmp/age && cd /tmp/age
            curl -fsSL --max-time 120 --retry 3 --retry-delay 5 --retry-all-errors \
              https://dl.filippo.io/age/latest/age-linux-amd64.tar.gz | tar xz
            ls -la /tmp/age/
            sudo mv /tmp/age/age /tmp/age/age-keygen /usr/local/bin/ || exit 1
            echo "Verifying installation..."
            age-keygen --help > /dev/null && echo "✓ age-keygen ready" || exit 1
          fi
      - run: uv sync --locked --extra dev --extra bootstrap
      - run: uv run pytest packages/maistro-bootstrap/tests -v --tb=short
      - run: uv run pytest packages/maistro-core/tests -v --tb=short
        env:
          REQUIRE_AUTH: "false"
          MAISTRO_DRY_RUN: "1"
      - run: uv run pytest packages/maistro-server/tests -v --tb=short
        env:
          REQUIRE_AUTH: "false"
          MAISTRO_DRY_RUN: "1"
      - run: uv run pytest packages/maistro-canvas/tests -v --tb=short
        env:
          REQUIRE_AUTH: "false"
          MAISTRO_DRY_RUN: "1"
      - run: uv run pytest packages/maistro-turing/tests -v --tb=short
        env:
          REQUIRE_AUTH: "false"
          MAISTRO_DRY_RUN: "1"
      - run: uv run pytest packages/maistro-turing/backend/tests -v --tb=short
        env:
          REQUIRE_AUTH: "false"
          MAISTRO_DRY_RUN: "1"
      - run: uv run pytest packages/maistro-design/tests -v --tb=short
        env:
          REQUIRE_AUTH: "false"
          MAISTRO_DRY_RUN: "1"
      - run: uv run pytest tests/ --ignore=tests/tools/registry -v --tb=short
        env:
          REQUIRE_AUTH: "false"
          MAISTRO_DRY_RUN: "1"
      - run: uv run pytest packages/maistro-rsi/tests packages/maistro-evolve/tests -v --tb=short
        env:
          REQUIRE_AUTH: "false"
          MAISTRO_DRY_RUN: "1"
          PYTHONPATH: packages/maistro-rsi/src:packages/maistro-evolve/src
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            packages/hive-conductor/frontend/package-lock.json
            packages/maistro-canvas/frontend/package-lock.json
      - run: npm ci && npm run lint && npm run build
        working-directory: packages/hive-conductor/frontend
      - run: npm ci && npm run test:ci
        working-directory: packages/maistro-canvas/frontend
      - run: npm run lint
        working-directory: packages/maistro-canvas/frontend
      - run: npm run build
        working-directory: packages/maistro-canvas/frontend
      - run: npm audit --audit-level=high
        working-directory: packages/maistro-canvas/frontend
      - run: uv pip install --system -r packages/hive-conductor/backend/requirements.txt
      - run: python -m pytest packages/hive-conductor/backend/tests -v --tb=short
      - name: Suite inventory matches collected node IDs (C1/#286)
        run: python scripts/check-suite-inventory.py

  durable-events:
    # The PostgreSQL legs of the durable-event suites (#135) skip without a
    # server, and a skipped leg is untested rather than passing — which is how
    # "durable events" stayed in-memory on PostgreSQL unnoticed in the first
    # place. This job is what makes those legs actually run.
    #
    # Plain postgres:17, not pgvector/pgvector:pg17: nothing here needs the
    # `vector` extension, because the schema-agreement test renders revision
    # 004 on its own rather than walking the chain from 001.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: maistro_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      MAISTRO_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/maistro_test
      # Turns "no server, skip" into a failure, in this job only. Without it a
      # misconfigured service container would leave this job green with every
      # PostgreSQL leg skipped — reporting the absence of the gap rather than
      # its closure.
      MAISTRO_REQUIRE_PG_LEGS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked --extra dev
      - name: Durable event stores conform across memory, SQLite and PostgreSQL
        run: uv run pytest packages/maistro-core/tests/events -v --tb=short
        env:
          REQUIRE_AUTH: "false"
          MAISTRO_DRY_RUN: "1"
      # Named file, not the directory: `test_migration_chain.py` walks the chain
      # from 001, whose first statement is `CREATE EXTENSION vector` — which the
      # plain postgres:17 above cannot serve. It runs in `postgres` instead,
      # which is on the pgvector image.
      - name: Migration 004 and ensure_event_schema describe the same tables
        run: uv run pytest tests/migrations/test_event_schema_agreement.py -v --tb=short
        env:
          REQUIRE_AUTH: "false"
          MAISTRO_DRY_RUN: "1"

  strike-ladder:
    # The PostgreSQL leg of the strike conformance suite (#134) skips without a
    # server, and the plain `test` job has none — so the suite that exists to
    # prove `PgStrikeTracker` matches the protocol was only ever exercising
    # `InMemoryStrikeTracker`. A skipped leg is untested, not passing, and that
    # is precisely how the original defect survived: `PgStrikeTracker` returned
    # `dict` from both methods and nothing ran it against `Gate`'s expectations.
    #
    # A separate job from `durable-events` above, not a second step in it: they
    # want different databases, and a shared server would let one suite's
    # leftover schema decide whether the other's passes.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: strike_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      MAISTRO_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/strike_test
      # Turns "no server, skip" into a failure, in this job only. Without it a
      # misconfigured service container leaves the job green with the durable
      # leg skipped — reporting the absence of the gap rather than its closure.
      MAISTRO_REQUIRE_PG_LEGS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked --extra dev
      - name: Strike ladder conforms on both in-memory and PostgreSQL
        run: uv run pytest packages/maistro-core/tests/security/test_strike_tracker_conformance.py -v --tb=short
        env:
          REQUIRE_AUTH: "false"
          MAISTRO_DRY_RUN: "1"

  hive-conductor-e2e-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Run PM workflow Playwright UI e2e against a live hive-conductor
        timeout-minutes: 14
        working-directory: packages/hive-conductor
        run: |
          docker compose -f docker-compose.test.yml --profile test up --build \
            --abort-on-container-exit --exit-code-from e2e-tests e2e-tests
      - name: Diagnose — container state and per-service logs
        if: always()
        working-directory: packages/hive-conductor
        run: |
          echo "::group::compose ps (did hive ever start and report healthy?)"
          docker compose -f docker-compose.test.yml ps -a || true
          echo "::endgroup::"
          echo "::group::hive service logs"
          docker compose -f docker-compose.test.yml logs --no-color --tail=300 hive || true
          echo "::endgroup::"
          echo "::group::e2e-tests (playwright) logs"
          docker compose -f docker-compose.test.yml logs --no-color --tail=200 e2e-tests || true
          echo "::endgroup::"
          echo "::group::is the app reachable, and what does GET / return?"
          docker compose -f docker-compose.test.yml run --rm --no-deps -T \
            --entrypoint sh e2e-tests -c \
            'wget -S -T 10 -O /dev/null http://hive:8101/ 2>&1 | head -40; echo "exit=$?"' || true
          echo "::endgroup::"
      - name: Tear down
        if: always()
        working-directory: packages/hive-conductor
        run: docker compose -f docker-compose.test.yml down -v

  hive-conductor-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Run PM workflow e2e against a live hive-conductor
        working-directory: packages/hive-conductor
        run: |
          docker compose -f docker-compose.test.yml --profile test up --build \
            --abort-on-container-exit --exit-code-from api-tests api-tests
      - name: Dump hive logs
        if: always()
        working-directory: packages/hive-conductor
        run: |
          docker compose -f docker-compose.test.yml ps -a || true
          docker compose -f docker-compose.test.yml logs --no-color --tail=200 || true
      - name: Tear down
        if: always()
        working-directory: packages/hive-conductor
        run: docker compose -f docker-compose.test.yml down -v

  wheel-imports:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v7
      - name: Build every package wheel
        run: |
          set -euo pipefail
          rm -rf dist
          for p in packages/*/; do
            [ -f "$p/pyproject.toml" ] || continue
            echo "::group::build $p"
            uv build "$p" --out-dir dist/
            echo "::endgroup::"
          done
          ls -1 dist/*.whl
      - name: Import wheels from a clean venv
        run: python scripts/verify-wheel-imports.py --dist dist/ --python 3.12

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked --extra dev
      - run: uv pip install pip-audit
      - run: uv pip freeze --exclude-editable > /tmp/deps.txt
      - run: uv run pip-audit --strict --format=json -r /tmp/deps.txt > /tmp/pip-audit.json || true
      - run: python scripts/pip_audit_gate.py /tmp/pip-audit.json

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Fetch the base images first, retrying (#204). This job used to fail on a
      # registry reset before touching a line of repository content — a red
      # required check that nobody could re-run, because the GitHub App gets
      # `403 Resource not accessible by integration` on `rerun-failed-jobs`.
      #
      # Only the fetch is retried. A genuine build failure still fails on its
      # first attempt below, so this buys reliability without hiding breakage.
      # The image list is parsed from the Dockerfiles rather than written here,
      # so it cannot drift from what is actually built.
      - name: Pre-pull base images (retry transient registry faults)
        run: scripts/prepull-base-images.sh Dockerfile packages/hive-conductor/Dockerfile

      - run: docker build -t maistro-engine:test .
      - run: docker build -f packages/hive-conductor/Dockerfile . -t hive-conductor:ci

  workflow-lint:
    runs-on: ubuntu-latest
    env:
      ACTIONLINT_VERSION: "1.7.7"
      SHELLCHECK_VERSION: "0.10.0"
    steps:
      - uses: actions/checkout@v4
      - name: Install actionlint + shellcheck
        run: |
          set -euo pipefail
          curl -fsSL "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            | tar xz -C /tmp actionlint
          curl -fsSL "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz" \
            | tar xJ -C /tmp
          install -m0755 "/tmp/shellcheck-v${SHELLCHECK_VERSION}/shellcheck" /tmp/shellcheck-bin
      - name: "actionlint (with shellcheck over run: blocks)"
        run: /tmp/actionlint -no-color -oneline -shellcheck /tmp/shellcheck-bin
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PyYAML
        run: pip install pyyaml
      # The check-name contract #162 pins branch protection against. It lives
      # in this job because it is a check about workflow shape, next to the
      # other one — and because a rename is only caught if the gate runs on the
      # PR that does the renaming, which after #161 is every PR.
      - name: PR check contract matches the workflows
        run: python3 scripts/check-required-checks.py
      # And the ruleset that pins branch protection against those names (#162).
      # Offline only: it checks that every required context is a real check
      # name, that no branch requires one that cannot report there, and that
      # every PR check is required somewhere or excused by name. The last is
      # what makes adding a gate a decision rather than a default — a new job
      # fails this step until someone says whether it is part of the merge
      # contract. Live verification (--verify) needs admin scope and is run by
      # hand, not here.
      - name: Branch-protection ruleset matches the check names
        run: python3 scripts/check-branch-protection.py

