name: Compliance evidence

on:
  # Evidence must be produced by a branch run that can be reviewed before a
  # release tag is created. A tag run starts too late: its artifact URL cannot
  # already be committed in the tagged registry.
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  actions: read
  contents: read

env:
  PYTHONUNBUFFERED: "1"

jobs:
  produce:
    name: Produce control-bound evidence
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: ./.github/actions/setup-uv
      - run: uv sync --locked --extra dev
      - name: Run registry-declared tests
        run: >-
          uv run python scripts/produce-compliance-evidence.py
          --release-digest "$GITHUB_SHA"
          --output compliance-evidence
      - name: Upload immutable compliance evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: compliance-evidence-${{ github.sha }}
          path: compliance-evidence/
          if-no-files-found: error
          retention-days: 90
      - name: Verify evidence against this commit
        if: success()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          uv run python scripts/check-compliance.py
          --release-digest "$GITHUB_SHA"
