name: Compliance evidence

on:
  push:
    branches: [main, integration, develop]
    tags: ["v*", "v*-rc*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"

jobs:
  produce:
    name: Produce control-bound evidence
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --extra dev
      - name: Run registry-declared tests
        run: >-
          uv run python scripts/produce-compliance-evidence.py
          --release-digest "$GITHUB_SHA"
          --output compliance-evidence
      - name: Upload immutable compliance evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: compliance-evidence-${{ github.sha }}
          path: compliance-evidence/
          if-no-files-found: error
          retention-days: 90
