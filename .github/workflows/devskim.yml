# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: DevSkim

on:
  push:
    branches: [ "develop" ]
  pull_request:
    branches: [ "develop" ]
  schedule:
    - cron: '28 17 * * 1'

jobs:
  lint:
    name: DevSkim
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # DevSkim ran unconfigured, so it scanned the test and vendored trees
      # alongside the shipped ones. Those trees are where `http://` and
      # `localhost` legitimately live in bulk -- fixtures asserting that an
      # insecure URL is refused, loopback addresses in test servers, vendored
      # benchmark corpora -- and they produced 619 of the 912 findings. A
      # scanner whose output is two-thirds noise is one nobody reads, which
      # costs more than the rule it enforces.
      #
      # Every glob names a *location* that holds no shipped code, never a
      # filename shape: a shape reaches across the tree into `packages/` and
      # silently drops a shipped module (exactly what `**/test_*.py` did to
      # the CodeQL config, where it also matched `maistro_rsi/test_inventory.py`).
      # `tests/test_devskim_scan_scope.py` fails if any glob here matches a
      # file that is neither a test nor vendored.
      #
      # `**/static/swagger-ui/**` (#1425) is the vendored swagger-ui-dist
      # release served by `backend/routes/api_docs.py`. It is upstream's
      # minified bundle, not code anyone reviews line-by-line here; its
      # integrity is pinned by sha256 provenance in `routes/api_docs.py` and
      # enforced by `backend/tests/test_docs_first_party.py`. Scanning it
      # produced 35 alerts (weak-hash, hardcoded-key and setTimeout shapes
      # inside the minified upstream JS) that no edit of ours can clear --
      # same category as `**/third_party/**`, a location that is vendored
      # by definition.
      #
      # `**/maistro_design/systems/catalog/**` is the bundled Open Design
      # fixture tree (json/md/css only — no Python). DevSkim DS173237 treats
      # every git commit sha in catalog.json as a "hard-coded token"; hundreds
      # of alerts, none actionable. Same class of noise as corpora below.
      #
      # `**/benchmarks/corpora/**` holds generated benchmark admission JSON
      # (commit shas + patch metadata). Not executable product code.
      #
      # `formal/**` is the Hypothesis conformance suite — already excluded
      # from CodeQL for the same reason (`**/tests/**` shape): it is not a
      # shipped surface, and its fixtures deliberately exercise eval/http
      # shapes the product must refuse.
      #
      # Allowlist the shipped trees via `--include-globs` (DevSkim AllowFilters).
      # `.github/`, `deploy/`, `alembic/`, `formal/`, `quality/`, and other
      # non-product roots are simply never scanned — they are not in the
      # allowlist. A deny-glob for `**/deploy/**` is unsafe: it also matches
      # shipped `templates/**/deploy/**.jinja`.
      #
      # Why not rely on deny-globs for `.github/**` alone? DevSkim's
      # DenyFilters run against absolute `$GITHUB_WORKSPACE` paths
      # (RecursiveExtractor FileNamePasses). A pattern like `.github/**`
      # (no leading `**/`) never matches
      # `/home/runner/work/.../.github/workflows/ci.yml`, so tip SARIF kept
      # 36 `.github` findings while that glob was already listed. The
      # allowlist does not have that footgun for roots we do not ship.
      #
      # Nested noise *inside* shipped trees still uses deny-globs; every
      # directory deny MUST start with `**/` (enforced by
      # `test_directory_globs_are_absolute_path_safe`).
      #
      # `**/hive-conductor/eval/**` — immutable department eval fixtures
      # (SPEC/cage-guard), under packages/ so inside the allowlist; deny it.
      #
      # Setting ignore-globs REPLACES the action's default, so `**/.git/**`
      # and `**/bin/**` are repeated rather than inherited.
      #
      # No `exclude-rules` — suppressing a rule repo-wide would silence it on
      # shipped code too.
      - name: Run DevSkim scanner
        uses: microsoft/DevSkim-Action@v1
        with:
          # `**/deploy/scripts/**` is required because `**/scripts/**` in the
          # allowlist also matches ops scripts under deploy/; product compose
          # templates live under `templates/**/deploy/` (not `deploy/scripts/`)
          # and must stay scanned.
          ignore-globs: "**/.git/**,**/bin/**,**/node_modules/**,**/dist/**,**/build/**,**/third_party/**,**/static/swagger-ui/**,**/maistro_design/systems/catalog/**,**/benchmarks/corpora/**,**/hive-conductor/eval/**,**/deploy/scripts/**,**/tests/**,**/__tests__/**,**/*.test.js,**/*.test.jsx,**/*.test.ts,**/*.test.tsx,**/*.test.yml"
          # AllowFilters also see absolute runner paths — prefix every root with **/.
          extra-options: --include-globs **/packages/**,**/scripts/**,**/templates/**,**/extensions/**

      - name: Upload DevSkim scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: devskim-results.sarif
