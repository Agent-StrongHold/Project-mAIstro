name: Enqueue Merge Queue

# Repository-owned merge-queue admission. This workflow runs only from the
# protected default branch after Gates Ran completes. It never checks out or
# executes pull-request-controlled code.
on:
  workflow_run:
    workflows: ["Gates Ran"]
    types: [completed]
  workflow_dispatch:
  pull_request:

permissions:
  checks: read
  contents: read
  pull-requests: read
  statuses: read

concurrency:
  group: enqueue-merge-queue-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  format-probe:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: ./.github/actions/setup-uv
      - run: uv sync --locked --extra dev
      - name: Print Ruff formatter diff
        run: uv run ruff format --diff --check scripts/check-enqueue-merge-queue.py

  enqueue:
    if: github.event_name != 'pull_request'
    name: enqueue-merge-queue
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout trusted controller
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Create short-lived merge-bot token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.MAISTRO_MERGE_APP_ID }}
          private-key: ${{ secrets.MAISTRO_MERGE_APP_PRIVATE_KEY }}

      - name: Enqueue every admissible develop PR
        env:
          GH_TOKEN: ${{ github.token }}
          MERGE_QUEUE_TOKEN: ${{ steps.app-token.outputs.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python3 scripts/check-enqueue-merge-queue.py
