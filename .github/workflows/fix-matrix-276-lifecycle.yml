name: Fix 276 lifecycle matrix

on:
  push:
    branches: [chatgpt/m1-237-run-derivation]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/m1-237-run-derivation
      - name: Update lifecycle module count
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('docs/architecture/CONVERGENCE-MATRIX.md')
          text = path.read_text(encoding='utf-8')
          old = '| Run / NodeRun / Attempt lifecycle | reached via `maistro.graph.durable_runs` from `services.dag_agents` | `0/20` |'
          new = '| Run / NodeRun / Attempt lifecycle | reached via `maistro.graph.durable_runs` from `services.dag_agents` | `0/21` |'
          if text.count(old) != 1:
              raise SystemExit('expected exactly one lifecycle matrix target')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
      - name: Commit repair and remove helper
        run: |
          rm .github/workflows/fix-matrix-276-lifecycle.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(architecture): refresh #276 lifecycle count"
          git push origin HEAD:chatgpt/m1-237-run-derivation
