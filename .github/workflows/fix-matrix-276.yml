name: Fix 276 convergence matrix counts

on:
  push:
    branches: [chatgpt/m1-237-run-derivation]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/m1-237-run-derivation
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Update exact matrix counts
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('docs/architecture/CONVERGENCE-MATRIX.md')
          text = path.read_text(encoding='utf-8')
          replacements = {
              '| Run / NodeRun / Attempt lifecycle | reached via `maistro.graph.durable_runs` from `services.dag_agents` | `0/20` |':
              '| Run / NodeRun / Attempt lifecycle | reached via `maistro.graph.durable_runs` from `services.dag_agents` | `0/21` |',
              '| Repo tooling | the `.github/workflows/*.yml` step that executes the script | `18/55` |':
              '| Repo tooling | the `.github/workflows/*.yml` step that executes the script | `19/56` |',
              '| Agent Conductor services |': '| Agent Conductor services |',
          }
          for old, new in list(replacements.items())[:2]:
              if text.count(old) != 1:
                  raise SystemExit(f'expected exactly one matrix target: {old}')
              text = text.replace(old, new)
          old = '| Agent Conductor services | `services` | `15/63` |'
          new = '| Agent Conductor services | `services` | `15/64` |'
          if text.count(old) != 1:
              raise SystemExit('expected exactly one Agent Conductor services disposition row')
          text = text.replace(old, new)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Prove matrix matches code
        run: python scripts/check-convergence-matrix.py
      - name: Commit verified matrix and remove helper
        run: |
          rm .github/workflows/fix-matrix-276.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(architecture): refresh convergence matrix counts"
          git push origin HEAD:chatgpt/m1-237-run-derivation
