name: Fix 276 reachability disposition

on:
  push:
    branches: [chatgpt/m1-237-run-derivation]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/m1-237-run-derivation
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Record intentional CI-only entrypoint
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('quality/reachability-baseline.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          entry = 'scripts/check-m1-convergence-freeze.py'
          unreachable = data['unreachable']
          if entry not in unreachable:
              unreachable.append(entry)
              unreachable.sort()
          data['_generated_from'] = '977 production modules'
          note = ' CI-only scripts invoked by tests/workflows may be listed when the static import graph cannot see that execution path; scripts/check-m1-convergence-freeze.py is invoked by the M1 convergence gate and its executable test.'
          if note.strip() not in data['_comment']:
              data['_comment'] += note
          path.write_text(json.dumps(data, indent=2) + '\n', encoding='utf-8')
          PY
      - name: Commit disposition and remove helper
        run: |
          rm .github/workflows/fix-reachability-276.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(quality): disposition M1 freeze checker reachability"
          git push origin HEAD:chatgpt/m1-237-run-derivation
