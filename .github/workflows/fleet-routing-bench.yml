name: Fleet-routing bench

# Manual only, on purpose (same pattern as model-routing-bench.yml).
#
# This runs scripts/bench_fleet_routing.py — the #934 / epic #905 M8-F1
# measurement: heterogeneous fleet-composition policies (hosted-only,
# local-only, the shipped CostAwareRouter over the whole fleet, and a
# difficulty-aware local-first candidate) routed over one shared corpus, one
# shared policy-independent outcome table, and one shared provider-pressure
# schedule, across four scenarios (benign, local outage, hosted-provider
# outage, hosted capacity pressure). It is deterministic and offline
# (blake2b-hashed draws, no network), so results are comparable run-to-run;
# the checked-in numbers live in docs/benchmarks/fleet-routing-baseline.json.
# It is not a gate and not a per-PR job: run it when the router, the fleet
# catalog, or the outcome model changes. The research disposition lives in
# docs/research/934-heterogeneous-fleet-benchmark.md; nothing here wires any
# fleet policy into production.
#
# It is also what makes `scripts/bench_fleet_routing.py` a *real* entry point
# rather than a script nobody can reach: `scripts/check-reachability.py` roots
# tooling at the workflow steps that execute it, matching on filename.
on:
  workflow_dispatch:
    inputs:
      tasks-per-class:
        description: "Synthetic tasks per capability class (corpus = 6 x this)"
        required: false
        default: "400"
        type: string
      seed:
        description: "Corpus/outcome seed (same seed reproduces the same run)"
        required: false
        default: "fleet-bench-v1"
        type: string
      scenario:
        description: "all-available | local-outage | hosted-outage | capacity-pressure | all"
        required: false
        default: "all"
        type: string

permissions:
  contents: read

concurrency:
  group: fleet-routing-bench
  cancel-in-progress: true

jobs:
  bench:
    name: bench
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-uv
      - name: uv sync (dev deps)
        run: uv sync --locked --extra dev
      - name: Benchmark heterogeneous fleet routing
        run: >-
          uv run python scripts/bench_fleet_routing.py
          --tasks-per-class ${{ inputs.tasks-per-class }}
          --seed ${{ inputs.seed }}
          --scenario ${{ inputs.scenario }}
          --output fleet-routing-bench.json
      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: fleet-routing-bench
          path: fleet-routing-bench.json
