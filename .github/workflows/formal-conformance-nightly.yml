name: Formal Conformance (Nightly)

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  formal-nightly:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      issues: write
    # A live PostgreSQL, same image and credentials as formal-conformance.yml's
    # service, so the Pg-backed models (#881's execution-lifecycle machine and
    # I29's lease/fence model) run here instead of skipping: ac_outcome_plugin
    # counts a skip as no evidence, and the nightly sweep exists precisely to
    # explore what the PR budget cannot.
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: maistro
          POSTGRES_PASSWORD: maistro
          POSTGRES_DB: maistro_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U maistro -d maistro_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      MAISTRO_FORMAL_NIGHTLY_EXAMPLES: "10000"
      # The Pg-backed models read this module-specific budget directly, not the
      # MAISTRO_FORMAL_NIGHTLY_EXAMPLES hook above: a live store is orders of
      # magnitude slower than the in-process models, so the nightly raise is
      # deliberately two orders of magnitude, not three.
      MAISTRO_FORMAL_PG_EXAMPLES: "200"
      MAISTRO_TEST_PG_DSN: postgresql://maistro:maistro@127.0.0.1:5432/maistro_test
      MAISTRO_TEST_DATABASE_URL: postgresql://maistro:maistro@127.0.0.1:5432/maistro_test

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e formal/ && pip install -e packages/maistro-core && pip install -e packages/maistro-evolve

      # Same drivers and migration step as formal-conformance.yml: asyncpg for
      # PgRunStore, psycopg[binary] for alembic's synchronous engine, and the
      # canonical schema applied before the models run so a missing relation
      # cannot read as a broken model.
      - name: Install PostgreSQL drivers and alembic
        run: pip install asyncpg "psycopg[binary]>=3.2" alembic "aiosqlite>=0.20"

      - name: Apply migrations
        env:
          DATABASE_URL: postgresql://maistro:maistro@127.0.0.1:5432/maistro_test
        run: alembic upgrade head

      - name: Restore Hypothesis example database
        uses: actions/cache/restore@v6
        with:
          path: .hypothesis/examples
          key: formal-hypothesis-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            formal-hypothesis-${{ runner.os }}-${{ github.ref_name }}-

      - name: Choose and record exploration seed
        shell: bash
        run: |
          set -euo pipefail
          seed="$(python -c 'import secrets; print(secrets.randbits(64))')"
          echo "HYPOTHESIS_SEED=$seed" >> "$GITHUB_ENV"
          mkdir -p formal
          if find .hypothesis/examples -type f -print -quit 2>/dev/null | grep -q .; then
            database_reused=true
          else
            database_reused=false
          fi
          {
            echo "seed=$seed"
            echo "max_examples=$MAISTRO_FORMAL_NIGHTLY_EXAMPLES"
            echo "database_reused=$database_reused"
            echo "replay=pytest formal/models/ -v --timeout=1800 --nightly --hypothesis-seed=$seed"
          } > formal/nightly-run-metadata.txt

      - name: Run formal models (deep exploration)
        shell: bash
        run: |
          set -euo pipefail
          pytest formal/models/ -v --timeout=1800 --nightly \
            --hypothesis-seed="$HYPOTHESIS_SEED" \
            --hypothesis-show-statistics \
            --junitxml=formal/nightly-results.xml \
            2>&1 | tee formal/nightly-hypothesis.log

      - name: Record example database result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -d .hypothesis/examples ]; then
            database_files_after="$(find .hypothesis/examples -type f | wc -l | tr -d ' ')"
          else
            database_files_after=0
          fi
          echo "database_files_after=$database_files_after" >> formal/nightly-run-metadata.txt

      - name: Save Hypothesis example database
        if: always()
        uses: actions/cache/save@v6
        with:
          path: .hypothesis/examples
          key: formal-hypothesis-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}

      - name: Upload nightly exploration evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: formal-nightly-results
          retention-days: 30
          include-hidden-files: true
          path: |
            formal/nightly-run-metadata.txt
            formal/nightly-hypothesis.log
            formal/nightly-results.xml
            .hypothesis/examples
