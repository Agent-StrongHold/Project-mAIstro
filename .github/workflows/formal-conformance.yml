name: Formal Conformance

on:
  pull_request:
  merge_group:
    types: [checks_requested]
  push:
    branches: [main, integration, develop]

concurrency:
  group: formal-conformance-${{ github.event.pull_request.number || github.event.merge_group.head_sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' }}

jobs:
  formal-conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    # I29 (`test_run_lease_fence.py`) drives the real `PgRunStore`, because the
    # invariant it checks is *about* concurrent writers and a store that has
    # only ever been asked one thing at a time cannot answer it (#132).
    #
    # A service rather than a skip, deliberately. `scripts/ac_outcome_plugin.py`
    # counts a skipped test as **no evidence**, so gating that model behind an
    # unset DSN would pin #132's criterion at unproven however green this job
    # looked — the precise failure the acceptance ladder exists to catch.
    #
    # Same image and credentials as ci.yml's `postgres` job, so the two agree
    # about what "a database" means here.
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: maistro
          POSTGRES_PASSWORD: maistro
          POSTGRES_DB: maistro_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U maistro -d maistro_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      MAISTRO_TEST_PG_DSN: postgresql://maistro:maistro@127.0.0.1:5432/maistro_test
      MAISTRO_TEST_DATABASE_URL: postgresql://maistro:maistro@127.0.0.1:5432/maistro_test

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # #460's checker was previously exercised only through a test wrapper.
      # Reachability correctly reported the script itself as never rooted by a
      # production/CI entry point. Run it directly in this already-required
      # architecture/conformance job so the freeze is operative and its own
      # reachability claim is true rather than baselined away.
      #
      # This is a PR-policy check because its exception is a PR label. The queue
      # runs only after the PR has already passed this check; the merge-group run
      # validates the combined tree through the formal models below rather than
      # trying to reconstruct PR label state from a merge_group payload.
      - name: Enforce M1 convergence freeze
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HAS_M1_CONVERGENCE_EXCEPTION: ${{ contains(github.event.pull_request.labels.*.name, 'm1-convergence-exception') }}
        run: |
          set -euo pipefail
          args=(--base "$BASE_SHA")
          if [[ "$HAS_M1_CONVERGENCE_EXCEPTION" == "true" ]]; then
            args+=(--exception)
          fi
          python scripts/check-m1-convergence-freeze.py "${args[@]}"

      # The oracle is a governed baseline, not a candidate-controlled test
      # input. After the initial contract lands, implementation and oracle
      # changes must use separate PRs so a self-approving candidate cannot
      # rewrite both sides of the judgment.
      - name: Enforce formal oracle independence
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        env:
          FORMAL_ORACLE_BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: python scripts/check-formal-oracle-independence.py --base "$FORMAL_ORACLE_BASE"

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e formal/

      - name: Install maistro-core
        run: pip install -e packages/maistro-core

      - name: Install maistro-evolve
        run: pip install -e packages/maistro-evolve

      # Two drivers, not one, and the second is the non-obvious half.
      #
      # `PgRunStore` uses asyncpg. `psycopg[binary]` is what *alembic* needs:
      # `maistro.config.database.to_sync_url` hands it a
      # `postgresql+psycopg://` URL because alembic drives a synchronous engine
      # and "the asyncio extension requires an async driver" otherwise. Without
      # it the migration step dies on `ModuleNotFoundError: No module named
      # 'psycopg'` — measured, on this job's first run.
      #
      # Both named explicitly so this job proves the same database boundary it
      # deploys rather than inheriting a driver transitively. ci.yml gets them
      # from `uv sync --extra dev`; a pip-based job has to say so. The version
      # matches the root pyproject's own `psycopg[binary]>=3.2` rather than
      # floating.
      - name: Install PostgreSQL drivers and alembic
        run: pip install asyncpg "psycopg[binary]>=3.2" alembic

      # The canonical tables I29 writes to. Without this the model fails on a
      # missing relation, which reads as a broken test rather than a missing
      # schema — so it runs before the models, not lazily inside them.
      #
      # `DATABASE_URL` is scoped to this step rather than the job. Alembic reads
      # it through `maistro.config.database.require_database_url`, which is also
      # what the Container answers "which database" with (#187) — setting it for
      # the whole job would silently give every other model a database none of
      # them is written against.
      - name: Apply migrations
        env:
          DATABASE_URL: postgresql://maistro:maistro@127.0.0.1:5432/maistro_test
        run: alembic upgrade head

      # The models consume the independently governed security oracle in
      # formal/fixtures/. They exercise the installed candidate behavior directly;
      # no artifact is regenerated from candidate source.
      - name: Run formal models
        run: pytest formal/models/ -v --timeout=300 --hypothesis-seed=0
