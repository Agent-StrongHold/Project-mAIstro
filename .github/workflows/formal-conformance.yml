name: Formal Conformance

on:
  pull_request:
  push:
    branches: [main, integration, develop]

concurrency:
  group: formal-conformance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  formal-conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write

    # I29 (`test_run_lease_fence.py`) drives the real `PgRunStore`, because the
    # invariant it checks is *about* concurrent writers and a store that has
    # only ever been asked one thing at a time cannot answer it (#132).
    #
    # A service rather than a skip, deliberately. `scripts/ac_outcome_plugin.py`
    # counts a skipped test as **no evidence**, so gating that model behind an
    # unset DSN would pin #132's criterion at unproven however green this job
    # looked — the precise failure the acceptance ladder exists to catch.
    #
    # Same image and credentials as ci.yml's `postgres` job, so the two agree
    # about what "a database" means here.
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: maistro
          POSTGRES_PASSWORD: maistro
          POSTGRES_DB: maistro_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U maistro"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      MAISTRO_TEST_PG_DSN: postgresql://maistro:maistro@127.0.0.1:5432/maistro_test
      MAISTRO_TEST_DATABASE_URL: postgresql://maistro:maistro@127.0.0.1:5432/maistro_test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e formal/

      - name: Install maistro-core
        run: pip install -e packages/maistro-core

      - name: Install maistro-evolve
        run: pip install -e packages/maistro-evolve

      # The driver I29 needs. Installed explicitly rather than through an extra
      # so this job's dependency on a database is visible in the workflow.
      - name: Install asyncpg and alembic
        run: pip install asyncpg alembic

      # The canonical tables I29 writes to. Without this the model fails on a
      # missing relation, which reads as a broken test rather than a missing
      # schema — so it runs before the models, not lazily inside them.
      #
      # `DATABASE_URL` is scoped to this step rather than the job. Alembic reads
      # it through `maistro.config.database.require_database_url`, which is also
      # what the Container answers "which database" with (#187) — setting it for
      # the whole job would silently give every other model a database none of
      # them is written against.
      - name: Apply migrations
        env:
          DATABASE_URL: postgresql://maistro:maistro@127.0.0.1:5432/maistro_test
        run: alembic upgrade head

      - name: Extract constants from source
        run: python -m formal.extractors.extract_security_constants

      - name: Check for drift
        id: drift
        run: |
          if git diff --quiet -- formal/generated/; then
            echo "drift=false" >> "$GITHUB_OUTPUT"
          else
            echo "drift=true" >> "$GITHUB_OUTPUT"
            git diff -- formal/generated/ > formal-models-drift.diff
          fi

      - name: Run formal models
        run: pytest formal/models/ -v --timeout=300 --hypothesis-seed=0

      - name: Upload drift diff artifact
        if: steps.drift.outputs.drift == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: formal-models-conformance-drift
          path: formal-models-drift.diff

      # Fork PRs get a read-only GITHUB_TOKEN, so createComment below would fail
      # there. That used to be handled with `continue-on-error: true`, which
      # swallowed every other failure mode too. Skipping forks by condition is the
      # narrow fix; the drift gate below runs regardless of fork status.
      - name: Comment on PR (drift detected)
        if: >-
          steps.drift.outputs.drift == 'true'
          && github.event_name == 'pull_request'
          && github.event.pull_request.head.repo.fork == false
        uses: actions/github-script@v7
        with:
          script: |
            const body = [
              'Formal models conformance drift detected.',
              '',
              'The extracted constants (`formal/generated/security-constants.json`) do not match this PR.',
              'Run `python -m formal.extractors.extract_security_constants` locally and commit the updated file.',
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body,
            });

      # Drift now FAILS the job. Until this step existed, `Check for drift` only set
      # an output: a PR whose security constants no longer matched the formal models
      # uploaded a diff, posted a comment, and passed. The workflow reported
      # conformance it had just measured as broken.
      #
      # Last, so the diff artifact and the PR comment are produced first — a
      # contributor gets the diff and the fix instruction alongside the failure.
      # Verified clean on 2026-07-26: the extractor is a no-op against this tree.
      - name: Gate on conformance drift
        if: steps.drift.outputs.drift == 'true'
        run: |
          echo "::error::Formal models conformance drift — formal/generated/ does not match this tree."
          echo "Run: python -m formal.extractors.extract_security_constants && git add formal/generated/"
          git diff -- formal/generated/
          exit 1
