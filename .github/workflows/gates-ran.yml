name: Gates Ran

# Did the gate set actually reach this commit? (#262 AC-2)
#
# Every other workflow here asks whether the code is good. This workflow asks a
# different question: did every required enforcement surface actually execute
# on the exact head being considered for merge?
#
# `workflow_run`, not `pull_request`, is deliberate. A job inside ci.yml cannot
# know whether quality.yml, Gate C, or another sibling workflow ran. Each
# producer completion re-evaluates the same PR head, so an early evaluation may
# be red while siblings are still running and the last completion settles the
# aggregate verdict.
#
# There is one GitHub Actions wrinkle that is load-bearing here: a
# `workflow_run` workflow itself runs from the default branch and its native job
# check is therefore attached to the default-branch SHA, not the triggering PR
# head. The required `gates-ran` context is consequently published explicitly
# as a commit status on `github.event.workflow_run.head_sha`. The workflow code
# and evaluator still come from the protected default branch, so a candidate PR
# cannot rewrite the judge that evaluates itself.
#
# This workflow does not run on the pull request that first installs a changed
# default-branch copy. That bootstrap limitation is inherent to `workflow_run`;
# once merged, the next producer completion uses the protected copy on develop.

on:
  workflow_run:
    workflows:
      - "CI"
      - "quality"
      - "security"
      - "CodeQL Advanced"
      - "Formal Conformance"
      - "Gate C"
      - "Registry CI"
      - "Vulture Ratchet"
      - "Cage Guard — Auto-reject PRs touching cage/ or eval/"
      - "Autonomous Merge Safety"
    types: [completed]

# Keyed by the head being judged rather than by the publisher's default-branch
# SHA. `cancel-in-progress` stays false because each completion is new evidence;
# queued evaluations converge on the latest check state for the same head.
concurrency:
  group: gates-ran-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

permissions:
  checks: read
  contents: read
  # The required gates-ran context must be attached to the PR head. A
  # workflow_run job's native check cannot do that, so the trusted publisher
  # writes exactly one named commit-status context and nothing else.
  statuses: write

jobs:
  publish-gates-ran:
    name: gates-ran-publisher
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Standard PR producer runs carry the candidate head SHA. A
    # pull_request_target producer is based on the protected base SHA, so it may
    # wake this workflow but must not publish a verdict for that SHA.
    if: github.event.workflow_run.event == 'pull_request'
    steps:
      - name: Resolve the PR head and base
        id: target
        uses: actions/github-script@v7
        with:
          script: |
            const source = context.payload.workflow_run;
            const headSha = source.head_sha;
            let prs = source.pull_requests || [];

            // GitHub normally supplies the PR association on workflow_run. If
            // it does not, resolve it from the exact triggering commit rather
            // than guessing the base branch.
            if (prs.length === 0) {
              const response = await github.rest.repos.listPullRequestsAssociatedWithCommit({
                owner: context.repo.owner,
                repo: context.repo.repo,
                commit_sha: headSha,
              });
              prs = response.data;
            }

            const pr = prs.find(candidate => candidate.head?.sha === headSha) || prs[0];
            if (!pr || !pr.base?.ref) {
              core.setFailed(`cannot resolve a pull request/base for ${headSha}`);
              return;
            }

            core.setOutput('head_sha', headSha);
            core.setOutput('base_branch', pr.base.ref);
            core.info(`evaluating ${headSha} for base ${pr.base.ref}`);

      # Explicitly use protected default-branch code. That is the security
      # advantage of workflow_run: the candidate cannot weaken its own judge.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyYAML
        run: pip install pyyaml

      # Paginated deliberately: this repository already emits enough checks for
      # the default GitHub page size to be unsafe evidence.
      - name: Collect check runs for the head under review
        uses: actions/github-script@v7
        env:
          HEAD_SHA: ${{ steps.target.outputs.head_sha }}
        with:
          script: |
            const fs = require('fs');
            const runs = await github.paginate(
              github.rest.checks.listForRef,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: process.env.HEAD_SHA,
                per_page: 100,
              },
            );
            fs.writeFileSync('check-runs.json', JSON.stringify({ check_runs: runs }));
            core.info(`${runs.length} check run(s) on ${process.env.HEAD_SHA}`);

      - name: Evaluate required execution evidence
        id: evaluate
        continue-on-error: true
        env:
          BASE_BRANCH: ${{ steps.target.outputs.base_branch }}
        run: >-
          python3 scripts/check-gates-ran.py
          --check-runs check-runs.json
          --require-complete
          --base-branch "$BASE_BRANCH"

      # Required checks are allowed by GitHub to be `skipped` and still satisfy
      # branch protection. This explicit status is the stricter aggregate: it
      # is green only when the evaluator saw real execution evidence.
      - name: Publish gates-ran on the exact PR head
        if: always() && steps.target.outputs.head_sha != ''
        uses: actions/github-script@v7
        env:
          HEAD_SHA: ${{ steps.target.outputs.head_sha }}
          EVALUATION_OUTCOME: ${{ steps.evaluate.outcome }}
        with:
          script: |
            const passed = process.env.EVALUATION_OUTCOME === 'success';
            const state = passed ? 'success' : 'failure';
            const description = passed
              ? 'All required checks executed on this exact head'
              : 'Required execution evidence is missing or non-executed';

            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: process.env.HEAD_SHA,
              state,
              context: 'gates-ran',
              description,
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });

            if (!passed) {
              core.setFailed(description);
            }
