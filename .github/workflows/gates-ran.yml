name: Gates Ran

# Did the gate set actually reach this candidate? (#262 AC-2)
#
# Every other workflow here asks whether the code is good. This workflow asks a
# different question: did every required enforcement surface actually execute
# on the exact PR or merge-group SHA being considered for merge?
#
# `workflow_run` is deliberate. A job inside ci.yml cannot know whether
# quality.yml, Gate C, or another sibling workflow ran. Each producer completion
# re-evaluates the same candidate. While sibling evidence is still absent or
# unfinished, this publisher emits a pending `gates-ran` status. Only complete
# evidence can become green, and a hard non-execution finding becomes red.
#
# A workflow_run workflow runs from the protected default branch and its native
# job check is attached to that default-branch execution, not the candidate SHA.
# The required `gates-ran` context is therefore published explicitly as a commit
# status on the candidate. The publisher and evaluator still come from protected
# default-branch code, so a candidate cannot rewrite the judge that evaluates
# itself.

on:
  workflow_run:
    workflows:
      - "CI"
      - "Integration Scope"
      - "quality"
      - "security"
      - "CodeQL Advanced"
      - "Formal Conformance"
      - "Gate C"
      - "Registry CI"
      - "Vulture Ratchet"
      - "Cage Guard — Auto-reject PRs touching cage/ or eval/"
      - "Autonomous Merge Safety"
    types: [completed]

concurrency:
  group: gates-ran-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

permissions:
  checks: read
  contents: read
  statuses: write

jobs:
  publish-gates-ran:
    name: gates-ran-publisher
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: >-
      github.event.workflow_run.event == 'pull_request' ||
      github.event.workflow_run.event == 'merge_group'
    steps:
      - name: Resolve the candidate head and base
        id: target
        uses: actions/github-script@v7
        with:
          script: |
            const source = context.payload.workflow_run;
            const headSha = source.head_sha;
            let baseBranch;
            let prNumber = '';

            if (source.event === 'merge_group') {
              const headBranch = source.head_branch || '';
              const queuePrefix = 'gh-readonly-queue/develop/';
              if (!headBranch.startsWith(queuePrefix)) {
                core.setFailed(`unreviewed merge-group base for ${headSha}: ${headBranch || '<empty>'}`);
                return;
              }
              baseBranch = 'develop';
            } else {
              let prs = source.pull_requests || [];
              if (prs.length === 0) {
                const response = await github.rest.repos.listPullRequestsAssociatedWithCommit({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  commit_sha: headSha,
                });
                prs = response.data;
              }

              const pr = prs.find(candidate => candidate.head?.sha === headSha) || prs[0];
              if (!pr || !pr.base?.ref) {
                core.setFailed(`cannot resolve a pull request/base for ${headSha}`);
                return;
              }
              baseBranch = pr.base.ref;
              prNumber = String(pr.number || '');
            }

            if (!/^[0-9a-f]{40}$/.test(headSha || '')) {
              core.setFailed(`candidate SHA is missing or invalid: ${headSha || '<empty>'}`);
              return;
            }

            core.setOutput('head_sha', headSha);
            core.setOutput('base_branch', baseBranch);
            core.setOutput('event_name', source.event);
            core.setOutput('pr_number', prNumber);
            core.info(`evaluating ${headSha} for base ${baseBranch} from ${source.event}`);

      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Collect check runs for the candidate under review
        if: steps.target.outputs.head_sha != ''
        uses: actions/github-script@v7
        env:
          HEAD_SHA: ${{ steps.target.outputs.head_sha }}
        with:
          script: |
            const fs = require('fs');
            const runs = await github.paginate(
              github.rest.checks.listForRef,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: process.env.HEAD_SHA,
                per_page: 100,
              },
            );
            fs.writeFileSync('check-runs.json', JSON.stringify({ check_runs: runs }));
            core.info(`${runs.length} check run(s) on ${process.env.HEAD_SHA}`);

      - name: Collect changed files for pull-request scope
        if: steps.target.outputs.head_sha != '' && steps.target.outputs.event_name == 'pull_request'
        uses: actions/github-script@v7
        continue-on-error: true
        env:
          PR_NUMBER: ${{ steps.target.outputs.pr_number }}
        with:
          script: |
            const fs = require('fs');
            const number = Number(process.env.PR_NUMBER || '0');
            if (!number) {
              fs.writeFileSync('changed-files.json', JSON.stringify({ measured: false }));
              core.warning('pull-request number was unavailable; specialized scope is ambiguous');
              return;
            }
            const files = await github.paginate(
              github.rest.pulls.listFiles,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: number,
                per_page: 100,
              },
            );
            fs.writeFileSync(
              'changed-files.json',
              JSON.stringify({ measured: true, files: files.map(file => file.filename) }),
            );
            core.info(`${files.length} changed file(s) on PR #${number}`);

      - name: Evaluate required execution evidence
        id: evaluate
        if: steps.target.outputs.head_sha != ''
        env:
          BASE_BRANCH: ${{ steps.target.outputs.base_branch }}
          EVENT_NAME: ${{ steps.target.outputs.event_name }}
        shell: bash
        run: |
          set +e
          python3 - "$BASE_BRANCH" "$EVENT_NAME" <<'PY'
          import importlib.util
          import json
          import sys
          from pathlib import Path

          base_branch, event_name = sys.argv[1:]
          root = Path.cwd()

          def load(name, path):
              spec = importlib.util.spec_from_file_location(name, path)
              if spec is None or spec.loader is None:
                  raise RuntimeError(f"cannot load {path}")
              module = importlib.util.module_from_spec(spec)
              sys.modules[name] = module
              spec.loader.exec_module(module)
              return module

          gate = load("check_gates_ran_inline", root / "scripts" / "check-gates-ran.py")
          required = gate.required_check_names(base_branch=base_branch, event_name=event_name)
          if not required:
              print("FAIL: the required-check contract is empty; nothing to verify ran.")
              raise SystemExit(1)

          try:
              payload = json.loads(Path("check-runs.json").read_text(encoding="utf-8"))
              runs = payload["check_runs"] if isinstance(payload, dict) else payload
          except (OSError, TypeError, ValueError, KeyError) as exc:
              print(f"FAIL: the check-run payload is unreadable, so whether the gates ran is unmeasured.\n  {exc}")
              raise SystemExit(1)

          # The existing merge-group classifier is the reviewed source of truth
          # for which expensive CI legs a changed path can affect. Apply it to
          # pull-request candidates only after measuring the PR file list. A
          # missing/ambiguous list never creates a pass: skipped specialized
          # checks remain pending until their scope is known.
          specialized = {
              "postgres (pg17)": "postgres",
              "postgres (pg18)": "postgres",
              "object storage (MinIO)": "object_storage",
              "durable-events": "durable_events",
              "strike-ladder": "strike_ladder",
              "hive-conductor-e2e": "hive_e2e",
              "hive-conductor-e2e-ui": "hive_e2e",
              "wheel-imports": "wheel_imports",
              "docker-build": "docker_build",
          }
          scoped_off = set()
          scope_measured = event_name != "pull_request"
          if event_name == "pull_request":
              try:
                  changed_payload = json.loads(
                      Path("changed-files.json").read_text(encoding="utf-8")
                  )
                  scope_measured = changed_payload.get("measured") is True
                  changed_files = changed_payload.get("files", [])
                  if scope_measured and not isinstance(changed_files, list):
                      scope_measured = False
                  if scope_measured:
                      classifier = load(
                          "ci_merge_group_scope_inline", root / "scripts" / "ci_merge_group_scope.py"
                      )
                      scope = classifier.classify(changed_files)
                      scoped_off = {
                          name for name, leg in specialized.items() if not scope.get(leg, True)
                      }
              except (OSError, TypeError, ValueError, AttributeError, ImportError, RuntimeError) as exc:
                  print(f"PENDING: specialized execution scope is ambiguous ({exc})")

          latest = {}
          for run in runs:
              if not isinstance(run, dict) or not isinstance(run.get("name"), str):
                  continue
              name = run["name"]
              incumbent = latest.get(name)
              if incumbent is None or gate._supersedes(run, incumbent):
                  latest[name] = run

          required = [
              name
              for name in required
              if name not in scoped_off or latest.get(name, {}).get("conclusion") != "skipped"
          ]
          absent = []
          not_executed = []
          unfinished = []
          for name in required:
              run = latest.get(name)
              if run is None:
                  absent.append(name)
              elif run.get("status") != "completed":
                  unfinished.append(name)
              elif run.get("conclusion") in gate.NON_EXECUTED:
                  if name in specialized and not scope_measured and run.get("conclusion") == "skipped":
                      unfinished.append(name)
                  else:
                      not_executed.append(name)

          if absent or unfinished or not_executed:
              pending = not not_executed and bool(absent or unfinished)
              heading = (
                  "PENDING: execution evidence is still arriving"
                  if pending
                  else "FAIL: the gate set did not reach this commit"
              )
              print(heading + "\n")
              if absent:
                  print(f"  not present yet ({len(absent)}):")
                  for name in absent:
                      print(f"    {name}")
              if not_executed:
                  print(f"\n  present but did not execute to a verdict ({len(not_executed)}):")
                  for name in not_executed:
                      print(f"    {name}")
              if unfinished:
                  print(f"\n  started but not finished ({len(unfinished)}):")
                  for name in unfinished:
                      print(f"    {name}")
              raise SystemExit(2 if pending else 1)

          print(f"ok: all {len(required)} required check(s) ran on this head")
          PY
          code=$?
          set -e
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"

      - name: Publish gates-ran on the exact candidate head
        if: always() && steps.target.outputs.head_sha != ''
        uses: actions/github-script@v7
        env:
          HEAD_SHA: ${{ steps.target.outputs.head_sha }}
          EVALUATION_EXIT_CODE: ${{ steps.evaluate.outputs.exit_code }}
        with:
          script: |
            const code = Number(process.env.EVALUATION_EXIT_CODE || '1');
            const state = code === 0 ? 'success' : code === 2 ? 'pending' : 'failure';
            const description = code === 0
              ? 'All required checks executed on this exact head'
              : code === 2
                ? 'Required execution evidence is still arriving'
                : 'Required execution evidence is missing or non-executed';

            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: process.env.HEAD_SHA,
              state,
              context: 'gates-ran',
              description,
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });

            if (state === 'failure') {
              core.setFailed(description);
            }
