name: Integration Scope

on:
  pull_request:
  merge_group:
    types: [checks_requested]

permissions:
  checks: read
  contents: read

concurrency:
  group: integration-scope-${{ github.event.pull_request.number || github.event.merge_group.head_sha || github.ref }}
  cancel-in-progress: true

jobs:
  integration-scope:
    name: integration-scope
    runs-on: ubuntu-latest
    # #869 demonstrated a 35-minute gap between this aggregator starting and
    # the last required specialized producer receiving a runner. docker-build
    # is bounded to 45 minutes (#899 coherence, raised for the maistro-core
    # cold-rebuild path measured in run 36831116132). Give evidence 85 minutes
    # to appear and complete (>= the 35-minute queue lag plus the producer's
    # 45-minute ceiling), plus five minutes for checkout/scope resolution and
    # cleanup.
    timeout-minutes: 90
    env:
      # A 30-second cadence preserves the 85-minute evidence window while
      # bounding each aggregator to about 170 check-list requests per hour.
      EVIDENCE_WAIT_ATTEMPTS: "170"
      EVIDENCE_WAIT_INTERVAL_MS: "30000"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Resolve integration scope
        id: scope
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "merge_group" ]]; then
            base_sha="$(python3 scripts/ci_base_revision.py)"
            git diff --name-only "$base_sha"...HEAD > /tmp/changed-paths.txt
            mapfile -t changed_paths < /tmp/changed-paths.txt
            scope_json="$(python3 scripts/ci_merge_group_scope.py --json "${changed_paths[@]}")"
          else
            scope_json="$(python3 scripts/ci_merge_group_scope.py --json)"
          fi
          required_json="$(
            python3 scripts/check-integration-scope.py \
              --event-name "$GITHUB_EVENT_NAME" \
              --scope-json "$scope_json" \
              --required-json
          )"
          echo "scope_json=$scope_json" >> "$GITHUB_OUTPUT"
          echo "required_json=$required_json" >> "$GITHUB_OUTPUT"
          echo "$scope_json"
          echo "$required_json"

      - name: Wait only for required specialized CI evidence
        uses: actions/github-script@v9
        env:
          REQUIRED_JSON: ${{ steps.scope.outputs.required_json }}
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
        with:
          script: |
            const required = new Set(JSON.parse(process.env.REQUIRED_JSON));
            const candidateSha = process.env.CANDIDATE_SHA;
            const maxAttempts = Number.parseInt(process.env.EVIDENCE_WAIT_ATTEMPTS, 10);
            const intervalMs = Number.parseInt(process.env.EVIDENCE_WAIT_INTERVAL_MS, 10);

            if (!Number.isInteger(maxAttempts) || maxAttempts < 1 || !Number.isInteger(intervalMs) || intervalMs < 1) {
              core.setFailed('invalid Integration Scope polling budget');
              return;
            }

            core.info(`candidate ${candidateSha}: waiting for ${[...required].join(', ') || '<no specialized checks>'}`);
            if (required.size === 0) return;

            for (let attempt = 1; attempt <= maxAttempts; attempt += 1) {
              // A transient GitHub API outage must not fail the aggregator
              // while evidence is still pending: run 37156105427 died on an
              // unhandled 503 at attempt 5 of 170 with every required check
              // still in flight. Treat server-side and throttling failures
              // (and unclassed network errors) as one spent attempt; anything
              // else — especially permanent 4xx — is a real fault and
              // rethrows. Budget exhaustion still fails closed below.
              let runs;
              try {
                runs = await github.paginate(
                  github.rest.checks.listForRef,
                  {
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    ref: candidateSha,
                    per_page: 100,
                  },
                );
              } catch (error) {
                const status = error && error.status;
                if (status !== undefined && status !== null && status < 500 && status !== 429) {
                  throw error;
                }
                core.warning(`attempt ${attempt}: checks API request failed transiently (${status === undefined || status === null ? 'network error' : `HTTP ${status}`}); retrying within the evidence budget`);
                await new Promise(resolve => setTimeout(resolve, intervalMs));
                continue;
              }

              const latest = new Map();
              for (const run of runs) {
                // Same-SHA workflow attempts can arrive newest-first or span
                // pages. Compare check-run IDs, not response order or verdict:
                // a newer queued/cancelled/failed attempt must supersede success.
                // started_at may be null while queued; an old job can finish last.
                const previous = latest.get(run.name);
                if (!previous || run.id > previous.id) latest.set(run.name, run);
              }

              const pending = [];
              for (const name of required) {
                const run = latest.get(name);
                if (!run || run.status !== 'completed') {
                  pending.push(name);
                  continue;
                }
                if (run.conclusion !== 'success') {
                  core.setFailed(`${name} is required by integration scope but concluded ${run.conclusion || '<none>'}`);
                  return;
                }
              }

              if (pending.length === 0) {
                core.info('all integration-scope specialized evidence succeeded');
                return;
              }

              core.info(`attempt ${attempt}: still waiting for ${pending.join(', ')}`);
              await new Promise(resolve => setTimeout(resolve, intervalMs));
            }

            core.setFailed('timed out waiting for required specialized CI evidence');
