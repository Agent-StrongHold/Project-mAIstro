name: M0 closeout

on:
  push:
    branches: [chatgpt/m0-closeout]

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/m0-closeout
          fetch-depth: 0

      - name: Reconcile with current develop
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "m0-closeout-bot"
          git config user.email "m0-closeout-bot@users.noreply.github.com"
          git fetch origin develop
          if ! git merge --no-edit origin/develop; then
            mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
            allowed=(
              "quality/ac-state.json"
              "quality/ac-state-ceilings.json"
              "quality/vulture-baseline.json"
            )
            for path in "${conflicts[@]}"; do
              ok=false
              for candidate in "${allowed[@]}"; do
                [[ "$path" == "$candidate" ]] && ok=true
              done
              if [[ "$ok" != true ]]; then
                echo "Unexpected merge conflict: $path" >&2
                exit 1
              fi
            done
            git checkout --theirs -- "${allowed[@]}"
            git add "${allowed[@]}"
            git commit --no-edit
          fi

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install workspace and quality scanners
        run: |
          uv sync --frozen
          bash scripts/install-quality-scanners.sh

      - name: Apply strict M0 corrections
        run: uv run python scripts/m0-finalize.py

      - name: Keep Container composition below complexity ceiling
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('packages/maistro-core/src/maistro/container.py')
          text = path.read_text()
          inline = '''    # Prompts are part of the same persistence decision as the agent definitions
              # that reference them. Hive used to construct an InMemoryPromptManager after
              # the Container had already selected PostgreSQL, which made agent souls the
              # last pg_* surface silently lost on restart (#122).
              if pg_pool is not None:
                  from maistro.persistence.pg_prompts import PgPromptManager

                  prompt_manager = PgPromptManager(pg_pool)
              elif db_pool is not None:
                  from maistro.persistence.sqlite_prompts import SqlitePromptManager

                  prompt_manager = SqlitePromptManager(db_pool)
                  await prompt_manager.ensure_schema()
              else:
                  from maistro.prompts.store import InMemoryPromptManager

                  prompt_manager = InMemoryPromptManager()
          '''.replace('          ', '')
          call = '''    # Prompt persistence is selected by the same backend decision as the
              # rest of the Container, but kept out of this composition function so adding a
              # backend does not grow the orchestration branch count (#122).
              prompt_manager = await _wire_prompt_manager(pg_pool=pg_pool, db_pool=db_pool)
          '''.replace('          ', '')
          if inline not in text:
              raise SystemExit('inline prompt wiring shape changed')
          text = text.replace(inline, call, 1)
          marker = 'async def _wire_audit_log(*, pg_pool: Any, db_pool: Any) -> Any:\n'
          helper = '''async def _wire_prompt_manager(*, pg_pool: Any, db_pool: Any) -> PromptManager:
              """Select the versioned prompt store from the configured relational backend."""
              if pg_pool is not None:
                  from maistro.persistence.pg_prompts import PgPromptManager

                  return PgPromptManager(pg_pool)
              if db_pool is not None:
                  from maistro.persistence.sqlite_prompts import SqlitePromptManager

                  manager = SqlitePromptManager(db_pool)
                  await manager.ensure_schema()
                  return manager

              from maistro.prompts.store import InMemoryPromptManager

              return InMemoryPromptManager()


          '''.replace('          ', '')
          if marker not in text:
              raise SystemExit('audit wiring marker changed')
          text = text.replace(marker, helper + marker, 1)
          path.write_text(text)
          PY

      - name: Format touched Python
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t pyfiles < <(git diff --name-only -- '*.py')
          if ((${#pyfiles[@]})); then
            uv run ruff format "${pyfiles[@]}"
            uv run ruff check "${pyfiles[@]}"
          fi

      - name: Bank measured acceptance state
        run: |
          uv run python scripts/check-ac-state.py --run-tests --ratchet --bank
          uv run python scripts/check-ac-state.py --run-tests --ratchet

      - name: Bank exact Vulture identities
        run: |
          uv run python scripts/check-vulture-baseline.py --update
          uv run python scripts/check-vulture-baseline.py

      - name: Verify M0 truth gates
        run: |
          uv run python scripts/check-backlog-consistency.py
          uv run python scripts/check-reachability.py
          uv run python scripts/check-reachability-dispositions.py
          uv run python scripts/check-convergence-matrix.py
          uv run python scripts/check-security-inventory.py
          uv run python scripts/check-doc-links.py

      - name: Verify targeted behavior
        run: |
          uv run pytest -q \
            packages/maistro-core/tests/test_container_sqlite_backend.py \
            packages/maistro-core/tests/test_container_postgres.py \
            packages/maistro-core/tests/fitness/test_import_boundaries.py \
            tests/test_check_backlog_consistency.py \
            tests/test_check_ac_state.py \
            tests/tools/registry/test_schema.py

      - name: Require strict M0 completion counters
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('quality/ac-state.json').read_text())
          assert report['totals']['completion_claims_contradicted'] == 0, report['totals']
          assert report['totals']['completion_claims_unverifiable'] == 0, report['totals']
          baseline = json.loads(Path('quality/reachability-baseline.json').read_text())
          remaining = [m for m in baseline['unreachable'] if m in {
              'maistro.persistence.pg_prompts',
              'maistro.persistence.sqlite_prompts',
              'maistro.persistence.sqlite_audit',
          }]
          assert not remaining, remaining
          PY

      - name: Commit verified closeout
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/m0-closeout.yml scripts/m0-finalize.py
          git add -A
          git status --short
          git commit -m "Finish strict M0 closeout (#30 #31 #122)"
          git push origin HEAD:chatgpt/m0-closeout
