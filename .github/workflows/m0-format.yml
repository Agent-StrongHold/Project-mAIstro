name: M0 format touched Python files

on:
  push:
    branches:
      - chatgpt/m0-closeout
    paths:
      - .github/workflows/m0-format.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/m0-closeout
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
      - name: Format only the two M0-touched Python files
        run: |
          uvx ruff@0.15.12 format packages/maistro-core/tests/fitness/test_import_boundaries.py tests/tools/registry/test_schema.py
          uvx ruff@0.15.12 format --check packages/maistro-core/tests/fitness/test_import_boundaries.py tests/tools/registry/test_schema.py
      - name: Commit formatting and remove this temporary helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/m0-format.yml
          git add packages/maistro-core/tests/fitness/test_import_boundaries.py tests/tools/registry/test_schema.py
          git commit -m "Format M0 closeout changes"
          git push origin HEAD:chatgpt/m0-closeout
