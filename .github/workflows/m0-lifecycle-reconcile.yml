name: M0 lifecycle reconcile

on:
  push:
    branches: [chatgpt/m0-closeout]

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/m0-closeout
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install lifecycle dependencies
        run: pip install pyyaml

      - name: Record evidence-driven backwards lifecycle corrections
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import importlib.util
          import json
          import re
          import sys

          root = Path('.')
          files = [
              'docs/adr/ADR-048-session-search.md',
              'docs/adr/ADR-050-tool-reversibility-taxonomy.md',
              'docs/adr/ADR-051-tool-approval-gates.md',
              'docs/adr/ADR-056-task-crash-recovery.md',
              'docs/adr/ADR-057-memory-exposure-mode.md',
              'docs/adr/ADR-061-maistro-design-package.md',
              'docs/adr/ADR-062326-616c-design-skills-code-export-capability.md',
              'docs/adr/ADR-062326-702b-multi-modality-design-outputs-hierarchical-artifact-containers.md',
              'docs/adr/ADR-067-canvas-asset-compositor.md',
              'docs/adr/ADR-068-unified-authorization-and-elevation.md',
              'docs/adr/ADR-069-code-registry.md',
              'docs/adr/ADR-070-repertoire-pattern.md',
              'docs/adr/ADR-074-policy-adr-deconfliction.md',
              'docs/adr/ADR-080-memory-dynamics.md',
              'docs/adr/ADR-091-memory-model-layers.md',
              'docs/specs/SPEC-062326-e9c6-design-skills-react-tsx-output-format.md',
              'docs/specs/SPEC-062826-1924-test-hardening-adversarial-matrix-exploratory.md',
              'docs/specs/SPEC-080126-9e42-memory-decay-driver.md',
              'docs/specs/SPEC-080226-4c1f-log-redaction-wiring.md',
              'docs/specs/SPEC-160-maistro-design-acceptance-criteria.md',
              'docs/specs/SPEC-201-builders-dag-runtime.md',
              'docs/specs/SPEC-206-policy-conformance-engine.md',
              'docs/specs/SPEC-208-foreign-harness-adapter.md',
          ]
          reason = (
              'M0 strict evidence reconciliation: current acceptance evidence does not '
              'support an Implemented completion claim; implementation history remains recorded.'
          )
          transition = (
              '\n  - status: Accepted\n'
              '    date: 2026-08-25\n'
              f'    reason: "{reason}"\n'
          )

          changed = 0
          for rel in files:
              path = root / rel
              text = path.read_text(encoding='utf-8')
              if not text.startswith('---\n'):
                  raise SystemExit(f'{rel}: missing front matter')
              fm_end = text.find('\n---\n', 4)
              if fm_end < 0:
                  raise SystemExit(f'{rel}: unterminated front matter')
              front = text[:fm_end]
              if not re.search(r'(?m)^status:\s*Accepted\s*$', front):
                  raise SystemExit(f'{rel}: current status is not Accepted')
              hist_match = re.search(r'(?m)^history:\s*$', front)
              if not hist_match:
                  raise SystemExit(f'{rel}: no history block')
              history_start = hist_match.end()
              next_field = re.search(r'(?m)^([A-Za-z][A-Za-z0-9_-]*):', front[history_start:])
              history_end = history_start + next_field.start() if next_field else len(front)
              history = front[history_start:history_end]
              states = re.findall(r'(?m)^\s{2}- status:\s*(.+?)\s*$', history)
              if states and states[-1] == 'Accepted':
                  continue
              if not states or states[-1] != 'Implemented':
                  raise SystemExit(f'{rel}: expected history to end Implemented, got {states[-1:]!r}')
              front = front[:history_end] + transition + front[history_end:]
              path.write_text(front + text[fm_end:], encoding='utf-8')
              changed += 1

          if changed not in (0, len(files)):
              raise SystemExit(f'partial lifecycle reconciliation: {changed}/{len(files)}')
          print(f'Lifecycle corrections recorded: {changed or len(files)}')

          spec = importlib.util.spec_from_file_location('lint_lifecycle', root / 'tools/lint_lifecycle.py')
          if spec is None or spec.loader is None:
              raise SystemExit('cannot import lifecycle linter')
          module = importlib.util.module_from_spec(spec)
          sys.modules['lint_lifecycle'] = module
          spec.loader.exec_module(module)
          current_errors = set(module.collect_errors(['docs/adr', 'docs/specs']))

          baseline_path = root / 'quality/lifecycle-baseline.json'
          baseline = json.loads(baseline_path.read_text(encoding='utf-8'))
          old = baseline['violations']
          baseline['violations'] = {
              key: value for key, value in old.items() if key in current_errors
          }
          pruned = sorted(set(old) - set(baseline['violations']))
          baseline_path.write_text(json.dumps(baseline, indent=2) + '\n', encoding='utf-8')
          print(f'Pruned {len(pruned)} stale lifecycle baseline entries')
          if len(pruned) != 21:
              raise SystemExit(f'expected 21 stale baseline entries, pruned {len(pruned)}')

          test_path = root / 'tests/tools/test_lint_lifecycle.py'
          test_text = test_path.read_text(encoding='utf-8')
          old_test = '''def test_baseline_file_matches_its_own_contract(lint):
              """Every committed baseline entry is a real, currently-occurring violation
              (test_repo_corpus_passes_the_gate proves 'no new' — this pins the shape)."""
              baseline = lint.load_baseline()
              assert baseline, "baseline exists and is non-empty as of SPEC-062826-8982"
              for key in baseline:
                  assert ": " in key, f"baseline keys are `path: message` strings, got {key!r}"
          '''.replace('          ', '')
          new_test = '''def test_baseline_file_matches_its_own_contract(lint):
              """The committed baseline exactly equals currently accepted violations.

              Zero is a valid and preferred steady state; a ratchet must not require debt
              to remain merely so the test has something to count.
              """
              baseline = lint.load_baseline()
              errors = set(lint.collect_errors(["docs/adr", "docs/specs"]))
              assert baseline == errors
              for key in baseline:
                  assert ": " in key, f"baseline keys are `path: message` strings, got {key!r}"
          '''.replace('          ', '')
          if old_test not in test_text:
              raise SystemExit('lifecycle baseline contract test shape changed')
          test_path.write_text(test_text.replace(old_test, new_test, 1), encoding='utf-8')
          PY

      - name: Verify lifecycle corpus and focused tests
        run: |
          python tools/lint_lifecycle.py
          pip install -e ./packages/maistro-registry pytest
          pytest tests/tools/registry/ tests/tools/test_lint_lifecycle.py \
            --confcutdir=tests/tools -p no:cacheprovider -q

      - name: Commit verified lifecycle reconciliation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "m0-closeout-bot"
          git config user.email "m0-closeout-bot@users.noreply.github.com"
          git rm .github/workflows/m0-lifecycle-reconcile.yml
          git add docs/adr docs/specs quality/lifecycle-baseline.json tests/tools/test_lint_lifecycle.py
          git commit -m "Record M0 evidence-driven lifecycle corrections"
          git push origin HEAD:chatgpt/m0-closeout
