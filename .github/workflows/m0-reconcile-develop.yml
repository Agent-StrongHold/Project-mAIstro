name: M0 reconcile latest develop

on:
  push:
    branches:
      - chatgpt/m0-closeout
    paths:
      - .github/workflows/m0-reconcile-develop.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/m0-closeout
          fetch-depth: 0
      - name: Merge current develop and resolve generated/planning surfaces deliberately
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin develop
          git merge --no-commit origin/develop || true

          if git ls-files -u -- quality/ac-state.json | grep -q .; then
            git checkout --theirs -- quality/ac-state.json
          fi
          if git ls-files -u -- quality/ac-state-ceilings.json | grep -q .; then
            git checkout --theirs -- quality/ac-state-ceilings.json
          fi
          if git ls-files -u -- docs/architecture/CONVERGENCE-MATRIX.md | grep -q .; then
            git checkout --ours -- docs/architecture/CONVERGENCE-MATRIX.md
          fi
          sed -i 's/ADR-2026-08-16/ADR-081626-f383/g' docs/architecture/CONVERGENCE-MATRIX.md
          git add quality/ac-state.json quality/ac-state-ceilings.json docs/architecture/CONVERGENCE-MATRIX.md

          unresolved=$(git diff --name-only --diff-filter=U)
          if [ -n "$unresolved" ]; then
            echo "Unresolved merge conflicts:"
            echo "$unresolved"
            exit 1
          fi

      - name: Align design-coverage status vocabulary with ADR-097
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("scripts/check-ac-state.py")
          text = path.read_text(encoding="utf-8")
          old = '''#: The three ADR-097 states between `Accepted` and `Implemented` are included,
          #: and `Fully Specced` most of all: it *means* every child spec has acceptance
          #: criteria, so an ADR carrying it with no child spec at all is precisely the
          #: absent link this counter exists to report. None of the three sits on any ADR
          #: today, which is exactly why leaving them out would have been invisible.
          DECISION_TAKEN = (
              "Accepted",
              "Fully Specced",
              "In Progress",
              "Tests Passing",
              "Implemented",
          )'''
          new = '''#: ADR-097 gives ADRs one taken intermediate state between `Accepted` and
          #: `Implemented`: `Fully Specced`. `In Progress` and `Tests Passing` are SPEC
          #: states, not ADR states, so including them here would silently make this
          #: governance metric accept lifecycle vocabulary the kind-specific linter rejects.
          DECISION_TAKEN = (
              "Accepted",
              "Fully Specced",
              "Implemented",
          )'''
          if old not in text:
              raise SystemExit("DECISION_TAKEN block did not match expected source")
          text = text.replace(old, new)
          old_definition = '"mean over Accepted|Implemented ADRs of the fraction of their criteria "'
          new_definition = (
              '"mean over Accepted|Fully Specced|Implemented ADRs of the fraction of their criteria "'
          )
          if old_definition not in text:
              raise SystemExit("design coverage definition did not match expected source")
          text = text.replace(old_definition, new_definition)
          path.write_text(text, encoding="utf-8")
          PY

      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.5.x"
      - run: uv python install 3.12
      - run: uv sync --locked --all-extras
      - run: uv pip install -e packages/maistro-evolve
      - name: Measure M0 on the current develop baseline
        run: |
          set +e
          output=$(uv run python scripts/check-ac-state.py --run-tests --ratchet 2>&1)
          rc=$?
          set -e
          echo "$output"

          if echo "$output" | grep -Eq 'completion_claims_|specs_awaiting_retrofit|markers_without_criterion|criteria_claimed_but_unproven|scenarios_without_ac_tag|gherkin_parse_errors|specs_implementing_nothing|adrs_without_implementing_spec|specs_declaring_no_criteria'; then
            echo "M0 changed a debt counter; refusing to bank it"
            exit 1
          fi
          if [ "$rc" -ne 0 ] && ! echo "$output" | grep -q 'design_coverage'; then
            echo "Ratchet failed for a reason other than the reviewed M0 denominator change"
            exit 1
          fi

          uv run python scripts/check-ac-state.py --run-tests --ratchet --bank
          uv run python scripts/check-ac-state.py --run-tests --ratchet
      - name: Commit reconciled M0 state
        run: |
          git add -A
          git commit -m "Align M0 governance metrics with ADR lifecycle"
          git push origin HEAD:chatgpt/m0-closeout
