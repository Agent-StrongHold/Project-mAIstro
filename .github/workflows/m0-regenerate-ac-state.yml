name: M0 regenerate acceptance-state report

on:
  push:
    branches:
      - chatgpt/m0-closeout
    paths:
      - .github/workflows/m0-regenerate-ac-state.yml

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/m0-closeout
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.5.x"
      - run: uv python install 3.12
      - run: uv sync --locked --all-extras
      - run: uv pip install -e packages/maistro-evolve
      - name: Regenerate measured report
        run: uv run python scripts/check-ac-state.py --run-tests --out quality/ac-state.json
      - name: Commit generated report
        run: |
          if git diff --quiet -- quality/ac-state.json; then
            echo "quality/ac-state.json already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add quality/ac-state.json
          git commit -m "Regenerate acceptance-state report"
          git push origin HEAD:chatgpt/m0-closeout
