name: M1 267 evidence reconciliation

on:
  push:
    branches:
      - chatgpt/m1-267-hive-ac-evidence

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: ./.github/actions/setup-uv

      - name: Setup Python
        run: uv python install 3.12

      - name: Install workspace and Hive test dependencies
        run: |
          uv sync --locked --all-extras
          uv pip install -r packages/hive-conductor/backend/requirements.txt

      - name: Apply issue 267 reconciliation
        run: uv run python scripts/m1_267_reconcile.py

      - name: Format and lint changed Python
        run: |
          uv run ruff format scripts/check-ac-state.py tests/test_check_ac_state_hive_recipes.py packages/hive-conductor/backend/tests/test_ac_evidence_recipe.py
          uv run ruff check scripts/check-ac-state.py tests/test_check_ac_state_hive_recipes.py packages/hive-conductor/backend/tests/test_ac_evidence_recipe.py

      - name: Unit-test recipe semantics
        run: uv run pytest tests/test_check_ac_state_hive_recipes.py -q

      - name: Prove isolated Hive marker directly
        run: uv run pytest packages/hive-conductor/backend/tests/test_ac_evidence_recipe.py -q

      - name: Measure and bank combined acceptance ladder
        run: |
          uv run python scripts/check-ac-state.py --run-tests --ratchet --bank
          uv run python - <<'PY'
          import json
          state = json.load(open("quality/ac-state.json"))
          adr = next(item for item in state["adrs"] if item["id"] == "ADR-082226-ff3c")
          ac8 = next(item for item in adr["own_detail"] if item["id"] == "ADR-082226-ff3c/AC-8")
          assert ac8["rung"] == "reachable", ac8
          print("AC-8 rung:", ac8["rung"])
          print("design coverage:", state["totals"]["design_coverage"])
          PY

      - name: Run affected governance gates
        run: |
          uv run python scripts/check-suite-inventory.py
          uv run python scripts/check-reachability.py
          uv run python tools/lint_lifecycle.py

      - name: Commit verified issue 267 implementation
        run: |
          rm .github/workflows/m1-267-reconcile.yml scripts/m1_267_reconcile.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Prove Hive acceptance evidence in an isolated recipe (#267)"
          git push origin HEAD:chatgpt/m1-267-hive-ac-evidence
