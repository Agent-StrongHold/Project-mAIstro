                      lease_holder=executor_id or runtime_name,
                      lease_ttl=self._lease_ttl,
                  )
                  lease = attempt.execution_lease
                  if lease is None:
                      raise RunIntegrityError("store-created Attempt is missing its execution lease")
                  token = lease.fencing_token
                  attempt = await self._store.transition_attempt(
                      attempt.attempt_id,
                      AttemptStatus.RUNNING,
                      fencing_token=token,
                  )
              else:
                  attempt = preclaimed_attempt
                  if attempt.node_run_id != node_run_id:
                      raise RunIntegrityError("preclaimed Attempt belongs to a different NodeRun")
                  if attempt.status is not AttemptStatus.RUNNING:
                      raise RunIntegrityError("preclaimed Attempt must already be RUNNING")
                  lease = attempt.execution_lease
                  if lease is None or lease.expires_at is None:
                      raise RunIntegrityError("preclaimed Attempt requires an expiring execution lease")
                  if self._lease_ttl is None:
                      raise RunIntegrityError("preclaimed Attempt execution requires lease_ttl")
                  token = lease.fencing_token
