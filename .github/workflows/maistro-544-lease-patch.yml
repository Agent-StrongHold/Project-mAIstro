                  await self._write(conn, "canonical_runs", "run_id", run_id, running_run)
              return attempt

              # ── NodeRun ───────────────────────────────────────────────────
''',
          )

          execution = "packages/maistro-core/src/maistro/runs/execution.py"
          replace(
