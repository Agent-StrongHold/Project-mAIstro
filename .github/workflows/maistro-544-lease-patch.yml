name: Apply #544 leased claim patch

on:
  push:
    branches:
      - chatgpt/m1-544-consumer-claim-recovery
    paths:
      - .github/workflows/maistro-544-lease-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/m1-544-consumer-claim-recovery
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - name: Apply guarded transforms
        shell: python
        run: |
          from pathlib import Path

          def replace(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected one match in {path}, found {count}: {old[:100]!r}")
              p.write_text(text.replace(old, new, 1))

          store = "packages/maistro-core/src/maistro/runs/store.py"
          replace(
              store,
              "class RunIntegrityError(ValueError):\n    pass\n\n\nclass ArchivedPayloadUnavailable",
              "class RunIntegrityError(ValueError):\n    pass\n\n\nclass RunClaimUnavailable(RunIntegrityError):\n    \"\"\"A QUEUED Run was claimed or moved before this consumer acquired it.\"\"\"\n\n\nclass ArchivedPayloadUnavailable",
          )
          replace(
              store,
              "def validate_accepted_outcome_against_attempt(\n",
              '''def _claimed_execution_records(
              run: Run,
              *,
              node_id: str,
              node_ordinal: int,
              runtime_id: str,
              executor_id: str,
              deadline_at: datetime | None,
              lease_ttl: timedelta,
          ) -> tuple[Run, NodeRun, Attempt]:
              """Build one all-or-nothing logical + physical consumer claim (#544)."""
              if run.status is not RunStatus.QUEUED:
                  raise RunClaimUnavailable(
                      f"Run {run.run_id!r} is {run.status.value!r}, not queued for claim"
                  )
              if lease_ttl <= timedelta(0):
                  raise ValueError("lease_ttl must be positive")
              graph = run.graph.materialize()
              if not any(node.node_id == node_id for node in graph.nodes):
                  raise RunIntegrityError(
                      f"node_id {node_id!r} is not present in the Run Graph snapshot"
                  )

              moment = datetime.now(UTC)
              running_run = transition_run(run, RunStatus.RUNNING, at=moment)
              node_run = NodeRun(run_id=run.run_id, node_id=node_id, ordinal=node_ordinal)
              node_run = transition_node_run(node_run, RunStatus.QUEUED, at=moment)
              node_run = transition_node_run(node_run, RunStatus.RUNNING, at=moment)
              attempt = Attempt(
                  node_run_id=node_run.node_run_id,
                  ordinal=1,
                  runtime_id=runtime_id,
                  executor_id=executor_id,
                  deadline_at=deadline_at,
              )
              lease = ExecutionLease(
                  node_run_id=node_run.node_run_id,
                  attempt_id=attempt.attempt_id,
                  lease_epoch=attempt.ordinal,
                  holder=executor_id or runtime_id,
                  issued_at=moment,
              )
              lease = renewed_lease(lease, at=moment, ttl=lease_ttl)
              attempt = Attempt.model_validate(
                  {**attempt.model_dump(mode="python"), "execution_lease": lease}
              )
              attempt = transition_attempt(attempt, AttemptStatus.RUNNING, at=moment)
              return running_run, node_run, attempt


def validate_accepted_outcome_against_attempt(
''',
          )
          replace(
              store,
              "    async def create_node_run(self, run_id: str, *, node_id: str) -> NodeRun: ...\n",
              '''    async def claim_run_execution(
              self,
              run_id: str,
              *,
              node_id: str,
              runtime_id: str = "python",
              executor_id: str = "",
              deadline_at: datetime | None = None,
              lease_ttl: timedelta,
          ) -> Attempt: ...

              async def create_node_run(self, run_id: str, *, node_id: str) -> NodeRun: ...
''',
          )
          replace(
              store,
