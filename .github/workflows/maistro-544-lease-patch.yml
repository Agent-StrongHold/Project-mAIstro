              # store, so another coroutine cannot observe or interleave a
              # partially claimed spine.
              self._runs[run_id] = running_run
              self._node_runs[node_run.node_run_id] = node_run
              self._attempts[attempt.attempt_id] = attempt
              return attempt.model_copy(deep=True)

              def _node_runs_of(self, run_id: str) -> list[NodeRun]:
''',
