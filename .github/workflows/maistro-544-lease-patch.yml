              )
              reconciled = await self._store.get_node_run(attempt.node_run_id)
              if reconciled is None:
                  raise RuntimeError("canonical NodeRun disappeared during claimed execution")
              return reconciled, terminal

              async def retry_node(
''',
          )

          consumption = "packages/maistro-core/src/maistro/runs/consumption.py"
          replace(
              consumption,
              "import contextlib\nfrom typing import TYPE_CHECKING, Any\n",
