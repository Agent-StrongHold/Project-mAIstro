              node_id: str,
              runtime_id: str = "python",
              executor_id: str = "",
              deadline_at: datetime | None = None,
              lease_ttl: timedelta,
          ) -> Attempt:
              """Atomically claim one queued Run with leased physical evidence."""
              run = self._require_run(run_id)
              ordinal = 1 + sum(node_run.run_id == run_id for node_run in self._node_runs.values())
              running_run, node_run, attempt = _claimed_execution_records(
                  run,
                  node_id=node_id,
                  node_ordinal=ordinal,
                  runtime_id=runtime_id,
                  executor_id=executor_id,
                  deadline_at=deadline_at,
                  lease_ttl=lease_ttl,
