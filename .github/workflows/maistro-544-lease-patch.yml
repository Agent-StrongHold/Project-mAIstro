              async def _open_node_runs(self, run_id: str) -> list[NodeRun]:
''',
          )

          pg = "packages/maistro-core/src/maistro/runs/pg_store.py"
          replace(
              pg,
              "    RunCursor,\n    RunIntegrityError,",
              "    RunClaimUnavailable,\n    RunCursor,\n    RunIntegrityError,",
          )
          replace(
              pg,
              "    admit_in_state,\n    validate_accepted_outcome_against_attempt,",
              "    _claimed_execution_records,\n    admit_in_state,\n    validate_accepted_outcome_against_attempt,",
          )
          replace(
              pg,
              "    # ── NodeRun ───────────────────────────────────────────────────\n",
              '''    async def claim_run_execution(
              self,
              run_id: str,
              *,
              node_id: str,
              runtime_id: str = "python",
              executor_id: str = "",
              deadline_at: datetime | None = None,
              lease_ttl: timedelta,
          ) -> Attempt:
              """Persist the consumer claim under the Run row lock in one transaction."""
              async with self._pool.acquire() as conn, conn.transaction():
                  run = Run.model_validate(
                      await self._locked(conn, "canonical_runs", "run_id", run_id)
                  )
                  ordinal = (
                      await conn.fetchval(
                          "SELECT COALESCE(MAX(ordinal), 0) FROM canonical_node_runs WHERE run_id = $1",
                          run_id,
                      )
                  ) + 1
                  running_run, node_run, attempt = _claimed_execution_records(
                      run,
                      node_id=node_id,
                      node_ordinal=ordinal,
                      runtime_id=runtime_id,
                      executor_id=executor_id,
