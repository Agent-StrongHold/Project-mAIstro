          tests = "packages/maistro-core/tests/runs/test_consumer_claim_recovery.py"
          replace(
              tests,
              "import contextlib\nfrom typing import ClassVar\n",
              "import asyncio\nimport contextlib\nfrom datetime import timedelta\nfrom typing import ClassVar\n",
          )
          replace(
              tests,
              "from maistro.runs.model import RunStatus\n",
              "from maistro.runs.consumption import SCHEDULE_EXECUTOR_ID\nfrom maistro.runs.model import Attempt, AttemptStatus, RunStatus\n",
          )
          replace(
              tests,
              "from maistro.runs.sources import ADMISSION_SOURCE, SCHEDULE_SOURCE\n",
