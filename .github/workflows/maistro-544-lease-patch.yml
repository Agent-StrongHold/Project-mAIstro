          p = Path(tests)
          text = p.read_text()
          text += '''

async def _claim(container: Container, run_id: str, *, ttl: timedelta = timedelta(seconds=30)) -> Attempt:
    run = await container.run_store.get_run(run_id)
    assert run is not None
    node_id = run.graph.materialize().nodes[0].node_id
    return await container.run_store.claim_run_execution(
        run_id,
        node_id=node_id,
        runtime_id="test-runtime",
        executor_id=SCHEDULE_EXECUTOR_ID,
        lease_ttl=ttl,
    )


async def test_consumer_claim_persists_leased_physical_evidence_atomically() -> None:
    container = await _container()
    run_id = await _admit(container, workspace="leased-claim")

    attempt = await _claim(container, run_id)

    run = await container.run_store.get_run(run_id)
    node_runs = await container.run_store.list_node_runs(run_id)
    attempts = await container.run_store.list_attempts(attempt.node_run_id)
    assert run is not None and run.status is RunStatus.RUNNING
    assert len(node_runs) == 1 and node_runs[0].status is RunStatus.RUNNING
    assert attempts == [attempt]
    assert attempt.status is AttemptStatus.RUNNING
    assert attempt.execution_lease is not None
    assert attempt.execution_lease.holder == SCHEDULE_EXECUTOR_ID
    assert attempt.execution_lease.expires_at is not None


async def test_hard_death_immediately_after_claim_recovers_through_ordinary_tick() -> None:
    container = await _container()
    run_id = await _admit(container, workspace="claim-death")
    attempt = await _claim(container, run_id, ttl=timedelta(seconds=5))
    lease = attempt.execution_lease
    assert lease is not None and lease.expires_at is not None

    recovered = await container.recover_abandoned_attempts(
        now=lease.expires_at + timedelta(microseconds=1)
    )

    assert recovered == 1
    settled_attempt = await container.run_store.get_attempt(attempt.attempt_id)
    node_run = await container.run_store.get_node_run(attempt.node_run_id)
    run = await container.run_store.get_run(run_id)
    assert settled_attempt is not None and settled_attempt.status is AttemptStatus.CANCELLED
    assert node_run is not None and node_run.status is RunStatus.WAITING
    assert run is not None and run.status is RunStatus.WAITING


async def test_only_one_concurrent_consumer_can_install_the_physical_claim() -> None:
    container = await _container()
    run_id = await _admit(container, workspace="claim-race")

    results = await asyncio.gather(
        _claim(container, run_id),
        _claim(container, run_id),
        return_exceptions=True,
    )

    winners = [item for item in results if isinstance(item, Attempt)]
    losers = [item for item in results if isinstance(item, RunClaimUnavailable)]
    assert len(winners) == 1
    assert len(losers) == 1
    node_runs = await container.run_store.list_node_runs(run_id)
    assert len(node_runs) == 1
    assert len(await container.run_store.list_attempts(node_runs[0].node_run_id)) == 1


async def test_normal_consumer_execution_finishes_the_exact_claimed_attempt() -> None:
    _EligibleNode.calls = 0
    container = await _container()
    run_id = await _admit(container, workspace="exact-claimed-attempt")

    assert await container.execute_admitted_runs(limit=1) == 1

    run = await container.run_store.get_run(run_id)
    node_runs = await container.run_store.list_node_runs(run_id)
    assert run is not None and run.status is RunStatus.COMPLETED
    assert len(node_runs) == 1
    attempts = await container.run_store.list_attempts(node_runs[0].node_run_id)
    assert len(attempts) == 1
    assert attempts[0].status is AttemptStatus.COMPLETED
    assert attempts[0].execution_lease is not None
    assert attempts[0].execution_lease.expires_at is not None
    assert attempts[0].execution_lease.holder == SCHEDULE_EXECUTOR_ID
'''
          p.write_text(text)
      - name: Format and targeted verification
        run: |
          uv sync --locked --extra dev
          uv run ruff format \
            packages/maistro-core/src/maistro/runs/store.py \
            packages/maistro-core/src/maistro/runs/sqlite_store.py \
            packages/maistro-core/src/maistro/runs/pg_store.py \
            packages/maistro-core/src/maistro/runs/execution.py \
            packages/maistro-core/src/maistro/runs/service.py \
