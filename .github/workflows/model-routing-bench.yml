name: Model-routing bench

# Manual only, on purpose (same pattern as working-memory-bench.yml).
#
# This runs scripts/bench_model_routing.py — the #914 / epic #900 M8-B1
# measurement: the shipped static router (CostAwareRouter) routed against
# task-conditioned candidate policies over one shared corpus and one shared,
# policy-independent outcome table. It is deterministic and offline (generated
# corpus, blake2b-hashed draws, no network), so results are comparable
# run-to-run; the checked-in numbers live in
# docs/benchmarks/model-routing-baseline.json. It is not a gate and not a
# per-PR job: run it when the router, the model catalog, or the outcome model
# changes. The research disposition lives in
# docs/research/914-task-conditioned-model-routing.md; nothing here wires any
# candidate policy into production.
#
# It is also what makes `scripts/bench_model_routing.py` a *real* entry point
# rather than a script nobody can reach: `scripts/check-reachability.py` roots
# tooling at the workflow steps that execute it, matching on filename.
on:
  workflow_dispatch:
    inputs:
      tasks-per-class:
        description: "Synthetic tasks per capability class (corpus = 6 × this)"
        required: false
        default: "400"
        type: string
      seed:
        description: "Corpus/outcome seed (same seed reproduces the same run)"
        required: false
        default: "routing-bench-v1"
        type: string
      scenario:
        description: "Availability scenario: all-available or opus-degraded"
        required: false
        default: "all-available"
        type: string

permissions:
  contents: read

concurrency:
  group: model-routing-bench
  cancel-in-progress: true

jobs:
  bench:
    name: bench
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-uv
      - name: uv sync (dev deps)
        run: uv sync --locked --extra dev
      - name: Benchmark task-conditioned model routing
        run: >-
          uv run python scripts/bench_model_routing.py
          --tasks-per-class ${{ inputs.tasks-per-class }}
          --seed ${{ inputs.seed }}
          --scenario ${{ inputs.scenario }}
          --output model-routing-bench.json
      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: model-routing-bench
          path: model-routing-bench.json
