name: mutation-baseline-secret-equal

permissions:
  contents: read

on:
  pull_request:
    paths:
      - ".github/workflows/mutation-baseline-secret-equal.yml"
      - "packages/maistro-core/src/maistro/security/secret_equal.py"
      - "packages/maistro-core/tests/security/test_secret_equal.py"

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install mutation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e packages/maistro-core
          python -m pip install cosmic-ray pytest pytest-timeout
      - name: Baseline tests
        run: |
          PYTHONPATH=packages/maistro-core/src python -m pytest packages/maistro-core/tests/security/test_secret_equal.py --timeout=20 -q -x
      - name: Configure and execute mutation sweep
        run: |
          cat > /tmp/cosmic-ray.toml <<'EOF'
          [cosmic-ray]
          module-path = "packages/maistro-core/src/maistro/security/secret_equal.py"
          timeout = 60.0
          excluded-modules = []
          test-command = "env PYTHONPATH=packages/maistro-core/src python -m pytest packages/maistro-core/tests/security/test_secret_equal.py --timeout=20 -q -x"

          [cosmic-ray.distributor]
          name = "local"

          [cosmic-ray.distributor.local]
          worker-count = 4
          EOF
          cosmic-ray init /tmp/cosmic-ray.toml /tmp/session.sqlite
          python scripts/mutation_filter_annotations.py /tmp/session.sqlite --report
          cosmic-ray exec /tmp/cosmic-ray.toml /tmp/session.sqlite
          cosmic-ray dump /tmp/session.sqlite > /tmp/mutation-rows.jsonl
          python scripts/mutation_viability.py /tmp/session.sqlite packages/maistro-core/src/maistro/security/secret_equal.py --json /tmp/mutation-report.json
          cat /tmp/mutation-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutation-baseline-secret-equal
          path: |
            /tmp/mutation-report.json
            /tmp/mutation-rows.jsonl
