# Nightly full-tree mutation measurement (#330).
#
# Sharded by stable mutant identity, measures the critical set and publishes
# killed/survived/timeout/no-coverage/error counts plus candidate baseline and
# history artifacts. Runs on a schedule or on demand; never on pull requests
# (the diff-scoped PR gate lives in mutation.yml).

name: mutation-nightly

permissions:
  contents: read

on:
  schedule:
    # Nightly full-tree measurement of the critical set.
    - cron: "23 2 * * *"
  workflow_dispatch:

concurrency:
  group: mutation-nightly-${{ github.ref }}
  cancel-in-progress: false

env:
  CRITICAL_LIST: quality/mutation-critical-files.json
  TRUSTED_BASELINE: quality/mutation-baseline.json
  HISTORY: quality/mutation-history.json

jobs:
  nightly-plan:
    name: Nightly mutation plan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      packets: ${{ steps.plan.outputs.packets }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - uses: ./.github/actions/setup-uv

      - run: uv sync --locked --extra dev

      - name: Validate mutation governance artifacts
        run: |
          set -euo pipefail
          uv run python scripts/mutation_critical.py --validate
          uv run python -c "import cosmic_ray, pytest, pytest_timeout; print('mutation toolchain present')"

      - name: Shard the critical set into stable packets
        id: plan
        run: |
          set -euo pipefail
          uv run python scripts/mutation_critical.py --changed-from <(uv run python scripts/mutation_critical.py --sources) > critical-targets.tsv
          test -s critical-targets.tsv || { echo "::error::critical list resolved to zero targets"; exit 1; }
          # Deterministic LPT packing: same inputs -> same packet membership, so
          # packet identities are stable across nights.
          uv run python scripts/mutation_scheduler.py critical-targets.tsv \
            --history "${HISTORY}" \
            --target-minutes 25 \
            --runner-capacity 4 \
            --output mutation-plan.json
          uv run python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          plan = json.load(open("mutation-plan.json"))
          print(f"packets={json.dumps([p['id'] for p in plan['packets']])}")
          PY
          cat mutation-plan.json

      - uses: actions/upload-artifact@v7
        with:
          name: mutation-plan
          path: |
            mutation-plan.json
            critical-targets.tsv
          retention-days: 7

  nightly-shard:
    name: Measure mutation packet ${{ matrix.packet }}
    needs: nightly-plan
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        packet: ${{ fromJSON(needs.nightly-plan.outputs.packets) }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - uses: ./.github/actions/setup-uv

      - run: uv sync --locked --extra dev

      - uses: actions/download-artifact@v7
        with:
          name: mutation-plan

      # Checkpoint cache: keyed by tool fingerprint + merge-base so unchanged
      # sources are never re-mutated. mutation_resume re-validates every
      # restored checkpoint against the live source/test hashes and the exact
      # commit, so a stale hit is rejected rather than trusted.
      - name: Restore mutation checkpoints
        uses: actions/cache@v6
        with:
          path: mutation-checkpoints
          key: mutation-checkpoints-${{ runner.os }}-${{ github.ref }}-${{ github.sha }}
          restore-keys: |
            mutation-checkpoints-${{ runner.os }}-${{ github.ref }}-

      - name: Measure this packet
        run: |
          set -euo pipefail
          mkdir -p packet-artifacts mutation-checkpoints
          uv run python - <<'PY' > packet-targets.tsv
          import json, sys
          sys.path.insert(0, "scripts")
          import mutation_packet
          plan = json.load(open("mutation-plan.json"))
          packet = next(p for p in plan["packets"] if p["id"] == int("${{ matrix.packet }}"))
          for target in packet["targets"]:
              print(f"{target['source']}\t{target['tests']}")
          PY
          test -s packet-targets.tsv || { echo "::error::packet ${{ matrix.packet }} resolved to zero targets"; exit 1; }
          echo "GITHUB_SHA=${{ github.sha }}" >> "$GITHUB_ENV"
          uv run python scripts/mutation_packet.py packet-targets.tsv \
            --checkpoints mutation-checkpoints \
            --environment <(uv run python - <<'PY'
          import json, sys
          sys.path.insert(0, "scripts")
          import mutation_pr_gate
          print(json.dumps(mutation_pr_gate.environment()))
          PY
          ) \
            --commit "${{ github.sha }}" \
            --run-id "${{ github.run_id }}" \
            --run-attempt "${{ github.run_attempt }}" \
            --uploader none

      - name: Fold fresh checkpoints into the uploaded and cached tree
        run: |
          set -euo pipefail
          # execute_source() writes new checkpoints, reports, and raw rows under
          # mutation-checkpoints-new/<identifier>/; without this copy the
          # uploaded artifact and the cache would carry only restored stale
          # state and nightly-publish would never see this run's measurements.
          if [ -d mutation-checkpoints-new ]; then
            cp -r mutation-checkpoints-new/. mutation-checkpoints/
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: mutation-packet-${{ matrix.packet }}
          path: |
            packet-artifacts/
            mutation-checkpoints/
          retention-days: 30

  nightly-publish:
    name: Publish mutation health
    needs: nightly-shard
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - uses: ./.github/actions/setup-uv

      - run: uv sync --locked --extra dev

      - uses: actions/download-artifact@v7
        with:
          name: mutation-plan

      - uses: actions/download-artifact@v7
        with:
          pattern: mutation-packet-*
          merge-multiple: true
          path: shard-output

      - name: Aggregate, ratchet, and publish counts
        run: |
          set -euo pipefail
          mkdir -p publish
          # Rehydrate the checkpoint tree the aggregate step reads.
          mkdir -p mutation-checkpoints
          if [ -d shard-output/mutation-checkpoints ]; then
            cp -r shard-output/mutation-checkpoints/. mutation-checkpoints/
          fi
          uv run python scripts/mutation_aggregate.py \
            --checkpoints mutation-checkpoints \
            --inventory critical-targets.tsv \
            --history "${HISTORY}" \
            --telemetry-output publish/mutation-telemetry-all.jsonl \
            --rows-output publish/mutation-rows.jsonl \
            --json-output publish/mutation-health-report.json \
            --markdown-output publish/mutation-health-report.md
          # Killed/survived/timeout/error counts straight from the raw rows.
          uv run python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, collections
          counts = collections.Counter()
          for line in open("publish/mutation-rows.jsonl"):
              line = line.strip()
              if not line:
                  continue
              work_item, outcome = json.loads(line)
              outcome_name = str(outcome.get("test_outcome") or outcome.get("worker_outcome") or "no-coverage").lower()
              counts[outcome_name] += 1
          print("### Nightly mutation measurement")
          print("")
          for name in ("killed", "survived", "timeout", "incompetent", "no-coverage"):
              print(f"- {name}: {counts.get(name, 0)}")
          print(f"- error (invalid/undetermined): see mutation-health-report.json")
          PY
          # The candidate baseline may only tighten the trusted one; a candidate
          # that weakens or invents floors fails here.
          uv run python scripts/check_mutation_baseline.py publish/mutation-rows.jsonl \
            --baseline "${TRUSTED_BASELINE}"
          # Candidate history/baseline artifacts for review (never auto-committed).
          uv run python scripts/mutation_ratchet.py publish/mutation-telemetry-all.jsonl \
            --baseline "${TRUSTED_BASELINE}" \
            --history "${HISTORY}" \
            --json-output publish/mutation-ratchet.json \
            --markdown-output publish/mutation-ratchet.md \
            --candidate-output publish/mutation-baseline-candidate.json \
            --floor 0.90
          uv run python scripts/mutation_history.py publish/mutation-telemetry-all.jsonl \
            --history "${HISTORY}" \
            --output publish/mutation-history-candidate.json
          cat publish/mutation-health-report.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: mutation-health
          path: publish/
          retention-days: 90
