# Nightly full-tree mutation measurement (#330).
#
# Sharded by stable mutant identity, measures the critical set and publishes
# killed/survived/timeout/no-coverage/error counts plus candidate baseline and
# history artifacts. Runs on a schedule or on demand; never on pull requests
# (the diff-scoped PR gate lives in mutation.yml).

name: mutation-nightly

permissions:
  contents: read
  actions: read

on:
  schedule:
    # Nightly full-tree measurement of the critical set.
    - cron: "23 2 * * *"
  workflow_dispatch:

concurrency:
  group: mutation-nightly-${{ github.ref }}
  cancel-in-progress: false

env:
  CRITICAL_LIST: quality/mutation-critical-files.json
  TRUSTED_BASELINE: quality/mutation-baseline.json
  HISTORY: quality/mutation-history.json

jobs:
  nightly-plan:
    name: Nightly mutation plan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      packets: ${{ steps.plan.outputs.packets }}
      ratchet_base: ${{ steps.ratchet-base.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # A scheduled/dispatch event has no PR merge base. Resolve a prior
      # successful protected develop quality run; never compare HEAD to itself.
      - name: Resolve independent trusted fitness baseline
        id: ratchet-base
        env:
          GH_TOKEN: ${{ github.token }}
          MEASURED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != refs/heads/develop ]]; then
            echo "::error::Nightly mutation measurement must run on develop"
            exit 1
          fi
          candidates=$(gh api --method GET \
            "repos/$GITHUB_REPOSITORY/actions/workflows/quality.yml/runs" \
            -f branch=develop -f event=push -f status=success -F per_page=100 \
            --jq '.workflow_runs[].head_sha')
          while IFS= read -r sha; do
            [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || continue
            [[ "$sha" != "$MEASURED_SHA" ]] || continue
            git cat-file -e "$sha^{commit}" 2>/dev/null || continue
            if git merge-base --is-ancestor "$sha" "$MEASURED_SHA"; then
              echo "sha=$sha" >> "$GITHUB_OUTPUT"
              echo "Trusted fitness baseline: $sha (prior successful develop quality run)"
              exit 0
            fi
          done <<< "$candidates"
          echo "::error::No independent successful develop quality ancestor in the last 100 runs"
          exit 1

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - uses: ./.github/actions/setup-uv

      - run: uv sync --locked --extra dev

      - name: Validate mutation governance artifacts
        run: |
          set -euo pipefail
          uv run python scripts/mutation_critical.py --validate
          uv run python -c "import cosmic_ray, pytest, pytest_timeout; print('mutation toolchain present')"

      - name: Shard the critical set into stable packets
        id: plan
        run: |
          set -euo pipefail
          uv run python scripts/mutation_critical.py --changed-from <(uv run python scripts/mutation_critical.py --sources) > critical-targets.tsv
          test -s critical-targets.tsv || { echo "::error::critical list resolved to zero targets"; exit 1; }
          # Deterministic LPT packing: same inputs -> same packet membership, so
          # packet identities are stable across nights.
          uv run python scripts/mutation_scheduler.py critical-targets.tsv \
            --history "${HISTORY}" \
            --target-minutes 25 \
            --runner-capacity 4 \
            --output mutation-plan.json
          uv run python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          plan = json.load(open("mutation-plan.json"))
          print(f"packets={json.dumps([p['id'] for p in plan['packets']])}")
          PY
          cat mutation-plan.json

      - uses: actions/upload-artifact@v7
        with:
          name: mutation-plan
          path: |
            mutation-plan.json
            critical-targets.tsv
          retention-days: 7

  nightly-shard:
    name: Measure mutation packet ${{ matrix.packet }}
    needs: nightly-plan
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        packet: ${{ fromJSON(needs.nightly-plan.outputs.packets) }}
    env:
      RATCHET_BASE_REV: ${{ needs.nightly-plan.outputs.ratchet_base }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify planned baseline provenance
        env:
          MEASURED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$RATCHET_BASE_REV" =~ ^[0-9a-f]{40}$ ]]
          [[ "$RATCHET_BASE_REV" != "$MEASURED_SHA" ]]
          [[ "$(git rev-parse HEAD)" == "$MEASURED_SHA" ]]
          git merge-base --is-ancestor "$RATCHET_BASE_REV" "$MEASURED_SHA"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - uses: ./.github/actions/setup-uv

      - run: uv sync --locked --extra dev

      - uses: actions/download-artifact@v8
        with:
          name: mutation-plan

      # Cache isolation includes the independent fitness baseline and packet.
      # A different base can change test outcomes even at the same source SHA.
      # Never restore across either dimension.
      - name: Restore mutation checkpoints
        id: checkpoint-cache
        uses: actions/cache/restore@v6
        with:
          path: mutation-checkpoints
          key: mutation-checkpoints-v3-${{ runner.os }}-${{ github.sha }}-${{ needs.nightly-plan.outputs.ratchet_base }}-${{ matrix.packet }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            mutation-checkpoints-v3-${{ runner.os }}-${{ github.sha }}-${{ needs.nightly-plan.outputs.ratchet_base }}-${{ matrix.packet }}-

      - name: Measure this packet
        run: |
          set -euo pipefail
          mkdir -p packet-artifacts mutation-checkpoints
          uv run python - <<'PY' > packet-targets.tsv
          import json, sys
          sys.path.insert(0, "scripts")
          import mutation_packet
          plan = json.load(open("mutation-plan.json"))
          packet = next(p for p in plan["packets"] if p["id"] == int("${{ matrix.packet }}"))
          for target in packet["targets"]:
              print(f"{target['source']}\t{target['tests']}")
          PY
          test -s packet-targets.tsv || { echo "::error::packet ${{ matrix.packet }} resolved to zero targets"; exit 1; }
          echo "GITHUB_SHA=${{ github.sha }}" >> "$GITHUB_ENV"
          uv run python scripts/mutation_packet.py packet-targets.tsv \
            --checkpoints mutation-checkpoints \
            --environment <(uv run python - <<'PY'
          import hashlib, json, os, sys
          sys.path.insert(0, "scripts")
          import mutation_pr_gate
          environment = mutation_pr_gate.environment()
          environment["tool_fingerprint"] = hashlib.sha256(
              (environment["tool_fingerprint"] + ":" + os.environ["RATCHET_BASE_REV"]).encode()
          ).hexdigest()
          print(json.dumps(environment))
          PY
          ) \
            --commit "${{ github.sha }}" \
            --run-id "${{ github.run_id }}" \
            --run-attempt "${{ github.run_attempt }}" \
            --uploader none

      - name: Fold fresh checkpoints into the uploaded and cached tree
        if: always()
        run: |
          set -euo pipefail
          # execute_source() writes new checkpoints, reports, and raw rows under
          # mutation-checkpoints-new/<identifier>/; without this copy the
          # uploaded artifact and the cache would carry only restored stale
          # state and nightly-publish would never see this run's measurements.
          if [ -d mutation-checkpoints-new ]; then
            cp -r mutation-checkpoints-new/. mutation-checkpoints/
          fi

      # A failed source must not erase earlier completed sources in this packet.
      # Immutable attempt-specific cache keys permit recovery from a failed run.
      - name: Save completed source checkpoints
        if: always() && steps.checkpoint-cache.outcome == 'success' && steps.checkpoint-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: mutation-checkpoints
          key: ${{ steps.checkpoint-cache.outputs.cache-primary-key }}

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mutation-packet-${{ matrix.packet }}
          overwrite: true
          path: |
            packet-artifacts/
            mutation-checkpoints/
            mutation-targets-pending.tsv
            mutation-reused.jsonl
            mutation-telemetry.jsonl
          retention-days: 30

  nightly-publish:
    name: Publish mutation health
    needs: [nightly-plan, nightly-shard]
    if: always() && needs.nightly-plan.result == 'success' && needs.nightly-shard.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RATCHET_BASE_REV: ${{ needs.nightly-plan.outputs.ratchet_base }}
      MEASURED_SHA: ${{ github.sha }}
      SHARD_RESULT: ${{ needs.nightly-shard.result }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify publishing baseline provenance
        run: |
          set -euo pipefail
          [[ "$RATCHET_BASE_REV" =~ ^[0-9a-f]{40}$ ]]
          [[ "$RATCHET_BASE_REV" != "$MEASURED_SHA" ]]
          [[ "$(git rev-parse HEAD)" == "$MEASURED_SHA" ]]
          git merge-base --is-ancestor "$RATCHET_BASE_REV" "$MEASURED_SHA"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - uses: ./.github/actions/setup-uv

      - run: uv sync --locked --extra dev

      - uses: actions/download-artifact@v8
        with:
          name: mutation-plan

      - uses: actions/download-artifact@v8
        with:
          pattern: mutation-packet-*
          merge-multiple: true
          path: shard-output

      - name: Aggregate, ratchet, and publish counts
        run: |
          set -euo pipefail
          mkdir -p publish
          # Rehydrate the checkpoint tree the aggregate step reads.
          mkdir -p mutation-checkpoints
          if [ -d shard-output/mutation-checkpoints ]; then
            cp -r shard-output/mutation-checkpoints/. mutation-checkpoints/
          fi
          uv run python scripts/mutation_aggregate.py \
            --checkpoints mutation-checkpoints \
            --inventory critical-targets.tsv \
            --history "${HISTORY}" \
            --telemetry-output publish/mutation-telemetry-all.jsonl \
            --rows-output publish/mutation-rows.jsonl \
            --json-output publish/mutation-health-report.json \
            --markdown-output publish/mutation-health-report.md
          # An aggregate is not promotable unless every planned source has
          # exact-candidate, exact-fitness-base measurement evidence.
          uv run python - <<'PY'
          import hashlib, json, os, sys
          sys.path.insert(0, "scripts")
          import mutation_pr_gate

          report = json.load(open("publish/mutation-health-report.json"))
          rows = [json.loads(line) for line in open("publish/mutation-telemetry-all.jsonl") if line.strip()]
          commit = os.environ["MEASURED_SHA"]
          base = os.environ["RATCHET_BASE_REV"]
          fingerprint = hashlib.sha256(
              (mutation_pr_gate.tool_fingerprint() + ":" + base).encode()
          ).hexdigest()
          provenance = {"candidate_sha": commit, "fitness_base_sha": base,
                        "run_id": os.environ["GITHUB_RUN_ID"],
                        "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"]}
          with open("publish/mutation-provenance.json", "w") as out:
              json.dump(provenance, out, indent=2)
          if os.environ["SHARD_RESULT"] != "success" or not report["complete"] or not rows:
              raise SystemExit("Incomplete mutation sweep; retain diagnostic evidence only")
          if any(row.get("verified_commit") != commit or row.get("tool_fingerprint") != fingerprint
                 for row in rows):
              raise SystemExit("Mutation checkpoint candidate/base provenance mismatch")
          PY
          # Killed/survived/timeout/error counts straight from the raw rows.
          uv run python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, collections
          counts = collections.Counter()
          for line in open("publish/mutation-rows.jsonl"):
              line = line.strip()
              if not line:
                  continue
              work_item, outcome = json.loads(line)
              outcome_name = str(outcome.get("test_outcome") or outcome.get("worker_outcome") or "no-coverage").lower()
              counts[outcome_name] += 1
          print("### Nightly mutation measurement")
          print("")
          for name in ("killed", "survived", "timeout", "incompetent", "no-coverage"):
              print(f"- {name}: {counts.get(name, 0)}")
          print(f"- error (invalid/undetermined): see mutation-health-report.json")
          PY
          # The candidate baseline may only tighten the trusted one; a candidate
          # that weakens or invents floors fails here.
          # Preserve complete measurements even when a quality floor rejects
          # them. Keep both checks fatal; do not let one hide the other.
          raw_status=0
          uv run python scripts/check_mutation_baseline.py publish/mutation-rows.jsonl \
            --baseline "${TRUSTED_BASELINE}" || raw_status=$?
          # Candidate history/baseline artifacts for review (never auto-committed).
          ratchet_status=0
          uv run python scripts/mutation_ratchet.py publish/mutation-telemetry-all.jsonl \
            --baseline "${TRUSTED_BASELINE}" \
            --history "${HISTORY}" \
            --json-output publish/mutation-ratchet.json \
            --markdown-output publish/mutation-ratchet.md \
            --candidate-output publish/mutation-baseline-candidate.json \
            --floor 0.90 || ratchet_status=$?
          uv run python scripts/mutation_history.py publish/mutation-telemetry-all.jsonl \
            --history "${HISTORY}" \
            --output publish/mutation-history-candidate.json
          cat publish/mutation-health-report.md >> "$GITHUB_STEP_SUMMARY"
          if [[ "$raw_status" != 0 || "$ratchet_status" != 0 ]]; then
            echo "::error::Mutation quality gate rejected the sweep; artifacts are diagnostic, not authorization"
            exit 1
          fi

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mutation-health
          path: publish/
          retention-days: 90
