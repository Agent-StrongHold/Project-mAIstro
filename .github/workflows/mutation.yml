# Mutation testing gate (#330).
#
# Replaces the former always-green "mutation-deferred" placeholder: every
# status this workflow publishes reflects work actually executed.
#
#   pr-gate   Mutates exactly the changed lines of changed mutation-critical
#             files (quality/mutation-critical-files.json), selecting per line
#             only the tests coverage says execute it, with each group's
#             per-mutant timeout derived from that group's measured baseline.
#             Fails fast on the first un-baselined survivor. Zero mutants,
#             zero selected tests, a missing tool, a red baseline run, or an
#             unreadable trusted base each fail the job explicitly.
#   nightly   Measures the critical set (monotonic expansion from the recorded
#             survivor baseline), sharded by stable packet identity, and
#             publishes killed/survived/timeout/no-coverage/error counts plus
#             candidate baseline/history artifacts. Cached checkpoints are
#             keyed by source, test scope, commit, and tool fingerprint, so
#             unchanged mutants are not rerun — and stale cache entries are
#             rejected, not accepted (scripts/mutation_resume.py).

name: mutation

permissions:
  contents: read

on:
  # No `paths:` filter. "Mutation gate (changed critical lines)" is a required
  # check for every pull request (#262 AC-2), and a check that cannot report on
  # a branch must not be required there (docs/ci/REQUIRED-CHECKS.md). A
  # paths-filtered trigger left PRs that touch no listed path with no check run
  # at all, so the gates-ran publisher waited forever for execution evidence
  # that could never exist and the merge queue read the pending aggregate as
  # "commit status not successful". The job below is self-scoping: it computes
  # critical ∩ changed and exits green when nothing mutation-critical changed,
  # so firing on every PR adds evidence, never a new failure mode.
  pull_request:
  workflow_dispatch:

concurrency:
  group: mutation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CRITICAL_LIST: quality/mutation-critical-files.json
  TRUSTED_BASELINE: quality/mutation-baseline.json
  HISTORY: quality/mutation-history.json

jobs:
  pr-gate:
    name: Mutation gate (changed critical lines)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - uses: ./.github/actions/setup-uv

      - name: Install toolchain
        run: uv sync --locked --extra dev

      - name: Resolve mutation targets (critical ∩ changed)
        id: targets
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          # Three-dot diff against the PR's own base branch: the trusted merge
          # base, never a hardcoded branch. BASE_REF travels through env, not
          # shell interpolation, so a hostile branch name cannot inject.
          git diff --name-only "origin/$BASE_REF...HEAD" -- packages --diff-filter=ACMR > changed-py.txt
          BASE_SHA="$(git merge-base "origin/${BASE_REF}" HEAD)"
          # The baseline must come from the trusted merge base, never from a
          # candidate-rewritten file in the PR.
          if ! git cat-file -e "${BASE_SHA}:${TRUSTED_BASELINE}"; then
            echo "::error::trusted merge base has no ${TRUSTED_BASELINE}; refusing to run without it"
            exit 1
          fi
          git show "${BASE_SHA}:${TRUSTED_BASELINE}" > trusted-mutation-baseline.json
          echo "base_sha=${BASE_SHA}" >> "$GITHUB_ENV"
          set +e
          uv run python scripts/mutation_critical.py --changed-from changed-py.txt > mutation-targets.tsv
          status=$?
          set -e
          if [ "${status}" -ne 0 ]; then
            exit "${status}"
          fi
          if [ ! -s mutation-targets.tsv ]; then
            {
              echo "### Mutation gate"
              echo ""
              echo "No mutation-critical file changed; nothing to mutate."
              echo "Critical scope lives in ${CRITICAL_LIST}."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "overlap=none" >> "$GITHUB_OUTPUT"
          else
            echo "overlap=critical" >> "$GITHUB_OUTPUT"
            cat mutation-targets.tsv
          fi

      - name: Validate mutation governance artifacts
        run: |
          set -euo pipefail
          uv run python scripts/mutation_critical.py --validate
          uv run python -c "import cosmic_ray, pytest, pytest_timeout; print('mutation toolchain present')"

      - name: Produce per-source diffs and selection inputs
        if: steps.targets.outputs.overlap == 'critical'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          mkdir -p mutation-artifacts
          # Column 2 is the selected-test list consumed downstream by the
          # packet runner; this loop only needs the source path, so the field
          # is read into `_tests` (not discarded) to keep column folding off
          # `${source}` and shellcheck SC2034 quiet.
          while IFS=$'\t' read -r source _tests; do
            id="$(uv run python -c "import sys; sys.path.insert(0, 'scripts'); import mutation_packet; print(mutation_packet.safe_id('${source}'))")"
            git diff "origin/$BASE_REF...HEAD" -- "${source}" > "mutation-artifacts/${id}.diff"
            test -s "mutation-artifacts/${id}.diff" || { echo "::error::empty diff for ${source}"; exit 1; }
            echo "${id} ${source}" | tee diff-map.txt
          done < mutation-targets.tsv

      - name: Run diff-scoped mutation gate
        if: steps.targets.outputs.overlap == 'critical'
        run: |
          set -euo pipefail
          uv run python scripts/mutation_pr_gate.py mutation-targets.tsv \
            --artifacts mutation-artifacts \
            --baseline trusted-mutation-baseline.json \
            --diff-dir mutation-artifacts \
            --scope changed \
            --commit "${{ github.event.pull_request.head.sha }}"

      - name: Publish gate summary
        if: always() && steps.targets.outputs.overlap == 'critical'
        run: |
          set -euo pipefail
          {
            echo "### Mutation gate"
            echo ""
            uv run python - <<'PY'
          import json, pathlib
          rows = []
          telemetry = pathlib.Path("mutation-artifacts/mutation-telemetry.jsonl")
          if telemetry.is_file():
              for line in telemetry.read_text().splitlines():
                  if line.strip():
                      row = json.loads(line)
                      rows.append(
                          f"- `{row['source']}`: killed {row['killed_mutants']}/"
                          f"{row['viable_mutants']} viable ({row['kill_rate']:.1%}), "
                          f"decision={row.get('decision', 'n/a')}"
                      )
          print("\n".join(rows) if rows else "- no telemetry produced")
          PY
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        if: always() && steps.targets.outputs.overlap == 'critical'
        with:
          name: mutation-pr-artifacts
          path: mutation-artifacts/
          retention-days: 14

