# Mutation testing gate (#330).
#
# Replaces the former always-green "mutation-deferred" placeholder: every
# status this workflow publishes reflects work actually executed.
#
#   pr-gate   Mutates exactly the changed lines of changed mutation-critical
#             files (quality/mutation-critical-files.json), selecting per line
#             only the tests coverage says execute it, with each group's
#             per-mutant timeout derived from that group's measured baseline.
#             Fails fast on the first un-baselined survivor. Zero mutants,
#             zero selected tests, a missing tool, a red baseline run, or an
#             unreadable trusted base each fail the job explicitly.
#   nightly   Measures the critical set (monotonic expansion from the recorded
#             survivor baseline), sharded by stable packet identity, and
#             publishes killed/survived/timeout/no-coverage/error counts plus
#             candidate baseline/history artifacts. Cached checkpoints are
#             keyed by source, test scope, commit, and tool fingerprint, so
#             unchanged mutants are not rerun — and stale cache entries are
#             rejected, not accepted (scripts/mutation_resume.py).

name: mutation

permissions:
  contents: read

on:
  pull_request:
    paths:
      - 'packages/**/*.py'
      - 'quality/mutation-critical-files.json'
      - 'quality/mutation-baseline.json'
      # The image-pin registry is a recurring non-Python integrity surface
      # (#93, #1152, #1373, #2120): with no matching path such a PR never
      # triggers this workflow, so the required-set row that
      # scripts/check-required-checks.py derives from it has no check-run on
      # the candidate head and gates-ran stays pending forever. Measured on
      # #2120's head fc525a8d86 with the CI-exact check-gates-ran evaluator:
      # 71/72 required checks present, "Mutation gate (changed critical
      # lines)" absent -> PENDING. Listing the registry here produces real
      # zero-overlap evidence ("No mutation-critical file changed") instead
      # of permanent absence; the job itself fails closed whenever a critical
      # file does change.
      - 'quality/image-pins.json'
      # Ratchet grant ledgers and the testing-inventory notes are governance
      # and evidence surfaces, not mutation-critical code, but PRs that touch
      # exactly them never trigger this workflow, so the required-set row that
      # scripts/check-required-checks.py derives from it has no check-run on
      # the candidate head and gates-ran stays pending forever. Measured on
      # #2371's head ca2feefd1d9b with the CI-exact evaluator
      # (check-gates-ran.py --require-complete --base-branch develop
      # --event-name pull_request): 71/72 required checks present, "Mutation
      # gate (changed critical lines)" absent -> PENDING (the same failure
      # mode #2120 fixed for image pins; every producer had completed, so no
      # later publisher run could ever flip the verdict). Both paths are
      # class-motivated: grant-only PRs (recurring under the two-merge ratchet
      # protocol) touch exactly quality/ratchet-authorizations.json;
      # verification-note PRs touch exactly docs/testing/inventory-notes/**
      # (this PR's remaining diff is one; the @tool/plan_delivery grant it
      # once carried was withdrawn as moot — see the branch's inventory
      # note). Listing these paths here produces real zero-overlap evidence
      # instead of permanent absence; the job still fails closed whenever a
      # critical file does change.
      - 'quality/ratchet-authorizations.json'
      - 'docs/testing/inventory-notes/**'
      # Python tooling under scripts/ (the gate scripts this contract system
      # runs on every PR) is a recurring PR surface that 'packages/**/*.py'
      # cannot match, so gate-script PRs never triggered this workflow and
      # the required-set row that scripts/check-required-checks.py derives
      # from it has no check-run on the candidate head and gates-ran stays
      # pending forever. Measured on #2432's head 632d5dbaa6 (a
      # scripts/js_dependency_gate.py + frontend lockfile bump) with the
      # CI-exact evaluator (check-gates-ran.py --require-complete
      # --base-branch develop --event-name pull_request --changed-files
      # <measured envelope>): 73/74 required checks present, "Mutation gate
      # (changed critical lines)" absent -> PENDING (the same failure mode
      # #2120 fixed for image pins and #2371 for grant ledgers and inventory
      # notes; every producer had completed, so no later publisher run could
      # ever flip the verdict). Listing this class here produces real
      # zero-overlap evidence ("No mutation-critical file changed") instead
      # of permanent absence — every mutation-critical source lives under
      # packages/, and the job's changed-file pathspec stays `-- packages`,
      # so scripts/ diffs are zero-overlap by construction; the job still
      # fails closed whenever a critical file does change.
      - 'scripts/**/*.py'
      - '.github/workflows/mutation.yml'
      # Dev-tool linter/security-scanner requirements and the campaign's
      # root-level repair-note evidence files are governance/dependency
      # surfaces, not mutation-critical code, but PRs that touch exactly
      # them never trigger this workflow, so the required-set row that
      # scripts/check-required-checks.py derives from it has no check-run on
      # the candidate head and gates-ran stays pending forever. Measured on
      # #2345's head 720aaa2500 with the CI-exact evaluator
      # (check-gates-ran.py --require-complete --base-branch develop
      # --event-name pull_request --changed-files <envelope>): 71/72 required
      # checks present, "Mutation gate (changed critical lines)" absent ->
      # PENDING (the same failure mode #2120 fixed for image pins and #2371
      # fixed for grant ledgers and inventory notes; every producer had
      # completed, so no later publisher run could ever flip the verdict).
      # Both paths are class-motivated: dev-tool bump PRs (dependabot and
      # manual) touch exactly requirements-dev-tools.txt, and repair-round
      # PRs record their evidence in exactly REPAIR-NOTES-*.md at the repo
      # root. Listing them here produces real zero-overlap evidence instead
      # of permanent absence; the job still fails closed whenever a critical
      # file does change.
      - 'requirements-dev-tools.txt'
      - 'REPAIR-NOTES-*.md'
      # Python dependency metadata is a recurring non-Python PR surface
      # (every dependabot uv bump): the bump edits uv.lock and one or more
      # packages/*/pyproject.toml, neither of which 'packages/**/*.py' can
      # match, so such PRs never triggered this workflow and the required-set
      # row has no check-run on the candidate head and gates-ran stays pending
      # forever. Measured on #2450's head 62ce6f87a9 (anthropic 1.11.0 ->
      # 2.9.0) with the CI-exact evaluator (check-gates-ran.py
      # --require-complete --base-branch develop --event-name pull_request
      # --changed-files <measured envelope>): 73/74 required checks present,
      # "Mutation gate (changed critical lines)" absent -> PENDING (the same
      # failure mode #2120 fixed for image pins, #2371 for grant ledgers and
      # inventory notes, #2432 for gate scripts and #2345 for dev-tool
      # requirements; every producer had completed, so no later publisher run
      # could ever flip the verdict). Both paths are class-motivated: every
      # workspace dependency bump touches the root uv.lock, and dependabot
      # edits the package manifest's version constraint in
      # packages/**/pyproject.toml. Listing them here produces real
      # zero-overlap evidence ("No mutation-critical file changed") instead
      # of permanent absence: every entry in
      # quality/mutation-critical-files.json is a .py source under packages/,
      # so lock/manifest diffs are zero-overlap by construction, and the job
      # still fails closed whenever a critical file does change.
      - 'uv.lock'
      - 'packages/**/pyproject.toml'
      # Security-suppression triage is governance, not mutation-critical
      # code: a dependency bump whose scan flags upstream docstring fixtures
      # (exactly #2450, .trivyignore.yaml + anthropic 2.9.0's
      # gcp-service-account example text) never matched this filter, so the
      # same required row had no check-run and gates-ran stayed pending
      # forever. Like quality/image-pins.json above, listing the suppression
      # registry produces real zero-overlap evidence instead of permanent
      # absence; the job still fails closed whenever a critical file does
      # change.
      - '.trivyignore.yaml'
      # NPM/JavaScript dependency metadata is a recurring non-Python PR
      # surface (every dependabot npm bump, and manual frontend dependency
      # work): the bump edits one packages/**/package.json plus its
      # package-lock.json, neither of which any filter above can match, so
      # such PRs never triggered this workflow and the required-set row has
      # no check-run on the candidate head and gates-ran stays pending
      # forever. Measured on #2442's head 251b4e2e71eb (react 19.2.0 ->
      # 19.3.1 in packages/hive-conductor/tests/e2e) with the CI-exact
      # evaluator (check-gates-ran.py --require-complete --base-branch
      # develop --event-name pull_request --changed-files <measured
      # envelope>): 73/74 required checks present, "Mutation gate (changed
      # critical lines)" absent -> PENDING (the same failure mode #2120
      # fixed for image pins, #2371 for grant ledgers and inventory notes,
      # #2432 for gate scripts, #2345 for dev-tool requirements and #2450
      # for Python lock/manifest metadata; every producer had completed, so
      # no later publisher run could ever flip the verdict). Both paths are
      # class-motivated: npm metadata lives at every packages/ depth (three
      # manifests and three lockfiles today), and every entry in
      # quality/mutation-critical-files.json is a .py source under
      # packages/, so npm metadata diffs are zero-overlap by construction;
      # the job still fails closed whenever a critical file does change.
      - 'packages/**/package.json'
      - 'packages/**/package-lock.json'
  workflow_dispatch:

concurrency:
  group: mutation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CRITICAL_LIST: quality/mutation-critical-files.json
  TRUSTED_BASELINE: quality/mutation-baseline.json
  HISTORY: quality/mutation-history.json

jobs:
  pr-gate:
    name: Mutation gate (changed critical lines)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # Budget must fit the widest mapped test scope, not the median one.
    # Most critical sources resolve to a mirror/ancestor test directory and
    # finish in ~15-25m. packages/maistro-core/src/maistro/privilege.py has
    # no tests/maistro/test_privilege.py mirror, so mutation_targets.resolve_tests
    # widens its scope to the whole packages/maistro-core/tests suite
    # (18,908 collected tests): selection then re-runs that entire suite
    # under coverage with dynamic_context=test_function before any mutant
    # runs. Measured on CI: ~30m for that pass alone (run 45574782108,
    # step 08:16:44Z->08:46:57Z), and run 45645094537 at PR head 5de7d17254
    # was killed by this very cap — annotation "The job has exceeded the
    # maximum execution time of 45m0s" — 25m into mutation_pr_gate.py with
    # selection still incomplete. 150m = selection + collection + a
    # nightly-shard-scale mutation phase (nightly packets get 60m each)
    # plus toolchain overhead, with headroom so the required producer can
    # actually emit a verdict instead of a permanent CANCELLED. The gate's
    # pass/fail logic, critical list, and fail-closed behaviors are
    # unchanged; this only stops strangling a verdict mid-selection.
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - uses: ./.github/actions/setup-uv

      - name: Install toolchain
        run: uv sync --locked --extra dev

      - name: Resolve mutation targets (critical ∩ changed)
        id: targets
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          # Three-dot diff against the PR's own base branch: the trusted merge
          # base, never a hardcoded branch. BASE_REF travels through env, not
          # shell interpolation, so a hostile branch name cannot inject.
          git diff --name-only "origin/$BASE_REF...HEAD" -- packages --diff-filter=ACMR > changed-py.txt
          BASE_SHA="$(git merge-base "origin/${BASE_REF}" HEAD)"
          # The baseline must come from the trusted merge base, never from a
          # candidate-rewritten file in the PR.
          if ! git cat-file -e "${BASE_SHA}:${TRUSTED_BASELINE}"; then
            echo "::error::trusted merge base has no ${TRUSTED_BASELINE}; refusing to run without it"
            exit 1
          fi
          git show "${BASE_SHA}:${TRUSTED_BASELINE}" > trusted-mutation-baseline.json
          echo "base_sha=${BASE_SHA}" >> "$GITHUB_ENV"
          set +e
          uv run python scripts/mutation_critical.py --changed-from changed-py.txt > mutation-targets.tsv
          status=$?
          set -e
          if [ "${status}" -ne 0 ]; then
            exit "${status}"
          fi
          if [ ! -s mutation-targets.tsv ]; then
            {
              echo "### Mutation gate"
              echo ""
              echo "No mutation-critical file changed; nothing to mutate."
              echo "Critical scope lives in ${CRITICAL_LIST}."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "overlap=none" >> "$GITHUB_OUTPUT"
          else
            echo "overlap=critical" >> "$GITHUB_OUTPUT"
            cat mutation-targets.tsv
          fi

      - name: Validate mutation governance artifacts
        run: |
          set -euo pipefail
          uv run python scripts/mutation_critical.py --validate
          uv run python -c "import cosmic_ray, pytest, pytest_timeout; print('mutation toolchain present')"

      - name: Produce per-source diffs and selection inputs
        if: steps.targets.outputs.overlap == 'critical'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          mkdir -p mutation-artifacts
          # Column 2 is the selected-test list consumed downstream by the
          # packet runner; this loop only needs the source path, so the field
          # is read into `_tests` (not discarded) to keep column folding off
          # `${source}` and shellcheck SC2034 quiet.
          while IFS=$'\t' read -r source _tests; do
            id="$(uv run python -c "import sys; sys.path.insert(0, 'scripts'); import mutation_packet; print(mutation_packet.safe_id('${source}'))")"
            git diff "origin/$BASE_REF...HEAD" -- "${source}" > "mutation-artifacts/${id}.diff"
            test -s "mutation-artifacts/${id}.diff" || { echo "::error::empty diff for ${source}"; exit 1; }
            echo "${id} ${source}" | tee diff-map.txt
          done < mutation-targets.tsv

      - name: Run diff-scoped mutation gate
        if: steps.targets.outputs.overlap == 'critical'
        run: |
          set -euo pipefail
          uv run python scripts/mutation_pr_gate.py mutation-targets.tsv \
            --artifacts mutation-artifacts \
            --baseline trusted-mutation-baseline.json \
            --diff-dir mutation-artifacts \
            --scope changed \
            --commit "${{ github.event.pull_request.head.sha }}"

      - name: Publish gate summary
        if: always() && steps.targets.outputs.overlap == 'critical'
        run: |
          set -euo pipefail
          {
            echo "### Mutation gate"
            echo ""
            uv run python - <<'PY'
          import json, pathlib
          rows = []
          telemetry = pathlib.Path("mutation-artifacts/mutation-telemetry.jsonl")
          if telemetry.is_file():
              for line in telemetry.read_text().splitlines():
                  if line.strip():
                      row = json.loads(line)
                      rows.append(
                          f"- `{row['source']}`: killed {row['killed_mutants']}/"
                          f"{row['viable_mutants']} viable ({row['kill_rate']:.1%}), "
                          f"decision={row.get('decision', 'n/a')}"
                      )
          print("\n".join(rows) if rows else "- no telemetry produced")
          PY
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        if: always() && steps.targets.outputs.overlap == 'critical'
        with:
          name: mutation-pr-artifacts
          path: mutation-artifacts/
          retention-days: 14

