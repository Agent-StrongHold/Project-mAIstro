name: PR1276 source verification
on:
  push:
    branches: [fix/m1-1153-accepted-node-outcome]
    paths: [.github/workflows/pr1276-source-verification.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Build locked identity and test dependency wheels
        run: |
          python - <<'PY'
          import pathlib, tomllib
          lock = tomllib.loads(pathlib.Path('uv.lock').read_text())
          needed = {'bip-utils', 'fastapi', 'pytest', 'pytest-asyncio'}
          registry = {p['name']: p['version'] for p in lock['package'] if 'registry' in p.get('source', {})}
          pathlib.Path('verification-requirements.txt').write_text(''.join(f'{n}=={v}\n' for n,v in sorted(registry.items()) if n in needed))
          pathlib.Path('verification-constraints.txt').write_text(''.join(f'{n}=={v}\n' for n,v in sorted(registry.items())))
          PY
          python -m pip wheel -r verification-requirements.txt -c verification-constraints.txt --wheel-dir verification-wheels
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr1276-identity-dependencies
          path: |
            verification-wheels
            verification-requirements.txt
          retention-days: 1
          if-no-files-found: error
