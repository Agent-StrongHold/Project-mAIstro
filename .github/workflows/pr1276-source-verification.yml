name: PR1276 source verification
on:
  push:
    branches: [fix/m1-1153-accepted-node-outcome]
    paths: [.github/workflows/pr1276-source-verification.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Archive exact tracked source for local verification
        run: |
          git archive --format=tar --output=pr1276-source.tar 2b4e6892956642d284a1da41a05ca0de43f3e5c2
          git ls-tree -r 2b4e6892956642d284a1da41a05ca0de43f3e5c2 > pr1276-source-manifest.txt
          git rev-parse '2b4e6892956642d284a1da41a05ca0de43f3e5c2^{tree}' > pr1276-source-tree.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr1276-exact-source
          path: |
            pr1276-source.tar
            pr1276-source-manifest.txt
            pr1276-source-tree.txt
          retention-days: 1
          if-no-files-found: error
