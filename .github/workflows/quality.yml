# Quality gate — the 8-pillar make qa target, fast bag (PR-blocking).
#
# Pillars that gate the PR:
#  1. Coverage (line + branch ≥95% on touched files; Boy Scout Rule).
#  2. Hypothesis property tests (subset; full formal/ runs in formal-conformance.yml).
#  3. Code smells: ruff (full ruleset), radon CC, xenon, vulture, interrogate.
#  4. Type checks: mypy --strict + pyright.
#  5. Mutation: cosmic-ray on changed files only (full nightly in mutation.yml).
#  6. Contract: schemathesis against the OpenAPI spec (when service running).
#  7. Architecture fitness functions.
#  8. Docstring coverage on touched modules.
#
# Heavy bag (DAST, container scan, image-signing) lives in security.yml.

name: quality

# Least privilege: this workflow only reads the repo to analyze it.
permissions:
  contents: read

# Progressive enforcement ladder (Phase 19; vulture and radon reclassified
# Phase 20 — SPEC-264):
#   topic-branch pushes (feat/bug/fix/  -> in scope, but lighter weight (no PR-target
#   idea/doc/chore, #381)                  backstop); the prefix set is single-sourced in
#                                          .github/branch-protection.json
#   PR/push -> develop/integration/main -> same gate everywhere: ruff/mypy hard; radon CC and
#                                          vulture hard-fail on any finding unmatched by their
#                                          respective baseline (quality/radon-baseline.json,
#                                          quality/vulture-baseline.json — classification
#                                          ratchets, not count ratchets); xenon hard-fails on
#                                          module/project-average REGRESSION only (count
#                                          ratchet vs. the recorded baseline below);
#                                          pyright stays advisory pending a separate triage PR.
on:
  # No `branches:` filter. It used to be [main, integration, develop], which
  # matched on the PR's *base* — so a PR stacked on a feature branch ran none of
  # this. #151 and #138 got Registry CI and Formal Conformance only: no lint, no
  # types, no tests, no coverage, no SAST, no ratchet gates. The work was not
  # unreviewed, it was unmeasured, and every accumulated failure arrived at once
  # on retarget, against the branch least able to absorb it.
  #
  # A required-check set that silently does not apply to a whole class of PRs is
  # worse than none: the green tick means different things depending on the base
  # and nothing on the PR says which. #161.
  pull_request:
  # A merge queue judges the synthetic current-base + candidate tree, so every
  # required quality check must report on that exact merge-group SHA too.
  merge_group:
    types: [checks_requested]
  push:
    # Every accepted topic-branch prefix (#381): the set is defined once in
    # .github/branch-protection.json (topic_branch_policy) and validated by
    # tests/test_branch_policy.py, so a push to any documented branch receives
    # this gate set — a `feature/*` or bare-name branch is not a documented
    # shape and gets its gates at PR time, where pull_request is unfiltered.
    branches: [main, integration, develop, feat/*, bug/*, fix/*, idea/*, doc/*, chore/*]

# See the rationale in ci.yml: supersede candidate runs, let protected-branch
# pushes finish so their pass/fail record survives.
concurrency:
  group: quality-${{ github.event.pull_request.number || github.event.merge_group.head_sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' }}

jobs:
  # ----- Coverage is produced by several jobs and judged by one (#211) -----
  #
  # Coverage used to be produced by a single job with no service containers,
  # which meant any code whose suites need a real server was scored from a run
  # that could not execute them. `pg_stores.py` read as 41% covered while being
  # thoroughly tested, because its PostgreSQL legs skip without a server and the
  # measuring job had none. A gate that cannot see something must not report a
  # number as if it had looked.
  #
  # So: every suite is measured exactly once, in a job that can actually run it,
  # and the floors are evaluated on the combined data.
  #
  # ADDING A PRODUCER is one job plus one artifact name:
  #   1. run the suite under `coverage run --branch --source=<src>`;
  #   2. upload `.coverage` as `coverage-<name>` with include-hidden-files;
  #   3. add `coverage-<name>` to `coverage-gate`'s `needs:` and download list.
  # Make skipping fatal in the producer (see MAISTRO_REQUIRE_* below) — a
  # producer that silently skips its legs contributes an empty file and shrinks
  # the denominator, which is the failure this whole structure exists to avoid.
  #
  # `durable-events` and `migrations` are not producers yet: no PostgreSQL-gated
  # test exists on `develop`. They arrive with #181 and #178, each adding its own
  # producer.

  coverage-unit:
    name: coverage (no services)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # full history: the diff gate needs the merge base

      - name: Install uv
        uses: ./.github/actions/setup-uv

      - name: Setup Python 3.12
        run: uv python install 3.12
      - name: uv sync (full dev deps)
        run: uv sync --locked --all-extras

      # formal/ imports maistro_evolve; not a uv workspace member, so
      # `uv sync` alone doesn't install it.
      - name: install maistro-evolve
        run: uv pip install -e packages/maistro-evolve

      # The Tier-3 sandbox backend (#76). Without it the bubblewrap
      # integration tests skip, and the diff-coverage gate then measures a
      # backend whose execution paths nothing ran -- the exact shape of the
      # gap that gate exists to find.
      - name: install bubblewrap
        run: |
          timeout 180 sudo apt-get update -qq || true
          timeout 180 sudo apt-get install -y bubblewrap
          # See ci.yml: without this, `bwrap` is installed but cannot build a
          # namespace on Ubuntu 24.04, so the integration tests skip and the
          # diff gate measures execution paths nothing ran.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      # ----- Pillar 1: coverage (line + branch ≥95% on touched files) -----
      # C2/#287: measured over the PyPI publish set (core, canvas, evolve, rsi,
      # bootstrap — the PyPI publish set),
      # not maistro-core alone. Each package runs as its own `coverage run
      # --append` invocation rather than one combined pytest call: an earlier
      # attempt at a single `pytest packages/maistro-core/tests
      # packages/maistro-canvas/tests ...` invocation broke an unrelated
      # maistro-rsi test (structlog's capture_logs() picks up stale global
      # config when another package's tests configure structlog first) — the
      # same cross-package state-pollution risk ci.yml's `test` job already
      # avoids by giving every package its own pytest step.
      - name: pytest with coverage (line + branch)
        env:
          PYTHONPATH: >-
            packages/maistro-core/src:packages/maistro-canvas/src:
            packages/maistro-rsi/src:packages/maistro-evolve/src
          REQUIRE_AUTH: "false"
          MAISTRO_DRY_RUN: "1"
        run: |
          uv run coverage erase
          uv run coverage run --branch --source=packages/maistro-core/src/maistro \
            -m pytest packages/maistro-core/tests --timeout=30 -q
          uv run coverage run --append --branch --source=packages/maistro-canvas/src/maistro_canvas \
            -m pytest packages/maistro-canvas/tests --timeout=30 -q
          uv run coverage run --append --branch --source=packages/maistro-evolve/src/maistro_evolve \
            -m pytest packages/maistro-evolve/tests --timeout=30 -q
          uv run coverage run --append --branch --source=packages/maistro-rsi/src/maistro_rsi \
            -m pytest packages/maistro-rsi/tests --timeout=30 -q
          uv run coverage run --append --branch --source=packages/maistro-bootstrap/src/maistro_bootstrap \
            -m pytest packages/maistro-bootstrap/tests --timeout=30 -q
      - name: upload coverage data
        uses: actions/upload-artifact@v7
        with:
          name: coverage-unit
          # `.coverage` is a dotfile and upload-artifact@v4 skips hidden files
          # by default — without this the artifact uploads empty and the gate
          # silently measures less than it claims to.
          include-hidden-files: true
          path: .coverage
          if-no-files-found: error
          retention-days: 1

  # The Archive tier against a real S3-compatible server (#133, ADR-082226-d3dd).
  # Moved here from ci.yml by #211: it is the only job that can execute these
  # legs, so it is the only job that can honestly measure them, and artifacts do
  # not cross workflow runs.
  #
  # MinIO rather than a mocked client: a mocked object store proves the call was
  # made with the arguments the test already knew, which is not the property
  # worth checking about storage. The same conformance suite runs over
  # FilesystemArchiveStore and S3ArchiveStore, so the two implementations cannot
  # drift into behaving differently under one protocol.
  #
  # `--extra dev --extra s3` installs the optional SDK for the S3 leg. The
  # *absence* case is covered by test_optional_dependency.py, which hides
  # aioboto3 from the import system rather than uninstalling it — so both halves
  # are checked in one environment.
  #
  # Started as a step rather than under `services:`, for two reasons found the
  # hard way. The official `minio/minio` image needs `server /data` as a
  # command, and a `services:` block has no `command:` key at all — only
  # `image`, `env`, `ports`, `options` and `credentials`. And the first version
  # of this job named `bitnami/minio:latest`, which does not resolve: Bitnami
  # retired their public tags, so every run died on `manifest unknown` before
  # reaching a single test. An image name is not verified by being plausible.
  # The move to the upstream image was not the end of it either: `minio/minio`
  # on Docker Hub stopped serving anonymous pulls (`pull access denied`), so
  # the image below names quay.io — where MinIO publishes the same RELEASE tag
  # ci.yml pins — rather than `:latest`, so this job and ci.yml's conformance
  # job exercise the same server build.
  coverage-archive:
    name: coverage (MinIO)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Start MinIO
        run: |
          set -euo pipefail
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin \
            quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z server /data
          # Poll the health endpoint rather than sleeping a fixed amount: a
          # fixed sleep is either slower than it needs to be or racy, and the
          # race surfaces as a connection error that reads exactly like the
          # storage bug this job exists to catch.
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:9000/minio/health/live >/dev/null; then
              echo "MinIO ready"
              exit 0
            fi
            sleep 2
          done
          echo "::error::MinIO did not become ready within 60s"
          docker logs minio
          exit 1
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: ./.github/actions/setup-uv
      - run: uv sync --locked --extra dev --extra s3
      # One archive tier now. `tests/memory/archive` (aioboto3, ADR-082226-d3dd)
      # was the second implementation of the same decision and was never
      # imported by anything; it is retired, and with it the second credential
      # spelling this job used to set. `tests/archive` uses boto3 and lets
      # botocore resolve `AWS_ACCESS_KEY_ID`/`AWS_SECRET_ACCESS_KEY` in the
      # ordinary way, so those are the only two the suite reads.
      - name: Archive conformance against MinIO (under coverage)
        env:
          MAISTRO_TEST_S3_ENDPOINT: http://127.0.0.1:9000
          AWS_ACCESS_KEY_ID: minioadmin
          AWS_SECRET_ACCESS_KEY: minioadmin
          AWS_DEFAULT_REGION: us-east-1
          # A skipped leg is untested, not passing. Without this the suite
          # would fall back to an in-process moto server (or skip outright) if
          # MinIO failed to start, leaving the job green over an unrun leg and
          # quietly dropping these lines from the denominator.
          MAISTRO_REQUIRE_S3_LEGS: "1"
        run: |
          uv run coverage run --branch --source=packages/maistro-core/src/maistro \
            -m pytest packages/maistro-core/tests/archive -v --tb=short
      - name: upload coverage data
        uses: actions/upload-artifact@v7
        with:
          name: coverage-archive
          include-hidden-files: true
          path: .coverage
          if-no-files-found: error
          retention-days: 1


  # The PostgreSQL producer, for both families of PG-only code. Everything
  # under `persistence/pg_*`, `container.py`'s backend wiring and
  # `events/pg_stores.py` executes only against a real server, so the run with
  # no services scores every one of those lines as uncovered — and the diff
  # gate, which is per file, then rejects them for being untestable in a job
  # that could never have tested them.
  #
  # `ci.yml`'s `postgres` matrix and `durable-events` job run these suites for
  # their pass/fail verdict; this runs them once more for their coverage, so
  # the combined report describes the code as it is actually exercised.
  #
  # One job rather than two, and one version rather than the pg17/pg18 matrix:
  # coverage is about which lines run, and both majors run the same ones.
  # Matrixing would upload artifacts with identical arcs for double the
  # wall-clock.
  #
  # `pgvector/pgvector:pg17`, not plain `postgres:17`: migration 001 opens with
  # `CREATE EXTENSION IF NOT EXISTS vector`, and this job walks the whole chain
  # rather than stamping partway. The stock image answers
  # `extension "vector" is not available`.
  coverage-postgres:
    name: coverage (PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: maistro
          POSTGRES_PASSWORD: maistro
          POSTGRES_DB: maistro_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U maistro -d maistro_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      DB_USER: maistro
      DB_PASSWORD: maistro
      DB_NAME: maistro_test
      MAISTRO_TEST_PG_DSN: postgresql://maistro:maistro@127.0.0.1:5432/maistro_test
      MAISTRO_TEST_DATABASE_URL: postgresql://maistro:maistro@127.0.0.1:5432/maistro_test
      # A skipped leg is untested, not passing. Without this a broken service
      # container would leave the job green and quietly drop these lines from
      # the denominator — the exact failure `coverage-archive` names.
      MAISTRO_REQUIRE_PG_LEGS: "1"
      REQUIRE_AUTH: "false"
      MAISTRO_DRY_RUN: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: ./.github/actions/setup-uv
      - run: uv sync --locked --extra dev
      # `tests/migrations` drives alembic itself — stamping, upgrading and
      # downgrading — so it runs against a database this job has NOT already
      # migrated. Applying the chain first and then asking those tests to apply
      # it again is a different scenario from the one they were written for.
      - name: Migration suites against an unmigrated database (under coverage)
        run: |
          uv run coverage run --branch --source=packages/maistro-core/src/maistro \
            -m pytest tests/migrations -v --tb=short
      # `runs`, `graph` and `projects` join the list because #132 put
      # PostgreSQL implementations behind them — `runs/pg_store.py`,
      # `projects/pg_scope_store.py`, `graph/pg_templates.py`. Their suites are
      # parametrised over every backend and the PostgreSQL leg skips without a
      # server, so running them only in `coverage (no services)` measured the
      # in-memory and SQLite legs and scored the PostgreSQL stores as untested
      # code. The diff gate was reading a number no job produced.
      #
      # `scheduling` joins for the same reason and on the same evidence: #231
      # put `scheduling/pg_store.py` behind it, the store suite is parametrised
      # over all three backends, and the diff gate scored the new file at 42.5%
      # while its PostgreSQL leg was passing — in the other job, where it
      # skipped. A list of suites is a list of what gets measured, so a new
      # PostgreSQL store means an edit here, every time.
      - name: Apply the chain, then the suites that need a schema (under coverage)
        run: |
          uv run alembic upgrade head
          uv run coverage run --append --branch \
            --source=packages/maistro-core/src/maistro \
            -m pytest packages/maistro-core/tests/persistence \
            packages/maistro-core/tests/test_container_postgres.py \
            packages/maistro-core/tests/events \
            packages/maistro-core/tests/runs \
            packages/maistro-core/tests/graph \
            packages/maistro-core/tests/projects \
            packages/maistro-core/tests/workspaces \
            packages/maistro-core/tests/scheduling -v --tb=short
          # The canvas org-scope lane (#857) put PostgresAssetStore and the
          # PgCanvasStore job/composite writers behind MAISTRO_TEST_PG_DSN.
          # Their suites are dual-leg: the PostgreSQL half skips in
          # `coverage (no services)`, so without a producer here the diff
          # gate scored every changed PG-store line as untested code while
          # the very same arcs were passing against a real server in
          # ci.yml. The suite builds its own throwaway schema (the pg_engine
          # fixture), so it does not depend on the alembic chain above; it
          # runs in the same step only to share the service and env.
          uv run coverage run --append --branch \
            --source=packages/maistro-canvas/src/maistro_canvas \
            -m pytest packages/maistro-canvas/tests --timeout=30 -q
      - name: upload coverage data
        uses: actions/upload-artifact@v7
        with:
          name: coverage-postgres
          include-hidden-files: true
          path: .coverage
          if-no-files-found: error
          retention-days: 1

  coverage-gate:
    name: Coverage gate (publish-set floor + diff coverage)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [coverage-unit, coverage-archive, coverage-postgres]
    env:
      # The combine step re-runs the root suite as the `scripts` producer, and
      # that suite carries the shipped-state `check-*` self-checks. On a push
      # to `develop` the resolver's local fallback degenerates to HEAD and the
      # #534 self-reference refusal fires, reding this job for "cannot
      # compare" rather than any coverage regression (#1235). Name the event's
      # own base, exactly as vulture-ratchet.yml does. tests/conftest.py
      # captures this value and keeps it away from every test except the gate
      # self-checks that opt in.
      RATCHET_BASE_REV: >-
        ${{ github.event_name == 'pull_request'
            && format('origin/{0}', github.base_ref)
            || github.event_name == 'merge_group'
            && github.event.merge_group.base_sha
            || github.event.before }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # full history: the diff gate needs the merge base

      - name: Install uv
        uses: ./.github/actions/setup-uv

      - name: Setup Python 3.12
        run: uv python install 3.12
      - name: uv sync (full dev deps)
        run: uv sync --locked --all-extras

      - name: download every producer's coverage data
        uses: actions/download-artifact@v8
        with:
          pattern: coverage-*
          path: coverage-data

      # `coverage combine` consumes files named `.coverage.<suffix>` from one
      # directory. Each artifact arrives as `coverage-data/<name>/.coverage`, so
      # they are renamed by producer before combining — same basename in
      # different directories would collide on move.
      - name: combine
        run: |
          set -euo pipefail
          shopt -s nullglob dotglob
          found=0
          for dir in coverage-data/*/; do
            name="$(basename "$dir")"
            if [ -s "${dir}.coverage" ]; then
              mv "${dir}.coverage" ".coverage.${name}"
              found=$((found + 1))
            else
              echo "::error::producer ${name} contributed no coverage data"
              exit 1
            fi
          done
          if [ "$found" -eq 0 ]; then
            echo "::error::no coverage artifacts found — every producer failed or uploaded nothing"
            exit 1
          fi
          echo "combining $found producer(s)"
          uv run coverage combine
          uv run coverage report -m --skip-covered

          # The publish-set floor is evaluated HERE, before any non-publish-set
          # data joins the database. `coverage report` scopes by --include/--omit
          # only, so appending maistro-server first would have put it under this
          # floor no matter what the comment said — the doc and the arithmetic
          # would have disagreed, silently, in the direction of a stricter gate
          # than anyone signed up for.
          #
          # 88 -> 86 on 2026-08-22, and this is a widened MEASUREMENT rather than
          # a regression. `include_namespace_packages` (added in this change) let
          # coverage discover never-imported files under
          # `maistro_canvas/canvas/`, a directory with no `__init__.py` whose
          # four modules had been invisible to this gate entirely. The publish
          # set went from 41,469 statements at 89% to 42,290 at 87.43%: the +821
          # are 100% uncovered and always were. Nothing got worse — the number
          # stopped being flattering, which is the entire point of the flag.
          #
          # 86 kept roughly the 1.5 points of headroom the 88-under-89.63 choice
          # had. The newly-visible debt was #171, NOT an omit pattern here:
          # re-hiding it is the one response that would have made discovering it
          # pointless.
          #
          # 86 -> 87 on 2026-08-22, as #171 lands. `canvas/compositor.py` (148
          # statements) and `canvas/executor.py` (167) went 0% -> 100% and 98%,
          # taking the publish set from 42,290 at 87.43% to 42,290 at 88.23%.
          # Same denominator: this is coverage arriving, not measurement moving.
          # 87 keeps 1.23 points of headroom under it.
          #
          # The floor does not go higher yet. `canvas/store.py` (175) and
          # `canvas/tool.py` (331) are still 0% and still in the denominator —
          # both are RETIRE in quality/reachability-dispositions.json, so the
          # 506 statements leave by deletion rather than by tests, and the
          # aggregate rises again when they do (see #171 for why writing tests
          # for them would be the wrong move).
          uv run coverage report --fail-under=87 || \
            (echo "::error::publish-set coverage below the 87% floor" && exit 1)
          # Now widen for the DIFF gate only. These four packages are outside
          # the publish set, so none of them is under the floor above, but "the
          # file you touched" is well defined even where "the package's
          # aggregate" is not yet governed (#163 item 6).
          #
          # Every --source here must also appear in MEASURED_ROOTS in
          # scripts/check-diff-coverage.py; tests/test_check_diff_coverage.py
          # asserts the two agree. Adding a producer here without declaring it
          # there leaves the package unscored and the log says so; declaring it
          # there without a producer here fails every PR that touches it.
          uv run coverage run --append --branch --source=packages/maistro-server/src/maistro_server \
            -m pytest packages/maistro-server/tests --timeout=30 -q
          uv run coverage run --append --branch --source=packages/maistro-turing/src/maistro_turing \
            -m pytest packages/maistro-turing/tests --timeout=30 -q
          # maistro-turing carries a second FastAPI service under backend/ with
          # its own suite. Measuring only src/ would leave that half of the
          # package silently unscored, which is the hole this item closes.
          uv run coverage run --append --branch --source=packages/maistro-turing/backend \
            -m pytest packages/maistro-turing/backend/tests --timeout=30 -q
          uv run coverage run --append --branch --source=packages/maistro-design/src/maistro_design \
            -m pytest packages/maistro-design/tests --timeout=30 -q
          # hive-conductor's pytest-bdd is declared in that workspace member's
          # OWN `dev` extra, and `--all-extras` includes every optional
          # dependency of the ROOT project only — not of each member. So the
          # sync above actively REMOVES pytest-bdd (`- pytest-bdd==8.1.0` in a
          # dry run) and the two BDD step-def modules abort collection.
          #
          # `uv sync --all-packages` is the obvious fix and does not work here:
          # hive-conductor's wheel config rewrites a path prefix
          # (`sources = { "backend" = "hive_conductor" }`), and hatchling
          # refuses an editable install for a prefix rewrite rather than a
          # removal (editables#20), so the sync fails to build the member. The
          # dry run passes because it never builds. Do not re-try that flag
          # without changing that `sources` mapping first.
          #
          # ci.yml's `test` job already installs this requirements file before
          # the same suite. Installed HERE rather than beside `uv sync`, so a
          # version it resolves outside the lock (it pulls protobuf 5.29.6 ->
          # 7.36.0) cannot perturb the three coverage runs above that are
          # already recorded.
          uv pip install -r packages/hive-conductor/backend/requirements.txt
          uv run coverage run --append --branch --source=packages/hive-conductor/backend \
            -m pytest packages/hive-conductor/backend/tests --timeout=30 -q
          # The gates themselves (#257). Every one of #160's five mandates is
          # enforced by a file in scripts/, and they were the only Python here
          # that no gate governed. The root suite is what exercises them —
          # tests/test_check_*.py import each script and drive its pure logic —
          # so this is the producer that puts them in coverage.xml.
          #
          # Its PostgreSQL-dependent legs skip in this job, which has no server.
          # That is fine for this --source: no gate script needs a database.
          uv run coverage run --append --branch --source=scripts \
            -m pytest tests/ --timeout=30 -q
          uv run coverage xml -o coverage.xml

      # ----- Pillar 1b: diff coverage (the lines this candidate added) -----
      #
      # The aggregate above cannot see a change: a new 400-line module landing
      # at 0% moves a 42,000-statement total by a fraction of a point.
      #
      # PER FILE, and branch arcs included — both learned from review of the
      # first version, which wrapped `diff-cover`. That tool pools every changed
      # line before applying its threshold, so five uncovered lines in a new file
      # plus ninety-five covered elsewhere passed at 95% — the aggregate defect
      # again, one scope smaller. It also scores line hits only, so `--branch`
      # collected arc data that nothing read.
      #
      # THRESHOLDS, measured over every PR merged into `develop` since 15abb9d
      # (#124, #125, #128, #123, #126), per file: worst line coverage 94.9%,
      # worst branch coverage 85.7%. Floors of 90 and 80 sit under each measured
      # worst — separate numbers because the distributions differ, and a single
      # shared floor would have to be the lower of the two, which would stop
      # enforcing anything on lines. Raise as the sample grows.
      - name: Diff coverage gate (per file, lines 90% / branches 80%)
        # A push has no candidate base SHA, so there is no "lines this candidate
        # touched" to measure. The aggregate floor is what governs a push.
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        env:
          DIFF_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: |
          uv run python scripts/check-diff-coverage.py coverage.xml \
            --base "$DIFF_BASE_SHA"

  # The former 37-step Quality gate is intentionally fan-out here. The
  # reusable workflow owns checkout, uv and analyzer setup; each caller emits
  # one independently retryable check. Vulture is owned by Vulture Ratchet,
  # which is the repository-wide invocation of that exact ledger check.
  quality-ruff-lint:
    name: Quality / ruff lint
    uses: ./.github/workflows/reusable-quality-check.yml
    with:
      check_name: Quality / ruff lint
      command: uv run ruff check .
  quality-ruff-format:
    name: Quality / ruff format
    uses: ./.github/workflows/reusable-quality-check.yml
    with:
      check_name: Quality / ruff format
      command: uv run ruff format --check .
  quality-radon-ratchet:
    name: Quality / radon CC ratchet
    uses: ./.github/workflows/reusable-quality-check.yml
    with:
      check_name: Quality / radon CC ratchet
      command: uv run python scripts/check-radon-baseline.py
  quality-radon-report:
    name: Quality / radon CC report
    uses: ./.github/workflows/reusable-quality-check.yml
    with:
      check_name: Quality / radon CC report
      command: uv run radon cc packages/maistro-core/src --min B --total-average
  quality-version:
    name: Quality / version consistency
    uses: ./.github/workflows/reusable-quality-check.yml
    with:
      check_name: Quality / version consistency
      command: uv run python scripts/bump_version.py --check
  quality-release:
    name: Quality / release consistency
    uses: ./.github/workflows/reusable-quality-check.yml
    with:
      check_name: Quality / release consistency
      command: uv run python scripts/check-release-consistency.py
  quality-doc-links:
    name: Quality / doc links
    uses: ./.github/workflows/reusable-quality-check.yml
    with:
      check_name: Quality / doc links
      command: uv run python scripts/check-doc-links.py
  quality-enumerations:
    name: Quality / enumeration coverage
    uses: ./.github/workflows/reusable-quality-check.yml
    with:
      check_name: Quality / enumeration coverage
      command: uv run python scripts/check_enumerations.py
  quality-ifeval:
    name: Quality / IFEval provenance
    uses: ./.github/workflows/reusable-quality-check.yml
    with:
      check_name: Quality / IFEval provenance
      command: uv run python scripts/vendor_ifeval.py --check
  quality-bfcl:
    name: Quality / BFCL provenance
    uses: ./.github/workflows/reusable-quality-check.yml
    with:
      check_name: Quality / BFCL provenance
      command: uv run python scripts/vendor_bfcl.py --check
  quality-xenon:
    name: Quality / xenon ratchet
    uses: ./.github/workflows/reusable-quality-check.yml
    with:
      check_name: Quality / xenon ratchet
      command: >-
        set -o pipefail; uv run xenon --max-absolute B --max-modules B
        --max-average A packages/maistro-core/src > xenon.log 2>&1 || true;
        count=$(grep -c '^ERROR:xenon:block' xenon.log || true); cat xenon.log;
        echo "xenon violation count: $count (baseline: 77)";
        test "$count" -le 77 || { echo "::error::xenon regression"; exit 1; }
  quality-reachability:
    name: Quality / reachability ratchet
    uses: ./.github/workflows/reusable-quality-check.yml
    with:
      check_name: Quality / reachability ratchet
      command: uv run python scripts/check-reachability.py
  quality-wiring:
    name: Quality / wiring reads ratchet
    uses: ./.github/workflows/reusable-quality-check.yml
    with:
      check_name: Quality / wiring reads ratchet
      ratchet_base_rev: >-
        ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref)
            || github.event_name == 'merge_group' && github.event.merge_group.base_sha
            || github.ref == 'refs/heads/develop' && github.event.before
            || github.ref == 'refs/heads/integration' && github.event.before
            || github.ref == 'refs/heads/main' && github.event.before
            || 'origin/develop' }}
      command: uv run python scripts/check-wiring-reads.py
  quality-agent-store:
    name: Quality / agent store write path
    uses: ./.github/workflows/reusable-quality-check.yml
    with:
      check_name: Quality / agent store write path
      command: uv run python scripts/check-agent-store-writes.py
  quality-contract-markers:
    name: Quality / contract marker ledger
    uses: ./.github/workflows/reusable-quality-check.yml
    with:
      check_name: Quality / contract marker ledger
      command: uv run python scripts/check-contract-markers.py
  quality-convergence:
    name: Quality / convergence matrix
    uses: ./.github/workflows/reusable-quality-check.yml
    with:
      check_name: Quality / convergence matrix
      command: uv run python scripts/check-convergence-matrix.py
  quality-dispositions:
    name: Quality / reachability dispositions
    uses: ./.github/workflows/reusable-quality-check.yml
    with:
      check_name: Quality / reachability dispositions
      command: uv run python scripts/check-reachability-dispositions.py
  quality-security-inventory:
    name: Quality / security inventory
    uses: ./.github/workflows/reusable-quality-check.yml
    with:
      check_name: Quality / security inventory
      command: uv run python scripts/check-security-inventory.py
  quality-image-inventory:
    name: Quality / image inventory
    uses: ./.github/workflows/reusable-quality-check.yml
    with:
      check_name: Quality / image inventory
      command: uv run python scripts/check-image-inventory.py
  quality-backlog:
    name: Quality / backlog consistency
    uses: ./.github/workflows/reusable-quality-check.yml
    with:
      check_name: Quality / backlog consistency
      command: uv run python scripts/check-backlog-consistency.py
  quality-acceptance:
    name: Quality / acceptance-state ratchet + mandate
    uses: ./.github/workflows/reusable-quality-postgres-check.yml
    with:
      check_name: Quality / acceptance-state ratchet + mandate
      ratchet_base_rev: >-
        ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref)
            || github.event_name == 'merge_group' && github.event.merge_group.base_sha
            || github.ref == 'refs/heads/develop' && github.event.before
            || github.ref == 'refs/heads/integration' && github.event.before
            || github.ref == 'refs/heads/main' && github.event.before
            || 'origin/develop' }}
      mandate_base_sha: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
      command: |
        uv run alembic upgrade head
        if [ -n "$MANDATE_BASE_SHA" ]; then
          uv run python scripts/check-ac-state.py \
            --run-tests --ratchet --mandate "$MANDATE_BASE_SHA"
        else
          uv run python scripts/check-ac-state.py --run-tests --ratchet
        fi
  quality-mypy:
    name: Quality / mypy strict
    uses: ./.github/workflows/reusable-quality-check.yml
    with:
      check_name: Quality / mypy strict
      command: uv run mypy --strict packages/maistro-core/src
  quality-pyright:
    name: Quality / pyright ratchet
    uses: ./.github/workflows/reusable-quality-check.yml
    with:
      check_name: Quality / pyright ratchet
      command: |
        export PYRIGHT_BASELINE=21
        uv run pyright --outputjson packages/maistro-core/src > pyright.json || true
        count=$(uv run python -c "import json;print(json.load(open('pyright.json'))['summary']['errorCount'])")
        uv run pyright packages/maistro-core/src || true
        echo "pyright error count: $count (baseline: $PYRIGHT_BASELINE)"
        if [ "$count" -gt "$PYRIGHT_BASELINE" ]; then
          echo "::error::pyright regression — $count errors exceeds baseline of $PYRIGHT_BASELINE"
          exit 1
        fi
  quality-hypothesis:
    name: Quality / Hypothesis property tests
    uses: ./.github/workflows/reusable-quality-postgres-check.yml
    with:
      check_name: Quality / Hypothesis property tests
      command: |
        PYTHONPATH=packages/maistro-core/src uv run pytest formal/ --timeout=120 -q
  quality-lifecycles:
    name: Quality / execution lifecycles
    uses: ./.github/workflows/reusable-quality-check.yml
    with:
      check_name: Quality / execution lifecycles
      command: uv run python scripts/check-execution-lifecycles.py
  quality-egress:
    name: Quality / model egress
    uses: ./.github/workflows/reusable-quality-check.yml
    with:
      check_name: Quality / model egress
      command: uv run python scripts/check-model-egress.py
  quality-fitness:
    name: Quality / architecture fitness functions
    uses: ./.github/workflows/reusable-quality-check.yml
    with:
      check_name: Quality / architecture fitness functions
      command: |
        PYTHONPATH=packages/maistro-core/src uv run pytest packages/maistro-core/tests/fitness -v --timeout=30
  quality-interrogate:
    name: Quality / interrogate
    uses: ./.github/workflows/reusable-quality-check.yml
    with:
      check_name: Quality / interrogate
      command: |
        uv run interrogate -f 38 packages/maistro-core/src/maistro/graph/nodes
        uv run interrogate -f 45 packages/maistro-core/src/maistro/graph/durable_runs
        uv run interrogate -f 63 packages/maistro-core/src/maistro/projects
        uv run interrogate -f 46 packages/maistro-core/src/maistro
