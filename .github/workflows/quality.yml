# Quality gate — the 8-pillar make qa target, fast bag (PR-blocking).
#
# Pillars that gate the PR:
#  1. Coverage (line + branch ≥95% on touched files; Boy Scout Rule).
#  2. Hypothesis property tests (subset; full formal/ runs in formal-conformance.yml).
#  3. Code smells: ruff (full ruleset), radon CC, xenon, vulture, interrogate.
#  4. Type checks: mypy --strict + pyright.
#  5. Mutation: cosmic-ray on changed files only (full nightly in mutation.yml).
#  6. Contract: schemathesis against the OpenAPI spec (when service running).
#  7. Architecture fitness functions.
#  8. Docstring coverage on touched modules.
#
# Heavy bag (DAST, container scan, image-signing) lives in security.yml.

name: quality

# Least privilege: this workflow only reads the repo to analyze it.
permissions:
  contents: read

# Progressive enforcement ladder (Phase 19; vulture and radon reclassified
# Phase 20 — SPEC-264):
#   feat/* pushes                       -> in scope, but lighter weight (no PR-target backstop)
#   PR/push -> develop/integration/main -> same gate everywhere: ruff/mypy hard; radon CC and
#                                          vulture hard-fail on any finding unmatched by their
#                                          respective baseline (quality/radon-baseline.json,
#                                          quality/vulture-baseline.json — classification
#                                          ratchets, not count ratchets); xenon hard-fails on
#                                          module/project-average REGRESSION only (count
#                                          ratchet vs. the recorded baseline below);
#                                          pyright stays advisory pending a separate triage PR.
on:
  # No `branches:` filter. It used to be [main, integration, develop], which
  # matched on the PR's *base* — so a PR stacked on a feature branch ran none of
  # this. #151 and #138 got Registry CI and Formal Conformance only: no lint, no
  # types, no tests, no coverage, no SAST, no ratchet gates. The work was not
  # unreviewed, it was unmeasured, and every accumulated failure arrived at once
  # on retarget, against the branch least able to absorb it.
  #
  # A required-check set that silently does not apply to a whole class of PRs is
  # worse than none: the green tick means different things depending on the base
  # and nothing on the PR says which. #161.
  pull_request:
  # A merge queue judges the synthetic current-base + candidate tree, so every
  # required quality check must report on that exact merge-group SHA too.
  merge_group:
    types: [checks_requested]
  push:
    branches: [main, integration, develop, feat/*]

# See the rationale in ci.yml: supersede candidate runs, let protected-branch
# pushes finish so their pass/fail record survives.
concurrency:
  group: quality-${{ github.event.pull_request.number || github.event.merge_group.head_sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' }}

jobs:
  # ----- Coverage is produced by several jobs and judged by one (#211) -----
  #
  # Coverage used to be produced by a single job with no service containers,
  # which meant any code whose suites need a real server was scored from a run
  # that could not execute them. `pg_stores.py` read as 41% covered while being
  # thoroughly tested, because its PostgreSQL legs skip without a server and the
  # measuring job had none. A gate that cannot see something must not report a
  # number as if it had looked.
  #
  # So: every suite is measured exactly once, in a job that can actually run it,
  # and the floors are evaluated on the combined data.
  #
  # ADDING A PRODUCER is one job plus one artifact name:
  #   1. run the suite under `coverage run --branch --source=<src>`;
  #   2. upload `.coverage` as `coverage-<name>` with include-hidden-files;
  #   3. add `coverage-<name>` to `coverage-gate`'s `needs:` and download list.
  # Make skipping fatal in the producer (see MAISTRO_REQUIRE_* below) — a
  # producer that silently skips its legs contributes an empty file and shrinks
  # the denominator, which is the failure this whole structure exists to avoid.
  #
  # `durable-events` and `migrations` are not producers yet: no PostgreSQL-gated
  # test exists on `develop`. They arrive with #181 and #178, each adding its own
  # producer.

  coverage-unit:
    name: coverage (no services)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # full history: the diff gate needs the merge base

      - name: Install uv
        uses: ./.github/actions/setup-uv

      - name: Setup Python 3.12
        run: uv python install 3.12
      - name: uv sync (full dev deps)
        run: uv sync --locked --all-extras

      # formal/ imports maistro_evolve; not a uv workspace member, so
      # `uv sync` alone doesn't install it.
      - name: install maistro-evolve
        run: uv pip install -e packages/maistro-evolve

      # The Tier-3 sandbox backend (#76). Without it the bubblewrap
      # integration tests skip, and the diff-coverage gate then measures a
      # backend whose execution paths nothing ran -- the exact shape of the
      # gap that gate exists to find.
      - name: install bubblewrap
        run: |
          timeout 180 sudo apt-get update -qq || true
          timeout 180 sudo apt-get install -y bubblewrap
          # See ci.yml: without this, `bwrap` is installed but cannot build a
          # namespace on Ubuntu 24.04, so the integration tests skip and the
          # diff gate measures execution paths nothing ran.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      # ----- Pillar 1: coverage (line + branch ≥95% on touched files) -----
      # C2/#287: measured over the PyPI publish set (core, canvas, evolve, rsi,
      # bootstrap — the PyPI publish set),
      # not maistro-core alone. Each package runs as its own `coverage run
      # --append` invocation rather than one combined pytest call: an earlier
      # attempt at a single `pytest packages/maistro-core/tests
      # packages/maistro-canvas/tests ...` invocation broke an unrelated
      # maistro-rsi test (structlog's capture_logs() picks up stale global
      # config when another package's tests configure structlog first) — the
      # same cross-package state-pollution risk ci.yml's `test` job already
      # avoids by giving every package its own pytest step.
      - name: pytest with coverage (line + branch)
        env:
          PYTHONPATH: >-
            packages/maistro-core/src:packages/maistro-canvas/src:
            packages/maistro-rsi/src:packages/maistro-evolve/src
          REQUIRE_AUTH: "false"
          MAISTRO_DRY_RUN: "1"
        run: |
          uv run coverage erase
          uv run coverage run --branch --source=packages/maistro-core/src/maistro \
            -m pytest packages/maistro-core/tests --timeout=30 -q
          uv run coverage run --append --branch --source=packages/maistro-canvas/src/maistro_canvas \
            -m pytest packages/maistro-canvas/tests --timeout=30 -q
          uv run coverage run --append --branch --source=packages/maistro-evolve/src/maistro_evolve \
            -m pytest packages/maistro-evolve/tests --timeout=30 -q
          uv run coverage run --append --branch --source=packages/maistro-rsi/src/maistro_rsi \
            -m pytest packages/maistro-rsi/tests --timeout=30 -q
          uv run coverage run --append --branch --source=packages/maistro-bootstrap/src/maistro_bootstrap \
            -m pytest packages/maistro-bootstrap/tests --timeout=30 -q
      - name: upload coverage data
        uses: actions/upload-artifact@v4
        with:
          name: coverage-unit
          # `.coverage` is a dotfile and upload-artifact@v4 skips hidden files
          # by default — without this the artifact uploads empty and the gate
          # silently measures less than it claims to.
          include-hidden-files: true
          path: .coverage
          if-no-files-found: error
          retention-days: 1

  # The Archive tier against a real S3-compatible server (#133, ADR-082226-d3dd).
  # Moved here from ci.yml by #211: it is the only job that can execute these
  # legs, so it is the only job that can honestly measure them, and artifacts do
  # not cross workflow runs.
  #
  # MinIO rather than a mocked client: a mocked object store proves the call was
  # made with the arguments the test already knew, which is not the property
  # worth checking about storage. The same conformance suite runs over
  # FilesystemArchiveStore and S3ArchiveStore, so the two implementations cannot
  # drift into behaving differently under one protocol.
  #
  # `--extra dev --extra s3` installs the optional SDK for the S3 leg. The
  # *absence* case is covered by test_optional_dependency.py, which hides
  # aioboto3 from the import system rather than uninstalling it — so both halves
  # are checked in one environment.
  #
  # Started as a step rather than under `services:`, for two reasons found the
  # hard way. The official `minio/minio` image needs `server /data` as a
  # command, and a `services:` block has no `command:` key at all — only
  # `image`, `env`, `ports`, `options` and `credentials`. And the first version
  # of this job named `bitnami/minio:latest`, which does not resolve: Bitnami
  # retired their public tags, so every run died on `manifest unknown` before
  # reaching a single test. An image name is not verified by being plausible.
  coverage-archive:
    name: coverage (MinIO)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Start MinIO
        run: |
          set -euo pipefail
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin \
            minio/minio:latest server /data
          # Poll the health endpoint rather than sleeping a fixed amount: a
          # fixed sleep is either slower than it needs to be or racy, and the
          # race surfaces as a connection error that reads exactly like the
          # storage bug this job exists to catch.
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:9000/minio/health/live >/dev/null; then
              echo "MinIO ready"
              exit 0
            fi
            sleep 2
          done
          echo "::error::MinIO did not become ready within 60s"
          docker logs minio
          exit 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: ./.github/actions/setup-uv
      - run: uv sync --locked --extra dev --extra s3
      # One archive tier now. `tests/memory/archive` (aioboto3, ADR-082226-d3dd)
      # was the second implementation of the same decision and was never
      # imported by anything; it is retired, and with it the second credential
      # spelling this job used to set. `tests/archive` uses boto3 and lets
      # botocore resolve `AWS_ACCESS_KEY_ID`/`AWS_SECRET_ACCESS_KEY` in the
      # ordinary way, so those are the only two the suite reads.
      - name: Archive conformance against MinIO (under coverage)
        env:
          MAISTRO_TEST_S3_ENDPOINT: http://127.0.0.1:9000
          AWS_ACCESS_KEY_ID: minioadmin
          AWS_SECRET_ACCESS_KEY: minioadmin
          AWS_DEFAULT_REGION: us-east-1
          # A skipped leg is untested, not passing. Without this the suite
          # would fall back to an in-process moto server (or skip outright) if
          # MinIO failed to start, leaving the job green over an unrun leg and
          # quietly dropping these lines from the denominator.
          MAISTRO_REQUIRE_S3_LEGS: "1"
        run: |
          uv run coverage run --branch --source=packages/maistro-core/src/maistro \
            -m pytest packages/maistro-core/tests/archive -v --tb=short
      - name: upload coverage data
        uses: actions/upload-artifact@v4
        with:
          name: coverage-archive
          include-hidden-files: true
          path: .coverage
          if-no-files-found: error
          retention-days: 1


  # The PostgreSQL producer, for both families of PG-only code. Everything
  # under `persistence/pg_*`, `container.py`'s backend wiring and
  # `events/pg_stores.py` executes only against a real server, so the run with
  # no services scores every one of those lines as uncovered — and the diff
  # gate, which is per file, then rejects them for being untestable in a job
  # that could never have tested them.
  #
  # `ci.yml`'s `postgres` matrix and `durable-events` job run these suites for
  # their pass/fail verdict; this runs them once more for their coverage, so
  # the combined report describes the code as it is actually exercised.
  #
  # One job rather than two, and one version rather than the pg17/pg18 matrix:
  # coverage is about which lines run, and both majors run the same ones.
  # Matrixing would upload artifacts with identical arcs for double the
  # wall-clock.
  #
  # `pgvector/pgvector:pg17`, not plain `postgres:17`: migration 001 opens with
  # `CREATE EXTENSION IF NOT EXISTS vector`, and this job walks the whole chain
  # rather than stamping partway. The stock image answers
  # `extension "vector" is not available`.
  coverage-postgres:
    name: coverage (PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: maistro
          POSTGRES_PASSWORD: maistro
          POSTGRES_DB: maistro_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U maistro -d maistro_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      DB_USER: maistro
      DB_PASSWORD: maistro
      DB_NAME: maistro_test
      MAISTRO_TEST_PG_DSN: postgresql://maistro:maistro@127.0.0.1:5432/maistro_test
      MAISTRO_TEST_DATABASE_URL: postgresql://maistro:maistro@127.0.0.1:5432/maistro_test
      # A skipped leg is untested, not passing. Without this a broken service
      # container would leave the job green and quietly drop these lines from
      # the denominator — the exact failure `coverage-archive` names.
      MAISTRO_REQUIRE_PG_LEGS: "1"
      REQUIRE_AUTH: "false"
      MAISTRO_DRY_RUN: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: ./.github/actions/setup-uv
      - run: uv sync --locked --extra dev
      # `tests/migrations` drives alembic itself — stamping, upgrading and
      # downgrading — so it runs against a database this job has NOT already
      # migrated. Applying the chain first and then asking those tests to apply
      # it again is a different scenario from the one they were written for.
      - name: Migration suites against an unmigrated database (under coverage)
        run: |
          uv run coverage run --branch --source=packages/maistro-core/src/maistro \
            -m pytest tests/migrations -v --tb=short
      # `runs`, `graph` and `projects` join the list because #132 put
      # PostgreSQL implementations behind them — `runs/pg_store.py`,
      # `projects/pg_scope_store.py`, `graph/pg_templates.py`. Their suites are
      # parametrised over every backend and the PostgreSQL leg skips without a
      # server, so running them only in `coverage (no services)` measured the
      # in-memory and SQLite legs and scored the PostgreSQL stores as untested
      # code. The diff gate was reading a number no job produced.
      #
      # `scheduling` joins for the same reason and on the same evidence: #231
      # put `scheduling/pg_store.py` behind it, the store suite is parametrised
      # over all three backends, and the diff gate scored the new file at 42.5%
      # while its PostgreSQL leg was passing — in the other job, where it
      # skipped. A list of suites is a list of what gets measured, so a new
      # PostgreSQL store means an edit here, every time.
      - name: Apply the chain, then the suites that need a schema (under coverage)
        run: |
          uv run alembic upgrade head
          uv run coverage run --append --branch \
            --source=packages/maistro-core/src/maistro \
            -m pytest packages/maistro-core/tests/persistence \
            packages/maistro-core/tests/test_container_postgres.py \
            packages/maistro-core/tests/events \
            packages/maistro-core/tests/runs \
            packages/maistro-core/tests/graph \
            packages/maistro-core/tests/projects \
            packages/maistro-core/tests/workspaces \
            packages/maistro-core/tests/scheduling -v --tb=short
      - name: upload coverage data
        uses: actions/upload-artifact@v4
        with:
          name: coverage-postgres
          include-hidden-files: true
          path: .coverage
          if-no-files-found: error
          retention-days: 1

  coverage-gate:
    name: Coverage gate (publish-set floor + diff coverage)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [coverage-unit, coverage-archive, coverage-postgres]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # full history: the diff gate needs the merge base

      - name: Install uv
        uses: ./.github/actions/setup-uv

      - name: Setup Python 3.12
        run: uv python install 3.12
      - name: uv sync (full dev deps)
        run: uv sync --locked --all-extras

      - name: download every producer's coverage data
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-*
          path: coverage-data

      # `coverage combine` consumes files named `.coverage.<suffix>` from one
      # directory. Each artifact arrives as `coverage-data/<name>/.coverage`, so
      # they are renamed by producer before combining — same basename in
      # different directories would collide on move.
      - name: combine
        run: |
          set -euo pipefail
          shopt -s nullglob dotglob
          found=0
          for dir in coverage-data/*/; do
            name="$(basename "$dir")"
            if [ -s "${dir}.coverage" ]; then
              mv "${dir}.coverage" ".coverage.${name}"
              found=$((found + 1))
            else
              echo "::error::producer ${name} contributed no coverage data"
              exit 1
            fi
          done
          if [ "$found" -eq 0 ]; then
            echo "::error::no coverage artifacts found — every producer failed or uploaded nothing"
            exit 1
          fi
          echo "combining $found producer(s)"
          uv run coverage combine
          uv run coverage report -m --skip-covered

          # The publish-set floor is evaluated HERE, before any non-publish-set
          # data joins the database. `coverage report` scopes by --include/--omit
          # only, so appending maistro-server first would have put it under this
          # floor no matter what the comment said — the doc and the arithmetic
          # would have disagreed, silently, in the direction of a stricter gate
          # than anyone signed up for.
          #
          # 88 -> 86 on 2026-08-22, and this is a widened MEASUREMENT rather than
          # a regression. `include_namespace_packages` (added in this change) let
          # coverage discover never-imported files under
          # `maistro_canvas/canvas/`, a directory with no `__init__.py` whose
          # four modules had been invisible to this gate entirely. The publish
          # set went from 41,469 statements at 89% to 42,290 at 87.43%: the +821
          # are 100% uncovered and always were. Nothing got worse — the number
          # stopped being flattering, which is the entire point of the flag.
          #
          # 86 kept roughly the 1.5 points of headroom the 88-under-89.63 choice
          # had. The newly-visible debt was #171, NOT an omit pattern here:
          # re-hiding it is the one response that would have made discovering it
          # pointless.
          #
          # 86 -> 87 on 2026-08-22, as #171 lands. `canvas/compositor.py` (148
          # statements) and `canvas/executor.py` (167) went 0% -> 100% and 98%,
          # taking the publish set from 42,290 at 87.43% to 42,290 at 88.23%.
          # Same denominator: this is coverage arriving, not measurement moving.
          # 87 keeps 1.23 points of headroom under it.
          #
          # The floor does not go higher yet. `canvas/store.py` (175) and
          # `canvas/tool.py` (331) are still 0% and still in the denominator —
          # both are RETIRE in quality/reachability-dispositions.json, so the
          # 506 statements leave by deletion rather than by tests, and the
          # aggregate rises again when they do (see #171 for why writing tests
          # for them would be the wrong move).
          uv run coverage report --fail-under=87 || \
            (echo "::error::publish-set coverage below the 87% floor" && exit 1)
          # Now widen for the DIFF gate only. These four packages are outside
          # the publish set, so none of them is under the floor above, but "the
          # file you touched" is well defined even where "the package's
          # aggregate" is not yet governed (#163 item 6).
          #
          # Every --source here must also appear in MEASURED_ROOTS in
          # scripts/check-diff-coverage.py; tests/test_check_diff_coverage.py
          # asserts the two agree. Adding a producer here without declaring it
          # there leaves the package unscored and the log says so; declaring it
          # there without a producer here fails every PR that touches it.
          uv run coverage run --append --branch --source=packages/maistro-server/src/maistro_server \
            -m pytest packages/maistro-server/tests --timeout=30 -q
          uv run coverage run --append --branch --source=packages/maistro-turing/src/maistro_turing \
            -m pytest packages/maistro-turing/tests --timeout=30 -q
          # maistro-turing carries a second FastAPI service under backend/ with
          # its own suite. Measuring only src/ would leave that half of the
          # package silently unscored, which is the hole this item closes.
          uv run coverage run --append --branch --source=packages/maistro-turing/backend \
            -m pytest packages/maistro-turing/backend/tests --timeout=30 -q
          uv run coverage run --append --branch --source=packages/maistro-design/src/maistro_design \
            -m pytest packages/maistro-design/tests --timeout=30 -q
          # hive-conductor's pytest-bdd is declared in that workspace member's
          # OWN `dev` extra, and `--all-extras` includes every optional
          # dependency of the ROOT project only — not of each member. So the
          # sync above actively REMOVES pytest-bdd (`- pytest-bdd==8.1.0` in a
          # dry run) and the two BDD step-def modules abort collection.
          #
          # `uv sync --all-packages` is the obvious fix and does not work here:
          # hive-conductor's wheel config rewrites a path prefix
          # (`sources = { "backend" = "hive_conductor" }`), and hatchling
          # refuses an editable install for a prefix rewrite rather than a
          # removal (editables#20), so the sync fails to build the member. The
          # dry run passes because it never builds. Do not re-try that flag
          # without changing that `sources` mapping first.
          #
          # ci.yml's `test` job already installs this requirements file before
          # the same suite. Installed HERE rather than beside `uv sync`, so a
          # version it resolves outside the lock (it pulls protobuf 5.29.6 ->
          # 7.36.0) cannot perturb the three coverage runs above that are
          # already recorded.
          uv pip install -r packages/hive-conductor/backend/requirements.txt
          uv run coverage run --append --branch --source=packages/hive-conductor/backend \
            -m pytest packages/hive-conductor/backend/tests --timeout=30 -q
          # The gates themselves (#257). Every one of #160's five mandates is
          # enforced by a file in scripts/, and they were the only Python here
          # that no gate governed. The root suite is what exercises them —
          # tests/test_check_*.py import each script and drive its pure logic —
          # so this is the producer that puts them in coverage.xml.
          #
          # Its PostgreSQL-dependent legs skip in this job, which has no server.
          # That is fine for this --source: no gate script needs a database.
          uv run coverage run --append --branch --source=scripts \
            -m pytest tests/ --timeout=30 -q
          uv run coverage xml -o coverage.xml

      # ----- Pillar 1b: diff coverage (the lines this candidate added) -----
      #
      # The aggregate above cannot see a change: a new 400-line module landing
      # at 0% moves a 42,000-statement total by a fraction of a point.
      #
      # PER FILE, and branch arcs included — both learned from review of the
      # first version, which wrapped `diff-cover`. That tool pools every changed
      # line before applying its threshold, so five uncovered lines in a new file
      # plus ninety-five covered elsewhere passed at 95% — the aggregate defect
      # again, one scope smaller. It also scores line hits only, so `--branch`
      # collected arc data that nothing read.
      #
      # THRESHOLDS, measured over every PR merged into `develop` since 15abb9d
      # (#124, #125, #128, #123, #126), per file: worst line coverage 94.9%,
      # worst branch coverage 85.7%. Floors of 90 and 80 sit under each measured
      # worst — separate numbers because the distributions differ, and a single
      # shared floor would have to be the lower of the two, which would stop
      # enforcing anything on lines. Raise as the sample grows.
      - name: Diff coverage gate (per file, lines 90% / branches 80%)
        # A push has no candidate base SHA, so there is no "lines this candidate
        # touched" to measure. The aggregate floor is what governs a push.
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        env:
          DIFF_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: |
          uv run python scripts/check-diff-coverage.py coverage.xml \
            --base "$DIFF_BASE_SHA"

  quality-gate:
    name: Quality gate (Pillars 1–4, 7, 8)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # A real PostgreSQL, because the acceptance-state ratchet below runs the
    # marked tests and `ac_outcome_plugin` counts a *skip* as not-passing --
    # deliberately, since a skip proves nothing about whether a criterion
    # holds. Without a server, every criterion whose evidence needs one is
    # unprovable here, which silently excluded the entire durable-store layer
    # from the acceptance mandate: the tests existed, passed in the `postgres`
    # job, and could never raise design coverage (#328).
    #
    # pg18 alone rather than the 17/18 matrix `ci.yml` runs. This job asks
    # whether the criteria are proven, not whether they hold on every supported
    # major; the compatibility question is the matrix's and stays there.
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: maistro
          POSTGRES_PASSWORD: maistro
          POSTGRES_DB: maistro_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U maistro -d maistro_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      MAISTRO_TEST_PG_DSN: postgresql://maistro:maistro@127.0.0.1:5432/maistro_test
      DATABASE_URL: postgresql://maistro:maistro@127.0.0.1:5432/maistro_test
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # full history for Boy-Scout-Rule diff vs baseline

      - name: Install uv
        uses: ./.github/actions/setup-uv

      - name: Setup Python 3.12
        run: uv python install 3.12

      - name: uv sync (full dev deps)
        run: uv sync --locked --all-extras

      # formal/ imports maistro_evolve (RSI conformance suites); not a uv
      # workspace member, so `uv sync` alone doesn't install it.
      - name: install maistro-evolve
        run: uv pip install -e packages/maistro-evolve

      # age/age-keygen are required by the vault + state encryption tests
      # (SPEC-011 / SPEC-010). apt's `age` package omits age-keygen on some
      # runners, so fall back to the upstream release tarball.
      - name: install age + age-keygen
        run: |
          set -e
          # Bounded: an unbounded apt-get or curl here hangs the whole job with
          # no output. Observed 2026-08-19 — quality.yml sat 29 minutes on this
          # step (past its own timeout-minutes) with every later step pending,
          # because the fetch from dl.filippo.io never returned and nothing
          # bounded it. `|| true` tolerates a *failed* apt, not a wedged one.
          timeout 180 sudo apt-get update || true
          timeout 180 sudo apt-get install -y age || true
          if ! command -v age-keygen &> /dev/null; then
            mkdir -p /tmp/age && cd /tmp/age
            curl -fsSL --max-time 120 --retry 3 --retry-delay 5 --retry-all-errors \
              https://dl.filippo.io/age/latest/age-linux-amd64.tar.gz | tar xz
            sudo mv /tmp/age/age /tmp/age/age-keygen /usr/local/bin/
            age-keygen --help > /dev/null && echo "✓ age-keygen ready"
          fi

      # The analyzer CLIs are NOT project extras (see requirements-dev-tools.txt
      # — semgrep-class tools carry conflicting pins; these are safe in-venv).
      - name: install quality tools
        run: uv pip install radon xenon vulture pyright interrogate pytest-timeout

      # ----- Pillar 3: code smells -----
      - name: ruff lint (full ruleset)
        run: uv run ruff check .

      - name: ruff format check
        run: uv run ruff format --check .

      # The workflow header has claimed since Phase 20 that radon findings are
      # gated against quality/radon-baseline.json — but the checker was never
      # invoked (Codex, #262): the plain `radon cc` below reports blocks and
      # exits 0 regardless, so the documented gate did not exist. Now it does:
      # fails on any unbaselined C-or-worse block, or a baselined block whose
      # complexity grew; stale entries are pruned as hotspots are refactored.
      - name: radon CC ratchet (new/regressed hotspots vs quality/radon-baseline.json)
        run: uv run python scripts/check-radon-baseline.py

      - name: radon CC (report; the ratchet above is the gate)
        run: uv run radon cc packages/maistro-core/src --min B --total-average

      # Single-sourced version (E1/#294): VERSION is the source of truth, and
      # every package's pyproject.toml/__version__ fallback, inter-package
      # dependency lower bound, and app-level FastAPI(version=...) literal
      # must agree with it — catches drift before merge, not just at bump time.
      - name: version consistency check (VERSION vs. every version site)
        run: uv run python scripts/bump_version.py --check

      # The step above proves the 32 version sites agree on a number. It says
      # nothing about the number's relationship to the release the repo is
      # writing notes for — and VERSION 0.9.0 against a CHANGELOG heading of
      # `## [1.0.0] - TBD` is coherent only if something states that they are
      # meant to differ. This checks that story: one pending release, VERSION
      # at or below it, no dated release above it, and a README block naming
      # all three numbers as labelled fields so a reader is not left to infer
      # any of them (#83).
      #
      # It reads the repository's `v*` tags, which is what makes "nothing has
      # been released yet" a checked fact rather than a claim that rots the
      # moment the first tag is pushed. The job's checkout above uses
      # `fetch-depth: 0`, which fetches them; without tags the gate demands
      # `Released: none` and so fails loudly on a published repo rather than
      # passing while the README understates.
      - name: release consistency (VERSION, CHANGELOG, README and tags tell one story)
        run: uv run python scripts/check-release-consistency.py

      # The maistro-registry gate validates front-matter relationships
      # (supersedes/depends_on); it never resolves prose links in a document
      # body. Renaming an ADR therefore leaves dead [ADR-xxx](...) links behind
      # in every spec that cited the old filename, invisibly. This is a strict
      # 0-baseline, not a ratchet: a broken relative link is never acceptable
      # and fixing one is always a one-line change.
      - name: doc links (every relative markdown link resolves)
        run: uv run python scripts/check-doc-links.py

      # Unlike the ratchets below, this one is a *count-free* ratchet: the
      # baseline names every tolerated gap, and a gap that gets fixed but left
      # in the file fails the build too. That asymmetry is the point — a count
      # ratchet lets one fix pay for one new gap, which is how three separate
      # reviews found a control that no longer covered its own motivating case.
      #
      # Enumerated security controls (_PROTECTED_OPS, SENSITIVE_PATH_PATTERNS,
      # CORE_PUBLIC_SURFACE) are checked as properties against the real tree
      # rather than trusted as hand-written lists. See the script's docstring
      # for the four findings that motivated it.
      - name: enumeration coverage (derived control lists — ratchet)
        run: uv run python scripts/check_enumerations.py

      # The vendored IFEval grader and corpus are the *exam* the RSI loop is
      # scored against, so they must stay byte-comparable to what Google
      # published. This verifies the committed tree still matches its pinned
      # content hashes and that no upstream import survived the documented
      # rewrite — i.e. that nobody (human or loop) hand-edited the grader into
      # something more forgiving while keeping the official name on it.
      # Offline by design: it checks invariants, it does not re-fetch.
      - name: vendored benchmark provenance (IFEval grader + corpus)
        run: uv run python scripts/vendor_ifeval.py --check

      - name: vendored benchmark provenance (BFCL checker + corpus)
        run: uv run python scripts/vendor_bfcl.py --check

      # Ratchet, not a 0-baseline: full backlog (77 ERROR blocks measured
      # 2026-06-29) is too large to clear in one PR (Phase 18 code-health
      # sweep). Hard-fails on REGRESSION (new violations beyond the
      # recorded baseline) on every branch; raise the floor as the backlog
      # is worked down, and drop the ratchet for a strict 0-baseline once
      # XENON_BASELINE reaches 0.
      - name: xenon (per-function ≤ B; per-module ≤ B; project avg ≤ A — ratchet)
        env:
          XENON_BASELINE: 77
        run: |
          uv run xenon --max-absolute B --max-modules B --max-average A packages/maistro-core/src > xenon.log 2>&1 || true
          count=$(grep -c '^ERROR:xenon:block' xenon.log || true)
          cat xenon.log
          echo "xenon violation count: $count (baseline: $XENON_BASELINE)"
          if [ "$count" -gt "$XENON_BASELINE" ]; then
            echo "::error::xenon regression — $count violations exceeds baseline of $XENON_BASELINE; refactor the new complex blocks (Boy Scout Rule)"
            exit 1
          fi

      # Per-identity debt ledger, not a count: quality/vulture-baseline.json
      # records the exact reviewed finding identities per classification rule,
      # so a new finding fails by name and a fixed one must shrink the ledger
      # in the same PR. This step ran a total-count ceiling until 2026-08
      # (history in git); a count could hold slack — the ceiling sat at 1,426
      # while the tree had 1,422 findings — and 4 findings of retained slack
      # would have silently paid for a later regression. The same invocation
      # also runs in vulture-ratchet.yml; the ledger JSON is the single
      # authority, this job extends it to feat/* pushes.
      #
      # Scope: ALL packages/*/src (2026-07-01), not just maistro-core — a single
      # invocation so cross-package reachability resolves public APIs consumed
      # across packages (e.g. maistro-rsi -> maistro-evolve), which a per-package
      # scan would false-positive. The `packages/*/src` glob auto-covers new
      # packages; adding one surfaces every new identity for banking (that IS
      # the ratchet). `third_party/` is vendored upstream source (Google's
      # IFEval verifier, BFCL's AST checker), kept byte-faithful so the
      # benchmarks run the official implementation — linting someone else's
      # tree for dead names measures nothing we can act on.
      - name: vulture (dead-code; confidence ≥ 60 — per-identity ledger)
        run: >-
          uv run python scripts/check-vulture-baseline.py
          packages/*/src
          --min-confidence 60
          --exclude '*/third_party/*'

      # Vulture works at symbol granularity inside a file, so it is structurally
      # blind to a whole module that only its own siblings and tests import —
      # every symbol in it looks used. That is the shape of #344/#346/#347 and
      # ADR-064's unwired redact(): correct, well-covered code with no caller.
      # This ratchet closes that blind spot at module granularity.
      - name: reachability ratchet (built-but-never-wired modules)
        run: uv run python scripts/check-reachability.py

      # Both gates above stop one level short of the DI root. `Container` is not
      # a value object -- its fields exist so the runtime can consume them -- and
      # a field that is constructed, stored and read by nobody is wiring that
      # does nothing. Reachability counts the module as reached because the
      # container imports it; vulture counts the symbol as used because the
      # assignment uses it. That is how `archive_store` (#133) and `a2a_broker`
      # (#225) each survived audits and were found by grep. Scope is narrow on
      # purpose: the same check over every uncalled public export would seed at
      # 662 entries and teach banking (ADR-082526-1899).
      # `RATCHET_BASE_REV` names the revision this event is a change *from*.
      # Without it the checker fell back to `origin/develop`, and on a push to
      # `develop` that ref IS the pushed HEAD -- so the ledger was read out of
      # the commit under judgement, which is the self-approval this ratchet
      # exists to prevent (Codex, #534). A PR based on anything other than
      # `develop` was judged against the wrong branch for the same reason.
      #
      # On the push that creates a branch, `github.event.before` is git's null
      # SHA. That names no revision, so the checker falls through to the trunk
      # rather than failing every first push to a `feat/*` branch.
      - name: wiring reads ratchet (DI attributes nothing reads back)
        env:
          RATCHET_BASE_REV: >-
            ${{ github.event_name == 'pull_request'
                && github.event.pull_request.base.sha
                || github.event.before }}
        run: uv run python scripts/check-wiring-reads.py

      # ADR-032 says the registry cross-checks a document's declared contract
      # kinds against `@pytest.mark.contract` on the tests it lists. Nothing
      # consumed the marker, so 228 uses carried an enforcement that did not
      # exist (#345). A ledger rather than a plain assertion: the check fails
      # on a *new* unevidenced claim, and a fixed one must shrink the ledger.
      - name: contract marker ledger (ADR-032's cross-check, enforced)
        run: uv run python scripts/check-contract-markers.py

      # The reachability ratchet says *how much* is unwired; the convergence
      # matrix says *who owns what* and which subsystem each unreachable module
      # belongs to. It is the M0 planning surface (#28), so it is checked rather
      # than trusted: the rows must partition every production module, and each
      # row's unreachable *share* -- `none`/`few`/`some`/`most`/`all` -- is
      # recomputed from the same import graph. A row that drifts out of date is
      # a wrong plan, silently. The share rather than a transcribed `19/62`,
      # because the denominator moved whenever any PR added a module anywhere
      # (#605); `--census` prints the exact counts.
      - name: convergence matrix (subsystem ownership stays current)
        run: uv run python scripts/check-convergence-matrix.py

      # The baseline says a module is unreachable; this says what is to be done
      # about it. Without the pairing, 207 unexplained entries is a number people
      # learn to ignore rather than a plan (#33). CONNECT must name the root that
      # would reach it, RETIRE must name what replaces it -- a disposition with no
      # evidence is a shrug.
      - name: reachability dispositions (every unreachable module has an owner)
        run: uv run python scripts/check-reachability-dispositions.py

      # SECURITY.md was the one load-bearing document with no gate behind it --
      # no script and no workflow referenced it at all -- while making the
      # strongest claims in the repository about what the code does. It had
      # Known Limitation #1 backwards (three files named as having no SSRF
      # guard; all three had one), and the consequence was a second SSRF
      # implementation written because the first was documented as absent (#157).
      - name: security inventory (SECURITY.md's checkable claims match the code)
        run: uv run python scripts/check-security-inventory.py

      # Trivy and Grype covered two images. The repository has nine
      # Dockerfiles, and the one whose own header calls the browser surface
      # "the single largest remaining CVE source" was not among the two —
      # unnoticed because nothing enumerated them. This closes the set: every
      # Dockerfile carries a disposition, and a shipped one must name the jobs
      # that build and scan it (#346).
      - name: image inventory (every Dockerfile is dispositioned; shipped ones name live jobs)
        run: uv run python scripts/check-image-inventory.py

      # BACKLOG.md is the hand-maintained work-source of record until the DB
      # backlog is live (#50), and agents read it as well as people. The gate
      # reads its vocabulary out of the file's own legend tables, so a legend
      # and its usage cannot drift apart (#30).
      - name: backlog consistency (legends match usage; citations resolve)
        run: uv run python scripts/check-backlog-consistency.py

      # Measuring how far a completion claim outruns its evidence was the easy
      # half; failing when it moves is the half that holds a line (#31). Seven
      # debt counters, each may only go down, and an unbanked improvement fails
      # too so the ceiling cannot hold slack a later regression would spend.
      # --run-tests runs only the ~180 @pytest.mark.ac tests, not the suite.
      # One invocation, both checks. `--run-tests` executes the ~180 AC-marked
      # tests, and the script performs that run once before dispatching either
      # check — so splitting these across two steps re-collected the corpus and
      # re-ran every AC test a second time, doubling this gate's slowest part
      # and its flake exposure inside a 20-minute cap. Two questions, one
      # measurement.
      #
      # THE RATCHET says the repository did not get worse: ten debt counters
      # against a bound folded from quality/ac-state-notes/ at the base
      # revision, each may only go down, and an unbanked improvement fails too
      # so the ceiling cannot hold slack a later regression would spend. The
      # bound moved off one shared line in #585 because that line was rewritten
      # by every AC-proving PR and serialized the queue; the strictness is
      # unchanged.
      #
      # THE MANDATE says this change proved what it claimed, in two halves.
      # The criterion half: zero tolerance on criteria the PR creates or newly
      # claims. The chain half (ADR-082526-ef55): zero tolerance on absent links
      # it introduces — an orphan spec, a taken decision nothing implements, a
      # spec stating nothing checkable. Both compare against the base by
      # identity rather than by count, because a ceiling on totals lets a new
      # violation be paid for by an unrelated legacy fix. Legacy stays on the
      # ceilings either way.
      #
      # The ratchet's own tests read this database. Applying the chain here
      # rather than trusting the `postgres` job's copy keeps this job
      # self-contained: it is a required check and must not depend on another
      # job's side effects.
      - name: Apply migrations
        run: uv run alembic upgrade head

      # `--mandate` needs the immutable candidate base. A push has none, so a
      # push gets the ratchet alone; PR and merge-group candidates get mandate.
      - name: acceptance-state ratchet + mandate
        env:
          MANDATE_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: |
          if [ -n "$MANDATE_BASE_SHA" ]; then
            uv run python scripts/check-ac-state.py \
              --run-tests --ratchet --mandate "$MANDATE_BASE_SHA"
          else
            uv run python scripts/check-ac-state.py --run-tests --ratchet
          fi

      # ----- Pillar 4: types -----
      - name: mypy --strict
        run: uv run mypy --strict packages/maistro-core/src

      # Ratchet, matching the xenon/vulture pattern above — NOT advisory.
      #
      # This step used to be `pyright ... || echo "::warning::"`. The comment then
      # recorded a backlog of 17 findings and said "escalate once triaged to zero".
      # Measured 2026-07-26: 24 errors, 23 warnings. The backlog grew by 7 while
      # nobody could block on it, which is the whole case against a warning-only
      # gate: it cannot hold a line, so the line moves.
      #
      # mypy --strict above stays the hard 0-baseline type gate. This ratchet makes
      # pyright block on REGRESSION instead, so the count can only go down. Lower
      # PYRIGHT_BASELINE as findings are fixed; drop the ratchet for a plain
      # `pyright` invocation once it reaches 0.
      #
      # Known real bugs inside the baseline, tracked for a dedicated fix PR:
      # unawaited coroutines in cli/_builders_tui.py, possibly-unbound tool_result
      # in artificer, a dead import in agents/factory.py.
      - name: pyright (type cross-check — ratchet)
        env:
          # 24 -> 21: `register_node` was typed
          # `type[BaseNode[Any, Any]] -> type[BaseNode[Any, Any]]`, which erased
          # every decorated subclass's own `__init__`, so each
          # dependency-injected construction in `build_node_resolver` was
          # reported as `No parameter named ...`. Making the decorator generic
          # removed six findings (three that were in this baseline, three #147
          # would have added). Ratcheted rather than left slack, per the note
          # above -- 3 points of headroom is 3 regressions that land silently.
          PYRIGHT_BASELINE: 21
        run: |
          uv run pyright --outputjson packages/maistro-core/src > pyright.json || true
          count=$(uv run python -c "import json;print(json.load(open('pyright.json'))['summary']['errorCount'])")
          uv run pyright packages/maistro-core/src || true
          echo "pyright error count: $count (baseline: $PYRIGHT_BASELINE)"
          if [ "$count" -gt "$PYRIGHT_BASELINE" ]; then
            echo "::error::pyright regression — $count errors exceeds baseline of $PYRIGHT_BASELINE; fix the new findings (Boy Scout Rule)"
            exit 1
          fi

      # ----- Pillar 2: Hypothesis property tests -----
      # The property suite lives in formal/ (also run by formal-conformance.yml
      # on PRs; cheap enough to gate here too). The old `-m "scope: property"`
      # was invalid -m syntax, and no core tests carry a property scope marker.
      - name: Hypothesis property tests (formal/)
        env:
          PYTHONPATH: packages/maistro-core/src
        run: |
          uv run pytest formal/ --timeout=120 -q

      # ----- Pillar 7: architecture fitness functions -----
      # The convergence spine's central claim is that Run/NodeRun/Attempt is the
      # one execution identity. A second one arrives as an enum, not as a
      # decision — someone needs pending/running/failed and the repository
      # quietly has another lifecycle. Every work-state enum is classified in
      # quality/execution-lifecycles.json (#36).
      - name: execution lifecycles (no unclassified second spine)
        run: uv run python scripts/check-execution-lifecycles.py

      # Invariant 2 of #36 cannot be enforced as written yet: maistro.providers
      # is a registry with no HTTP client, so there is no approved Provider
      # implementation for a caller to be outside of. #56 builds it. What is
      # enforceable meanwhile is that the set of direct callers cannot grow.
      - name: model egress (the direct-caller set may only shrink)
        run: uv run python scripts/check-model-egress.py

      - name: Architecture fitness functions
        env:
          PYTHONPATH: packages/maistro-core/src
        # The directory guard was removed along with the warning it emitted:
        # while the suite did not exist, this pillar passed green having
        # asserted nothing, and would have silently gone back to doing so if
        # the directory were ever deleted. It is now a hard step.
        run: uv run pytest packages/maistro-core/tests/fitness -v --timeout=30

      # ----- Pillar 8: docstring coverage on touched modules -----
      # Per-module floors are RATCHET BASELINES set at measured coverage
      # (2026-06-10): regressions fail; raise the floor as docstrings land.
      # 95% everywhere is the Phase 15 push.
      - name: interrogate (docstring coverage ratchet)
        run: |
          uv run interrogate -f 38 packages/maistro-core/src/maistro/graph/nodes
          uv run interrogate -f 45 packages/maistro-core/src/maistro/graph/durable_runs
          uv run interrogate -f 63 packages/maistro-core/src/maistro/projects
          uv run interrogate -f 46 packages/maistro-core/src/maistro
