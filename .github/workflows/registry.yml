name: Registry CI

# Validate ADR/spec front-matter per engine#ADR-031.
# Warn-only during the rollout window (until 2026-06-07);
# Strict since 2026-07-27 (the ADR-031 30-day warn-only window closed
# 2026-06-06; measured before flipping: 268 files, 0 warnings).

on:
  # No `paths:` filter, deliberately (#162). This job validates the ADR -> spec
  # -> AC chain, which is the fifth of the five mandates #160 wants CI to hold,
  # so it has to be a *required* check. A required check whose workflow never
  # triggers never reports, and branch protection or a merge queue then waits
  # on an `Expected` status forever — so a paths-filtered check cannot be
  # required as-is. See docs/ci/REQUIRED-CHECKS.md.
  #
  # The filter was also already close to unfalsifiable: it had grown to include
  # `tests/**` and `packages/**/tests/**` (PR #479, for markers) plus
  # `pyproject.toml`, which between them match nearly every PR in this
  # repository. Removing it costs ~20s of runner time on the PRs it did not
  # already match, and buys a check that can be required by name.
  pull_request:
  merge_group:
    types: [checks_requested]
  push:
    branches:
      - main
      - integration
      - develop

permissions:
  contents: read

concurrency:
  group: registry-ci-${{ github.event.pull_request.number || github.event.merge_group.head_sha || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate ADR/spec front-matter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install minimal deps
        run: pip install -e ./packages/maistro-registry pytest

      - name: Run unit tests
        run: |
          pytest tests/tools/registry/ tests/tools/test_lint_lifecycle.py \
            --confcutdir=tests/tools \
            -p no:cacheprovider \
            -v

      - name: Lifecycle status machine (ADR-097)
        # Statuses, forward-only transitions (backwards only with a `reason`),
        # per-status required fields, and AC traceability for Tests Passing+
        # specs. Ratchets against quality/lifecycle-baseline.json in both
        # directions: new violations fail, and stale baseline entries fail
        # until pruned — the baseline can only shrink.
        run: python tools/lint_lifecycle.py

      - name: Validate ADR/spec front-matter (warn-only window)
        # `lint` is a strict superset of `walk`: same front-matter validation
        # via _load_walk_validation, plus supersedes/blocks cycle detection,
        # dangling cross-reference checks, and duplicate-ID detection — none of
        # which any workflow previously invoked, so those defects were ungated
        # across 118 ADRs and 151 specs. Verified clean at the time of this
        # change: 268 files, 0 errors, 0 warnings, 0 DAG/dangling findings.
        run: python -m maistro_registry.cli lint . --strict

      - name: Governing citations resolve to active authority (#374)
        # `lint` checks that a cited document exists. This checks that an
        # *active* document does not rest its authority on something that is
        # not itself active -- a Superseded ADR, a Deprecated one, or a
        # decision still merely Proposed. 47 such citations were already in the
        # corpus when this was turned on; they are baselined per-identity, so
        # no new one can land and each existing one stays visible.
        run: python scripts/check-citation-status.py

      - name: ADR-INDEX agrees with ADR front matter (#379)
        # The index was outside registry validation entirely, and 32 of its 82
        # rows carried a status the ADR's own front matter contradicted — every
        # one saying `Proposed` about a decision that had since been Accepted,
        # Deferred, Deprecated or Superseded, which inverts the signal the
        # index exists to carry. Front matter is canonical; the derived columns
        # are regenerated from it with `--fix`, and the reviewed columns
        # (`Summary`, `Ver`, `Last Modified`) are never touched.
        run: python scripts/check-adr-index.py
