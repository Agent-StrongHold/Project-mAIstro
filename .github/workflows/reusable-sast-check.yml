name: Reusable SAST check

on:
  workflow_call:
    inputs:
      check_name:
        description: Check label shown in the called job.
        required: true
        type: string
      command:
        description: Shell command that implements the check.
        required: true
        type: string
      install_command:
        description: Optional command for the tool used by the check.
        required: false
        default: ""
        type: string
      python_environment:
        description: Whether to install the locked Python environment.
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  check:
    name: ${{ inputs.check_name }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-uv
        if: inputs.python_environment
      - name: Setup Python 3.12
        if: inputs.python_environment
        run: uv python install 3.12
      - name: uv sync
        if: inputs.python_environment
        run: uv sync --locked --all-extras
      - name: Install SAST tool
        if: inputs.install_command != ''
        run: ${{ inputs.install_command }}
      - name: Run SAST check
        run: ${{ inputs.command }}
