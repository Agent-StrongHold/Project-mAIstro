name: Repair 276 legacy evidence compatibility

on:
  push:
    branches: [chatgpt/m1-237-run-derivation]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/m1-237-run-derivation
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: ./.github/actions/setup-uv
      - run: uv sync --locked --extra dev
      - name: Apply narrow compatibility repair and conformance coverage
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one replacement target, found {count}")
              file.write_text(text.replace(old, new), encoding="utf-8")

          guard = (
              "        # A completed row without accepted evidence predates AcceptedNodeOutcome.\n"
              "        # Let it reach transition_node_run's migration validator even after the\n"
              "        # parent closed; that validator permits only a matching evidence install\n"
              "        # and preserves all lifecycle fields.\n"
              "        if node_run.status is RunStatus.COMPLETED and node_run.accepted_outcome is None:\n"
              "            return\n"
          )

          replace_once(
              "packages/maistro-core/src/maistro/runs/store.py",
              "        run = self._runs.get(node_run.run_id)\n",
              guard + "        run = self._runs.get(node_run.run_id)\n",
          )
          replace_once(
              "packages/maistro-core/src/maistro/runs/sqlite_store.py",
              "        row = await self._fetchone(\n            \"SELECT status FROM canonical_runs WHERE run_id = ?\",\n            (node_run.run_id,),\n        )\n",
              guard
              + "        row = await self._fetchone(\n            \"SELECT status FROM canonical_runs WHERE run_id = ?\",\n            (node_run.run_id,),\n        )\n",
          )
          replace_once(
              "packages/maistro-core/src/maistro/runs/pg_store.py",
              "        run = Run.model_validate(\n            await self._locked(conn, \"canonical_runs\", \"run_id\", node_run.run_id)\n        )\n",
              guard
              + "        run = Run.model_validate(\n            await self._locked(conn, \"canonical_runs\", \"run_id\", node_run.run_id)\n        )\n",
          )

          anchor = '''async def test_a_child_run_cannot_cross_workspaces(spine: Any) -> None:\n'''
          test = '''async def test_legacy_completed_node_run_can_backfill_evidence_under_terminal_run(\n    spine: Any,\n) -> None:\n    store, _workspace, _project_id = spine\n    run = await _run(spine)\n    await store.transition_run(run.run_id, RunStatus.QUEUED)\n    await store.transition_run(run.run_id, RunStatus.RUNNING)\n    node_run = await store.create_node_run(run.run_id, node_id="node-1")\n    await store.transition_node_run(node_run.node_run_id, RunStatus.QUEUED)\n    await store.transition_node_run(node_run.node_run_id, RunStatus.RUNNING)\n    attempt = await store.create_attempt(node_run.node_run_id)\n    await store.transition_attempt(attempt.attempt_id, AttemptStatus.RUNNING)\n    terminal = await store.transition_attempt(\n        attempt.attempt_id, AttemptStatus.COMPLETED, result={"answer": "ok"}\n    )\n    completed = await store.transition_node_run(\n        node_run.node_run_id, RunStatus.COMPLETED, result=terminal.result\n    )\n    await store.transition_run(run.run_id, RunStatus.COMPLETED, result=completed.result)\n    outcome = AcceptedNodeOutcome(\n        node_run_id=node_run.node_run_id,\n        attempt_result=AttemptResult.from_attempt(terminal),\n        result=completed.result,\n    )\n\n    migrated = await store.transition_node_run(\n        node_run.node_run_id,\n        RunStatus.COMPLETED,\n        result=completed.result,\n        error=completed.error,\n        accepted_outcome=outcome,\n    )\n\n    assert migrated.status is RunStatus.COMPLETED\n    assert migrated.accepted_outcome == outcome\n    assert migrated.finished_at == completed.finished_at\n\n\n'''
          replace_once(
              "packages/maistro-core/tests/runs/test_spine_conformance.py",
              anchor,
              test + anchor,
          )
          PY
      - name: Format and lint repaired files
        run: |
          uv run ruff format \
            packages/maistro-core/src/maistro/runs/store.py \
            packages/maistro-core/src/maistro/runs/sqlite_store.py \
            packages/maistro-core/src/maistro/runs/pg_store.py \
            packages/maistro-core/src/maistro/runs/reconciliation.py \
            packages/maistro-core/src/maistro/runs/service.py \
            packages/maistro-core/src/maistro/tasks/execution.py \
            packages/maistro-core/tests/runs/test_run_terminal_derivation.py \
            packages/maistro-core/tests/runs/test_spine_conformance.py
          uv run ruff check \
            packages/maistro-core/src/maistro/runs/store.py \
            packages/maistro-core/src/maistro/runs/sqlite_store.py \
            packages/maistro-core/src/maistro/runs/pg_store.py \
            packages/maistro-core/src/maistro/runs/reconciliation.py \
            packages/maistro-core/src/maistro/runs/service.py \
            packages/maistro-core/src/maistro/tasks/execution.py \
            packages/maistro-core/tests/runs/test_run_terminal_derivation.py \
            packages/maistro-core/tests/runs/test_spine_conformance.py
      - name: Prove replay and store conformance
        run: >-
          uv run pytest
          packages/maistro-core/tests/runs/test_attempt_result_reconciliation.py
          packages/maistro-core/tests/runs/test_spine_conformance.py
          -q --tb=short
      - name: Commit only the verified repair and remove this helper
        run: |
          rm .github/workflows/ruff-format-diagnostic-276.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(runs): preserve legacy outcome backfill under terminal Run"
          git push origin HEAD:chatgpt/m1-237-run-derivation
