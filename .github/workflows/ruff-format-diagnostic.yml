name: Ruff format diagnostic

on:
  push:
    branches: [chatgpt/repair-ci-contract-after-gate-c]

permissions:
  contents: read

jobs:
  diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: ./.github/actions/setup-uv
      - run: uv sync --locked --extra dev
      - run: uv run ruff format --diff tests/test_m1_convergence_freeze.py
