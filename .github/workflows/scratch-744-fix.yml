name: Scratch 744 Fix Validation

on:
  push:
    branches:
      - chatgpt/scratch-744-diagnostics
    paths:
      - .github/workflows/scratch-744-fix.yml

permissions:
  contents: write

jobs:
  validate-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/scratch-744-diagnostics
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: ./.github/actions/setup-uv
      - run: uv sync --locked --extra dev --extra bootstrap
      - name: Apply resolver return annotation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('packages/maistro-core/src/maistro/builders/canonical_execution.py')
          text = path.read_text()
          before_import = 'from typing import TYPE_CHECKING, Any, ClassVar, Literal'
          after_import = 'from typing import TYPE_CHECKING, Any, Callable, ClassVar, Literal'
          before_sig = '    budget: IterationBudget,\n):\n    stages = {node.name: node for node in graph}'
          after_sig = '    budget: IterationBudget,\n) -> Callable[[str, Graph], BaseNode[Any, Any]]:\n    stages = {node.name: node for node in graph}'
          assert before_import in text
          assert before_sig in text
          path.write_text(text.replace(before_import, after_import).replace(before_sig, after_sig))
          PY
      - name: Validate
        run: |
          uv run mypy packages/maistro-core/src/maistro/builders/canonical_execution.py
          uv run pytest packages/maistro-core/tests/builders/test_canonical_execution.py -q
          uv run ruff check packages/maistro-core/src/maistro/builders/canonical_execution.py
          uv run ruff format --check packages/maistro-core/src/maistro/builders/canonical_execution.py
      - name: Persist validated blob
        shell: bash
        run: |
          git config user.name "maistro-diagnostics-bot"
          git config user.email "actions@users.noreply.github.com"
          git add packages/maistro-core/src/maistro/builders/canonical_execution.py
          git commit -m "Validate Builders resolver return annotation"
          git push origin HEAD:chatgpt/scratch-744-diagnostics
