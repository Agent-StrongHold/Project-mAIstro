# Security gate — SAST + supply chain + container scanning.
#
# Pillar 5 of the QA gate. The heavy bag (container build + scan) runs only on
# PR-to-main + main pushes + nightly. Lightweight SAST runs on every push.
#
# No DAST here. There was a `dast:` job that referenced a compose file that
# was never part of this repo, so it skipped every step and reported green
# while scanning nothing. The deployment stack it needs lives in the
# deployment repo; if DAST is wanted it belongs there, next to the compose
# file that defines the target.

name: security

# Least privilege: SAST/supply-chain/container scanning only read the repo.
# (Image signing was removed; if it returns, grant id-token: write on that job.)
permissions:
  contents: read

on:
  # No `branches:` filter. It used to be [main, integration, develop], which
  # matched on the PR's *base* — so a PR stacked on a feature branch ran none of
  # this. #151 and #138 got Registry CI and Formal Conformance only: no lint, no
  # types, no tests, no coverage, no SAST, no ratchet gates. The work was not
  # unreviewed, it was unmeasured, and every accumulated failure arrived at once
  # on retarget, against the branch least able to absorb it.
  #
  # Merge groups are first-class candidates: required security checks must run
  # on the synthetic SHA the queue will actually land.
  pull_request:
  merge_group:
    types: [checks_requested]
  push:
    # Every accepted topic-branch prefix (#381), single-sourced in
    # .github/branch-protection.json (topic_branch_policy) and validated by
    # tests/test_branch_policy.py. See quality.yml's push block for the rule.
    branches: [main, integration, develop, feat/*, bug/*, fix/*, idea/*, doc/*, chore/*]
  schedule:
    - cron: "30 7 * * *"

concurrency:
  group: security-${{ github.event.pull_request.number || github.event.merge_group.head_sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' }}

jobs:
  sast:
    name: SAST (bandit + semgrep + gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install uv + Python
        uses: ./.github/actions/setup-uv
      - name: Setup Python 3.12
        run: uv python install 3.12
      - name: uv sync
        run: uv sync --locked --all-extras
      - name: install SAST tools
        run: uv pip install bandit
      - name: bandit (zero Medium+ on OUR code)
        run: |
          uv run bandit -r packages/maistro-core/src packages/hive-conductor/backend \
                          packages/maistro-server/src \
                          -ll --confidence-level=medium -f json -o bandit.json || true
          uv run python -c "
          import json, sys
          data = json.load(open('bandit.json'))
          new = [r for r in data.get('results', []) if r.get('issue_severity') in {'MEDIUM','HIGH'}]
          if new:
              print(f'::error::bandit found {len(new)} Medium+ finding(s) — strict 0-baseline:')
              for r in new:
                  print(f'  {r[\"filename\"]}:{r[\"line_number\"]} [{r[\"test_id\"]}] {r[\"issue_text\"]}')
              sys.exit(1)
          print('bandit Medium+ count: 0 (strict gate)')
          "
      - name: semgrep (custom + p/security-audit + p/owasp-top-ten + p/secrets)
        run: |
          set -o pipefail
          uvx semgrep --metrics off \
            --config tools/semgrep/maistro-rules.yaml \
            --config p/security-audit \
            --config p/owasp-top-ten \
            --config p/secrets \
            --exclude 'packages/hive-conductor/eval' \
            --exclude 'packages/hive-conductor/cage' \
            --error packages/ tests/ 2>&1 | tee semgrep-report.txt
      - name: install gitleaks CLI
        run: |
          set -euo pipefail
          curl -sSfL -o gitleaks.tgz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tgz" | sha256sum --check
          tar -xzf gitleaks.tgz gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
      - name: gitleaks (full history on protected branches; changed range elsewhere)
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ] || [ "$EVENT_NAME" = "merge_group" ]; then
            gitleaks git --redact --log-opts="$BASE_SHA..$HEAD_SHA" .
          elif [ "$EVENT_NAME" = "push" ] && [ "$REF_NAME" != "main" ] && [ "$REF_NAME" != "integration" ] && [ "$REF_NAME" != "develop" ]; then
            if [ -n "$BEFORE_SHA" ] && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
              gitleaks git --redact --log-opts="$BEFORE_SHA..$HEAD_SHA" .
            else
              gitleaks git --redact --log-opts="$HEAD_SHA^..$HEAD_SHA" .
            fi
          else
            gitleaks git --redact --log-opts="--all" .
          fi

  supply-chain:
    name: Supply chain (pip-audit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Install uv + Python
        uses: ./.github/actions/setup-uv
      - name: Setup Python 3.12
        run: uv python install 3.12
      - name: uv sync
        run: uv sync --locked --all-extras
      - name: install supply-chain tools
        run: uv pip install pip-audit
      - name: pip-audit (strict; gate the known CVE list)
        run: |
          uv pip freeze --exclude-editable > /tmp/deps.txt
          uv run pip-audit --strict --format=json -r /tmp/deps.txt > pip-audit.json || true
          uv run python scripts/pip_audit_gate.py pip-audit.json

  containers:
    name: Container scan + SBOM + cosign
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # License and container evidence is required before code reaches either
    # protected development or release branch. Release tags are checked again
    # against their pushed digest in release.yml.
    if: >-
      (github.event_name == 'pull_request' && (github.base_ref == 'main' || github.base_ref == 'develop')) ||
      (github.event_name == 'merge_group' && (github.event.merge_group.base_ref == 'refs/heads/main' || github.event.merge_group.base_ref == 'refs/heads/develop')) ||
      (github.event_name == 'push' && github.ref == 'refs/heads/develop') ||
      github.event_name == 'schedule'
    env:
      CANDIDATE_TAG: ${{ github.event.pull_request.number || github.event.merge_group.head_sha || 'nightly' }}
    steps:
      - uses: actions/checkout@v7

      # Same scopes ci.yml's docker-build job writes to, so this main-only,
      # far rarer job (see the `if:` above) starts warm off whatever a
      # develop-targeted run already cached instead of building all four
      # images cold on a fresh runner.
      - uses: docker/setup-buildx-action@v3

      # `docker/build-push-action` exposes GitHub's runtime cache-auth
      # variables (ACTIONS_RUNTIME_TOKEN, ACTIONS_CACHE_URL) internally
      # before invoking buildx; a raw `docker buildx build` in a `run:` step
      # does not have them, so every `type=gha` cache reference below would
      # silently fail to authenticate and build with no cache (Codex, #684).
      # Docker's own documented fix: https://docs.docker.com/build/cache/backends/gha/#authentication
      - uses: crazy-max/ghaction-github-runtime@v4

      # Buildx's own driver has its own image store, isolated from the host
      # daemon -- no prepull step protects these fetches, so each build
      # retries itself via buildx-build-retry.sh (Codex, #683).
      - name: Build hive-conductor image
        run: >-
          scripts/buildx-build-retry.sh --
          -f packages/hive-conductor/Dockerfile
          -t "hive-conductor:pr-${CANDIDATE_TAG}"
          --build-arg VITE_POC_MODE=pm --build-arg VITE_BASE_PATH=/pm/
          --load --cache-from type=gha,scope=hive-conductor
          --cache-to type=gha,scope=hive-conductor,mode=max .
      - name: Build maistro-engine image
        run: >-
          scripts/buildx-build-retry.sh --
          -f Dockerfile -t "maistro-engine:pr-${CANDIDATE_TAG}"
          --load --cache-from type=gha,scope=engine
          --cache-to type=gha,scope=engine,mode=max .

      # The two images the inventory (quality/image-inventory.json) records as
      # DISTRIBUTED. Neither was built or scanned here before #346 -- including
      # the research image, whose own header calls the browser surface "the
      # single largest remaining CVE source". Being the reason the API image
      # could go near-zero-CVE is not the same as being clean; it is the
      # opposite, and it went unmeasured because nothing enumerated the images.
      - name: Build maistro-engine-research image
        run: >-
          scripts/buildx-build-retry.sh --
          -f Dockerfile.research -t "maistro-engine-research:pr-${CANDIDATE_TAG}"
          --load --cache-from type=gha,scope=engine-research
          --cache-to type=gha,scope=engine-research,mode=max .

      - name: Build maistro-rsi-runner image
        run: >-
          scripts/buildx-build-retry.sh --
          -f Dockerfile.rsi-runner -t "maistro-rsi-runner:pr-${CANDIDATE_TAG}"
          --load --cache-from type=gha,scope=rsi-runner
          --cache-to type=gha,scope=rsi-runner,mode=max .

      - name: Verify live Python packages supersede base-image SBOM inventory
        run: |
          docker run --rm --entrypoint python \
            "hive-conductor:pr-${CANDIDATE_TAG}" \
            -c "import importlib.metadata as m; from packaging.version import Version; assert Version(m.version('msgpack')) >= Version('1.2.1'), m.version('msgpack'); assert Version(m.version('setuptools')) >= Version('78.1.1'), m.version('setuptools'); print('live msgpack='+m.version('msgpack')+', setuptools='+m.version('setuptools'))"

      - name: Trivy scan (HIGH/CRITICAL only)
        # Keep Chainguard's embedded SBOMs intact. The checked-in YAML ignore is
        # deliberately version-scoped to the two stale Python package records
        # from the pre-overlay base environment. The step above proves the live
        # runtime has patched versions before those exact duplicate records are
        # filtered. All other vendor-SBOM, filesystem, OS and binary findings
        # remain blocking.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.73.0
          image-ref: hive-conductor:pr-${{ env.CANDIDATE_TAG }}
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
          trivyignores: .trivyignore.yaml

      # maistro-engine was built here and never scanned: no Trivy `image-ref`
      # named it and the Grype step did not either, while its own Dockerfile
      # header said in as many words "this image is NOT vuln-gated (only the
      # hive-conductor image is trivy/grype scanned)". It is a PUBLISHED image
      # -- release.yml pushes it -- so it is now gated like the rest (#346).
      - name: Trivy scan maistro-engine (HIGH/CRITICAL only)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.73.0
          image-ref: maistro-engine:pr-${{ env.CANDIDATE_TAG }}
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
          trivyignores: .trivyignore.yaml

      - name: Trivy scan maistro-engine-research (HIGH/CRITICAL only)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.73.0
          image-ref: maistro-engine-research:pr-${{ env.CANDIDATE_TAG }}
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
          trivyignores: .trivyignore.yaml

      - name: Trivy scan maistro-rsi-runner (HIGH/CRITICAL only)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.73.0
          image-ref: maistro-rsi-runner:pr-${{ env.CANDIDATE_TAG }}
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
          trivyignores: .trivyignore.yaml

      # One grype install, every image. `--only-fixed` on all of them, so a
      # finding here is always something a rebuild could actually resolve.
      - name: Grype scan (cross-check)
        run: |
          curl -sSfL -o grype.tgz https://github.com/anchore/grype/releases/download/v0.116.0/grype_0.116.0_linux_amd64.tar.gz
          echo "40aff724297312f91ea390d003bed8d8651c74cc7f5b26732db80b3a408d2fc5  grype.tgz" | sha256sum --check
          tar -xzf grype.tgz grype && sudo mv grype /usr/local/bin/
          for image in hive-conductor maistro-engine maistro-engine-research maistro-rsi-runner; do
            echo "::group::grype ${image}"
            grype "${image}:pr-${CANDIDATE_TAG}" \
              --fail-on high --only-fixed --output table
            echo "::endgroup::"
          done

      - name: Setup Node for frontend license surfaces
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            packages/hive-conductor/frontend/package-lock.json
            packages/maistro-canvas/frontend/package-lock.json

      # Build both bundles and materialise both npm trees. Scanning only the
      # workspace would miss the dependencies that Vite emits into a shipped
      # bundle; scanning only the bundle would lose package identities.
      - name: Build frontend license surfaces
        run: |
          set -euo pipefail
          (
            cd packages/hive-conductor/frontend
            npm ci
            npm run build
          )
          (
            cd packages/maistro-canvas/frontend
            npm ci
            npm run build
          )

      - name: Generate final-filesystem SBOMs and license inventory
        run: |
          set -euo pipefail
          curl -sSfL -o syft.tgz https://github.com/anchore/syft/releases/download/v1.49.0/syft_1.49.0_linux_amd64.tar.gz
          echo "7aa2f03ee92739cf643279ba3990548b9925d4e22cae13f46831ee62821147fe  syft.tgz" | sha256sum --check
          tar -xzf syft.tgz syft && sudo mv syft /usr/local/bin/
          mkdir -p license-sboms
          for image in hive-conductor maistro-engine maistro-engine-research maistro-rsi-runner; do
            syft "${image}:pr-${CANDIDATE_TAG}" -o cyclonedx-json > "license-sboms/${image}.json"
          done

          # The final image, not the frontend build stage, is the legal surface.
          container="license-hive-conductor"
          docker create --name "$container" "hive-conductor:pr-${CANDIDATE_TAG}" >/dev/null
          rm -rf /tmp/hive-conductor-dist
          docker cp "$container:/app/frontend/dist" /tmp/hive-conductor-dist
          docker rm "$container" >/dev/null
          syft dir:/tmp/hive-conductor-dist -o cyclonedx-json > license-sboms/hive-conductor-frontend-bundle.json
          syft dir:packages/hive-conductor/frontend -o cyclonedx-json > license-sboms/hive-conductor-npm-tree.json
          syft dir:packages/maistro-canvas/frontend/dist -o cyclonedx-json > license-sboms/canvas-frontend-bundle.json
          syft dir:packages/maistro-canvas/frontend -o cyclonedx-json > license-sboms/canvas-npm-tree.json

          python scripts/check-license-inventory.py \
            --policy quality/license-policy.json \
            --sbom maistro-engine=license-sboms/maistro-engine.json \
            --sbom hive-conductor=license-sboms/hive-conductor.json \
            --sbom maistro-engine-research=license-sboms/maistro-engine-research.json \
            --sbom maistro-rsi-runner=license-sboms/maistro-rsi-runner.json \
            --sbom hive-conductor-frontend-bundle=license-sboms/hive-conductor-frontend-bundle.json \
            --sbom canvas-frontend-bundle=license-sboms/canvas-frontend-bundle.json \
            --sbom hive-conductor-npm-tree=license-sboms/hive-conductor-npm-tree.json \
            --sbom canvas-npm-tree=license-sboms/canvas-npm-tree.json \
            --artifact maistro-engine=maistro-engine:pr-${CANDIDATE_TAG} \
            --artifact hive-conductor=hive-conductor:pr-${CANDIDATE_TAG} \
            --artifact maistro-engine-research=maistro-engine-research:pr-${CANDIDATE_TAG} \
            --artifact maistro-rsi-runner=maistro-rsi-runner:pr-${CANDIDATE_TAG} \
            --output license-inventory.json

      - name: Upload license inventory and SBOMs
        uses: actions/upload-artifact@v7
        with:
          name: license-inventory-${{ env.CANDIDATE_TAG }}
          path: |
            license-inventory.json
            license-sboms/
          if-no-files-found: error

      # Image signing was removed, not fixed: the old step ran `cosign sign`
      # against local Docker tags that were never pushed to a registry, so no
      # consumer could verify the signature. Reinstate it with a real registry
      # push and sign the pushed digest when that exists.
