name: Temporary final 352 quality probe

on:
  push:
    branches:
      - feat/352-unused-direct-deps

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/352-unused-direct-deps
      - uses: ./.github/actions/setup-uv
      - name: Verify dependency ratchet and quality integration
        run: |
          set -euo pipefail
          uv python install 3.12
          uv sync --locked --all-extras
          uv run ruff format scripts/check_direct_dependencies.py tests/test_check_direct_dependencies.py
          uv run ruff check scripts/check_direct_dependencies.py scripts/pip_audit_gate.py tests/test_check_direct_dependencies.py
          uv run ruff format --check scripts/check_direct_dependencies.py scripts/pip_audit_gate.py tests/test_check_direct_dependencies.py
          uv run pytest -q tests/test_check_direct_dependencies.py
          uv run python scripts/check_direct_dependencies.py
          uv run python scripts/check-reachability.py
          uv run python scripts/check-convergence-matrix.py
          rm .github/workflows/tmp-352-finalcheck.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/check_direct_dependencies.py tests/test_check_direct_dependencies.py .github/workflows/tmp-352-finalcheck.yml
          git commit -m "Finalize #352 dependency ratchet checks"
          git push origin HEAD:feat/352-unused-direct-deps
