name: Temporary recheck 352 dependency candidates

on:
  push:
    branches:
      - feat/352-unused-direct-deps

permissions:
  contents: write

jobs:
  recheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/352-unused-direct-deps
      - uses: ./.github/actions/setup-uv
      - name: Recheck dependency candidates
        run: |
          set -euo pipefail
          uv python install 3.12
          uv sync --locked --all-extras
          uv run ruff check --fix scripts/check_direct_dependencies.py tests/test_check_direct_dependencies.py
          uv run ruff format scripts/check_direct_dependencies.py tests/test_check_direct_dependencies.py
          uv run pytest -q tests/test_check_direct_dependencies.py
          uv run python scripts/check_direct_dependencies.py --list-unused || true
          rm .github/workflows/tmp-352-recheck.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/check_direct_dependencies.py tests/test_check_direct_dependencies.py .github/workflows/tmp-352-recheck.yml
          git commit -m "Refine #352 dependency candidate detection"
          git push origin HEAD:feat/352-unused-direct-deps
