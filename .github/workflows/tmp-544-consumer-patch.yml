name: temporary #544 container patch

on:
  push:
    branches:
      - chatgpt/m1-544-consumer-claim-recovery

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/m1-544-consumer-claim-recovery
          fetch-depth: 0
      - name: Apply exact consumer claim patch
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("packages/maistro-core/src/maistro/container.py")
          text = path.read_text()

          text = text.replace(
              "        from maistro.runs.consumption import (\n",
              "        from maistro.runs.consumer_claim import ConsumerClaimLost\n"
              "        from maistro.runs.consumption import (\n",
              1,
          )

          old = '''                try:\n                    claimed = await self.run_store.transition_run(run.run_id, RunStatus.RUNNING)\n                except Exception:\n                    # Another tick won the claim, or the Run moved on. Not ours.\n                    continue\n                try:\n                    await executor.execute(claimed)\n                except Exception:\n                    logger.warning(\n                        "admitted Run %s failed during consumption", run.run_id, exc_info=True\n                    )\n                    await self._settle_unstarted_consumption(run.run_id)\n                executed += 1\n'''
          new = '''                try:\n                    await executor.execute(run)\n                except ConsumerClaimLost:\n                    # Another tick won the atomic Run + NodeRun + Attempt claim.\n                    continue\n                except Exception:\n                    # Any execution that got past claim owns leased physical\n                    # evidence, so ordinary recovery owns a process loss here.\n                    logger.warning(\n                        "admitted Run %s failed during consumption", run.run_id, exc_info=True\n                    )\n                executed += 1\n'''
          if old not in text:
              raise SystemExit("old consumer claim block not found")
          text = text.replace(old, new, 1)

          text = text.replace(
              '''        Eligibility is `executable_by_consumer`: QUEUED, an allowlisted\n        admission source, one registered node. The claim is the QUEUED→RUNNING\n        lifecycle transition itself — the transition table is the mutex, so a\n        concurrent tick's loser skips instead of double-executing. A Run whose\n        node then fails is parked by the reconciler (the recovery\n        disposition's WAITING row), never silently retried by the next tick.\n''',
              '''        Eligibility is `executable_by_consumer`: QUEUED, an allowlisted\n        admission source, one registered node. Claiming atomically persists the\n        RUNNING Run, RUNNING NodeRun, and a leased CREATED Attempt; the Run row\n        is the cross-process mutex and the Attempt lease is the recovery proof.\n        A node failure is parked by the reconciler and never silently retried.\n''',
              1,
          )

          start = text.find("    async def _settle_unstarted_consumption(")
          end = text.find("    async def list_durable_triggers(", start)
          if start == -1 or end == -1:
              raise SystemExit("obsolete settlement helper not found")
          text = text[:start] + text[end:]
          path.write_text(text)
          PY
      - name: Commit real patch and remove temporary workflow
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/tmp-544-consumer-patch.yml
          git add packages/maistro-core/src/maistro/container.py
          git diff --cached --check
          git commit -m "fix: make schedule consumer claim physically recoverable"
          git push origin HEAD:chatgpt/m1-544-consumer-claim-recovery
