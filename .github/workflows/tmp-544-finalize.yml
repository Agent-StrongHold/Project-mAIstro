name: temporary #544 final proof

on:
  push:
    branches:
      - chatgpt/m1-544-consumer-claim-recovery
    paths:
      - .github/workflows/tmp-544-finalize.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/m1-544-consumer-claim-recovery
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - name: Apply remaining proof updates
        run: |
          python - <<'PY'
          from pathlib import Path

          claim = Path("packages/maistro-core/src/maistro/runs/consumer_claim.py")
          text = claim.read_text().replace(
              "from maistro.runs.evidence_json import decode_payload, json_of, model_of, model_of_json\n",
              "from maistro.runs.evidence_json import json_of, model_of, model_of_json\n",
              1,
          )
          claim.write_text(text)

          tests = Path("packages/maistro-core/tests/runs/test_consumer_claim_recovery.py")
          text = tests.read_text()
          if "test_hard_death_after_claim_recovers_through_ordinary_tick" not in text:
              text = text.replace("import contextlib\n", "import asyncio\nimport contextlib\nfrom datetime import timedelta\n", 1)
              text = text.replace(
                  "from maistro.runs.model import RunStatus\n",
                  "from maistro.runs.consumption import SCHEDULE_EXECUTOR_ID\n"
                  "from maistro.runs.consumer_claim import ConsumerClaimLost, ConsumerClaimStore\n"
                  "from maistro.runs.model import Attempt, AttemptStatus, RunStatus\n",
                  1,
              )
              text += '''\n\nasync def _claim(container: Container, run_id: str, *, ttl: timedelta) -> Attempt:\n    run = await container.run_store.get_run(run_id)\n    assert run is not None\n    store = container.run_store\n    assert isinstance(store, ConsumerClaimStore)\n    node_id = run.graph.materialize().nodes[0].node_id\n    claim = await store.claim_consumer_run(\n        run_id, node_id=node_id, runtime_id="test-runtime",\n        executor_id=SCHEDULE_EXECUTOR_ID, lease_ttl=ttl,\n    )\n    return claim.attempt\n\n\nasync def test_claim_is_run_node_and_leased_attempt_together() -> None:\n    container = await _container()\n    run_id = await _admit(container, workspace="leased-claim")\n    attempt = await _claim(container, run_id, ttl=timedelta(seconds=30))\n    run = await container.run_store.get_run(run_id)\n    node_runs = await container.run_store.list_node_runs(run_id)\n    assert run is not None and run.status is RunStatus.RUNNING\n    assert len(node_runs) == 1 and node_runs[0].status is RunStatus.RUNNING\n    assert attempt.status is AttemptStatus.CREATED\n    assert attempt.execution_lease is not None\n\n\nasync def test_hard_death_after_claim_recovers_through_ordinary_tick() -> None:\n    container = await _container()\n    run_id = await _admit(container, workspace="claim-death")\n    attempt = await _claim(container, run_id, ttl=timedelta(seconds=5))\n    lease = attempt.execution_lease\n    assert lease is not None and lease.expires_at is not None\n    assert await container.recover_abandoned_attempts(now=lease.expires_at + timedelta(microseconds=1)) == 1\n    settled = await container.run_store.get_attempt(attempt.attempt_id)\n    node_run = await container.run_store.get_node_run(attempt.node_run_id)\n    run = await container.run_store.get_run(run_id)\n    assert settled is not None and settled.status is AttemptStatus.CANCELLED\n    assert node_run is not None and node_run.status is RunStatus.WAITING\n    assert run is not None and run.status is RunStatus.WAITING\n\n\nasync def test_concurrent_claims_have_one_physical_winner() -> None:\n    container = await _container()\n    run_id = await _admit(container, workspace="claim-race")\n    results = await asyncio.gather(\n        _claim(container, run_id, ttl=timedelta(seconds=30)),\n        _claim(container, run_id, ttl=timedelta(seconds=30)),\n        return_exceptions=True,\n    )\n    assert sum(isinstance(item, Attempt) for item in results) == 1\n    assert sum(isinstance(item, ConsumerClaimLost) for item in results) == 1\n    node_runs = await container.run_store.list_node_runs(run_id)\n    assert len(node_runs) == 1\n    attempts = await container.run_store.list_attempts(node_runs[0].node_run_id)\n    assert len(attempts) == 1\n'''
              tests.write_text(text)

          tests = Path("packages/maistro-core/tests/runs/test_consumption.py")
          text = tests.read_text()
          start = text.index("async def test_a_lost_claim_is_skipped_rather_than_failed() -> None:")
          end = text.index("# --- the executor's own guards", start)
          replacement = '''async def test_a_lost_claim_is_skipped_rather_than_failed() -> None:\n    """The atomic claim race has one winner; the loser touches no state."""\n    from maistro.runs.consumer_claim import ConsumerClaimLost\n\n    container = await _container()\n    run_id = await _admit_schedule_run(container)\n\n    class _ClaimVeto(_Proxy):\n        async def claim_consumer_run(self, *args: Any, **kwargs: Any) -> Any:\n            raise ConsumerClaimLost("claimed by a concurrent tick")\n\n    container.run_store = _ClaimVeto(container.run_store)  # type: ignore[assignment]\n    assert await container.execute_admitted_runs() == 0\n    run = await container.run_store.get_run(run_id)\n    assert run is not None and run.status is RunStatus.QUEUED\n    assert await container.run_store.list_node_runs(run_id) == []\n\n\nasync def test_infrastructure_failure_is_physical_evidence_and_parks_waiting(\n    caplog: pytest.LogCaptureFixture,\n) -> None:\n    import logging\n    from maistro.runs.model import AttemptStatus\n\n    container = await _container()\n    run_id = await _admit_schedule_run(container, kind=_UnbuildableTickNode.kind)\n    with caplog.at_level(logging.WARNING):\n        executed = await container.execute_admitted_runs()\n    assert executed == 1\n    assert "failed during consumption" in caplog.text\n    run = await container.run_store.get_run(run_id)\n    assert run is not None and run.status is RunStatus.WAITING\n    (node_run,) = await container.run_store.list_node_runs(run_id)\n    (attempt,) = await container.run_store.list_attempts(node_run.node_run_id)\n    assert node_run.status is RunStatus.WAITING\n    assert attempt.status is AttemptStatus.FAILED\n    assert attempt.execution_lease is not None\n    assert "needs wiring" in (attempt.error or "")\n\n\n'''
          tests.write_text(text[:start] + replacement + text[end:])
          PY
      - name: Focused verification
        run: |
          uv sync --locked --extra dev
          uv run ruff check --fix packages/maistro-core/tests/runs/test_consumer_claim_recovery.py packages/maistro-core/tests/runs/test_consumption.py
          uv run ruff format packages/maistro-core/src/maistro/runs/consumer_claim.py packages/maistro-core/src/maistro/runs/consumption.py packages/maistro-core/tests/runs/test_consumer_claim_recovery.py packages/maistro-core/tests/runs/test_consumption.py
          uv run ruff check packages/maistro-core/src/maistro/runs/consumer_claim.py packages/maistro-core/src/maistro/runs/consumption.py packages/maistro-core/src/maistro/runs/execution.py packages/maistro-core/src/maistro/runs/wiring.py packages/maistro-core/src/maistro/container.py packages/maistro-core/tests/runs/test_consumer_claim_recovery.py packages/maistro-core/tests/runs/test_consumption.py
          uv run pytest packages/maistro-core/tests/runs/test_consumer_claim_recovery.py packages/maistro-core/tests/runs/test_consumption.py packages/maistro-core/tests/runs/test_recovery_events.py -q
      - name: Commit verified proof
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/tmp-544-finalize.yml .github/workflows/tmp-544-verify-v2.yml
          git add packages/maistro-core/src/maistro/runs/consumer_claim.py packages/maistro-core/src/maistro/runs/consumption.py packages/maistro-core/tests/runs/test_consumer_claim_recovery.py packages/maistro-core/tests/runs/test_consumption.py
          git diff --cached --check
          git commit -m "test: prove #544 leased claim recovery"
          git push origin HEAD:chatgpt/m1-544-consumer-claim-recovery
