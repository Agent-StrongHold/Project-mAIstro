name: temporary #544 canonical claim proof

on:
  push:
    branches:
      - chatgpt/m1-544-consumer-claim-recovery
    paths:
      - .github/workflows/tmp-544-verify-v2.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/m1-544-consumer-claim-recovery
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - name: Apply final #544 semantics
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              if text.count(old) != 1:
                  raise SystemExit(f"expected one match in {path}: {old[:90]!r}")
              p.write_text(text.replace(old, new, 1))

          claim = "packages/maistro-core/src/maistro/runs/consumer_claim.py"
          replace(
              claim,
              "from maistro.runs.evidence_json import decode_payload, json_of, model_of, model_of_json\n",
              "from maistro.runs.evidence_json import json_of, model_of, model_of_json\n",
          )
          replace(
              claim,
              "from maistro.runs.lifecycle import renewed_lease, transition_node_run, transition_run\n",
              "from maistro.runs.lifecycle import (\n"
              "    renewed_lease,\n"
              "    transition_attempt,\n"
              "    transition_node_run,\n"
              "    transition_run,\n"
              ")\n",
          )
          replace(
              claim,
              "from maistro.runs.model import Attempt, ExecutionLease, NodeRun, Run, RunStatus\n",
              "from maistro.runs.model import (\n"
              "    Attempt,\n"
              "    AttemptStatus,\n"
              "    ExecutionLease,\n"
              "    NodeRun,\n"
              "    Run,\n"
              "    RunStatus,\n"
              ")\n",
          )
          replace(
              claim,
              "    attempt = Attempt.model_validate(\n"
              "        {**attempt.model_dump(mode=\"python\"), \"execution_lease\": lease}\n"
              "    )\n"
              "    return ConsumerClaim(\n",
              "    attempt = Attempt.model_validate(\n"
              "        {**attempt.model_dump(mode=\"python\"), \"execution_lease\": lease}\n"
              "    )\n"
              "    # The physical execution claim is part of the same atomic write.\n"
              "    # Recovery must never observe logical RUNNING with only a not-yet-\n"
              "    # started physical record and have to infer whether execution began.\n"
              "    attempt = transition_attempt(attempt, AttemptStatus.RUNNING)\n"
              "    return ConsumerClaim(\n",
          )

          execution = "packages/maistro-core/src/maistro/runs/execution.py"
          replace(
              execution,
              "        \"\"\"Execute an atomically claimed leased CREATED Attempt.\n\n"
              "        The consumer claim transaction has already persisted RUNNING Run and\n"
              "        NodeRun rows beside this Attempt. Nothing here repeats that claim; the\n"
              "        remaining work is the physical CREATED→RUNNING edge and the same Runtime,\n"
              "        heartbeat, terminalization and reconciliation path used by ``execute``.\n"
              "        \"\"\"\n"
              "        if attempt.status is not AttemptStatus.CREATED:\n"
              "            raise RunIntegrityError(\"execute_claimed requires a CREATED Attempt\")\n"
              "        lease = attempt.execution_lease\n"
              "        if lease is None:\n"
              "            raise RunIntegrityError(\"claimed Attempt is missing its execution lease\")\n"
              "        token = lease.fencing_token\n"
              "        attempt = await self._store.transition_attempt(\n"
              "            attempt.attempt_id,\n"
              "            AttemptStatus.RUNNING,\n"
              "            fencing_token=token,\n"
              "        )\n",
              "        \"\"\"Execute a leased Attempt that already owns or is entering execution.\n\n"
              "        Atomic consumer claims arrive RUNNING because physical ownership is part\n"
              "        of the claim transaction. Ordinary callers still arrive CREATED after\n"
              "        persisting the lease first; this method advances only that compatibility\n"
              "        path before sharing Runtime, heartbeat and terminalization.\n"
              "        \"\"\"\n"
              "        lease = attempt.execution_lease\n"
              "        if lease is None:\n"
              "            raise RunIntegrityError(\"claimed Attempt is missing its execution lease\")\n"
              "        token = lease.fencing_token\n"
              "        if attempt.status is AttemptStatus.CREATED:\n"
              "            attempt = await self._store.transition_attempt(\n"
              "                attempt.attempt_id,\n"
              "                AttemptStatus.RUNNING,\n"
              "                fencing_token=token,\n"
              "            )\n"
              "        elif attempt.status is not AttemptStatus.RUNNING:\n"
              "            raise RunIntegrityError(\"execute_claimed requires an active Attempt\")\n",
          )

          consumption = "packages/maistro-core/src/maistro/runs/consumption.py"
          replace(
              consumption,
              "Run RUNNING + NodeRun RUNNING + a leased CREATED Attempt atomically. The Attempt\n"
              "is then executed through the same canonical Attempt service as every other\n",
              "Run RUNNING + NodeRun RUNNING + a leased RUNNING Attempt atomically. The exact\n"
              "Attempt is then executed through the same canonical service as every other\n",
          )
          replace(
              consumption,
              "        spec = self._single_node(run)\n        node = self._resolve(run, spec)\n        inputs = self._inputs(run, spec)\n",
              "        spec = self._single_node(run)\n        inputs = self._inputs(run, spec)\n",
          )
          replace(
              consumption,
              "        async def _run(_work_item: Any, context: Any) -> Any:\n            result = await node.run(inputs, context)\n",
              "        async def _run(_work_item: Any, context: Any) -> Any:\n"
              "            # Resolve after the atomic claim. Constructor/wiring failure is\n"
              "            # therefore physical Attempt evidence, not a bare RUNNING orphan.\n"
              "            node = self._resolve(run, spec)\n"
              "            result = await node.run(inputs, context)\n",
          )

          tests = Path("packages/maistro-core/tests/runs/test_consumer_claim_recovery.py")
          text = tests.read_text()
          if "test_hard_death_after_claim_recovers_through_ordinary_tick" not in text:
              text = text.replace(
                  "import contextlib\n",
                  "import asyncio\nimport contextlib\nfrom datetime import timedelta\n",
                  1,
              )
              text = text.replace(
                  "from maistro.runs.model import RunStatus\n",
                  "from maistro.runs.consumption import SCHEDULE_EXECUTOR_ID\n"
                  "from maistro.runs.consumer_claim import ConsumerClaimLost, ConsumerClaimStore\n"
                  "from maistro.runs.model import Attempt, AttemptStatus, RunStatus\n",
                  1,
              )
              text += '''\n\nasync def _claim(container: Container, run_id: str, *, ttl: timedelta) -> Attempt:\n    run = await container.run_store.get_run(run_id)\n    assert run is not None\n    store = container.run_store\n    assert isinstance(store, ConsumerClaimStore)\n    node_id = run.graph.materialize().nodes[0].node_id\n    claim = await store.claim_consumer_run(\n        run_id,\n        node_id=node_id,\n        runtime_id="test-runtime",\n        executor_id=SCHEDULE_EXECUTOR_ID,\n        lease_ttl=ttl,\n    )\n    return claim.attempt\n\n\nasync def test_claim_is_run_node_and_running_leased_attempt_together() -> None:\n    container = await _container()\n    run_id = await _admit(container, workspace="leased-claim")\n    attempt = await _claim(container, run_id, ttl=timedelta(seconds=30))\n    run = await container.run_store.get_run(run_id)\n    node_runs = await container.run_store.list_node_runs(run_id)\n    assert run is not None and run.status is RunStatus.RUNNING\n    assert len(node_runs) == 1 and node_runs[0].status is RunStatus.RUNNING\n    assert attempt.status is AttemptStatus.RUNNING\n    persisted = await container.run_store.get_attempt(attempt.attempt_id)\n    assert persisted is not None and persisted.status is AttemptStatus.RUNNING\n    assert attempt.execution_lease is not None\n    assert attempt.execution_lease.holder == SCHEDULE_EXECUTOR_ID\n    assert attempt.execution_lease.expires_at is not None\n\n\nasync def test_hard_death_after_claim_recovers_through_ordinary_tick() -> None:\n    container = await _container()\n    run_id = await _admit(container, workspace="claim-death")\n    attempt = await _claim(container, run_id, ttl=timedelta(seconds=5))\n    lease = attempt.execution_lease\n    assert lease is not None and lease.expires_at is not None\n    assert await container.recover_abandoned_attempts(\n        now=lease.expires_at + timedelta(microseconds=1)\n    ) == 1\n    settled = await container.run_store.get_attempt(attempt.attempt_id)\n    node_run = await container.run_store.get_node_run(attempt.node_run_id)\n    run = await container.run_store.get_run(run_id)\n    assert settled is not None and settled.status is AttemptStatus.CANCELLED\n    assert node_run is not None and node_run.status is RunStatus.WAITING\n    assert run is not None and run.status is RunStatus.WAITING\n    assert await container.recover_abandoned_attempts(\n        now=lease.expires_at + timedelta(seconds=1)\n    ) == 0\n\n\nasync def test_concurrent_claims_have_one_physical_winner() -> None:\n    container = await _container()\n    run_id = await _admit(container, workspace="claim-race")\n    results = await asyncio.gather(\n        _claim(container, run_id, ttl=timedelta(seconds=30)),\n        _claim(container, run_id, ttl=timedelta(seconds=30)),\n        return_exceptions=True,\n    )\n    assert sum(isinstance(item, Attempt) for item in results) == 1\n    assert sum(isinstance(item, ConsumerClaimLost) for item in results) == 1\n    node_runs = await container.run_store.list_node_runs(run_id)\n    assert len(node_runs) == 1\n    attempts = await container.run_store.list_attempts(node_runs[0].node_run_id)\n    assert len(attempts) == 1\n    assert attempts[0].status is AttemptStatus.RUNNING\n\n\nasync def test_normal_tick_completes_the_same_leased_attempt() -> None:\n    _EligibleNode.calls = 0\n    container = await _container()\n    run_id = await _admit(container, workspace="normal-leased-run")\n    assert await container.execute_admitted_runs(limit=1) == 1\n    (node_run,) = await container.run_store.list_node_runs(run_id)\n    (attempt,) = await container.run_store.list_attempts(node_run.node_run_id)\n    run = await container.run_store.get_run(run_id)\n    assert run is not None and run.status is RunStatus.COMPLETED\n    assert node_run.status is RunStatus.COMPLETED\n    assert attempt.status is AttemptStatus.COMPLETED\n    assert attempt.execution_lease is not None\n    assert attempt.execution_lease.expires_at is not None\n    assert _EligibleNode.calls == 1\n'''
              tests.write_text(text)

          tests = Path("packages/maistro-core/tests/runs/test_consumption.py")
          text = tests.read_text()
          start = text.index("async def test_a_lost_claim_is_skipped_rather_than_failed() -> None:")
          end = text.index("# --- the executor's own guards", start)
          replacement = '''async def test_a_lost_claim_is_skipped_rather_than_failed() -> None:\n    """The atomic claim race has one winner; the loser touches no state."""\n    from maistro.runs.consumer_claim import ConsumerClaimLost\n\n    container = await _container()\n    run_id = await _admit_schedule_run(container)\n    store = container.run_store\n\n    async def _veto(*args: Any, **kwargs: Any) -> Any:\n        raise ConsumerClaimLost("claimed by a concurrent tick")\n\n    store.claim_consumer_run = _veto  # type: ignore[attr-defined,method-assign]\n\n    assert await container.execute_admitted_runs() == 0\n    run = await store.get_run(run_id)\n    assert run is not None and run.status is RunStatus.QUEUED\n    assert await store.list_node_runs(run_id) == []\n\n\nasync def test_infrastructure_failure_is_physical_evidence_and_parks_waiting(\n    caplog: pytest.LogCaptureFixture,\n) -> None:\n    """A live-process constructor failure uses the same Attempt recovery path."""\n    import logging\n\n    from maistro.runs.model import AttemptStatus\n\n    container = await _container()\n    run_id = await _admit_schedule_run(container, kind=_UnbuildableTickNode.kind)\n\n    with caplog.at_level(logging.WARNING):\n        executed = await container.execute_admitted_runs()\n\n    assert executed == 1\n    assert "failed during consumption" in caplog.text\n    run = await container.run_store.get_run(run_id)\n    assert run is not None and run.status is RunStatus.WAITING\n    (node_run,) = await container.run_store.list_node_runs(run_id)\n    assert node_run.status is RunStatus.WAITING\n    (attempt,) = await container.run_store.list_attempts(node_run.node_run_id)\n    assert attempt.status is AttemptStatus.FAILED\n    assert attempt.execution_lease is not None\n    assert "needs wiring" in (attempt.error or "")\n\n\n'''
          tests.write_text(text[:start] + replacement + text[end:])
          PY
      - name: Format and focused verification
        run: |
          uv sync --locked --extra dev
          uv run ruff check --fix packages/maistro-core/tests/runs/test_consumer_claim_recovery.py packages/maistro-core/tests/runs/test_consumption.py
          uv run ruff format packages/maistro-core/src/maistro/runs/consumer_claim.py packages/maistro-core/src/maistro/runs/consumption.py packages/maistro-core/src/maistro/runs/execution.py packages/maistro-core/tests/runs/test_consumer_claim_recovery.py packages/maistro-core/tests/runs/test_consumption.py
          uv run ruff check packages/maistro-core/src/maistro/runs/consumer_claim.py packages/maistro-core/src/maistro/runs/consumption.py packages/maistro-core/src/maistro/runs/execution.py packages/maistro-core/src/maistro/runs/wiring.py packages/maistro-core/src/maistro/container.py packages/maistro-core/tests/runs/test_consumer_claim_recovery.py packages/maistro-core/tests/runs/test_consumption.py
          uv run pytest packages/maistro-core/tests/runs/test_consumer_claim_recovery.py packages/maistro-core/tests/runs/test_consumption.py packages/maistro-core/tests/runs/test_recovery_events.py -q
      - name: Commit verified implementation and remove workflow
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/tmp-544-verify-v2.yml
          git add packages/maistro-core/src/maistro/runs/consumer_claim.py packages/maistro-core/src/maistro/runs/consumption.py packages/maistro-core/src/maistro/runs/execution.py packages/maistro-core/tests/runs/test_consumer_claim_recovery.py packages/maistro-core/tests/runs/test_consumption.py
          git diff --cached --check
          git commit -m "fix: make consumer claim physical and recoverable"
          git push origin HEAD:chatgpt/m1-544-consumer-claim-recovery
