name: temporary #544 verify

on:
  push:
    branches:
      - chatgpt/m1-544-consumer-claim-recovery
    paths:
      - .github/workflows/tmp-544-verify.yml

permissions:
  contents: write

jobs:
  finish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/m1-544-consumer-claim-recovery
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - name: Apply guarded cleanup and acceptance proof
        run: |
          python - <<'PY'
          from pathlib import Path

          claim = Path('packages/maistro-core/src/maistro/runs/consumer_claim.py')
          text = claim.read_text()
          old = 'from maistro.runs.evidence_json import decode_payload, json_of, model_of, model_of_json\n'
          new = 'from maistro.runs.evidence_json import json_of, model_of, model_of_json\n'
          if text.count(old) != 1:
              raise SystemExit('consumer_claim import shape changed')
          claim.write_text(text.replace(old, new, 1))

          consumption = Path('packages/maistro-core/src/maistro/runs/consumption.py')
          text = consumption.read_text()
          old = '''        spec = self._single_node(run)\n        node = self._resolve(run, spec)\n        inputs = self._inputs(run, spec)\n        ctx = self._context(run, spec)\n        deadline_at = (\n'''
          new = '''        spec = self._single_node(run)\n        inputs = self._inputs(run, spec)\n        ctx = self._context(run, spec)\n        deadline_at = (\n'''
          if text.count(old) != 1:
              raise SystemExit('preclaim resolver shape changed')
          text = text.replace(old, new, 1)
          anchor = '''        claim = await self._claims.claim_consumer_run(\n            run.run_id,\n            node_id=spec.node_id,\n            runtime_id=self._runtime_id,\n            executor_id=SCHEDULE_EXECUTOR_ID,\n            lease_ttl=self._lease_ttl,\n            deadline_at=deadline_at,\n        )\n\n        async def _run'''
          replacement = '''        claim = await self._claims.claim_consumer_run(\n            run.run_id,\n            node_id=spec.node_id,\n            runtime_id=self._runtime_id,\n            executor_id=SCHEDULE_EXECUTOR_ID,\n            lease_ttl=self._lease_ttl,\n            deadline_at=deadline_at,\n        )\n        # Construction happens after the claim. A wired constructor can fail,\n        # and that failure must still leave leased physical evidence for the\n        # ordinary recovery tick rather than a bare RUNNING Run.\n        node = self._resolve(run, spec)\n\n        async def _run'''
          if text.count(anchor) != 1:
              raise SystemExit('claim anchor changed')
          consumption.write_text(text.replace(anchor, replacement, 1))

          tests = Path('packages/maistro-core/tests/runs/test_consumer_claim_recovery.py')
          text = tests.read_text()
          if 'test_hard_death_after_claim_recovers_through_ordinary_tick' not in text:
              text = text.replace('import contextlib\n', 'import asyncio\nimport contextlib\nfrom datetime import timedelta\n', 1)
              text = text.replace(
                  'from maistro.runs.model import RunStatus\n',
                  'from maistro.runs.consumption import SCHEDULE_EXECUTOR_ID\nfrom maistro.runs.model import Attempt, AttemptStatus, RunStatus\n',
                  1,
              )
              text = text.replace(
                  'from maistro.runs.sources import ADMISSION_SOURCE, SCHEDULE_SOURCE\n',
                  'from maistro.runs.consumer_claim import ConsumerClaimLost, ConsumerClaimStore\nfrom maistro.runs.sources import ADMISSION_SOURCE, SCHEDULE_SOURCE\n',
                  1,
              )
              text += '''\n\nasync def _claim(container: Container, run_id: str, *, ttl: timedelta) -> Attempt:\n    run = await container.run_store.get_run(run_id)\n    assert run is not None\n    store = container.run_store\n    assert isinstance(store, ConsumerClaimStore)\n    node_id = run.graph.materialize().nodes[0].node_id\n    claim = await store.claim_consumer_run(\n        run_id,\n        node_id=node_id,\n        runtime_id="test-runtime",\n        executor_id=SCHEDULE_EXECUTOR_ID,\n        lease_ttl=ttl,\n    )\n    return claim.attempt\n\n\nasync def test_claim_is_run_node_and_leased_attempt_together() -> None:\n    container = await _container()\n    run_id = await _admit(container, workspace="leased-claim")\n    attempt = await _claim(container, run_id, ttl=timedelta(seconds=30))\n\n    run = await container.run_store.get_run(run_id)\n    node_runs = await container.run_store.list_node_runs(run_id)\n    assert run is not None and run.status is RunStatus.RUNNING\n    assert len(node_runs) == 1 and node_runs[0].status is RunStatus.RUNNING\n    assert attempt.status is AttemptStatus.CREATED\n    assert attempt.execution_lease is not None\n    assert attempt.execution_lease.holder == SCHEDULE_EXECUTOR_ID\n    assert attempt.execution_lease.expires_at is not None\n\n\nasync def test_hard_death_after_claim_recovers_through_ordinary_tick() -> None:\n    container = await _container()\n    run_id = await _admit(container, workspace="claim-death")\n    attempt = await _claim(container, run_id, ttl=timedelta(seconds=5))\n    lease = attempt.execution_lease\n    assert lease is not None and lease.expires_at is not None\n\n    assert await container.recover_abandoned_attempts(\n        now=lease.expires_at + timedelta(microseconds=1)\n    ) == 1\n\n    settled = await container.run_store.get_attempt(attempt.attempt_id)\n    node_run = await container.run_store.get_node_run(attempt.node_run_id)\n    run = await container.run_store.get_run(run_id)\n    assert settled is not None and settled.status is AttemptStatus.CANCELLED\n    assert node_run is not None and node_run.status is RunStatus.WAITING\n    assert run is not None and run.status is RunStatus.WAITING\n    assert await container.recover_abandoned_attempts(\n        now=lease.expires_at + timedelta(seconds=1)\n    ) == 0\n\n\nasync def test_concurrent_claims_have_one_physical_winner() -> None:\n    container = await _container()\n    run_id = await _admit(container, workspace="claim-race")\n\n    results = await asyncio.gather(\n        _claim(container, run_id, ttl=timedelta(seconds=30)),\n        _claim(container, run_id, ttl=timedelta(seconds=30)),\n        return_exceptions=True,\n    )\n\n    assert sum(isinstance(item, Attempt) for item in results) == 1\n    assert sum(isinstance(item, ConsumerClaimLost) for item in results) == 1\n    node_runs = await container.run_store.list_node_runs(run_id)\n    assert len(node_runs) == 1\n    attempts = await container.run_store.list_attempts(node_runs[0].node_run_id)\n    assert len(attempts) == 1\n\n\nasync def test_normal_tick_completes_the_same_leased_attempt() -> None:\n    _EligibleNode.calls = 0\n    container = await _container()\n    run_id = await _admit(container, workspace="normal-leased-run")\n\n    assert await container.execute_admitted_runs(limit=1) == 1\n\n    (node_run,) = await container.run_store.list_node_runs(run_id)\n    (attempt,) = await container.run_store.list_attempts(node_run.node_run_id)\n    run = await container.run_store.get_run(run_id)\n    assert run is not None and run.status is RunStatus.COMPLETED\n    assert node_run.status is RunStatus.COMPLETED\n    assert attempt.status is AttemptStatus.COMPLETED\n    assert attempt.execution_lease is not None\n    assert attempt.execution_lease.expires_at is not None\n    assert _EligibleNode.calls == 1\n'''
              tests.write_text(text)
          PY
      - name: Format and focused verification
        run: |
          uv sync --locked --extra dev
          uv run ruff check --fix packages/maistro-core/tests/runs/test_consumer_claim_recovery.py
          uv run ruff format packages/maistro-core/src/maistro/runs/consumer_claim.py packages/maistro-core/src/maistro/runs/consumption.py packages/maistro-core/tests/runs/test_consumer_claim_recovery.py
          uv run ruff check packages/maistro-core/src/maistro/runs/consumer_claim.py packages/maistro-core/src/maistro/runs/consumption.py packages/maistro-core/src/maistro/runs/execution.py packages/maistro-core/src/maistro/runs/wiring.py packages/maistro-core/src/maistro/container.py packages/maistro-core/tests/runs/test_consumer_claim_recovery.py
          uv run pytest packages/maistro-core/tests/runs/test_consumer_claim_recovery.py packages/maistro-core/tests/runs/test_consumption.py packages/maistro-core/tests/runs/test_recovery_events.py -q
      - name: Commit verified implementation and remove workflow
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/tmp-544-verify.yml
          git add packages/maistro-core/src/maistro/runs/consumer_claim.py packages/maistro-core/src/maistro/runs/consumption.py packages/maistro-core/tests/runs/test_consumer_claim_recovery.py
          git diff --cached --check
          git commit -m "test: prove #544 leased claim recovery"
          git push origin HEAD:chatgpt/m1-544-consumer-claim-recovery
