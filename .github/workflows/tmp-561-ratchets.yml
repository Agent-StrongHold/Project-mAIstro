# Second push activates the helper workflow after registration.
name: tmp-561-ratchets

on:
  push:
    branches:
      - chatgpt/tmp-561-ratchets-current

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: ./.github/actions/setup-uv
      - run: uv sync --locked --extra dev
      - run: uv pip install --system vulture==2.16
      - name: Generate reviewed Vulture ledger
        run: python scripts/check-vulture-baseline.py --update packages/*/src --min-confidence 60 --exclude '*/third_party/*'
      - name: Generate maistro-server inventory delta
        run: python scripts/check-suite-inventory.py --update --suite packages/maistro-server/tests --note chatgpt-m1-38-project-scope-api-6451
      - name: Commit exact generator output and remove generator workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/tmp-561-ratchets.yml
          git add quality/vulture-baseline.json docs/testing/inventory-notes/chatgpt-m1-38-project-scope-api-6451.md
          git commit -m "chore: generate PR 561 quality ratchets"
          git push origin HEAD:${{ github.ref_name }}
