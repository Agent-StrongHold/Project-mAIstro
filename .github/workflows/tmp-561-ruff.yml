name: temp-561-ruff

on:
  push:
    branches:
      - chatgpt/tmp-561-ruff

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: 0.12.5
      - run: uv python install 3.12
      - run: uv sync --locked --all-extras
      - name: Print exact Ruff import fix
        run: |
          uv run ruff check --fix packages/maistro-server/src/maistro_server/api/projects.py packages/maistro-server/src/maistro_server/api/workspaces.py
          git diff -- packages/maistro-server/src/maistro_server/api/projects.py packages/maistro-server/src/maistro_server/api/workspaces.py
