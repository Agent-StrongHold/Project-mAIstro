name: temporary-640-format-wiring-test

on:
  push:
    paths:
      - .github/workflows/tmp-640-format-wiring-test.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/m1-544-consumer-claim-recovery
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: 0.12.5
      - run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          uv sync --locked --extra dev
          uv run ruff format packages/maistro-core/tests/runs/test_consumer_claim_wiring_contract.py
          uv run ruff format --check packages/maistro-core/tests/runs/test_consumer_claim_wiring_contract.py
          git rm .github/workflows/tmp-640-format-wiring-test.yml
          git add packages/maistro-core/tests/runs/test_consumer_claim_wiring_contract.py
          git commit -m 'style: apply Ruff to consumer claim wiring test'
          git push origin HEAD:chatgpt/m1-544-consumer-claim-recovery
