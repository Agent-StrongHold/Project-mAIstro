name: temporary #640 format

on:
  push:
    branches:
      - chatgpt/m1-544-consumer-claim-recovery
    paths:
      - .github/workflows/tmp-640-format.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/m1-544-consumer-claim-recovery
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - name: Format the two reported files
        run: |
          uv sync --locked --extra dev
          uv run ruff format packages/maistro-core/src/maistro/container.py packages/maistro-core/src/maistro/runs/pg_store.py
          uv run ruff format --check packages/maistro-core/src/maistro/container.py packages/maistro-core/src/maistro/runs/pg_store.py
          uv run ruff check packages/maistro-core/src/maistro/container.py packages/maistro-core/src/maistro/runs/pg_store.py
      - name: Commit formatting and remove carrier
        run: |
          git config user.name BlakeMatthews-dev
          git config user.email 270501485+BlakeMatthews-dev@users.noreply.github.com
          git rm .github/workflows/tmp-640-format.yml
          git add packages/maistro-core/src/maistro/container.py packages/maistro-core/src/maistro/runs/pg_store.py
          git diff --cached --check
          git commit -m "style: format #544 consumer claim changes"
          git push origin HEAD:chatgpt/m1-544-consumer-claim-recovery
