name: temporary #640 radon refactor

on:
  push:
    paths:
      - .github/workflows/tmp-640-radon-refactor.yml

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/m1-544-consumer-claim-recovery
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: 0.12.5
      - name: Install
        run: uv sync --locked --extra dev
      - name: Reduce list_by_status complexity without changing semantics
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('packages/maistro-core/src/maistro/runs/store.py')
          text = path.read_text()
          anchor = '''def run_cursor_key(run: Run) -> RunCursor:\n    """Stable oldest-first key using the exact durable JSON timestamp."""\n    created_at = run.model_dump(mode="json")["created_at"]\n    if not isinstance(created_at, str):\n        raise RunIntegrityError("Run.created_at did not serialize as JSON text")\n    return (created_at, run.run_id)\n\n\n'''
          helper = '''def _run_matches_status_scope(\n    run: Run, *, status: RunStatus, project_id: str | None\n) -> bool:\n    """Whether one Run belongs in a status/scope listing."""\n    return run.status is status and (project_id is None or run.project_id == project_id)\n\n\n'''
          if helper not in text:
              if anchor not in text:
                  raise SystemExit('run_cursor_key anchor changed; refusing to patch')
              text = text.replace(anchor, anchor + helper, 1)

          old = '''                if run.status is status and (project_id is None or run.project_id == project_id)\n'''
          new = '''                if _run_matches_status_scope(run, status=status, project_id=project_id)\n'''
          if old not in text:
              raise SystemExit('list_by_status filter changed; refusing to patch')
          text = text.replace(old, new, 1)
          path.write_text(text)
          PY
      - name: Format, lint, complexity, focused tests
        run: |
          uv run ruff format packages/maistro-core/src/maistro/runs/store.py
          uv run ruff check packages/maistro-core/src/maistro/runs/store.py
          uv run python scripts/check-radon-baseline.py
          uv run pytest packages/maistro-core/tests/runs/test_consumption.py -q
      - name: Commit validated refactor and remove temporary workflow
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/tmp-640-radon-refactor.yml
          git add packages/maistro-core/src/maistro/runs/store.py
          git commit -m "refactor: keep run listing below complexity ratchet"
          git pull --rebase origin chatgpt/m1-544-consumer-claim-recovery
          git push origin HEAD:chatgpt/m1-544-consumer-claim-recovery
