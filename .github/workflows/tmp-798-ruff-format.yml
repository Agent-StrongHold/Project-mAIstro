name: tmp-798-ruff-format

on:
  push:
    branches:
      - chatgpt/m1-129-pm-fleet-closeout
    paths:
      - .github/workflows/tmp-798-ruff-format.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/m1-129-pm-fleet-closeout
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Format exact #798 paths and self-remove
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet ruff==0.15.12
          ruff format \
            packages/hive-conductor/backend/services/dag_run_store.py \
            packages/hive-conductor/backend/services/engine.py \
            packages/hive-conductor/backend/tests/test_pm_poc_execution_retirement.py \
            packages/maistro-core/tests/agents/test_hyperagent.py \
            packages/maistro-core/tests/agents/test_pm_fleet_retirement.py \
            packages/maistro-core/tests/agents/test_program_hyperagent.py \
            packages/maistro-server/src/maistro_server/main.py \
            packages/maistro-server/tests/test_pm_poc_catalog_retirement.py
          rm .github/workflows/tmp-798-ruff-format.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m 'Apply pinned Ruff formatting for #798'
          git push origin HEAD:chatgpt/m1-129-pm-fleet-closeout
