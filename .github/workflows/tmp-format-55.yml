name: Temporary format 55

on:
  push:
    branches:
      - feat/55-direct-effect-inventory

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/55-direct-effect-inventory
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.12.5"
      - name: Format and remove temporary workflow
        run: |
          uvx --from ruff==0.15.12 ruff format scripts/check_direct_effects.py tests/test_check_direct_effects.py
          rm .github/workflows/tmp-format-55.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/check_direct_effects.py tests/test_check_direct_effects.py .github/workflows/tmp-format-55.yml
          git commit -m "Format #55 direct-effect analyzer"
          git push origin HEAD:feat/55-direct-effect-inventory
