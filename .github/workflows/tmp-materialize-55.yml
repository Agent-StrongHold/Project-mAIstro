name: Temporary materialize final 55 inventory

on:
  push:
    branches:
      - feat/55-direct-effect-inventory

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/55-direct-effect-inventory
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Materialize final analyzer and inventory
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path("scripts/check_direct_effects.py")
          text = path.read_text()

          scan_pattern = re.compile(
              r"def _production_python_files\(root: Path = ROOT\) -> list\[Path\]:\n"
              r".*?    return sorted\(set\(files\)\)\n",
              re.DOTALL,
          )
          scan_replacement = '''_EXCLUDED_PRODUCTION_FILES = frozenset(
              {
                  # Standalone developer hill-climb driver, invoked manually rather than shipped
                  # as an application/runtime path.
                  "packages/hive-conductor/run_hill_climb.py",
              }
          )


          def _production_python_files(root: Path = ROOT) -> list[Path]:
              """Return shipped package Python, excluding tests and explicit dev utilities."""
              packages = root / "packages"
              if not packages.exists():
                  return []
              files: list[Path] = []
              for candidate in packages.rglob("*.py"):
                  rel = candidate.relative_to(root)
                  if "tests" in rel.parts or candidate.name.startswith("test_"):
                      continue
                  if rel.as_posix() in _EXCLUDED_PRODUCTION_FILES:
                      continue
                  files.append(candidate)
              return sorted(files)
          '''
          text, count = scan_pattern.subn(scan_replacement, text, count=1)
          if count != 1:
              raise SystemExit(f"production scan replacement count={count}")

          helper_anchor = "def _string_parts(\n"
          helpers = '''def _environment_default_parts(
              node: ast.Call,
              bindings: dict[str, ast.expr],
              seen: frozenset[str],
          ) -> tuple[str, ...]:
              """Return literal default fragments for supported environment lookups."""
              if _dotted(node.func) not in {"os.environ.get", "os.getenv"}:
                  return ()
              default: ast.expr | None = node.args[1] if len(node.args) >= 2 else None
              if default is None:
                  for keyword in node.keywords:
                      if keyword.arg == "default":
                          default = keyword.value
                          break
              if default is None:
                  return ()
              return _string_parts(default, bindings, seen)


          def _joined_string_parts(
              node: ast.JoinedStr,
              bindings: dict[str, ast.expr],
              seen: frozenset[str],
          ) -> tuple[str, ...]:
              """Resolve literal fragments from an f-string without evaluating expressions."""
              parts: list[str] = []
              for value in node.values:
                  if isinstance(value, ast.Constant) and isinstance(value.value, str):
                      parts.append(value.value)
                  elif isinstance(value, ast.FormattedValue):
                      parts.extend(_string_parts(value.value, bindings, seen))
              return tuple(parts)


          '''
          if helper_anchor not in text:
              raise SystemExit("string-parts helper anchor not found")
          text = text.replace(helper_anchor, helpers + helper_anchor, 1)

          joined_pattern = re.compile(
              r"    if isinstance\(node, ast\.JoinedStr\):\n"
              r"        parts: list\[str\] = \[\]\n"
              r".*?        return tuple\(parts\)\n",
              re.DOTALL,
          )
          joined_replacement = (
              "    if isinstance(node, ast.JoinedStr):\n"
              "        return _joined_string_parts(node, bindings, seen)\n"
          )
          text, count = joined_pattern.subn(joined_replacement, text, count=1)
          if count != 1:
              raise SystemExit(f"joined-string replacement count={count}")

          binop = "    if isinstance(node, ast.BinOp) and isinstance(node.op, ast.Add):\n"
          call_block = (
              "    if isinstance(node, ast.Call):\n"
              "        return _environment_default_parts(node, bindings, seen)\n"
          )
          if binop not in text:
              raise SystemExit("binop insertion point not found")
          text = text.replace(binop, call_block + binop, 1)

          rules = '''    (
              "packages/maistro-canvas/frontend/server/mcp/image_provider.py",
              "_generate_cloudflare",
              "httpx.post",
          ): ("MODEL_EFFECT", "cloudflare-image-http"),
              (
                  "packages/maistro-canvas/frontend/server/mcp/image_provider.py",
                  "_generate_azure",
                  "httpx.post",
              ): ("MODEL_EFFECT", "azure-openai-image-http"),
              (
                  "packages/maistro-canvas/frontend/server/mcp/image_provider.py",
                  "_generate_gemini",
                  "httpx.post",
              ): ("MODEL_EFFECT", "gemini-image-http"),
          '''
          start = text.index("_PATH_CALLS:")
          end = text.index("\n}\n\n\n@dataclass(frozen=True)\nclass Site", start)
          text = text[:end] + "\n" + rules.rstrip() + text[end:]
          path.write_text(text)

          tests = Path("tests/test_check_direct_effects.py")
          current = tests.read_text()
          if "test_environment_default_model_endpoint_is_detected" not in current:
              current += '''

          def test_environment_default_model_endpoint_is_detected(gate) -> None:
              source = """
          import os
          import httpx
          def ask():
              return httpx.post(f"{base}{os.environ.get('LLM_CHAT_PATH', '/v1/chat/completions')}")
          """
              sites = gate.analyze_source(source)
              assert [(site.category, site.entry_point) for site in sites] == [
                  ("MODEL_EFFECT", "openai-compatible-http"),
              ]


          def test_non_src_package_python_is_scanned_but_explicit_dev_utility_is_not(gate, tmp_path) -> None:
              shipped = tmp_path / "packages/demo/frontend/server/mcp/effect.py"
              shipped.parent.mkdir(parents=True)
              shipped.write_text("pass\\n")
              test_file = tmp_path / "packages/demo/tests/test_effect.py"
              test_file.parent.mkdir(parents=True)
              test_file.write_text("pass\\n")
              excluded = tmp_path / "packages/hive-conductor/run_hill_climb.py"
              excluded.parent.mkdir(parents=True)
              excluded.write_text("pass\\n")
              found = {
                  item.relative_to(tmp_path).as_posix()
                  for item in gate._production_python_files(tmp_path)
              }
              assert found == {"packages/demo/frontend/server/mcp/effect.py"}


          def test_curated_image_provider_http_is_detected_without_generic_http_matching(gate) -> None:
              source = """
          import httpx
          def _generate_gemini(url):
              return httpx.post(url, json={})
          """
              sites = gate.analyze_source(
                  source,
                  "packages/maistro-canvas/frontend/server/mcp/image_provider.py",
              )
              assert [(site.category, site.entry_point) for site in sites] == [
                  ("MODEL_EFFECT", "gemini-image-http"),
              ]
          '''
              tests.write_text(current)
          PY

          python -m pip install -q pytest ruff
          ruff format scripts/check_direct_effects.py tests/test_check_direct_effects.py
          ruff check scripts/check_direct_effects.py tests/test_check_direct_effects.py
          python scripts/check_direct_effects.py --update

          python - <<'PY'
          from pathlib import Path
          import json

          inventory = Path("quality/direct-effect-call-sites.json")
          payload = json.loads(inventory.read_text())
          for site_id, entry in payload["sites"].items():
              category = entry["category"]
              source = entry["path"]
              if category == "CANONICAL_INVOCATION":
                  disposition, owner = "INTENTIONAL_LIBRARY/INFRASTRUCTURE", "#55"
                  rationale = "Canonical capabilities-layer Invocation plumbing; this is the governed seam, not a bypass."
              elif category == "HARNESS_EFFECT":
                  disposition, owner = "INTENTIONAL_LIBRARY/INFRASTRUCTURE", "#56"
                  rationale = "Terminal harness/provider lifecycle egress inside capabilities infrastructure; #56 owns governed caller convergence."
              elif source == "packages/maistro-evolve/src/maistro_evolve/providers/openai_compatible.py":
                  disposition, owner = "INTENTIONAL_LIBRARY/INFRASTRUCTURE", "#56"
                  rationale = "Terminal model-provider adapter egress; #56 owns ensuring callers reach it through governed Binding/Invocation."
              elif source.startswith("packages/maistro-canvas/frontend/server/mcp/"):
                  disposition, owner = "MIGRATE_TO_GOVERNED_INVOCATION", "#59"
                  rationale = "Canvas MCP-hosted model/provider effect bypasses canonical authorization; #59 owns MCP convergence using #56 model egress."
              elif category == "TOOL_EFFECT":
                  disposition, owner = "MIGRATE_TO_GOVERNED_INVOCATION", "#57"
                  rationale = "Shipped tool call can cause an external effect without an Invocation record; #57 owns governed tool execution."
              elif category == "MCP_EFFECT":
                  disposition, owner = "MIGRATE_TO_GOVERNED_INVOCATION", "#59"
                  rationale = "Direct MCP call bypasses canonical authorization/Invocation; #59 owns governed MCP ingress and egress."
              elif category == "MODEL_EFFECT":
                  disposition, owner = "MIGRATE_TO_GOVERNED_INVOCATION", "#56"
                  rationale = "Shipped model call bypasses canonical Provider/Binding/Invocation execution; #56 owns governed model egress."
              else:
                  raise SystemExit(f"unclassified {site_id}: {category}")
              entry["disposition"] = disposition
              entry["owner"] = owner
              entry["rationale"] = rationale
          inventory.write_text(json.dumps(payload, indent=2) + "\n")
          PY

          python scripts/check_direct_effects.py
          python scripts/check-model-egress.py
          rm -rf /tmp/maistro55
          mkdir -p /tmp/maistro55/tests /tmp/maistro55/scripts
          cp tests/test_check_direct_effects.py /tmp/maistro55/tests/
          cp scripts/check_direct_effects.py /tmp/maistro55/scripts/
          python -m pytest -q --rootdir=/tmp/maistro55 /tmp/maistro55/tests/test_check_direct_effects.py

          rm .github/workflows/tmp-materialize-55.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/check_direct_effects.py tests/test_check_direct_effects.py quality/direct-effect-call-sites.json .github/workflows/tmp-materialize-55.yml
          git commit -m "Complete #55 direct-effect inventory classification"
          git push origin HEAD:feat/55-direct-effect-inventory
