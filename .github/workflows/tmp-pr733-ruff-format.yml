name: tmp-pr733-ruff-format

on:
  push:
    branches:
      - chatgpt/issue-51-evolve-canonical-runs

permissions:
  contents: write

jobs:
  format-commit:
    if: ${{ !contains(github.event.head_commit.message, '[ruff-formatted]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/issue-51-evolve-canonical-runs
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: 0.12.5
      - name: Commit exact Ruff 0.15.12 formatting
        run: |
          uvx --from ruff==0.15.12 ruff format \
            packages/hive-conductor/backend/services/evolution_graph.py \
            packages/hive-conductor/backend/tests/test_evolution_canonical_graph.py
          git diff --check
          if git diff --quiet -- \
            packages/hive-conductor/backend/services/evolution_graph.py \
            packages/hive-conductor/backend/tests/test_evolution_canonical_graph.py; then
            echo 'Already formatted'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            packages/hive-conductor/backend/services/evolution_graph.py \
            packages/hive-conductor/backend/tests/test_evolution_canonical_graph.py
          git commit -m 'Apply exact Ruff formatting for #733 [ruff-formatted]'
          git push origin HEAD:chatgpt/issue-51-evolve-canonical-runs
