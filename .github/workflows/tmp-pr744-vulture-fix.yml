name: tmp-pr744-vulture-fix

on:
  push:
    branches:
      - chatgpt/m1-734-builders-canonical-runs

permissions:
  contents: write

jobs:
  apply-fix:
    if: ${{ !contains(github.event.head_commit.message, '[vulture-fixed]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/m1-734-builders-canonical-runs
      - name: Apply reviewed Vulture fixes and remove helper
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('packages/maistro-core/src/maistro/builders/canonical_execution.py')
          text = path.read_text()
          changes = {
              'def resolve(node_id: str, canonical_graph: Graph) -> BaseNode[Any, Any]:':
                  'def resolve(node_id: str, _canonical_graph: Graph) -> BaseNode[Any, Any]:',
              '    run.canonical_run_id = record.run_id\n    latest_by_stage = _latest_stage_runs(record)':
                  '    latest_by_stage = _latest_stage_runs(record)',
              '            run_id=admitted.run_id,':
                  '            run_id=run.canonical_run_id,',
          }
          for old, new in changes.items():
              if old not in text:
                  raise SystemExit(f'missing expected source fragment: {old!r}')
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY
          rm .github/workflows/tmp-pr744-vulture-fix.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/maistro-core/src/maistro/builders/canonical_execution.py .github/workflows/tmp-pr744-vulture-fix.yml
          git commit -m 'Remove Builders Vulture findings (#734) [vulture-fixed]'
          git push origin HEAD:chatgpt/m1-734-builders-canonical-runs
