name: Temporary Ruff Format Diff

on:
  pull_request:

permissions:
  contents: read

jobs:
  format-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-uv
      - run: uv sync --locked --extra dev
      - name: Show canonical Ruff formatting diff
        run: |
          uv run ruff format --diff \
            scripts/check-ratchet-provenance.py \
            scripts/check_mutation_baseline.py \
            tests/test_m1_542_review_regressions.py || true
