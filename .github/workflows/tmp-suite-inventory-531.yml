name: "Temporary #531 Suite Inventory Generator"

on:
  push:
    branches: [chatgpt/tmp-531-suite-inventory]
    paths:
      - .github/workflows/tmp-suite-inventory-531.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: ./.github/actions/setup-uv
      - name: Install collection dependencies
        run: |
          uv sync --locked --extra dev --extra bootstrap
          uv pip install --system -r packages/hive-conductor/backend/requirements.txt
      - name: "Generate #531 inventory delta"
        run: python scripts/check-suite-inventory.py --update --note 531-pm-fleet-persona-authority
      - name: Explain the inventory movement
        run: |
          cat >> docs/testing/inventory-notes/531-pm-fleet-persona-authority.md <<'EOF'

          The PM Fleet Persona-authority slice expands maistro-core coverage for canonical Persona-backed roster data, fail-closed parity validation, runtime catalog projection, compatibility properties, and preserved delegation/product-routing behavior. This note records only the resulting collected-node-ID movement.
          EOF
      - name: Commit generated note on temporary branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/testing/inventory-notes/531-pm-fleet-persona-authority.md
          git diff --cached --exit-code && exit 1 || true
          git commit -m "Generate #531 suite inventory delta"
          git push origin HEAD:chatgpt/tmp-531-suite-inventory
