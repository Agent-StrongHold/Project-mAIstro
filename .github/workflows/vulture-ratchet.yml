name: Vulture Ratchet

on:
  pull_request:

permissions:
  contents: write

jobs:
  exact-debt-ledger:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/tmp-561-vulture-rebuilt
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: ./.github/actions/setup-uv
      - name: Install pinned analyzer
        run: uv pip install --system vulture==2.16
      - name: Generate exact reviewed Vulture identities
        run: >-
          python scripts/check-vulture-baseline.py --update
          packages/*/src
          --min-confidence 60
          --exclude '*/third_party/*'
      - name: Commit generated ledger
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add quality/vulture-baseline.json
          git diff --cached --quiet && exit 0
          git commit -m "chore: regenerate exact Vulture ledger"
          git push origin HEAD:chatgpt/tmp-561-vulture-rebuilt
