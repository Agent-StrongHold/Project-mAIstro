name: TEMP Format #759

on:
  pull_request:

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/tmp-759-ruff-format
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: ./.github/actions/setup-uv
      - run: uv sync --locked --all-extras
      - name: Format exact acceptance file
        run: uv run ruff format packages/hive-conductor/backend/tests/test_scheduler_canonical_admission.py
      - name: Commit formatter output
        run: |
          if git diff --quiet; then
            echo "already formatted"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/hive-conductor/backend/tests/test_scheduler_canonical_admission.py
          git commit -m "temp: apply pinned Ruff to #759 acceptance test"
          git push origin HEAD:chatgpt/tmp-759-ruff-format
