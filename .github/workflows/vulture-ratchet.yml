name: TEMP Vulture Generator

on:
  push:
    branches: [chatgpt/tmp-523-vulture-current]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/tmp-523-vulture-current
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: ./.github/actions/setup-uv
      - name: Install pinned analyzer
        run: uv pip install --system vulture==2.16
      - name: Generate exact reviewed Vulture identities
        run: >-
          python scripts/check-vulture-baseline.py
          --update
          packages/*/src
          --min-confidence 60
          --exclude '*/third_party/*'
      - name: Commit generated ledger
        run: |
          if git diff --quiet -- quality/vulture-baseline.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add quality/vulture-baseline.json
          git commit -m "chore: generate exact PR 523 vulture ledger"
          git push origin HEAD:chatgpt/tmp-523-vulture-current
