name: Vulture Ratchet

on:
  pull_request:

permissions:
  contents: write

jobs:
  exact-vulture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/tmp-636-vulture-current
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: ./.github/actions/setup-uv
      - run: uv pip install --system vulture==2.16
      - name: Generate exact reviewed ledger
        run: |
          python scripts/check-vulture-baseline.py --update packages/*/src --min-confidence 60 --exclude '*/third_party/*'
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add quality/vulture-baseline.json
          git commit -m "chore: prune consumed schedule resolver Vulture debt"
          git push origin HEAD:chatgpt/tmp-636-vulture-current
