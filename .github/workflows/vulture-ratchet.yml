name: Vulture Ratchet

on:
  pull_request:

permissions:
  contents: write

jobs:
  rebuild-636:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/tmp-636-rebuild-current
          fetch-depth: 0
      - name: Replay proven #545 delta onto current develop
        run: |
          set -euo pipefail
          git fetch origin claude/issue-545-schedule-node-fidelity
          cp packages/maistro-core/src/maistro/container.py /tmp/develop-container.py
          git checkout origin/claude/issue-545-schedule-node-fidelity -- \
            docs/specs/SPEC-082926-d90e-schedule-consumer-node-fidelity.md \
            docs/testing/inventory-notes/claude-issue-545-schedule-node-fidelity-cb03.md \
            packages/maistro-core/src/maistro/container.py \
            packages/maistro-core/src/maistro/runs/consumption.py \
            packages/maistro-core/src/maistro/runs/execution.py \
            packages/maistro-core/src/maistro/runs/model.py \
            packages/maistro-core/src/maistro/runs/reconciliation.py \
            packages/maistro-core/src/maistro/runs/service.py \
            packages/maistro-core/tests/runs/test_consumption_node_fidelity.py \
            packages/maistro-core/tests/runs/test_yield_disposition_edges.py \
            quality/ac-state-notes/claude-issue-545-schedule-node-fidelity.json
          python - <<'PY'
          from pathlib import Path

          path = Path("packages/maistro-core/src/maistro/container.py")
          text = path.read_text()
          develop = Path("/tmp/develop-container.py").read_text()
          marker = "        embedding_client=embeddings,\n"
          if marker in develop and marker not in text:
              needle = "        outcome_store=outcome_store,\n        project_store=project_store,\n"
              replacement = needle + (
                  "        # The same client #188 wires for durable memory similarity. Absent, the\n"
                  "        # hybrid score is its lexical term alone rather than a second formula.\n"
                  "        embedding_client=embeddings,\n"
              )
              if needle not in text:
                  raise SystemExit("cannot locate #188 container insertion point")
              text = text.replace(needle, replacement, 1)
              path.write_text(text)
          PY
          # Keep current shared debt ledgers and restore the temporary workflow.
          git checkout origin/develop -- \
            quality/vulture-baseline.json \
            quality/wiring-reads-baseline.json \
            .github/workflows/vulture-ratchet.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: rebuild schedule consumer node fidelity on current develop"
          git push origin HEAD:chatgpt/tmp-636-rebuild-current
