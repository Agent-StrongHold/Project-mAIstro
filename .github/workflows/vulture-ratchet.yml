name: Vulture Ratchet

on:
  # No `branches:` filter. It used to be [main, integration, develop], which
  # matched on the PR's *base* — so a PR stacked on a feature branch ran none of
  # this. #151 and #138 got Registry CI and Formal Conformance only: no lint, no
  # types, no tests, no coverage, no SAST, no ratchet gates. The work was not
  # unreviewed, it was unmeasured, and every accumulated failure arrived at once
  # on retarget, against the branch least able to absorb it.
  #
  # A required-check set that silently does not apply to a whole class of PRs is
  # worse than none: the green tick means different things depending on the base
  # and nothing on the PR says which. #161.
  pull_request:
  push:
    branches: [develop, integration, main]

# Supersede in-flight runs for the same PR. Added with #161: this workflow now
# runs on every PR rather than only develop/integration/main-based ones, and a
# stack of PRs each pushing repeatedly is exactly where runs pile up.
# Cancellation is scoped to pull_request — a push to a protected branch must run
# to completion, because a cancelled run reports neither success nor failure and
# ADR-095's branch model relies on knowing whether a commit there was green.
concurrency:
  group: vulture-ratchet-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  exact-debt-ledger:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: ./.github/actions/setup-uv
      - name: Install pinned analyzer
        run: uv pip install --system vulture==2.16
      - name: Require exact reviewed Vulture identities
        run: >-
          python scripts/check-vulture-baseline.py
          packages/*/src
          --min-confidence 60
          --exclude '*/third_party/*'
