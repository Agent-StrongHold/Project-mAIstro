name: Vulture Ratchet

on:
  pull_request:

permissions:
  contents: write

jobs:
  exact-debt-ledger:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/tmp-561-reachability-current
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate exact reachability baseline
        run: |
          python - <<'PY'
          import importlib.util
          import json
          from pathlib import Path

          path = Path('scripts/check-reachability.py')
          spec = importlib.util.spec_from_file_location('check_reachability', path)
          module = importlib.util.module_from_spec(spec)
          assert spec.loader is not None
          spec.loader.exec_module(module)
          unreachable, total = module.unreachable_modules()
          baseline_path = Path('quality/reachability-baseline.json')
          data = json.loads(baseline_path.read_text())
          data['_generated_from'] = f'{total} production modules'
          data['unreachable'] = unreachable
          baseline_path.write_text(json.dumps(data, indent=2) + '\n')
          PY
      - name: Commit generated baseline to helper branch
        run: |
          if git diff --quiet -- quality/reachability-baseline.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add quality/reachability-baseline.json
          git commit -m "chore: generate exact PR 561 reachability baseline"
          git push origin HEAD:chatgpt/tmp-561-reachability-current
