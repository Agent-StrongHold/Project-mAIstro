name: Vulture Ratchet

on:
  pull_request:

permissions:
  contents: read

jobs:
  exact-debt-ledger:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: ./.github/actions/setup-uv
      - name: Install pinned analyzer
        run: uv pip install --system vulture==2.16
      - name: Generate exact reviewed Vulture identities
        run: >-
          python scripts/check-vulture-baseline.py
          --update
          packages/*/src
          --min-confidence 60
          --exclude '*/third_party/*'
      - uses: actions/upload-artifact@v4
        with:
          name: exact-vulture-ledger
          path: quality/vulture-baseline.json
