name: Vulture Ratchet

on:
  # No `branches:` filter. It used to be [main, integration, develop], which
  # matched on the PR's *base* — so a PR stacked on a feature branch ran none of
  # this. #151 and #138 got Registry CI and Formal Conformance only: no lint, no
  # types, no tests, no coverage, no SAST, no ratchet gates. The work was not
  # unreviewed, it was unmeasured, and every accumulated failure arrived at once
  # on retarget, against the branch least able to absorb it.
  #
  # A required-check set that silently does not apply to a whole class of PRs or
  # merge-group candidates is worse than none: the green tick means different
  # things depending on the merge path and nothing on the candidate says which.
  pull_request:
  merge_group:
    types: [checks_requested]
  push:
    branches: [develop, integration, main]

# Supersede in-flight candidate runs. Protected-branch pushes still run to
# completion because their pass/fail record is durable evidence about that SHA.
concurrency:
  group: vulture-ratchet-${{ github.event.pull_request.number || github.event.merge_group.head_sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' }}

permissions:
  contents: read

jobs:
  exact-debt-ledger:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # A PR is checked out as GitHub's synthetic base+candidate merge. Name the
      # current target ref, not github.event.pull_request.base.sha: a long-lived
      # PR's event SHA can still name its original branch-cut commit after the
      # target has absorbed independent ratchets. The shared resolver takes the
      # merge-base with the checked-out synthetic merge, yielding the exact
      # target state this candidate is being integrated into. For stacked PRs,
      # github.base_ref names the parent branch rather than assuming develop.
      # Merge groups already provide their integration base SHA.
      #
      # Protected-branch pushes compare to the previous SHA, so the pushed
      # commit cannot bless its own ledger. Topic-branch pushes must not: there
      # `before` is the branch's own previous tip, which a force-push (any
      # rebase) leaves unreachable from every ref, and `fetch-depth: 0` fetches
      # refs rather than orphans -- the ratchet then refuses with "base revision
      # could not be resolved" on a candidate that is otherwise green, while the
      # pull-request run on identical content passes. Topic pushes therefore use
      # the same integration base their PR run does, which is also what
      # `ratchet_provenance._push_event_base` computes when no base is named.
      RATCHET_BASE_REV: >-
        ${{ github.event_name == 'pull_request'
            && format('origin/{0}', github.base_ref)
            || github.event_name == 'merge_group'
            && github.event.merge_group.base_sha
            || github.ref == 'refs/heads/develop'
            && github.event.before
            || github.ref == 'refs/heads/integration'
            && github.event.before
            || github.ref == 'refs/heads/main'
            && github.event.before
            || 'origin/develop' }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Trusted-base resolution uses git merge-base and git show. A depth-1
          # PR checkout has no readable oracle and must never silently become a
          # candidate-tree comparison.
          fetch-depth: 0
      - uses: ./.github/actions/setup-uv
      - name: Setup Python 3.12
        run: uv python install 3.12
      - name: Restore locked repository environment
        run: uv sync --locked --all-extras
      - name: Require enforced ratchet provenance policy
        run: uv run python scripts/check-ratchet-provenance.py
      - name: Require classified shipped surfaces
        run: uv run python scripts/check-shipped-surface-truth.py
      - name: Require exact reviewed Vulture identities
        run: >-
          uv run python scripts/check-vulture-baseline.py
          packages/*/src
          --min-confidence 60
          --exclude '*/third_party/*'
