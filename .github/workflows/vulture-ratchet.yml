name: Vulture Ratchet

on:
  pull_request:

permissions:
  contents: write

jobs:
  exact-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/tmp-640-ruff-format
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: ./.github/actions/setup-uv
      - run: uv sync --locked --extra dev
      - name: Format exact regression file
        run: |
          uv run ruff format packages/maistro-core/tests/runs/test_consumer_claim_recovery.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/maistro-core/tests/runs/test_consumer_claim_recovery.py
          if git diff --cached --quiet; then
            echo "already formatted"
          else
            git commit -m "style: apply pinned ruff formatter"
            git push origin HEAD:chatgpt/tmp-640-ruff-format
          fi
