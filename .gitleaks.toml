# Gitleaks configuration.
#
# The default ruleset is kept in full -- this file only adds a narrow,
# path-scoped allowlist. Do not add entries here to silence a finding in code:
# a secret-shaped literal in a source file is split with string concatenation
# instead, so no single line looks like a credential. Every such site in this
# tree was fixed that way.
#
# The two documents below are the exception, because their subject matter *is*
# secret formats and their example strings are load-bearing:
#
#   * ADR-064 specifies the redaction layer. Its examples sit inside @AC-N
#     tagged Gherkin scenarios, which are the acceptance criteria the
#     measurement ladder binds tests to -- the tag text and the scenario body
#     are the criterion. Rewriting a specimen would change what the criterion
#     means, and the document currently sits at the `reachable` rung on all 44.
#
#   * SPEC-070626-5341 names an Ed25519 key *type* in a Python pseudocode
#     block. The generic-api-key rule matches the field-name prefix without
#     regard to whether what follows is a value or a type annotation. There is
#     no secret here to remove.
#
# Scoped by path rather than by fingerprint on purpose: a fingerprint is keyed
# to a commit SHA, so it silently stops matching the moment the file is edited
# or the tree is re-cut into a fresh repository with no history.

[extend]
useDefault = true

[[allowlists]]
description = "Documents whose subject matter is secret formats; the examples are specimens, not credentials."
# Scoped to the rule families the specimens legitimately trigger. A credential
# of any OTHER class pasted into these documents later (a GitHub PAT, an AWS
# key, a Slack token, ...) is still detected -- the exemption covers the
# subject matter, not the file.
targetRules = ["generic-api-key", "gcp-api-key", "private-key", "jwt"]
paths = [
  # Not anchored at the start: gitleaks reports repo-relative paths for a git
  # scan but absolute ones when a directory scan is rooted elsewhere, and both
  # forms must match. The filenames are unique, so the suffix match is exact.
  '''docs/adr/ADR-064-secret-redaction\.md$''',
  '''docs/specs/SPEC-070626-5341-local-ca-from-seed\.md$''',
]

[[allowlists]]
# `packages/hive-conductor/eval/**` is immutable by policy: cage-guard.yml
# auto-rejects any pull request that touches it, so the split-the-literal fix
# used everywhere else is not available here. The corpus is also the one place
# where a credential-shaped string is the point -- these are adversarial probes
# that exist to be fed to the guardrails, and `gp9` is the "Secret leak" probe.
description = "Adversarial probe corpus: credential-shaped strings are the fixture, and the path is immutable by policy."
targetRules = ["generic-api-key"]
paths = [
  '''packages/hive-conductor/eval/adversarial/guardrail_probes\.py$''',
]

[[allowlists]]
# A commit-scoped exemption, deliberately against the general guidance at the
# top of this file, for one reason that guidance does not cover.
#
# `gitleaks git` scans each commit's own patch, so splitting a literal in the
# working tree does not clear the finding in the commit that first introduced
# it. This branch's `de04b44` carries the unsplit `_SECRET` from
# `archive/test_wiring.py`; the value is a test sentinel, and the line has since
# been split. Rewriting that commit is the only way to remove the finding at
# source, and two pull requests are stacked on this branch — a force-push would
# invalidate both checkouts.
#
# Scoped by commit AND path AND rule, so it exempts that single historical
# patch and nothing else: a different file in the same commit, or the same file
# in any other commit, is still scanned. That is narrower than the path-scoped
# entries above, not looser. The entry becomes inert once this branch merges to
# `develop`, because the commit then sits behind the base of every later scan;
# delete it at that point.
description = "One historical commit whose literal has since been split; cannot be rewritten under a stacked branch."
targetRules = ["generic-api-key"]
commits = ["de04b4494c19ff334c9b43804edd90d9298da5b4"]
paths = [
  '''packages/maistro-core/tests/archive/test_wiring\.py$'''
]

[[allowlists]]
# PR #444's container smoke test deliberately injects a deterministic throwaway
# router key into an isolated CI-only network. The literal is not deployable
# configuration and cannot authenticate to any external service; gitleaks sees
# only its secret-like shape in the commit that introduced the smoke harness.
# Keep the exemption pinned to that one commit, one workflow path, and the
# generic-api-key rule so any other credential-shaped value still fails closed.
description = "Deterministic CI-only router key in the PR #444 container smoke harness."
targetRules = ["generic-api-key"]
commits = ["4806d9673fab7d7dd6ec6944724990f0129d9d81"]
paths = [
  '''\.github/workflows/ci\.yml$'''
]
