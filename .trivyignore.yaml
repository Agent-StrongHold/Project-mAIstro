# Trivy suppressions for the "Container scan + SBOM + cosign" gate
# (.github/workflows/security.yml) and the release re-scan
# (.github/workflows/release.yml). Every entry is a named, documented finding
# with an expiry: an entry that has lapsed or whose subject is gone must be
# removed rather than silently renewed. Expired entries are inert — trivy
# drops them.
vulnerabilities:
  - id: CVE-2026-77214
    path: packages/hive-conductor/Dockerfile
    expired_at: 2026-12-31
    statement: >-
      expat information disclosure via heap buffer overread (libexpat1 in the
      bookworm base, 2.5.0-1+deb12u4). No fixed libexpat release exists as of
      2026-10-22 (trivy: fix column empty), so it cannot be patched by the
      apt layer that addresses CVE-2025-59375 in the same stage. Triaged:
      expat parses XML only from operator-supplied feed content, not
      attacker-controlled network input, on loopback-bound services.
      Re-triage when upstream ships a fix or Debian ships deb12u6; remove
      this entry and re-scan then.
  - id: CVE-2026-111497
    path: Dockerfile.research
    expired_at: 2026-12-31
    statement: >-
      brotli out-of-bounds write (libbrotli1). Trivy names a fixed version
      only on Debian 13 (1.1.0-2+deb13u1); the research image is
      python:3.13-slim-bookworm and `apt-get upgrade` already runs in the
      runtime stage with no bookworm point-release available as of
      2026-10-24. Triaged: brotli is pulled in as a transitive OS library
      for the research image's browser/PDF tooling, not an intentional
      network decoder of attacker content at the API edge. Re-triage when
      Debian bookworm ships a fix or the base image moves to a suite that
      has one; remove this entry and re-scan then.
  - id: CVE-2026-111497
    path: Dockerfile.rsi-runner
    expired_at: 2026-12-31
    statement: >-
      brotli out-of-bounds write (libbrotli1). The only fixed version the
      trivy DB names is the trixie-security pocket's 1.1.0-2+deb13u1, and
      the rsi-runner image installs exactly that (its runtime-apt stage
      resolves libbrotli1 from trixie-security; dpkg -l inside the built
      image reads 1.1.0-2+deb13u1). The DB feed this job downloads fresh
      per run (mirror.gcr.io/aquasec/trivy-db:2) intermittently attributes
      trixie main's binNMU line (1.1.0-2+b7) to the image instead: in runs
      40066067725 and 40079603187 the very job whose scan reported
      installed=1.1.0-2+b7 shows apt setting up 1.1.0-2+deb13u1 minutes
      earlier in its own build log, and no-cache rebuilds of the same
      commits scan clean against both of 2026-10-24's DB revisions (01:18
      and 07:11). A deliberately-built b7 fixture scans vulnerable with
      the same scanner and DB, so the record itself is sound and the
      mismatch is on the feed/image boundary this entry cannot reach from
      a lane. Scope note: trivy does not bind OS-package findings to the
      path field, so while this entry stands it suppresses this one CVE on
      every scanned surface; a genuine regression to a vulnerable
      libbrotli1 would still fail the job's Grype cross-check (--only-fixed,
      fail-on high, independent Anchore feed). Re-triage when the feed
      reconciles or trixie ships a newer brotli point release; remove this
      entry and re-scan then.
secrets:
  - id: aws-access-key-id
    path: moto/
    expired_at: 2027-01-31
    statement: >-
      moto is the AWS-mock library the RSI runner installs as part of its
      locked dev dependency set (Dockerfile.rsi-runner `uv sync --frozen`), and
      its own source ships fixture/example key material (e.g.
      moto/ec2/models/elastic_network_interfaces.py docstrings). These are not
      credentials and not ours; they ship wherever moto ships. Scope is limited
      to moto's own package tree, so a real key anywhere else still fails the
      gate. Remove this entry if moto stops shipping the fixture or leaves the
      dependency set.
  - id: private-key
    path: moto/moto_proxy/
    expired_at: 2027-01-31
    statement: >-
      moto_proxy's ca.key/cert.key are the library's own local-MITM test
      fixtures, generated and shipped upstream inside the moto wheel — again
      part of the RSI runner's locked dev dependency set, not secret material
      of this repository. Scope is limited to moto_proxy's directory so any
      other private key still fails the gate. Remove this entry if moto drops
      the fixtures or the dependency.
