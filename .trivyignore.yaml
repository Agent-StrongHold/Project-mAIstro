# Trivy suppressions for the "Container scan + SBOM + cosign" gate
# (.github/workflows/security.yml) and the release re-scan
# (.github/workflows/release.yml). Every entry is a named, documented finding
# with an expiry: an entry that has lapsed or whose subject is gone must be
# removed rather than silently renewed. Expired entries are inert — trivy
# drops them.
vulnerabilities:
  - id: CVE-2026-77214
    path: packages/hive-conductor/Dockerfile
    expired_at: 2026-12-31
    statement: >-
      The base-image SBOM may report msgpack 1.1.2 from its pre-overlay Python
      environment. The final runtime venv contains msgpack 1.2.1 or newer and
      CI verifies the live installed version immediately before Trivy runs.
      This suppresses only the stale package/version tuple.
  - id: CVE-2025-47273
    purls:
      - pkg:pypi/setuptools@70.3.0
    expired_at: 2026-09-30
    statement: >-
      The base-image SBOM may report setuptools 70.3.0 from its pre-overlay
      Python environment. The final runtime venv contains setuptools 78.1.1 or
      newer and CI verifies the live installed version immediately before Trivy
      runs. This suppresses only the stale package/version tuple.
