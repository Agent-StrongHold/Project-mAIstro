# Production reference topology for maistro-engine (SPEC-070226-fbe3 / ADR-081).
#
# Load balancer (nginx) -> 2x stateless maistro-server replicas
# -> PostgreSQL primary + streaming replica, Redis, shared file store.
#
# Usage:
#   cp .env.example .env   # set POSTGRES_PASSWORD, REPLICATION_PASSWORD, REDIS_PASSWORD, API_KEYS
#   docker compose -f deploy/docker-compose.prod.yml up -d
#
# No secrets inline — everything sensitive comes from the environment / .env.
# This is a REFERENCE artifact: production deployments should pin image digests
# and move the sandbox worker off the host docker socket (CRIT-01, DEPLOYMENT-STANCE.md).

services:
  lb:
    image: nginx:1.27-alpine
    ports:
      - "${MAISTRO_BIND_HOST:-0.0.0.0}:${MAISTRO_LB_PORT:-8080}:8080"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - maistro-server-1
      - maistro-server-2
    mem_limit: 256m
    memswap_limit: 256m
    pids_limit: 128
    cpus: 0.5
    restart: unless-stopped

  maistro-server-1: &maistro-server
    build:
      context: ..
      dockerfile: Dockerfile
    environment: &maistro-env
      DB_HOST: postgres-primary
      DB_PORT: "5432"
      DB_NAME: ${POSTGRES_DB:-maistro}
      DB_USER: ${POSTGRES_USER:-maistro}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      REDIS_URL: redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}@redis:6379/0
      API_KEYS: ${API_KEYS:?Set API_KEYS in .env}
      REQUIRE_AUTH: "true"
      # Shared only with the trusted Hive delegation bridge, never clients.
      TASK_DELEGATION_KEY: ${TASK_DELEGATION_KEY:?Set TASK_DELEGATION_KEY in .env}
      # The server refuses to start without it -- it builds a maistro-core
      # Container, and create_container needs a router key (#142). The dev
      # stack and installer have required it for a long time; this file was
      # never told, so each replica exited with "ROUTER_API_KEY is unset".
      ROUTER_API_KEY: ${ROUTER_API_KEY:?Set ROUTER_API_KEY in .env — openssl rand -hex 32}
      # This stack runs no model gateway, so it needs one it can reach (#808).
      # It used to pass LITELLM_BASE_URL alone, defaulting to empty, and no
      # key at all -- while LITELLM_API_BASE, the name most of the code
      # reads, was never set. A deployment booted, passed /health/ready, and
      # could not call a single model. Required now, like every other
      # dependency this file names, and every alias derived from the one
      # input so no two components pick different gateways.
      LITELLM_BASE_URL: "${LITELLM_BASE_URL:?Set LITELLM_BASE_URL in .env — this stack runs no model gateway of its own}"
      LITELLM_URL: "${LITELLM_BASE_URL:?Set LITELLM_BASE_URL in .env — this stack runs no model gateway of its own}"
      LITELLM_PROXY_URL: "${LITELLM_BASE_URL:?Set LITELLM_BASE_URL in .env — this stack runs no model gateway of its own}"
      LITELLM_API_BASE: "${LITELLM_API_BASE:-${LITELLM_BASE_URL:?Set LITELLM_BASE_URL in .env — this stack runs no model gateway of its own}/v1}"
      LITELLM_API_KEY: "${LITELLM_API_KEY:?Set LITELLM_API_KEY in .env — the gateway key}"
      LITELLM_PROXY_KEY: "${LITELLM_API_KEY:?Set LITELLM_API_KEY in .env — the gateway key}"
      FILE_STORE_PATH: /var/lib/maistro/files
    volumes:
      - file-store:/var/lib/maistro/files
    depends_on:
      postgres-primary:
        condition: service_healthy
      redis:
        condition: service_healthy
    stop_grace_period: 30s   # connection drain (ADR-081 rolling update contract)
    # Service-level limits are honored by Docker/Podman Compose; do not move
    # these to Swarm-only deploy.resources keys.
    mem_limit: 2g
    memswap_limit: 2g
    pids_limit: 512
    cpus: 2.0
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"]
      interval: 10s
      timeout: 5s
      retries: 3

  maistro-server-2:
    <<: *maistro-server

  hive-conductor:
    build:
      context: ..
      dockerfile: packages/hive-conductor/Dockerfile
    # Resource floors (#75): a runaway Conductor must not starve the engine
    # services it shares the host with. Same app-server class as maistro-server.
    mem_limit: 2g
    memswap_limit: 2g
    pids_limit: 512
    cpus: 2.0
    environment:
      - PYTHONUNBUFFERED=1
      # The engine's database, not a second one: the embedded runtime's
      # canonical Workspace/Membership store is the same canonical_workspaces
      # table maistro-server serves (ADR-092326-97c4, #37). Hive never runs
      # alembic; it starts only once maistro-engine has migrated and is healthy.
      - DB_HOST=postgres-primary
      - DB_PORT=5432
      - DB_NAME=${POSTGRES_DB:-maistro}
      - DB_USER=${POSTGRES_USER:-maistro}
      - DB_PASSWORD=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      - DATABASE_URL=postgresql://maistro:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres-primary:5432/maistro
      # The same gateway the engine uses, derived the same way (#808) -- two
      # services that disagree about which gateway they talk to would bill,
      # rate-limit and log against different backends.
      - LITELLM_BASE_URL=${LITELLM_BASE_URL:?Set LITELLM_BASE_URL in .env — this stack runs no model gateway of its own}
      - LITELLM_URL=${LITELLM_BASE_URL:?Set LITELLM_BASE_URL in .env — this stack runs no model gateway of its own}
      - LITELLM_PROXY_URL=${LITELLM_BASE_URL:?Set LITELLM_BASE_URL in .env — this stack runs no model gateway of its own}
      - LITELLM_API_BASE=${LITELLM_API_BASE:-${LITELLM_BASE_URL:?Set LITELLM_BASE_URL in .env — this stack runs no model gateway of its own}/v1}
      - LITELLM_API_KEY=${LITELLM_API_KEY:?Set LITELLM_API_KEY in .env — the gateway key}
      - LITELLM_PROXY_KEY=${LITELLM_API_KEY:?Set LITELLM_API_KEY in .env — the gateway key}
      - CHAT_DEFAULT_MODEL=${CHAT_DEFAULT_MODEL:-gemini/gemini-2.5-flash}
      # Engine router for DAG execution (REQUIRE_AUTH=true expects the router
      # key). Settings.maistro_base_url / maistro_router_api_key (config.py)
      # read these MAISTRO_* names directly; CONDUCTOR_ROUTER_URL/ROUTER_API_KEY
      # are not bound to any field, so task dispatch silently fell back to
      # localhost with no auth. install.sh writes MAISTRO_ROUTER_API_KEY and
      # migrates the retired MAISTRO_ACCESS_TOKEN alias into it (#402).
      - MAISTRO_BASE_URL=http://maistro-server-1:8000  # DevSkim: ignore DS137138 until 2027-12-31 -- internal compose network name; TLS terminates at the ingress
      - MAISTRO_ROUTER_API_KEY=${MAISTRO_ROUTER_API_KEY:-}
      - WORKSPACE_SCOPE_KEY=${WORKSPACE_SCOPE_KEY:-}
      # Sentinel must be armed here like in every other shipped stack: the
      # preset default is "none", which fail-closed denies every tool
      # (ADR-072726-0d6b, #1165). Same grant set as the dev/pm-poc/
      # hive-standalone Conductors, kept in parity by the sentinel test.
      - MAISTRO_PERMISSION_PRESET=hive_conductor_tools
      # Must match the task server's TASK_DELEGATION_KEY; never reuse the API key.
      - MAISTRO_DELEGATION_KEY=${TASK_DELEGATION_KEY:?Run ./install.sh to generate TASK_DELEGATION_KEY}
      - MAISTRO_SERVICE_PRINCIPAL=${MAISTRO_SERVICE_PRINCIPAL:-conductor}
      # Langfuse credentials for the Langfuse service's own UI/API. These
      # do NOT enable trace export from this app: the conductor's spans go
      # out only over OTLP — a build with INSTALL_OBSERVABILITY=1 plus
      # OTEL_EXPORTER_OTLP_ENDPOINT/HEADERS (see
      # packages/hive-conductor/backend/adapters/telemetry_langfuse.py).
      - LANGFUSE_BASE_URL=http://langfuse:3000  # DevSkim: ignore DS137138 until 2027-12-31 -- internal compose network name; TLS terminates at the ingress
      - LANGFUSE_PUBLIC_KEY=${LANGFUSE_PUBLIC_KEY:-}
      - LANGFUSE_SECRET_KEY=${LANGFUSE_SECRET_KEY:-}
      # Foundation state (SQLite/vault/state) on a persistent volume. /data is
      # pre-owned by the nonroot uid 65532 in the image so the volume is writable.
      - CONDUCTOR_DATA_DIR=/data
      # Human login mode + OIDC metadata; secrets remain in the /data vault.
      - HUMAN_AUTH_MODE=${HUMAN_AUTH_MODE:-hybrid}
      - OAUTH_PROVIDERS=${OAUTH_PROVIDERS:-{}}
      - OAUTH_PUBLIC_ORIGIN=${OAUTH_PUBLIC_ORIGIN:-}
      - OAUTH_SUCCESS_PATH=${OAUTH_SUCCESS_PATH:-/}
      - HARDWARE_PRESET=${HARDWARE_PRESET:-laptop}
    volumes:
      - conductor-data:/data
    depends_on:
      postgres-primary:
        condition: service_healthy
      redis:
        condition: service_healthy
      maistro-server-1:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8101/health/ready')"]  # devskim: ignore DS162092 until 2027-12-31 -- in-container readiness probe against the container's own loopback
      interval: 15s
      timeout: 5s
      retries: 3

  postgres-primary:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-maistro}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-maistro}
      # Streaming replication + WAL archival (daily full + continuous WAL).
      POSTGRES_INITDB_ARGS: "--data-checksums"
      # init-replication.sh reads this to create the `replicator` role the
      # replica's pg_basebackup logs in as. It was never passed here: the
      # script aborted at its first line, the role and its pg_hba entry were
      # never created, and -- because the entrypoint carries on past a failed
      # init script -- the primary still reported healthy while the replica
      # retried pg_basebackup every two seconds forever. The documented
      # hot-standby has never replicated.
      REPLICATION_PASSWORD: ${REPLICATION_PASSWORD:?Set REPLICATION_PASSWORD in .env}
    command:
      - postgres
      - -c
      - wal_level=replica
      - -c
      - max_wal_senders=5
      - -c
      - wal_keep_size=512MB
      - -c
      - archive_mode=on
      - -c
      - archive_command=test ! -f /var/lib/postgresql/wal_archive/%f && cp %p /var/lib/postgresql/wal_archive/%f
      - -c
      - hot_standby=on
    volumes:
      - pgdata-primary:/var/lib/postgresql/data
      - wal-archive:/var/lib/postgresql/wal_archive
      - ./init-replication.sh:/docker-entrypoint-initdb.d/init-replication.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-maistro}"]
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 2g
    memswap_limit: 2g
    pids_limit: 512
    cpus: 2.0
    restart: unless-stopped

  postgres-replica:
    image: pgvector/pgvector:pg17
    environment:
      PGPASSWORD: ${REPLICATION_PASSWORD:?Set REPLICATION_PASSWORD in .env}
    # Bootstrap a hot standby via pg_basebackup on first start, then run postgres.
    command:
      - bash
      - -ceu
      - |
        if [ ! -s /var/lib/postgresql/data/PG_VERSION ]; then
          until pg_basebackup -h postgres-primary -U replicator -D /var/lib/postgresql/data \
            -X stream -R --checkpoint=fast; do sleep 2; done
          chmod 700 /var/lib/postgresql/data
        fi
        exec docker-entrypoint.sh postgres -c hot_standby=on
    volumes:
      - pgdata-replica:/var/lib/postgresql/data
    depends_on:
      postgres-primary:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-maistro}"]
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 2g
    memswap_limit: 2g
    pids_limit: 512
    cpus: 2.0
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    # RDB snapshots (daily off-host copy via scripts/backup.sh) + AOF on-instance.
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
      - --appendonly
      - "yes"
      - --save
      - "3600 1"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    mem_limit: 512m
    memswap_limit: 512m
    pids_limit: 256
    cpus: 0.5
    restart: unless-stopped

volumes:
  pgdata-primary:
  pgdata-replica:
  wal-archive:
  redis-data:
  file-store:
  conductor-data:
