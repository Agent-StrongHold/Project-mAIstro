# nginx load-balancer config for maistro-server replicas (SPEC-070226-fbe3).
# Health-gated round-robin; failed upstreams are ejected via passive checks.

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    upstream maistro_backend {
        # Failure counts live in shared memory. Without a zone every nginx
        # worker keeps its own, so with `worker_processes auto` a dead replica
        # needed 3 failures *per worker* before all of them stopped routing to
        # it -- measured at 6 slow requests in 10 where 3 was promised.
        zone maistro_backend 64k;
        # Passive health: after 3 failures within 10s the replica is removed
        # for 10s. Active checks use /health/live via the compose healthcheck.
        server maistro-server-1:8000 max_fails=3 fail_timeout=10s;
        server maistro-server-2:8000 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    server {
        listen 8080;

        # LB self-check (does not hit backends).
        location = /lb-health {
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }

        location / {
            proxy_pass http://maistro_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_next_upstream error timeout http_502 http_503 http_504;
            # A stopped replica does not refuse the connection, it just never
            # answers, so connect() waits out this timeout. Unset, it is 60s:
            # with one replica down, half of all requests hung for a minute
            # before nginx could count the failure or retry the other one.
            # 2s bounds that, and then proxy_next_upstream completes the same
            # request on the healthy replica. Connecting is all this covers;
            # long-running tasks are governed by proxy_read_timeout below.
            proxy_connect_timeout 2s;
            proxy_next_upstream_tries 2;
            proxy_read_timeout 300s;   # long-running task endpoints
            proxy_send_timeout 60s;
        }
    }
}
