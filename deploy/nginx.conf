# nginx load-balancer config for maistro-server replicas (SPEC-070226-fbe3).
# Health-gated round-robin; failed upstreams are ejected via passive checks.

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    upstream maistro_backend {
        # Passive health: after 3 failures within 10s the replica is removed
        # for 10s. Active checks use /health/live via the compose healthcheck.
        server maistro-server-1:8000 max_fails=3 fail_timeout=10s;
        server maistro-server-2:8000 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    server {
        listen 8080;

        # LB self-check (does not hit backends).
        location = /lb-health {
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }

        location / {
            proxy_pass http://maistro_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # No http_503 (F10, found by the #860 soak): /health/ready
            # answers 503 while the LLM circuit is open (degraded-not-dead by
            # design), and with http_503 as a next-upstream condition every
            # such response counts toward passive-health max_fails — a
            # provider outage would eject BOTH healthy replicas from rotation
            # within seconds and 502 every endpoint fleet-wide. Retries stay
            # scoped to transport failures; the application's 503 reaches the
            # client as the degraded signal it is.
            proxy_next_upstream error timeout http_502 http_504;
            proxy_read_timeout 300s;   # long-running task endpoints
            proxy_send_timeout 60s;
        }
    }
}
