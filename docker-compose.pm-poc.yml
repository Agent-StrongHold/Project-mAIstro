# PM fleet POC overlay — use with base compose:
#   docker compose -f docker-compose.yml -f docker-compose.pm-poc.yml up --build
version: "3.9"

services:
  maistro-engine:
    environment:
      - MAISTRO_POC_MODE=pm
      # Required, with no default. This overlay sets REQUIRE_AUTH=true, so a
      # baked-in value would be an authenticated deployment whose keys are
      # published in this repository (#367). `:?` makes compose refuse to
      # start rather than start insecurely.
      - API_KEYS=${API_KEYS:?Run ./install.sh to generate API_KEYS, or set it in .env}
      - CORS_ORIGINS=http://localhost:8101,http://localhost:5173,http://127.0.0.1:8101
      - REQUIRE_AUTH=true
    profiles:
      - pm-poc

  hive-conductor:
    build:
      context: .
      dockerfile: packages/hive-conductor/Dockerfile
      args:
        VITE_POC_MODE: pm
    ports:
      - "8101:8101"
    environment:
      - MAISTRO_POC_MODE=pm
      - HIVE_POC_MODE=pm
      # The bare token, not the server's key list. `install.sh` writes
      # `MAISTRO_ROUTER_API_KEY=<token>` and `API_KEYS=["conductor:<token>"]` -- a
      # JSON array -- so sending API_KEYS here presents `["conductor:<token>"]`
      # as the bearer credential and every call gets 401. Required here because
      # the overlay sets REQUIRE_AUTH=true. (#402: this used to interpolate
      # MAISTRO_ACCESS_TOKEN, a second name for the same credential that no
      # production code read; it now reads the credential's only name.)
      - MAISTRO_ROUTER_API_KEY=${MAISTRO_ROUTER_API_KEY:?Run ./install.sh to generate MAISTRO_ROUTER_API_KEY, or set it in .env}
      # Atlassian (container runtime — not Cursor): set site + token for headless MCP/Jira REST
      - ATLASSIAN_ROVO_MCP_URL=https://mcp.atlassian.com/v1/mcp/authv2
      # - ATLASSIAN_SITE_URL=https://your-org.atlassian.net
      # - ATLASSIAN_API_TOKEN=${ATLASSIAN_API_TOKEN:-}
      # Same Sentinel preset as the dev stack (#66); the PM overlay inherits
      # the base hive-conductor service but replaces its environment block.
      - MAISTRO_PERMISSION_PRESET=dangerous_tools_admin
    depends_on:
      - maistro-engine
    profiles:
      - pm-poc
