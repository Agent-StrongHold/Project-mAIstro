# Isolated Gate-C reproduction stack (docker-compose.repro.yml)
#
# Purpose: let any lane reproduce the canonical clean install WITHOUT
# touching the production fleet. This file is standalone (not an override)
# and deliberately does NOT reuse the production container names
# (maistro-*) or ports (8000/8101/5432). On 2026-10-21 a lane stopped the
# live maistro-* containers to free those ports, leaving the fleet down
# for ~4h45m (see incident retro + #2250). This file exists so that never
# happens again.
#
# Usage (from any worktree):
#   export DB_PASSWORD=... LITELLM_MASTER_KEY=...   # any throwaway values
#   docker compose -f docker-compose.repro.yml -p repro-$$ up -d
#   curl -f http://127.0.0.1:8800/health/live
#   docker compose -f docker-compose.repro.yml -p repro-$$ down -v --remove-orphans
#
# NEVER point this stack at the production volumes, network, or names.
# NEVER `docker stop`/`docker rm` a `maistro-*` container to free ports —
# use the offsets below (8800/5433/8400) instead.

services:
  repro-postgres:
    image: pgvector/pgvector:pg18
    container_name: repro-postgres
    environment:
      - POSTGRES_DB=maistro
      - POSTGRES_USER=maistro
      - POSTGRES_PASSWORD=${DB_PASSWORD:?Set DB_PASSWORD (throwaway ok)}
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U maistro -d maistro"]
      interval: 5s
      timeout: 3s
      retries: 12

  repro-litellm:
    image: ghcr.io/berriai/litellm@sha256:af8050ea45707c42a0572c5cceaa5cebaa89cee4c5cd0585cf879a529804b898
    container_name: repro-litellm
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    environment:
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY:?Set LITELLM_MASTER_KEY (throwaway ok)}
    ports:
      - "127.0.0.1:8400:4000"

  repro-engine:
    build: .
    image: ${MAISTRO_ENGINE_IMAGE:-repro-engine:local}
    container_name: repro-engine
    depends_on:
      repro-postgres:
        condition: service_healthy
    ports:
      - "${MAISTRO_BIND_HOST:-127.0.0.1}:${REPRO_MAISTRO_PORT:-8800}:8000"
    environment:
      - DB_HOST=repro-postgres
      - DB_PORT=5432
      - DB_NAME=maistro
      - DB_USER=maistro
      - DB_PASSWORD=${DB_PASSWORD:?Set DB_PASSWORD (throwaway ok)}
      - DATABASE_URL=postgresql://maistro:${DB_PASSWORD:?Set DB_PASSWORD (throwaway ok)}@repro-postgres:5432/maistro
      - LITELLM_BASE_URL=http://repro-litellm:4000
      - LITELLM_URL=http://repro-litellm:4000
      - LITELLM_PROXY_URL=http://repro-litellm:4000
      - LITELLM_API_BASE=http://repro-litellm:4000/v1
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY:?Set LITELLM_MASTER_KEY (throwaway ok)}
      - LITELLM_API_KEY=${LITELLM_API_KEY:-${LITELLM_MASTER_KEY:?Set LITELLM_MASTER_KEY (throwaway ok)}}
