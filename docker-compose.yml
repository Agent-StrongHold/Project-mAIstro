version: "3.9"

services:
  maistro-engine:
    build: .
    image: ${MAISTRO_ENGINE_IMAGE:-maistro-engine:local}
    container_name: maistro-engine
    ports:
      - "${MAISTRO_BIND_HOST:-127.0.0.1}:${MAISTRO_PORT:-8000}:8000"
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=maistro
      - DB_USER=maistro
      - DB_PASSWORD=${DB_PASSWORD:?Set DB_PASSWORD in .env}
      - DATABASE_URL=postgresql://maistro:${DB_PASSWORD:?Set DB_PASSWORD in .env}@postgres:5432/maistro
      - LITELLM_URL=http://litellm:4000
      - LITELLM_BASE_URL=http://litellm:4000
      - LITELLM_PROXY_URL=http://litellm:4000
      - LITELLM_API_BASE=http://litellm:4000/v1
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY:?Set LITELLM_MASTER_KEY in .env}
      - LITELLM_API_KEY=${LITELLM_MASTER_KEY:?Set LITELLM_MASTER_KEY in .env}
      - LITELLM_PROXY_KEY=${LITELLM_MASTER_KEY:?Set LITELLM_MASTER_KEY in .env}
      # Langfuse coordinates for the Langfuse service's own UI/API. Trace
      # export from this stack is not driven by these: spans leave only over
      # OTLP, and nothing here sets OTEL_EXPORTER_OTLP_ENDPOINT (see the
      # note on the hive-conductor service below).
      - LANGFUSE_HOST=http://langfuse:3000
      - LANGFUSE_PUBLIC_KEY=${LANGFUSE_PUBLIC_KEY:-}
      - LANGFUSE_SECRET_KEY=${LANGFUSE_SECRET_KEY:-}
      - DEFAULT_MODEL=${DEFAULT_MODEL:-gemini/gemini-2.5-flash}
      - CHAT_DEFAULT_MODEL=${CHAT_DEFAULT_MODEL:-${DEFAULT_MODEL:-gemini/gemini-2.5-flash}}
      - MAISTRO_BUILDERS_MODEL=${MAISTRO_BUILDERS_MODEL:-${DEFAULT_MODEL:-gemini/gemini-2.5-flash}}
      - API_KEYS=${API_KEYS:?Run ./install.sh to generate API_KEYS}
      - ROUTER_API_KEY=${ROUTER_API_KEY:?Run ./install.sh to generate ROUTER_API_KEY}
      # Hive signs explicit Workspace admission bindings with a dedicated
      # capability. Unconfigured deployments remain fail-closed for named scope
      # while unscoped submissions retain the existing default Workspace path.
      - WORKSPACE_SCOPE_KEY=${WORKSPACE_SCOPE_KEY:-}
      - MAISTRO_ACCESS_TOKEN=${MAISTRO_ACCESS_TOKEN:-}
      - REQUIRE_AUTH=${REQUIRE_AUTH:-true}
      - GITHUB_WEBHOOK_SECRET=${GITHUB_WEBHOOK_SECRET:-}
      - CI_WEBHOOK_SECRET=${CI_WEBHOOK_SECRET:-}
      - SANDBOX_NETWORK_DISABLED=true
      - SANDBOX_READINESS_REQUIRED=false
    volumes:
      # The host Docker socket is NOT mounted by default: it grants the
      # container control of the host Docker daemon (container escape = host
      # root; June audit 3.1 / HN-LAUNCH-AUDIT). If the builder sandbox needs
      # it, opt in explicitly:
      #   docker compose -f docker-compose.yml \
      #     -f docker-compose.docker-sock.override.example.yml up
      # (or copy that override into docker-compose.override.yml).
      - workspace-data:/repos
    depends_on:
      postgres:
        condition: service_healthy
      litellm:
        condition: service_started
    stop_grace_period: 30s
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live')"]
      interval: 10s
      timeout: 5s
      retries: 3

  postgres-layout-check:
    # Mount the named volume at its parent so legacy layouts are visible before
    # PostgreSQL can initialize anything. Old installs mounted pgdata directly
    # at /var/lib/postgresql/data, leaving PG_VERSION at the volume root. The
    # PG18 layout instead stores the cluster below /18/docker. Refuse a legacy
    # volume here so an image/layout change can never look like silent data loss.
    image: ${POSTGRES_IMAGE:-pgvector/pgvector:pg18}
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        if [ -f /var/lib/postgresql/PG_VERSION ] && [ ! -f /var/lib/postgresql/18/docker/PG_VERSION ]; then
          echo >&2 "ERROR: legacy PostgreSQL volume layout detected. Refusing to initialize a new cluster over an existing volume. Follow docs/install/postgres-volume-upgrades.md before starting this stack."
          exit 78
        fi
    volumes:
      - pgdata:/var/lib/postgresql:ro
    restart: "no"

  postgres:
    # Supported majors are 17-19; 18 is the default here and what CI matrixes
    # against (alongside 17). A legacy root-layout volume is rejected by
    # postgres-layout-check before startup; major upgrades remain explicit
    # maintenance operations documented in docs/install/postgres-volume-upgrades.md.
    image: ${POSTGRES_IMAGE:-pgvector/pgvector:pg18}
    container_name: maistro-postgres
    environment:
      POSTGRES_USER: maistro
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      POSTGRES_DB: maistro
      # PostgreSQL 18+ uses a version-specific cluster below this parent.
      # Keeping PGDATA explicit prevents image-tag and volume-layout drift.
      PGDATA: /var/lib/postgresql/18/docker
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    depends_on:
      postgres-layout-check:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U maistro"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    container_name: maistro-litellm
    ports:
      # Host interface the gateway binds to. Default 127.0.0.1 = loopback only
      # (this machine). Set LITELLM_BIND_ADDR=0.0.0.0 in .env to expose it to your
      # LAN. See .env.example for the trade-offs.
      - "${LITELLM_BIND_ADDR:-127.0.0.1}:4000:4000"
    environment:
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY:?Set LITELLM_MASTER_KEY in .env}
      - DATABASE_URL=postgresql://maistro:${DB_PASSWORD:?Set DB_PASSWORD in .env}@postgres:5432/litellm
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - CEREBRAS_API_KEY=${CEREBRAS_API_KEY:-}
      - COHERE_API_KEY=${COHERE_API_KEY:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - MISTRAL_API_KEY=${MISTRAL_API_KEY:-}
      - NVIDIA_API_KEY=${NVIDIA_API_KEY:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - SAMBANOVA_API_KEY=${SAMBANOVA_API_KEY:-}
      - XAI_API_KEY=${XAI_API_KEY:-}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - TOGETHER_API_KEY=${TOGETHER_API_KEY:-}
      - FIREWORKS_API_KEY=${FIREWORKS_API_KEY:-}
      - DEEPINFRA_API_KEY=${DEEPINFRA_API_KEY:-}
      - LANGFUSE_PUBLIC_KEY=${LANGFUSE_PUBLIC_KEY:-}
      - LANGFUSE_SECRET_KEY=${LANGFUSE_SECRET_KEY:-}
      - LANGFUSE_HOST=http://langfuse:3000
    volumes:
      - ./litellm_config.yaml:/app/config.yaml:ro
    command: ["--config", "/app/config.yaml"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  langfuse:
    image: langfuse/langfuse:2
    container_name: maistro-langfuse
    ports:
      - "127.0.0.1:3100:3000"
    environment:
      - DATABASE_URL=postgresql://maistro:${DB_PASSWORD:?Set DB_PASSWORD in .env}@postgres:5432/langfuse
      - NEXTAUTH_URL=http://localhost:3100
      - NEXTAUTH_SECRET=${LANGFUSE_NEXTAUTH_SECRET:?Set LANGFUSE_NEXTAUTH_SECRET in .env}
      - SALT=${LANGFUSE_SALT:?Set LANGFUSE_SALT in .env}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # Agent Conductor app: chat UI, DAG views, and deck builder (React SPA + FastAPI).
  # Wired to the same LiteLLM gateway and engine so the curl install brings up the
  # full UI, not just the headless API. Frontend is built inside its Dockerfile.
  hive-conductor:
    build:
      context: .
      dockerfile: packages/hive-conductor/Dockerfile
    container_name: maistro-hive-conductor
    ports:
      - "${MAISTRO_BIND_HOST:-127.0.0.1}:${HIVE_PORT:-8101}:8101"
    environment:
      - PYTHONUNBUFFERED=1
      # OpenAI-compatible gateway (must end in /v1).
      - LITELLM_API_BASE=http://litellm:4000/v1
      - LITELLM_API_KEY=${LITELLM_MASTER_KEY:?Set LITELLM_MASTER_KEY in .env}
      - LITELLM_PROXY_URL=http://litellm:4000
      - LITELLM_PROXY_KEY=${LITELLM_MASTER_KEY:?Set LITELLM_MASTER_KEY in .env}
      - CHAT_DEFAULT_MODEL=${CHAT_DEFAULT_MODEL:-${DEFAULT_MODEL:-gemini/gemini-2.5-flash}}
      # Engine router for DAG execution (REQUIRE_AUTH=true expects the access token).
      # Settings.maistro_base_url / maistro_router_api_key (config.py) read these
      # MAISTRO_* names directly; CONDUCTOR_ROUTER_URL/ROUTER_API_KEY are not bound
      # to any field, so task dispatch silently fell back to localhost with no auth.
      - MAISTRO_BASE_URL=http://maistro-engine:8000
      - MAISTRO_ROUTER_API_KEY=${MAISTRO_ACCESS_TOKEN:-}
      - WORKSPACE_SCOPE_KEY=${WORKSPACE_SCOPE_KEY:-}
      # Langfuse credentials for the Langfuse service's own UI/API. These
      # do NOT enable trace export from this app: the conductor's spans go
      # out only over OTLP — a build with INSTALL_OBSERVABILITY=1 plus
      # OTEL_EXPORTER_OTLP_ENDPOINT/HEADERS (see
      # packages/hive-conductor/backend/adapters/telemetry_langfuse.py).
      - LANGFUSE_BASE_URL=http://langfuse:3000
      - LANGFUSE_PUBLIC_KEY=${LANGFUSE_PUBLIC_KEY:-}
      - LANGFUSE_SECRET_KEY=${LANGFUSE_SECRET_KEY:-}
      # Foundation state (SQLite/vault/state) on a persistent volume. /data is
      # pre-owned by the nonroot uid 65532 in the image so the volume is writable.
      - CONDUCTOR_DATA_DIR=/data
      # Human login mode + OIDC metadata; secrets remain in the /data vault.
      - HUMAN_AUTH_MODE=${HUMAN_AUTH_MODE:-hybrid}
      - OAUTH_PROVIDERS=${OAUTH_PROVIDERS:-{}}
      - OAUTH_PUBLIC_ORIGIN=${OAUTH_PUBLIC_ORIGIN:-}
      - OAUTH_SUCCESS_PATH=${OAUTH_SUCCESS_PATH:-/}
      - HARDWARE_PRESET=${HARDWARE_PRESET:-laptop}
    volumes:
      - conductor-data:/data
    depends_on:
      litellm:
        condition: service_started
      maistro-engine:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8101/health/ready')"]
      interval: 15s
      timeout: 5s
      retries: 3

volumes:
  pgdata:
  workspace-data:
  conductor-data:
