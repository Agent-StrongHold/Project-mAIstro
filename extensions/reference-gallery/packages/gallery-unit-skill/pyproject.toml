[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gallery-unit-skill"
version = "1.0.0"
description = "Reference gallery skill extension (M9-J2): pure unit-conversion handlers over host-fetched report data"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
# No Python distribution dependencies, exactly like the connector package:
# this skill's code is self-contained. Its dependency on the connector
# extension is an *extension-level* declaration in manifest.json — the
# catalog resolves and installs both through the platform lifecycle, which is
# precisely what a Python dependency could not express.
dependencies = []

[tool.hatch.build.targets.wheel]
packages = ["src/gallery_unit_skill"]

[tool.hatch.build.targets.wheel.force-include]
"manifest.json" = "gallery_unit_skill/manifest.json"

[tool.pytest.ini_options]
addopts = "--import-mode=importlib --strict-markers"
testpaths = ["tests"]
