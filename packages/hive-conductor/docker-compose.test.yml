# Full-stack compose for e2e testing.
# Usage:
#   docker compose -f docker-compose.test.yml up --build -d
#   docker compose -f docker-compose.test.yml run --rm api-tests
#   docker compose -f docker-compose.test.yml run --rm e2e-tests
#   docker compose -f docker-compose.test.yml down -v

services:
  hive:
    build:
      context: ../..
      dockerfile: packages/hive-conductor/Dockerfile
      args:
        # #1420: this harness is where the RUM reporter's production path is
        # exercised end to end, so the SPA in the image collects and the
        # backend below ingests. rum-telemetry.spec.ts pins the payloads.
        VITE_RUM_ENABLED: "true"
        VITE_RUM_BUILD_ID: e2e
    ports:
      - "8101:8101"
    mem_limit: 1g
    memswap_limit: 1g
    pids_limit: 256
    cpus: 1.0
    environment:
      - PYTHONUNBUFFERED=1
      - HARDWARE_PRESET=beast
      - CONDUCTOR_DATA_DIR=/tmp/conductor
      # #1420: ingest on — the reporter above needs a receiver that stores.
      - RUM_INGEST_ENABLED=true
      # This harness serves the app over plain HTTP at http://hive:8101, so it
      # is a local-development context in the sense #369 defines one, and says
      # so with the same two settings a developer running locally sets.
      #
      # Not a formality. Flipping SESSION_COOKIE_SECURE on by default made a
      # real Chromium refuse to send the session cookie back over `http://`,
      # and seven of these e2e tests failed with 401 immediately after a
      # successful login. That is the browser-level confirmation the attribute
      # took effect — the strongest evidence in this change that it is real —
      # and it is also why the harness has to declare itself.
      #
      # ALLOW_INSECURE_TRANSPORT alone would not be enough: startup would come
      # up, but the cookie would still be Secure and the browser would still
      # drop it. Both are needed, which is the point of them being separate.
      - SESSION_COOKIE_SECURE=false
      - ALLOW_INSECURE_TRANSPORT=true
      # #290 (develop integration): schedule execution requires the canonical
      # execution spine (run store + graph run store), and a bare harness
      # container gets an ephemeral in-memory Container whose fire path fails
      # closed — so this harness pins the file-backed SQLite canonical store
      # the shipped image explicitly supports (aiosqlite is in requirements.txt
      # for exactly this), under the durable CONDUCTOR_DATA_DIR so the
      # restart-marked test sees the same store the pre-restart phase wrote.
      # The product frequency floor (#1200) applies to everything the
      # scheduler admits; the harness selects the hard minimum (300s, the
      # product's own fail-loud bound — see SCHEDULE_FLOOR_HARD_MINIMUM_S) so
      # the UTC suite can observe a natural fire inside the CI job budget
      # instead of waiting out the default 900s floor.
      - DATABASE_URL=sqlite:////tmp/conductor/canonical.sqlite3
      - SCHEDULE_MIN_FREQUENCY_GAP_S=300
      # create_container() refuses to build the canonical Container without a
      # router key (fail-closed #155): with DATABASE_URL set the roster must
      # materialize or every Workspace request fails closed (#37). The harness
      # has no gateway; the stub key unblocks roster construction while model
      # calls keep failing at call time — the F3 degraded mode this harness
      # already runs in.
      - MAISTRO_ROUTER_API_KEY=test-harness-not-a-real-key
    # No curl/shell in the `hive` runtime image (Chainguard/Wolfi, near-zero
    # CVEs — see Dockerfile). Its own HEALTHCHECK already uses Python's
    # urllib for exactly this reason; mirror that here rather than `curl`,
    # which silently fails every check and never reports healthy.
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import sys,urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8101/health/ready', timeout=3).status==200 else 1)",
        ]
      interval: 5s
      timeout: 3s
      start_period: 10s
      retries: 10

  api-tests:
    build:
      context: .
      dockerfile: tests/Dockerfile
    environment:
      - HIVE_BASE_URL=http://hive:8101
    mem_limit: 512m
    memswap_limit: 512m
    pids_limit: 128
    cpus: 0.5
    depends_on:
      hive:
        condition: service_healthy
    command:
      ["pytest", "tests/e2e/test_pm_workflow_api.py", "tests/e2e/test_scheduler_timezone_container.py", "-v", "--tb=short"]
    profiles: ["test"]

  e2e-tests:
    build:
      context: .
      dockerfile: tests/Dockerfile.playwright
    environment:
      - HIVE_BASE_URL=http://hive:8101
      # Forwarded from the host, not inherited: compose does not pass the
      # runner's environment into a container. playwright.config.ts keys its
      # reduced CI budget off this, and without it the suite runs at local
      # settings and overruns the job's step timeout. Empty when run locally.
      - CI=${CI:-}
    mem_limit: 1g
    memswap_limit: 1g
    pids_limit: 256
    cpus: 1.0
    depends_on:
      hive:
        condition: service_healthy
    command: ["npx", "playwright", "test", "--config=tests/e2e/playwright.config.ts"]
    profiles: ["test"]
