department: deep_research
evals:
  - name: source_attribution
    criteria:
      - name: has_citations
        weight: 30
        check: {op: regex, pattern: '\[\d+\]|\(\d{4}\)|https?://|Source:'}
      - name: min_3_sources
        weight: 25
        check: {op: regex_count, pattern: '\[\d+\]|Source:|https?://\S+', min: 3}
      - name: inline_attribution
        weight: 25
        check: {op: keywords_any, words: ["according to", "per "]}
      - name: no_unsupported_claims
        weight: 20
        check:
          op: any
          of:
            - {op: keywords_none, words: ["studies show"]}
            - {op: regex, pattern: '\[\d+\]'}

  - name: claim_factuality
    criteria:
      - name: hedges_uncertainty
        weight: 25
        check: {op: keywords_any, words: [may, likely, suggests, indicates]}
      - name: no_absolute_claims
        weight: 25
        check: {op: keywords_none, words: [always, never, impossible, guaranteed]}
      - name: quantified_claims
        weight: 25
        check: {op: regex, pattern: '\d+%|\d+\.\d+'}
      - name: distinguishes_fact_opinion
        weight: 25
        check: {op: keywords_any, words: [evidence, data, research, analysis]}

  - name: completeness
    criteria:
      - name: has_sections
        weight: 25
        check: {op: regex, pattern: '#{1,3}\s|^\d+\.', flags: m}
      - name: has_conclusion
        weight: 25
        check: {op: keywords_any, words: [conclusion, summary, "key takeaway"], slice_start: -500}
      - name: min_length
        weight: 25
        check: {op: word_count, min: 300}
      - name: covers_multiple_angles
        weight: 25
        check: {op: regex_count, pattern: '#{1,3}\s|^\d+\.', flags: m, min: 3}

  - name: synthesis
    criteria:
      - name: connects_sources
        weight: 30
        check: {op: keywords_any, words: [similarly, "in contrast", "building on", corroborates]}
      - name: identifies_patterns
        weight: 25
        check: {op: keywords_any, words: [pattern, trend, theme, recurring]}
      - name: novel_insight
        weight: 25
        check: {op: keywords_any, words: [implication, "suggests that", therefore, consequently]}
      - name: not_just_list
        weight: 20
        check: {op: metric, name: list_density, cmp: lt, value: 0.7}

  - name: actionability
    criteria:
      - name: has_recommendations
        weight: 30
        check: {op: keywords_any, words: [recommend, should, "next step", "action item"]}
      - name: specific_not_vague
        weight: 25
        check: {op: regex, pattern: '\d+|specific|concrete', flags: i}
      - name: prioritized
        weight: 25
        check: {op: keywords_any, words: [first, priority, "most important", critical]}
      - name: feasible
        weight: 20
        check: {op: keywords_any, words: [timeline, resource, budget, team]}
