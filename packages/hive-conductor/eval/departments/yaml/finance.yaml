department: finance
evals:
  - name: numerical_accuracy
    criteria:
      - name: has_numbers
        weight: 25
        check: {op: regex, pattern: '\$[\d,.]+|\d+%|\d+\.\d+'}
      - name: numbers_add_up
        weight: 25
        check: {op: keywords_any, words: [total, sum, net]}
      - name: units_specified
        weight: 25
        check: {op: keywords_any, words: ["$", "%", USD, EUR, bps, M, B, K]}
      - name: precision_appropriate
        weight: 25
        check: {op: regex, pattern: '\d+\.\d{1,2}[^0-9]'}

  - name: regulatory_compliance
    criteria:
      - name: mentions_regulations
        weight: 25
        check: {op: keywords_any, words: [GAAP, IFRS, SEC, SOX, FASB, IRS, compliance]}
      - name: disclaimers
        weight: 25
        check: {op: keywords_any, words: [disclaimer, "not financial advice", consult, "subject to"]}
      - name: audit_trail
        weight: 25
        check: {op: keywords_any, words: [source, reference, "as of", "period ending"]}
      - name: materiality
        weight: 25
        check: {op: keywords_any, words: [material, significant, threshold, "de minimis"]}

  - name: risk_identification
    criteria:
      - name: identifies_risks
        weight: 25
        check: {op: keywords_any, words: [risk, exposure, downside, threat, vulnerability]}
      - name: quantifies_impact
        weight: 25
        check: {op: regex, pattern: '(risk|impact|loss).*\d+|\d+.*(risk|impact|loss)', flags: i}
      - name: mitigation_strategies
        weight: 25
        check: {op: keywords_any, words: [mitigat, hedge, diversif, contingency, insurance]}
      - name: probability_assessment
        weight: 25
        check: {op: keywords_any, words: [likely, probability, scenario, "best case", "worst case"]}

  - name: assumption_transparency
    criteria:
      - name: states_assumptions
        weight: 30
        check: {op: keywords_any, words: [assumption, assumes, assuming, "based on"]}
      - name: sensitivity_analysis
        weight: 25
        check: {op: keywords_any, words: [sensitivity, "if", scenario, range, varies]}
      - name: data_sources
        weight: 25
        check: {op: keywords_any, words: [source, "data from", "based on", "as reported"]}
      - name: limitations_noted
        weight: 20
        check: {op: keywords_any, words: [limitation, caveat, "note that", "important to"]}

  - name: decision_clarity
    criteria:
      - name: clear_recommendation
        weight: 30
        check: {op: keywords_any, words: [recommend, suggest, advise, conclusion, decision]}
      - name: options_compared
        weight: 25
        check: {op: keywords_any, words: [option, alternative, versus, "compared to", vs]}
      - name: criteria_stated
        weight: 25
        check: {op: keywords_any, words: [criteria, metric, kpi, measure, benchmark]}
      - name: next_steps
        weight: 20
        check: {op: keywords_any, words: ["next step", action, proceed, implement, timeline]}
