department: hr_people_ops
evals:
  - name: legal_compliance
    criteria:
      - name: no_discriminatory_language
        weight: 30
        check: {op: keywords_none, words: [young, old, "male only", "female only", "native speaker required"]}
      - name: references_policy
        weight: 25
        check: {op: keywords_any, words: [policy, handbook, guideline, procedure, regulation]}
      - name: equal_opportunity
        weight: 25
        check: {op: keywords_any, words: ["equal opportunity", inclusive, diversity, "regardless of", "all qualified"]}
      - name: proper_disclaimers
        weight: 20
        check: {op: keywords_any, words: ["at-will", "subject to", "in accordance", "applicable law"]}

  - name: tone_appropriateness
    criteria:
      - name: professional
        weight: 25
        check: {op: keywords_none, words: [lol, omg, btw, gonna, wanna]}
      - name: empathetic
        weight: 25
        check: {op: keywords_any, words: [understand, appreciate, value, support, "here to help"]}
      - name: clear_not_jargon
        weight: 25
        check: {op: keywords_none, words: [synergy, leverage, paradigm, "circle back"]}
      - name: respectful
        weight: 25
        check: {op: keywords_any, words: [please, thank, respect, appreciate, welcome]}

  - name: policy_accuracy
    criteria:
      - name: specific_policy_refs
        weight: 25
        check: {op: regex, pattern: '(section|article|policy)\s+\d+|handbook', flags: i}
      - name: consistent_with_law
        weight: 25
        check: {op: keywords_any, words: [fmla, ada, eeoc, flsa, osha, "labor law", "employment law"]}
      - name: no_contradictions
        weight: 25
        check:
          op: any
          of:
            - {op: keywords_none, words: [however], slice_end: 200}
            - {op: regex_count, pattern: '\n\n', min: 2}
      - name: effective_dates
        weight: 25
        check: {op: keywords_any, words: [effective, "as of", starting, beginning, updated]}

  - name: actionability
    criteria:
      - name: clear_next_steps
        weight: 30
        check: {op: keywords_any, words: ["next step", action, please, submit, contact]}
      - name: deadlines
        weight: 25
        check: {op: keywords_any, words: ["by", deadline, within, "no later than", due]}
      - name: responsible_party
        weight: 25
        check: {op: keywords_any, words: [manager, hr, employee, "team lead", department]}
      - name: resources_provided
        weight: 20
        check: {op: keywords_any, words: [form, link, portal, system, contact, email]}

  - name: confidentiality
    criteria:
      - name: no_pii_exposed
        weight: 30
        check: {op: regex_absent, pattern: '\b\d{3}-\d{2}-\d{4}\b|\b\d{9}\b'}
      - name: confidentiality_notice
        weight: 25
        check: {op: keywords_any, words: [confidential, private, sensitive, "do not share"]}
      - name: need_to_know
        weight: 25
        check: {op: keywords_any, words: [authorized, appropriate, "relevant parties", "need to know"]}
      - name: data_handling
        weight: 20
        check: {op: keywords_any, words: [secure, encrypted, stored, retained, destroyed]}
