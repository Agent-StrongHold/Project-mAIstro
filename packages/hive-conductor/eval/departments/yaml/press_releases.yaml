department: press_releases
evals:
  - name: inverted_pyramid
    criteria:
      - name: lead_has_who_what
        weight: 25
        check: {op: keywords_any, words: [announced, launched, released, appointed], slice_end: 200}
      - name: lead_has_when_where
        weight: 25
        check: {op: regex, pattern: '(today|yesterday|\d{4}|January|February|March)', slice_end: 300}
      - name: details_follow
        weight: 25
        check: {op: metric, name: paragraph_count, cmp: gte, value: 3}
      - name: background_last
        weight: 25
        check: {op: keywords_any, words: [about, founded, headquartered, contact], slice_start: -500}

  - name: quote_quality
    criteria:
      - name: has_quotes
        weight: 30
        check: {op: regex_count, pattern: '"', min: 4}
      - name: attributed
        weight: 25
        check: {op: keywords_any, words: [said, stated, commented, noted]}
      - name: titled_speaker
        weight: 25
        check: {op: keywords_any, words: [CEO, President, Director, VP, Chief]}
      - name: adds_value
        weight: 20
        check: {op: regex_count, pattern: '"[^"]{30,}"', min: 1}

  - name: factual_accuracy
    criteria:
      - name: specific_numbers
        weight: 25
        check: {op: regex, pattern: '\$[\d,.]+|\d+%|\d+,\d{3}'}
      - name: verifiable_claims
        weight: 25
        check: {op: keywords_any, words: ["according to", "based on", "data shows"]}
      - name: no_unproven_superlatives
        weight: 25
        check: {op: keywords_none, words: ["best in class", "world's first", revolutionary]}
      - name: date_present
        weight: 25
        check: {op: regex, pattern: '(January|February|March|April|May|June|July|August|September|October|November|December)\s+\d'}

  - name: ap_style
    criteria:
      - name: dateline
        weight: 25
        check: {op: regex, pattern: '^[A-Z]{2,}[\s,]'}
      - name: no_exclamation_marks
        weight: 25
        check: {op: regex_absent, pattern: '!'}
      - name: third_person
        weight: 25
        check: {op: keywords_none, words: ["we "], slice_end: 500}
      - name: boilerplate
        weight: 25
        check: {op: keywords_any, words: ["about ", "###", "media contact", "for immediate release"]}

  - name: newsworthiness
    criteria:
      - name: timeliness
        weight: 25
        check: {op: keywords_any, words: [today, announces, new, launch]}
      - name: impact
        weight: 25
        check: {op: keywords_any, words: [million, billion, thousands, industry, market]}
      - name: prominence
        weight: 25
        check: {op: regex, pattern: '[A-Z][a-z]+\s[A-Z][a-z]+', slice_end: 500}
      - name: relevance
        weight: 25
        check: {op: keywords_any, words: [solution, problem, challenge, opportunity]}
