# Agent Conductor (hive-conductor) — the household/personal app that ships from
# this monorepo.
#
# NOT in the PyPI publish set (that set is maistro-core, -canvas, -evolve, -rsi,
# -bootstrap). This file exists for build hygiene and image builds: it puts the
# app's dependency resolution inside the workspace lock instead of a second,
# unlocked `requirements.txt` resolution, and enrolls it in the wheel-imports
# CI build loop. Do not add it to a publish job.
#
# Wheel layout: `backend/` is a FLAT module layout — no package root, no
# `backend/__init__.py` — and the app imports its own modules top-level-relative
# (`from config import get_settings`, `from routes import ...`, `from
# middleware.auth import AuthMiddleware`). Those imports are resolved by putting
# `backend/` itself on sys.path: the Dockerfile sets `PYTHONPATH=/app/backend`
# and `backend/tests/conftest.py` inserts it at `sys.path[0]`. The wheel
# therefore ships the sources remapped under a `hive_conductor/` prefix so it
# installs without colliding with anything else in site-packages, but the app is
# NOT importable as `hive_conductor.main` — see the `hive-conductor` entry in
# scripts/verify-wheel-imports.py's SKIPPED_DISTS.
[project]
name = "hive-conductor"
version = "0.9.0"
description = "Agent Conductor — FastAPI backend for the Maistro household/personal app"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
# This list is no longer a line-for-line translation of
# backend/requirements.txt, and the difference is deliberate (#514). The two
# files are consumed by different installers: the Dockerfile pip-installs
# `/packages/maistro-core` and *then* requirements.txt, so the image gets
# core's hard dependencies from core itself, while this list is what a wheel
# install of hive-conductor resolves. Restating a dependency the backend never
# imports gave the app a second version range that could drift from the range
# held by the package that actually imports it, and made the wheel claim a
# requirement it does not have. requirements.txt keeps its own restatements
# and its own reasons; it is a separate resolution, not a copy of this one.
dependencies = [
    "pyyaml>=6.0.0,<7",
    "fastapi>=0.115.0,<1",
    "uvicorn[standard]>=0.32.0,<1",
    "pydantic>=2.0.0,<3",
    "pydantic-settings>=2.0.0,<3",
    "python-multipart>=0.0.9,<1",
    "httpx>=0.27.0,<1",
    "cryptography>=50.0.0,<51",
    "sqlalchemy[asyncio]>=2.0.0,<3",
    # `[bcrypt]` rather than a bare `bcrypt` pin. Nothing under `backend/`
    # imports bcrypt; the importer is `maistro.security.passwords`, which
    # verifies pre-Argon2id columns. maistro-core now declares that extra, so
    # the requirement is expressed by the package whose code has it, and this
    # app asks for it because it is the deployment with legacy hashes (#514).
    #
    # argon2-cffi, regex and structlog were dropped from this list for the same
    # reason with no extra needed: all three are hard dependencies of
    # maistro-core, which is what imports them, and the backend imports none of
    # them itself.
    #
    # Bound is `>=0.9.0,<2` because 0.9.0 is what every package in this repo is
    # at today (root VERSION); nothing resolves at 1.0.0 yet. Tighten to
    # `>=1.0.0,<2` at tag time, per E1/E2 of the v1.0.0 release plan.
    "maistro-core[bcrypt]>=0.9.0,<2",
]

# `backend/adapters/telemetry_langfuse.py` exports spans to a Langfuse OTLP
# endpoint using the OpenTelemetry SDK -- it never imports the Langfuse SDK,
# which was nonetheless a hard dependency here while the packages the adapter
# does import were declared nowhere. Its whole body sits under `try:` with an
# `except Exception: _tracer = None`, so the absence read as "tracing off"
# rather than "tracing is missing its dependencies" (#514).
#
# An extra rather than a hard dependency because the adapter is inert unless
# OTEL_EXPORTER_OTLP_ENDPOINT is set, so a deployment that does not trace
# should not carry an exporter. maistro-core owns the actual packages.
[project.optional-dependencies]
observability = [
    "maistro-core[observability]>=0.9.0,<2",
]
# Test-only, matching the sibling packages' `dev` extra convention. These were
# runtime entries in requirements.txt (which is also the CI/Docker install
# path), so they stay in that file; here they are correctly optional.
dev = [
    "pytest>=8.0.0,<10",
    "pytest-asyncio>=0.25,<2",
    "pytest-bdd>=8.0.0,<9",
    "hypothesis>=6.0.0,<7",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

# Only the backend Python sources ship. The Vite frontend (`frontend/`) is built
# by the Dockerfile's node stage into the image — its build artifacts are never
# part of the wheel (F1 acceptance criterion).
[tool.hatch.build.targets.wheel]
only-include = ["backend"]
sources = { "backend" = "hive_conductor" }
exclude = [
    "backend/tests",
    "backend/__pycache__",
    "backend/Dockerfile",
    "backend/requirements.txt",
    "backend/.env.example",
]

[tool.hatch.build.targets.sdist]
# Siblings define no sdist target; hive-conductor needs one only to keep the
# default sdist from sweeping in `frontend/node_modules` and the app's data dirs.
only-include = ["backend", "README.md", "LICENSE"]
exclude = ["backend/__pycache__"]
