[project]
name = "maistro-bootstrap"
version = "0.9.0"
description = "Interactive and headless installer helper for maistro-engine feature slices and Copier templates"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
    "typer>=0.12,<1",
    "questionary>=2.0,<3",
    "pyyaml>=6.0,<7",
    "rich>=13.0,<16",
    "pydantic>=2.7,<3",
]

[project.optional-dependencies]
builders = [
    "anthropic>=0.28,<1",
    "textual>=0.61,<9",
]

[project.scripts]
maistro-install = "maistro_bootstrap.cli:run"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/maistro_bootstrap"]
