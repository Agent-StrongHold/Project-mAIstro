[project]
name = "maistro-canvas"
version = "0.9.0"
description = "Standalone book builder — phased illustration pipeline with AI image generation"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
    "maistro-core>=0.9.0",
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.34,<1",
    "sqlalchemy[asyncio]>=2.0,<3",
    "asyncpg>=0.30,<1",
    # RGBA layer assembly in canvas/compositor.py — a hard runtime dep, not
    # optional: the module-level _LANCZOS/_BICUBIC lookups run at import time.
    "pillow>=11.0,<13",
    "httpx>=0.28,<1",
    "pydantic>=2.0,<3",
]

[project.optional-dependencies]
# PPTX export (SPEC-070426-457b) — optional; without it export_pptx() raises a
# typed ExporterDependencyError and HTML export still works.
export = [
    "python-pptx>=1.0,<2",
]
dev = [
    "pytest>=8.3,<10",
    "pytest-asyncio>=0.25,<2",
    "python-pptx>=1.0,<2",
    "ruff>=0.9,<1",
    "mypy>=1.14,<2",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/maistro_canvas"]
