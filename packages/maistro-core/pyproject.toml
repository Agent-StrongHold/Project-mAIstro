[project]
name = "maistro-core"
version = "0.9.0"
description = "Core library for the Maistro multi-agent AI platform — memory, security, classification, routing, agents, A2A, skills, builders"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
    "pydantic>=2.0,<3",
    "pydantic-settings>=2.7,<3",
    "structlog>=24.4,<26",
    "httpx>=0.28,<1",
    "sqlalchemy[asyncio]>=2.0,<3",
    "asyncpg>=0.30,<1",
    "pgvector>=0.3,<1",
    "pyyaml>=6.0,<7",
    # 50.x contains the security fix required by the supply-chain gate.
    "cryptography>=50.0.0,<51",
    "argon2-cffi>=23.1,<25",
    # Warden's pattern engine (security/warden/patterns.py) prefers `regex` over
    # stdlib `re` for its match timeout. Declared so the timeout path is always
    # reachable rather than silently degrading to the `re` fallback.
    # Date-based versioning, hence the year upper bound.
    "regex>=2024.5.15,<2027",
]

[project.scripts]
maistro = "maistro.cli:main"

[project.optional-dependencies]
llm = [
    # Resolves at 3.x in the workspace lock; >=2.0 remains the true floor.
    "fastmcp>=2.0,<4",
]
# The sandbox tool drives the `docker` CLI via subprocess, not the Python SDK,
# so it needs no pip dependency. Kept as an explicit (empty) extra for clarity.
sandbox = []
# RE2 accelerates Warden's 47-pattern scan ~14x and, more importantly, bounds
# its worst case: `re` backtracks, so attacker-shaped input can make a scan
# superlinear. Optional because it is a native extension — without it Warden
# falls back to `re` and behaves identically, just slower (see
# security/warden/_regex.py).
re2 = [
    "google-re2>=1.1",
]
# The Archive tier (ADR-082226-d3dd) — cold records below durable memory, on any
# S3-compatible store. Optional because the homelab deployment uses
# `FilesystemArchiveStore`, which needs nothing, and because a deployment that
# does not archive must not pay for a cloud SDK in its base install. The module
# is imported lazily via `maistro.memory.archive.s3_archive_store`, so
# `maistro-core` imports cleanly without this — proven by
# tests/memory/archive/test_optional_dependency.py, not assumed.
#
# S3-compatible, not AWS: `endpoint_url` is configurable, so MinIO, Cloudflare
# R2 and Backblaze B2 work. CI exercises it against a real MinIO.
s3 = [
    "aioboto3>=13.0",
]
# Vendor-neutral tracing export. The agent tracing decorators use the OpenTelemetry
# API directly (see observability/tracing.py); installing this extra + setting an OTLP
# endpoint routes spans to any backend (Arize/Phoenix, Langfuse, Honeycomb, Jaeger).
observability = [
    "opentelemetry-api>=1.30,<2",
    "opentelemetry-sdk>=1.30,<2",
    "opentelemetry-exporter-otlp>=1.30,<2",
]
tui = [
    "typer>=0.12,<1",
    "rich>=13.0,<16",
]
builders = [
    "textual>=0.61,<9",
    "anthropic>=0.28,<1",
    "maistro-bootstrap[builders]",
]
# Homelab/single-instance persistence backend (no Postgres server required).
sqlite = [
    "aiosqlite>=0.20,<1",
]
# BIP39/BIP32 HD root of trust for maistro.identity (ADR-021): Ed25519 signing
# plus secp256k1 derivation for the BTC/ETH coin types.
#
# An extra rather than a base dependency, reluctantly. bip-utils requires
# coincurve, a secp256k1 C extension whose newest release (21.0.0) publishes
# wheels only for cp39-cp313 and whose sdist build is broken against the cffi
# that Python 3.14 resolves. The API image's base (cgr.dev/chainguard/python,
# Wolfi) is 3.14-only, so a base dependency here makes that image unbuildable.
# maistro.identity raises an ImportError naming this extra when it is missing —
# loud and actionable, not a silent fallback.
identity = [
    "pynacl>=1.5,<2",
    "bip-utils>=2.9,<3",
]
# ASGI framework adapters — auth/middleware.py (FastAPI) and
# observability/middleware.py (Starlette) import these at module level. Kept out
# of the base dependencies so importing maistro.memory or maistro.router does not
# drag a web framework into a library consumer.
asgi = [
    "fastapi>=0.115,<1",
    "starlette>=0.40,<2",
]
# The widest extra set, and what `wheel-imports` installs before importing every
# module in the wheel. `s3` belongs here even though the Archive tier is opt-in:
# `maistro/memory/archive/s3.py` imports aioboto3 at module level (correctly —
# it is a module behind an extra, not one with a fallback), so leaving it out
# makes that sweep fail on a module that is working as designed.
#
# This does not weaken the base-install guarantee. `all` is the widest set, not
# the default one; `maistro-core` with no extras still has no cloud SDK, which
# tests/memory/archive/test_optional_dependency.py proves by hiding aioboto3
# from the import system.
#
# `re2` stays out for a different reason: it is a native extension whose absence
# is a supported configuration (Warden falls back to `re`), so importing without
# it is a case worth keeping in the sweep.
all = [
    "maistro-core[llm,sandbox,observability,tui,builders,sqlite,asgi,identity,s3]",
]
dev = [
    "pytest>=8.3,<10",
    "pytest-asyncio>=0.25,<2",
    "pytest-cov>=6.0,<8",
    "ruff>=0.9,<1",
    "mypy>=1.14,<2",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/maistro"]
