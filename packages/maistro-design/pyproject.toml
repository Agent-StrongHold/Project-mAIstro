[project]
name = "maistro-design"
version = "0.9.0"
description = "Composable design skills + design systems + canvas composition engine"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
    "maistro-core>=0.9.0",
    "maistro-canvas>=0.9.0",
    "httpx>=0.28,<1",
    "pydantic>=2.4.0,<3",
    "regex>=2024.5.15,<2027",
    # Re-declared (#514 removed an earlier, *unused* declaration): the domain
    # pack registry (#793) parses its in-repo YAML manifests, so the dependency
    # is now genuinely imported in `src/maistro_design/packs/registry.py`.
    "pyyaml>=6.0,<7",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3,<10",
    "pytest-asyncio>=0.25,<2",
    "hypothesis>=6.130,<7",
    "ruff>=0.9,<1",
    "mypy>=1.14,<3",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/maistro_design"]
