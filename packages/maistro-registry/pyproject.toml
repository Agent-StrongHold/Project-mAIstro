[project]
name = "maistro-registry"
version = "0.9.0"
description = "ADR/spec registry CLI — walk, validate, lint, link-check for maistro-engine docs"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
    "pyyaml>=6.0,<7",
    "pydantic>=2.0,<3",
    "httpx>=0.28,<1",
]

[project.scripts]
maistro-registry = "maistro_registry.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/maistro_registry"]
