[project]
name = "maistro-server"
version = "0.9.0"
description = "FastAPI server for the Maistro multi-agent AI platform"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
    # `[llm]` rather than a raw `fastmcp` pin: nothing under
    # `src/maistro_server` imports fastmcp. It is reached through the
    # maistro-core tool-server modules the API imports, and that package
    # already expresses the requirement as an extra -- which maistro-rsi
    # depends on for exactly this reason. A duplicate direct pin restated the
    # requirement without naming what needs it, and carried its own range to
    # drift from core's (#514).
    "maistro-core[llm]>=0.9.0",
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.34,<1",
    # langfuse was declared here and imported nowhere in `src/maistro_server`;
    # unlike hive-conductor this package has no telemetry adapter aimed at a
    # Langfuse OTLP endpoint either, so there is nothing to re-home (#514).
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
# Deployment extras (#348): which maistro-core optional surfaces a deployment
# of the API server carries. Nothing under `src/maistro_server` imports these
# directly — core reaches them lazily — so they are opt-in here exactly as
# they are opt-in on core, mirroring hive-conductor's `observability` extra.
# The published images select them by name (`uv export --extra ...`), which is
# what makes "the shipped dependency set is exactly the locked one" expressible
# in the lock instead of a pip command line.
identity = ["maistro-core[identity]>=0.9.0"]
observability = ["maistro-core[observability]>=0.9.0"]
browser = ["maistro-core[browser]>=0.9.0"]
# The API server image's whole dependency contract, in one name (#348).
#
# The engine image installs three workspace members — maistro-core,
# maistro-server and maistro-canvas — and nothing else. Before the lock
# existed, that was a pip command line in the Dockerfile:
# `pip install ./packages/maistro-core[identity,llm,sandbox,observability]
#  ./packages/maistro-server ./packages/maistro-canvas alembic>=1.14
#  psycopg[binary]>=3.2 openai>=1.40,<2 anyio>=4.14.2 httpx>=0.27.0`
# — a second resolution, at build time, of a set the scanners never saw. The
# image now exports THIS extra from the committed lock and installs the three
# members from source, so the shipped set is the locked set by construction.
#
# Every name below is load-bearing, and each is named for a reason:
#   identity      the DID-key surface maistro.identity exposes; the server
#                 wires it at startup.
#   llm           the fastmcp tool servers maistro-core exposes. (It is
#                 already a hard dependency of this package; naming it here
#                 keeps the image's contract readable in one place.)
#   sandbox       the docker-CLI sandbox tool. It has no third-party
#                 dependency today, and it is named anyway so the contract
#                 says which surface the image ships.
#   observability the OTLP exporter the server's tracing setup uses.
#   maistro-canvas
#                 the Canvas package ships in the supported image (#1825):
#                 `_wire_canvas_ability()` hit ImportError at startup and
#                 every Canvas route answered 503 forever when it was
#                 missing. It is named here, not in the server's hard
#                 dependencies, because `maistro_server.api.canvas` duck-types
#                 the store on purpose — a leaner environment keeps the 503
#                 rather than failing startup. Naming it here also puts
#                 canvas's own third-party dependency (Pillow) in the
#                 exported set, so the member installs with no unmet
#                 dependency instead of pulling one at build time.
#   sqlite        the sqlite persistence deployment (2dfd3b97a) wires
#                 SqliteCampaignStore, SqliteWorkspaceLogStore and the
#                 backlog history, which import aiosqlite. The extra is named
#                 here so the image's contract carries it: before #348 the
#                 Dockerfile's pip line named `maistro-core[...,sqlite]`
#                 directly, and dropping the name here would have quietly
#                 shipped an image whose sqlite stores cannot open.
#   openai        the engine image has shipped openai>=1.40,<2 since before
#                 the lock existed. It is kept: this extra exists to make
#                 the image's set reproducible, not to shrink it. The one
#                 importer of the openai SDK in the product is core's browser
#                 tool, which the API image deliberately does not ship
#                 (Dockerfile.research is its home) — so this line is dead
#                 weight today, and removing it is a deliberate change to
#                 what the image ships, not a side effect of locking it.
image = [
    "maistro-core[identity,llm,sandbox,observability,sqlite]>=0.9.0",
    "maistro-canvas>=0.9.0",
    "openai>=1.40,<2",
]
dev = [
    "pytest>=9.0.3,<10",
    "pytest-asyncio>=0.25,<2",
    "ruff>=0.9,<1",
    "mypy>=1.14,<3",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/maistro_server"]
