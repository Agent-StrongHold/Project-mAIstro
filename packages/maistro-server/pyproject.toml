[project]
name = "maistro-server"
version = "0.9.0"
description = "FastAPI server for the Maistro multi-agent AI platform"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
    # `[llm]` rather than a raw `fastmcp` pin: nothing under
    # `src/maistro_server` imports fastmcp. It is reached through the
    # maistro-core tool-server modules the API imports, and that package
    # already expresses the requirement as an extra -- which maistro-rsi
    # depends on for exactly this reason. A duplicate direct pin restated the
    # requirement without naming what needs it, and carried its own range to
    # drift from core's (#514).
    "maistro-core[llm]>=0.9.0",
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.34,<1",
    # langfuse was declared here and imported nowhere in `src/maistro_server`;
    # unlike hive-conductor this package has no telemetry adapter aimed at a
    # Langfuse OTLP endpoint either, so there is nothing to re-home (#514).
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<10",
    "pytest-asyncio>=0.25,<2",
    "ruff>=0.9,<1",
    "mypy>=1.14,<2",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/maistro_server"]
