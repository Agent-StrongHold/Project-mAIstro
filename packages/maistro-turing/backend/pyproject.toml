[project]
name = "maistro-turing-backend"
version = "0.9.0"
description = "FastAPI application for the Maistro Turing runtime"
requires-python = ">=3.12"
dependencies = [
    "maistro-turing>=0.9.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.28",
    "pydantic>=2.0",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["maistro_turing_backend"]
