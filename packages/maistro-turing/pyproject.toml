[project]
name = "maistro-turing"
version = "0.9.0"
description = "Autonoetic self-model extensions for the Maistro platform — Turing agent runtime"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
    "maistro-core>=0.9.0",
    "pydantic>=2.0,<3",
    "structlog>=24.4,<26",
    "httpx>=0.28,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<10",
    "pytest-asyncio>=0.25,<2",
    "ruff>=0.9,<1",
    "mypy>=1.14,<2",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/maistro_turing"]
