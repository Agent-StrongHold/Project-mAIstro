# Load balancer for the #860 multi-replica soak. Mirrors the supported
# production reference config (deploy/nginx.conf): one upstream zone with
# passive health checks (max_fails=3 within fail_timeout=10s) and failover
# to the surviving replica via proxy_next_upstream. Only the upstream
# addresses change: soak replicas listen on the host, reached from the
# container through the docker host-gateway alias.

worker_processes 1;
error_log /dev/stderr warn;
pid /tmp/nginx-soak.pid;

events {
    worker_connections 1024;
}

http {
    access_log off;

    upstream maistro_soak {
        # Passive health: after 3 failures within 10s the replica is removed
        # from rotation until the fail_timeout elapses (same policy as
        # deploy/nginx.conf).
        server host.docker.internal:18201 max_fails=3 fail_timeout=10s;
        server host.docker.internal:18202 max_fails=3 fail_timeout=10s;
        # Mirror deploy/nginx.conf's upstream connection pool. This pool was
        # accidentally dropped when the conf was first written, so every
        # request opened a fresh container→host-gateway connection; under the
        # sustained profile that per-request connect churn is the F3 storm's
        # leading suspect (run 1: 7445/7590 instant 502s while sequential
        # bursts through the same LB were 100% served; DB rows show only ~51
        # requests ever reached the app). proxy_http_version 1.1 and the
        # cleared Connection header below are the other keepalive
        # prerequisites and were already present.
        keepalive 32;
    }

    server {
        listen 8080;

        location / {
            proxy_pass http://maistro_soak;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_connect_timeout 2s;
            proxy_read_timeout 30s;
            # A connection refused by the killed replica must not surface to
            # the client while the other replica can serve the request.
            # F10 (found by the #860 soak): http_503 must NOT be a
            # next-upstream condition. /health/ready answers 503 while the
            # LLM circuit is open — degraded-not-dead by design — and with
            # http_503 listed here every such response counts toward the
            # passive-health max_fails, so under the sustained profile both
            # replicas are ejected within seconds of a circuit opening and
            # the LB answers mass instant "no live upstreams" 502s for every
            # endpoint until fail_timeout windows flap shut again. Retries
            # stay scoped to transport failures; an application 503 passes
            # to the client as the degraded signal it is.
            proxy_next_upstream error timeout http_502 http_504;
            proxy_next_upstream_tries 2;
            proxy_next_upstream_timeout 15s;
        }
    }
}
